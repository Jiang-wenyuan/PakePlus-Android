"最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "中央银行"}, {"src": "拓展", "stem": "初次分配属于微观分配行为，主要由____自主进行。", "opts": {"A": "生产部门", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "生产部门"}], "branches": [{"h": "要点", "terms": ["紧缩", "增加", "减发", "减少", "提高", "卖出", "扩张"]}, {"h": "2.收入分配政策", "terms": ["生产部门", "最低工资保障", "政府", "社会保障", "慈善公益"]}], "notes": ["财政政策主体是政府（收入=税收、国债；支出=政府购买[付出商品/劳动]+转移支付[只发钱不求回报]）；货币政策主体是央行。", "逆风向调节：通胀（钱太多）→紧缩性政策（财政：减支增税；货币：提高准备金率/再贴现率/利率、卖出有价证券、减少货币供应）；通缩→扩张性政策（财政：减税增支、增发国债；货币：降准降息、买入有价证券、增加货币供应）。", "货币政策工具：法定存款准备金率（如10%则1亿存款最多贷出9000万）；再贴现率（商行拿未到期票据向央行融资的预扣利率，降低→商行融资成本低→更愿放贷→货币增多）；公开市场业务（央行买卖国债吞吐基础货币，买入→钱投放到市场）；基准利率。", "收入分配三次：初次分配由生产部门自主（工资、最低工资）；再分配由政府主导（个税、社保、转移支付、公务员薪资）；第三次分配靠自愿慈善公益。"]}, {"id": 104, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "汇率", "nblank": 10, "blocks": [{"type": "h2", "toks": [{"t": "1.汇率的含义\n汇率是指两种货币之间兑换的比率，即用一国货币表示的另一国货币的价格。"}]}, {"type": "h2", "toks": [{"t": "2.汇率标价方法\n直接标价法：以一定单位的"}, {"a": "外国货币", "ul": 8}, {"t": "为标准来计算应付出多少单位本国货币。\n间接标价法：以一定单位的"}, {"a": "本国货币", "ul": 8}, {"t": "为标准来计算应收多少单位的外国货币。"}]}, {"type": "h2", "toks": [{"t": "3.汇率变动的影响\n汇率变动\n本国进口\n本国出口\n进口商品物价\n资本流动\n本币汇率下降\n（本币贬值）\n"}, {"a": "不利于", "ul": 8}, {"t": "\n"}, {"a": "有利于", "ul": 8}, {"t": "\n"}, {"a": "上涨", "ul": 8}, {"t": "\n资本"}, {"a": "外流", "ul": 4}, {"t": "\n本币汇率上升\n（本币升值）\n"}, {"a": "有利于", "ul": 8}, {"t": "\n"}, {"a": "不利于", "ul": 8}, {"t": "\n"}, {"a": "下降", "ul": 8}, {"t": "\n资本"}, {"a": "内流", "ul": 4}]}], "quiz": [{"src": "真题", "stem": "2017 年5 月以来，人民币汇率出现了小幅回升。在美国读大学的小赵说：“每学期学费是3 万美元，上次交学费是在2017 年1 月，当时人民币汇率是6.87 左右，花了近21 万元人民币……”下列关于汇率的说法错误的是：", "opts": {"A": "汇率是一种货币对其他国家或地区货币的兑换比率", "B": "汇率是国际贸易中最重要的调节杠杆", "C": "小赵在人民币汇率回升的情况下再交学费，要比1 月份多花不少钱", "D": "近期的汇率上升，有利于我国进口，不利于出口"}, "ans": "C"}, {"src": "母题", "stem": "假如三个月前1 欧元对人民币中间价为7.9748 元，现在1 欧元对人民币中间价为8.0314 元。若不考虑其他因素，下列推导正确的是：", "opts": {"A": "人民币升值→中国企业在欧盟投资成本下降→有利于扩大进口欧盟商品", "B": "人民币贬值→中国企业在欧盟投资成本上升→不利于中国企业在欧盟投资", "C": "欧元升值→中国商品在欧盟市场的价格下降→不利于中国商品出口欧盟", "D": "欧元贬值→欧盟商品在中国市场的价格上升→有利于中国进口欧盟商品"}, "ans": "B"}, {"src": "拓展", "stem": "直接标价法：以一定单位的____为标准来计算应付出多少单位本国货币。", "opts": {"A": "外国货币", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "外国货币"}, {"src": "拓展", "stem": "间接标价法：以一定单位的____为标准来计算应收多少单位的外国货币。", "opts": {"A": "本国货币", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "本国货币"}], "branches": [{"h": "2.汇率标价方法", "terms": ["外国货币", "本国货币"]}, {"h": "3.汇率变动的影响", "terms": ["不利于", "有利于", "上涨", "外流", "下降", "内流"]}], "notes": ["直接标价法=一定单位外币折合多少本币（1美元=7.1829人民币，我国采用）；间接标价法=一定单位本币折合多少外币（1人民币=0.1402美元）。", "本币贬值（汇率下降）：不利于进口、有利于出口、进口商品在国内涨价、资本外流；本币升值（汇率上升）：有利于进口和出国消费、不利于出口、进口商品降价、资本内流（预期人民币升值时投机资金会流入）。"]}, {"id": 105, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "经济名词", "nblank": 18, "blocks": [{"type": "p", "toks": [{"a": "黑天鹅", "ul": 8}, {"t": "事件：极其罕见、难以预测，但一旦发生就会产生颠覆性影响的小概率事件。\n"}, {"a": "灰犀牛", "ul": 8}, {"t": "事件：明显的、高概率的、早已存在，但却被人们有意或无意忽视，最终可能酿成重大危机的事件。\n流动性偏好：人们在心理上更偏好持有现金或能快速变现的资产，而非收益较高但难以快速、无损失变现的资产的倾向。\n流动性陷阱：当利率降至零或接近零的极低水平时，人们宁愿以现金或储蓄的形式持有货币，而不愿进行投资或消费，导致中央银行通过增加货币供应量、降低利率来刺激经济的货币政策完全无效的状态。\n边际效用递减：在一定时间内，在其他商品的消费数量保持不变的条件下，当一个人连续消费某种物品时，随着所消费的该物品的数量增加，其所带来的效用的增加量有"}, {"a": "递减", "ul": 8}, {"t": "的趋势。\n拉弗曲线：当税率在一定的限度以下时，提高税率能增加政府税收收入，但超过这一限度时，再提高税率反而导致政府税收收入"}, {"a": "减少", "ul": 8}, {"t": "。\n公共物品：满足社会公众需要的商品。一般具有两大特征：（1）"}, {"a": "非竞争性", "ul": 8}, {"t": "：\n消费者对某种物品的消费并不会影响其他人对该物品的消费。（2）"}, {"a": "非排他性", "ul": 8}, {"t": "：消费者对某种物品的消费并不会阻止其他人对该物品的消费。\n恩格尔系数：表示"}, {"a": "食品支出", "ul": 8}, {"t": "总额占个人消费支出总额的比重。通常将其作为衡量家庭或国家"}, {"a": "富裕程度", "ul": 8}, {"t": "的指标，恩格尔系数越大，一个国家或家庭生活越"}, {"a": "贫困", "ul": 8}, {"t": "；反之，恩格尔系数越小，生活越"}, {"a": "富裕", "ul": 8}, {"t": "。\n基尼系数：在全部居民收入中，用于进行不平均分配的那部分收入占总收入的百分比。它是用来综合考察居民内部收入分配"}, {"a": "差异状况", "ul": 8}, {"t": "的指标。基尼系数介于"}, {"a": "0-1", "ul": 8}, {"t": "之间，基尼系数越大，表示收入分配差距越"}, {"a": "大", "ul": 8}, {"t": "、越"}, {"a": "不公平", "ul": 8}, {"t": "；基尼系数越接近0，表示收入分配差距越小、越公平。国际上通常把"}, {"a": "0.4", "ul": 8}, {"t": "作为“警戒线”。\n赤字率：财政赤字与同期国内生产总值（GDP）之比。这是衡量一个国家财政政策力度和风险水平的重要指标。国际上通常将"}, {"a": "3%", "ul": 8}, {"t": "作为赤字率的警戒线。\n狭义货币（M1）：包含流通中货币（M0）、单位活期存款、个人活期存款、非银行支付机构客户备付金。代表“随时能花的钱”，反映"}, {"a": "现实", "ul": 8}, {"t": "购买力。\n广义货币（M2）：包含M1 以及单位定期和其他存款、个人存款、非存款类金融机构存款、非存款机构部门持有的货币市场基金份额。代表“所有的钱”，反映"}, {"a": "潜在", "ul": 8}, {"t": "购买力。"}]}], "quiz": [{"src": "真题", "stem": "下列经济指标及其衡量对象的关系对应正确的是：", "opts": {"A": "赤字率——财政风险", "B": "恩格尔系数——收入分配差距", "C": "基尼系数——居民生活水平", "D": "生产者物价指数——货币供应量"}, "ans": "A"}, {"src": "母题", "stem": "下列选项体现的经济学原理与其他三项不同的是：", "opts": {"A": "婚姻出现七年之痒", "B": "熟悉的地方没有风景", "C": "入芝兰之室，久而不闻其香", "D": "三个臭皮匠，顶个诸葛亮"}, "ans": "D"}, {"src": "拓展", "stem": "____事件：极其罕见、难以预测，但一旦发生就会产生颠覆性影响的小概率事件。", "opts": {"A": "黑天鹅", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "黑天鹅"}, {"src": "拓展", "stem": "恩格尔系数：表示____总额占个人消费支出总额的比重。", "opts": {"A": "食品支出", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "食品支出"}, {"src": "拓展", "stem": "基尼系数介于0-1之间，基尼系数越大，表示收入分配差距越大、越____", "opts": {"A": "不公平", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "不公平"}], "branches": [{"h": "要点", "terms": ["黑天鹅", "灰犀牛", "递减", "减少", "非竞争性", "非排他性", "食品支出"]}], "notes": ["黑天鹅=极罕见、难预测、颠覆性的小概率事件（如9·11）；灰犀牛=明显的、高概率却被忽视、最终酿成危机的风险（如房地产）。", "流动性偏好=偏好持有现金或快速变现资产；流动性陷阱=利率接近零时人们宁愿持现金储蓄也不投资消费，货币宽松政策完全失效、经济低迷。", "边际效用递减=一定时间内持续增加消费，每多消费一单位带来的效用增量递减（极饿时第一个馒头最香）；拉弗曲线=税率在一定限度内提高能增加税收、超过限度反而使税收减少。", "公共物品两特征：非竞争性（多一人消费不影响他人）+非排他性（无法阻止他人消费）；纯公共物品双非、准公共物品只具其一（公交车=拥挤型、上大学=排他但非竞争）。", "恩格尔系数=食品支出占消费总支出比重，越大越穷；基尼系数衡量收入分配差距（0–1，越大越不公，0.4是警戒线）；赤字率=财政赤字/GDP，3%是警戒线。", "M0=流通中现金；M1=M0+单位活期存款（'随时能花的钱'，反映现实购买力，M1走高市场偏热）；M2=M1+定期存款等（'所有的钱'，反映潜在购买力）。"]}, {"id": 106, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "经济效应", "nblank": 8, "blocks": [{"type": "p", "toks": [{"t": "挤出效应：政府通过增加支出来刺激经济时，可能会导致利率上升，从而"}, {"a": "减少", "ul": 8}, {"t": "了私人投资和消费的现象。\n口红效应：因经济萧条而导致口红热卖，廉价产品在收入降低时需求量反而"}, {"a": "增加", "ul": 8}, {"t": "。\n棘轮效应：人的消费习惯形成之后有"}, {"a": "不可逆性", "ul": 8}, {"t": "，即易于向上调整，而难于向下调整。\n"}, {"a": "马太效应", "ul": 8}, {"t": "：强者愈强、弱者愈弱的现象，即两极分化现象。\n"}, {"a": "从众效应", "ul": 8}, {"t": "：也称羊群效应，是指经济个体的从众跟风心理。\n凡勃伦效应：消费者对某些商品的需求程度，因其标价较高而"}, {"a": "增加", "ul": 8}, {"t": "。体现了“炫耀性消费”的社会心理现象。\n外部效应：也称溢出效应，是指一个人或一群人的行动和决策使另一个人或一群人受损或受益的情况。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n外部效应（外部性）\n正外部效应（正外部性）：某种经济活动给与这项活动无关的第三方带来的\n"}, {"a": "利益", "ul": 8}, {"t": "。\n负外部效应（负外部性）：某种经济活动给与这项活动无关的第三方带来的\n"}, {"a": "成本", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "经济萧条时，人们收入减少，正常情况下消费也相应减少，但是市场上做头发、做按摩等“放松消费”颇有人气，与奢侈品的低迷销量呈现出鲜明的对比，这种现象反映的经济效益是：", "opts": {"A": "棘轮效应", "B": "外部效应", "C": "羊群效应", "D": "口红效应"}, "ans": "D"}, {"src": "母题", "stem": "下列有关经济效应匹配不正确的是：", "opts": {"A": "由俭入奢易，由奢入俭难——棘轮效应", "B": "强者愈强、弱者愈弱——马太效应", "C": "商品定价越低越能受到青睐——凡勃伦效应", "D": "投资时喜欢从众跟风——羊群效应"}, "ans": "C"}, {"src": "拓展", "stem": "挤出效应：政府通过增加支出来刺激经济时，可能会导致利率上升，从而____了私人投资和消费的现象。", "opts": {"A": "减少", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "减少"}, {"src": "拓展", "stem": "棘轮效应：人的消费习惯形成之后有____，即易于向上调整，而难于向下调整。", "opts": {"A": "不可逆性", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "不可逆性"}, {"src": "拓展", "stem": "____：也称羊群效应，是指经济个体的从众跟风心理。", "opts": {"A": "从众效应", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "从众效应"}], "branches": [{"h": "要点", "terms": ["减少", "增加", "不可逆性", "马太效应", "从众效应", "利益", "成本"]}], "notes": ["挤出效应=政府扩大支出刺激经济反而推高利率、挤出部分私人投资和消费；口红效应=经济萧条时廉价奢侈品（如口红）需求反而上升；棘轮效应=消费习惯不可逆、'由俭入奢易，由奢入俭难'；马太效应=强者愈强、弱者愈弱；从众效应（羊群效应）=跟风；凡勃伦效应=越贵越买的炫耀性消费。", "外部效应（溢出效应）：正外部性=给无关第三方带来收益（如演唱会周边商业）；负外部性=给无关第三方带来成本（如上游工厂排污）。"]}, {"id": 107, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "太阳系", "nblank": 31, "blocks": [{"type": "p", "toks": [{"t": "太阳系包括太阳、八大行星及其卫星、小行星、彗星、流星体以及行星际物质。"}]}, {"type": "h2", "toks": [{"t": "1.太阳"}]}, {"type": "h3", "toks": [{"t": "（1）太阳结构\n按照由里往外的顺序，太阳由核心、辐射区、对流层、"}, {"a": "光球层", "ul": 8}, {"t": "、"}, {"a": "色球层", "ul": 8}, {"t": "、日冕层构成。\n太阳内部：核心、辐射区、对流层。\n太阳大气：光球层、"}, {"a": "色球层", "ul": 8}, {"t": "、日冕层。"}, {"a": "光球层", "ul": 8}, {"t": "是用肉眼可以观测到的太阳表面。"}]}, {"type": "h3", "toks": [{"t": "（2）太阳辐射\n太阳辐射是指太阳以"}, {"a": "电磁波", "ul": 8}, {"t": "的形式向外传递能量。能量来源于太阳内部"}, {"a": "氢", "ul": 8}, {"t": "原子"}, {"a": "核聚变", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）太阳活动\n太阳活动的表现包括太阳黑子、太阳耀斑（"}, {"a": "色球层", "ul": 8}, {"t": "）、日珥（"}, {"a": "色球层", "ul": 8}, {"t": "）和日冕物质抛射等，其中太阳黑子和"}, {"a": "耀斑", "ul": 8}, {"t": "是太阳活动的主要标志。\n太阳活动的周期大约是11 年，时烈时弱，往往引起地球上"}, {"a": "极光", "ul": 8}, {"t": "、磁暴和电离层扰动等现象。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n太阳黑子的最早记录\n中国是世界上首先发现太阳黑子的国家，最早在《"}, {"a": "汉书", "ul": 8}, {"t": "》中有记载。"}]}, {"type": "h2", "toks": [{"t": "2.八大行星\n按离太阳"}, {"a": "从近到远", "ul": 8}, {"t": "的顺序排列为：水星、金星、地球、火星、木星、土星、\n天王星、海王星。"}]}, {"type": "h3", "toks": [{"t": "（1）水星：离太阳"}, {"a": "最近", "ul": 8}, {"t": "、公转速度"}, {"a": "最快", "ul": 8}, {"t": "、体积和质量"}, {"a": "最小", "ul": 8}, {"t": "、昼\n夜温差最大的行星。古代被称为“"}, {"a": "辰星", "ul": 8}, {"t": "”或“昏星”。"}]}, {"type": "h3", "toks": [{"t": "（2）金星：自转方向"}, {"a": "自东向西", "ul": 8}, {"t": "，距地球最近、自转最慢、夜空中"}, {"a": "最亮", "ul": 8}, {"t": "的\n行星。古代被称为“"}, {"a": "长庚", "ul": 8}, {"t": "”“"}, {"a": "启明", "ul": 8}, {"t": "”“太白”。"}]}, {"type": "h3", "toks": [{"t": "（3）地球：直径最大、比重最大的岩石行星，也是质量、密度最大的类地行\n星。"}]}, {"type": "h3", "toks": [{"t": "（4）火星：表面富含"}, {"a": "氧化铁", "ul": 8}, {"t": "，被称为“红色星球”。古代被称为“荧惑星”。"}]}, {"type": "h3", "toks": [{"t": "（5）木星：质量和体积"}, {"a": "最大", "ul": 8}, {"t": "、自转"}, {"a": "最快", "ul": 8}, {"t": "的行星。古代被称为“岁星”。"}]}, {"type": "h3", "toks": [{"t": "（6）"}, {"a": "土星", "ul": 8}, {"t": "：行星环最为明亮。古代被称为“镇星”或“填星”。"}]}, {"type": "h3", "toks": [{"t": "（7）天王星：自转的倾斜度很大。"}]}, {"type": "h3", "toks": [{"t": "（8）"}, {"a": "海王星", "ul": 8}, {"t": "：大气活动最猛烈、表面风速最快，是唯一利用数学预测而非\n有计划的观测发现的行星。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n小行星带"}]}, {"type": "h2", "toks": [{"t": "1.位置\n介于"}, {"a": "火星", "ul": 8}, {"t": "轨道和"}, {"a": "木星", "ul": 8}, {"t": "轨道之间。"}]}, {"type": "h2", "toks": [{"t": "2.类型\nC型：主要成分为碳质，富含"}, {"a": "碳", "ul": 8}, {"t": "和水合矿物。颜色暗，反照率低，最为\n古老和原始，占小行星总数的75%。\nS型：主要成分为"}, {"a": "硅酸盐", "ul": 8}, {"t": "（石质）和金属。颜色较亮，反照率中等，占小行\n星总数的17%。\nM型：主要成分为金属（主要为"}, {"a": "铁", "ul": 8}, {"t": "和镍）。非常明亮，被认为是较大\n天体的金属核心在远古碰撞中被剥离后留下的残骸。"}]}], "quiz": [{"src": "真题", "stem": "小行星是太阳系形成与演化的“活化石”。关于小行星，下列说法错误的是：", "opts": {"A": "主带小行星位于火星与木星轨道之间", "B": "金属质类小行星富含的主要金属资源是铜和锌", "C": "硅酸盐质类小行星富含硅酸盐矿物，可作为太空建筑的原材料", "D": "碳质类小行星蕴藏水资源，可用于推进剂、生保物资的原位生产和补给"}, "ans": "B"}, {"src": "母题", "stem": "下列关于太阳系中八大行星的说法，正确的是：", "opts": {"A": "金星是昼夜温差最大的行星", "B": "水星是夜空中最亮的行星", "C": "木星是离地球最近、体积最大的行星", "D": "海王星是唯一利用数学预测而非有计划的观测发现的行星"}, "ans": "D"}, {"src": "拓展", "stem": "按照由里往外的顺序，太阳由核心、辐射区、对流层、____、色球层、日冕层构成。", "opts": {"A": "光球层", "B": "色球层", "C": "电磁波", "D": "核聚变"}, "ans": "A", "real": "光球层"}, {"src": "拓展", "stem": "按离太阳____的顺序排列为：水星、金星、地球、火星、木星、土星、", "opts": {"A": "从近到远", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "从近到远"}, {"src": "拓展", "stem": "古代被称为“长庚”“____”“太白”。", "opts": {"A": "启明", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "启明"}], "branches": [{"h": "1.太阳", "terms": ["光球层", "色球层", "电磁波", "核聚变", "耀斑", "极光", "汉书"]}, {"h": "2.八大行星", "terms": ["从近到远", "最近", "最快", "最小", "辰星", "自东向西", "最亮"]}, {"h": "1.位置", "terms": ["火星", "木星"]}, {"h": "2.类型", "terms": ["硅酸盐"]}], "notes": ["太阳结构由里向外=核心、辐射区、对流层（内部，核心区氢核聚变释放核能）+光球层、色球层、日冕层（太阳大气）：肉眼可见表面是光球，黑子在光球、耀斑和日珥在色球；黑子和耀斑是太阳活动主要标志，周期约11年，会引发地球极光、磁暴、电离层扰动；我国《汉书》有世界最早太阳黑子记录；极光三条件=大气+高能带电粒子+磁场。", "八大行星由近到远=水金地火木土天王海王：水星（最近、公转最快、体积质量最小、昼夜温差最大）；金星（自转自东向西、距地球最近、自转最慢、夜空中最亮，称长庚/启明/太白）；地球（类地行星中直径质量密度最大）；火星（富氧化铁呈红色、荧惑）；木星（质量体积最大、自转最快，公转约12年=岁星）；土星（光环最明亮）；天王星（自转轴倾斜极大）；海王星（大气活动最猛、唯一靠数学计算预测发现的行星）。", "小行星带位于火星与木星轨道之间，分C型（碳质、最古老、数量最多约75%）、S型（石质硅酸盐）、M型（金属铁镍）。"]}, {"id": 108, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "地球运动", "nblank": 18, "blocks": [{"type": "p", "toks": [{"t": "地球运动包括自转运动和公转运动。"}]}, {"type": "h2", "toks": [{"t": "1.自转运动"}]}, {"type": "h3", "toks": [{"t": "（1）方向："}, {"a": "自西向东", "ul": 8}]}, {"type": "h3", "toks": [{"t": "（2）周期：自转约为24 小时"}]}, {"type": "h3", "toks": [{"t": "（3）地理意义"}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "昼夜交替", "ul": 8}, {"t": "\n昼夜现象的出现原因在于地球是一个既不发光、也不透明的球体。\n昼夜更替的出现原因在于地球不停地自转。"}]}, {"type": "h4", "toks": [{"t": "②时差\n全球共划分为24 个时区，每个时区跨"}, {"a": "15", "ul": 8}, {"t": "个经度，相邻两个时区的区时相差1 小时。在同一日期内，时间上是"}, {"a": "东早西晚", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③地转偏向力\n地转偏向力并不是一个真正的力，而是一种惯性力。地转偏向力在"}, {"a": "极地", "ul": 8}, {"t": "最显著，向赤道方向逐渐减弱直到消失在赤道处。\n相对于前进方向来说，北半球地转偏向力向"}, {"a": "右", "ul": 8}, {"t": "，南半球地转偏向力向"}, {"a": "左", "ul": 8}, {"t": "，在赤道上"}, {"a": "没有偏转", "ul": 8}, {"t": "。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n地转偏向力对河流地貌的影响\n北半球：河水向右岸冲刷，使得右岸陡峭，左岸平缓并发生堆积。因此，港\n口、防洪堤坝多建于"}, {"a": "右岸", "ul": 8}, {"t": "，而聚落、挖沙场则宜选在"}, {"a": "左岸", "ul": 8}, {"t": "。\n南半球：河水向"}, {"a": "左岸", "ul": 8}, {"t": "冲刷，左岸陡峭，右岸平缓。"}]}, {"type": "h2", "toks": [{"t": "2.公转运动"}]}, {"type": "h3", "toks": [{"t": "（1）方向："}, {"a": "自西向东", "ul": 8}]}, {"type": "h3", "toks": [{"t": "（2）周期：约为365 天"}]}, {"type": "h3", "toks": [{"t": "（3）地理意义："}, {"a": "昼夜长短", "ul": 8}, {"t": "变化、正午太阳高度的变化、"}, {"a": "四季更替", "ul": 8}, {"t": "和五带划分等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n近日点和远日点\n近日点："}, {"a": "1", "ul": 8}, {"t": "月初，地球离太阳最近，公转速度"}, {"a": "最快", "ul": 8}, {"t": "。\n远日点："}, {"a": "7", "ul": 8}, {"t": "月初，地球离太阳最远，公转速度"}, {"a": "最慢", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.自转与公转的关系"}]}, {"type": "h3", "toks": [{"t": "（1）黄赤交角：又名黄道交角，也称为黄赤大距，是地球绕太阳公转的轨道\n面（黄道面）与赤道面的交角，地球的黄赤交角约为23°26'。"}]}, {"type": "h3", "toks": [{"t": "（2）太阳直射点的移动"}]}], "quiz": [{"src": "真题", "stem": "下列现象，由地球公转引起的是：", "opts": {"A": "日月星辰东升西落", "B": "各地的昼夜交替", "C": "一年中学校操场上旗杆的影子长短方向随季节发生改变", "D": "济南球迷上午9:00 观看美国当地时间20:00 举行的NBA球赛"}, "ans": "C"}, {"src": "母题", "stem": "关于地球运动，下列说法正确的是：", "opts": {"A": "天空中天体东升西落的现象都是地球公转的反映", "B": "酒泉所处纬度较之文昌更高，更有利于发射卫星", "C": "地球位于近日点时，澳大利亚西南部易发森林火灾", "D": "受地转偏向力的影响，长江口南岸的泥沙淤积更多"}, "ans": "C"}, {"src": "拓展", "stem": "（1）方向：____", "opts": {"A": "自西向东", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "自西向东"}, {"src": "拓展", "stem": "相对于前进方向来说，北半球地转偏向力向右，南半球地转偏向力向左，在赤道上____", "opts": {"A": "没有偏转", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "没有偏转"}, {"src": "拓展", "stem": "（1）方向：____", "opts": {"A": "自西向东", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "自西向东"}], "branches": [{"h": "1.自转运动", "terms": ["自西向东", "昼夜交替", "15", "东早西晚", "极地", "没有偏转", "右岸"]}, {"h": "2.公转运动", "terms": ["自西向东", "昼夜长短", "四季更替", "最快", "最慢"]}], "notes": ["自转：自西向东（北极为逆时针）、周期约24小时；地理意义=昼夜交替（地球不发光不透明+自转）、地方时差（全球24时区、每区跨15°、相邻差1小时、东早西晚）、地转偏向力（北半球向右、南半球向左、赤道不偏转，是惯性力而非真正的力）。", "地转偏向力对河流：北半球冲蚀右岸使右岸陡、左岸缓并堆积→港口和防洪堤建在右岸、聚落和挖沙场选左岸（如崇明岛在长江北岸淤积）。", "公转自西向东、约365天；黄赤交角约23°26′（对应南北回归线纬度）；直射点移动：春分3.21直射赤道→夏至6.22直射北回归线→秋分9.23回赤道→冬至12.22直射南回归线；近日点1月初（公转最快）、远日点7月初（最慢），与季节无关。"]}, {"id": 109, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "月球", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.概述\n月球是地球"}, {"a": "唯一", "ul": 8}, {"t": "的天然卫星，是离地球最近的天体。月亮本身不发光，\n"}, {"a": "反射", "ul": 8}, {"t": "的是太阳的光。"}, {"a": "环形山", "ul": 8}, {"t": "是月面上最显著的地貌特征。由于缺乏大气层\n保护，月球昼夜温差"}, {"a": "极大", "ul": 8}, {"t": "。\n月球"}, {"a": "自西向东", "ul": 8}, {"t": "逆时针方向自转，自转周期与公转周期都大约为27 天7 小时，\n故月球是一颗同步卫星。\n月球引力是地球海洋"}, {"a": "潮汐", "ul": 8}, {"t": "产生最主要的原因。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n"}, {"a": "潮汐锁定", "ul": 8}, {"t": "\n地球引力导致月球自转速度逐渐减慢，最终使其自转周期与公转周期完全一\n致，导致月球总是以同一面（正面）朝向地球。"}]}, {"type": "h2", "toks": [{"t": "2.月相\n月相变化的周期为一个朔望月，即29.53 天。\n月相\n新月（朔）\n上弦月\n满月（望）\n下弦月\n日期（农历）\n"}, {"a": "初一", "ul": 8}, {"t": "\n初七、初八\n"}, {"a": "十五、十六", "ul": 8}, {"t": "\n二十二、二十三\n外观\n不可见\n半圆形\n亮面朝西\n圆形\n半圆形\n亮面朝东"}]}, {"type": "h2", "toks": [{"t": "3.日食和月食\n日食\n月食\n概念\n"}, {"a": "月球", "ul": 8}, {"t": "运动到太阳和地球中间，\n三者在一条直线。\n"}, {"a": "地球", "ul": 8}, {"t": "运动到太阳和月球中间，\n三者在一条直线。\n时间\n只可能发生在农历"}, {"a": "初一", "ul": 8}, {"t": "前后\n只可能发生在农历"}, {"a": "十五", "ul": 8}, {"t": "前后\n分类\n日偏食、日全食、"}, {"a": "日环食", "ul": 8}, {"t": "\n月偏食、月全食、"}, {"a": "半影月食", "ul": 8}]}], "quiz": [{"src": "真题", "stem": "下列关于日食和月食的判断，正确的是：", "opts": {"A": "日、月食的成因只与日、地、月三个天体的几何位置有关", "B": "日食与月食都是自然现象，所以它们是不可能准确预报的", "C": "当月相是朔的时候就一定会发生日食", "D": "如果日食带在我国经过，肯定是东部的居民先看到"}, "ans": "A"}, {"src": "母题", "stem": "月球是围绕地球公转的卫星，也是离地球最近的星球。下列关于月球的描述有误的是：", "opts": {"A": "当部分月球进入地球的本影时，就会出现月全食", "B": "月球的自转周期和公转周期基本相等", "C": "月球本身不发光，只反射太阳光", "D": "月球表面的昼夜温差大"}, "ans": "A"}, {"src": "拓展", "stem": "月球是地球____的天然卫星，是离地球最近的天体。", "opts": {"A": "唯一", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "唯一"}, {"src": "拓展", "stem": "月球____逆时针方向自转，自转周期与公转周期都大约为27 天7 小时，", "opts": {"A": "自西向东", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "自西向东"}, {"src": "拓展", "stem": "只可能发生在农历____前后", "opts": {"A": "初一", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "初一"}], "branches": [{"h": "1.概述", "terms": ["唯一", "反射", "环形山", "极大", "自西向东", "潮汐", "潮汐锁定"]}, {"h": "2.月相", "terms": ["初一"]}, {"h": "3.日食和月食", "terms": ["月球", "地球", "初一", "十五", "日环食", "半影月食"]}], "notes": ["月球是地球唯一天然卫星、距地球最近的天体，本身不发光、反射太阳光，环形山是最显著地貌，因缺大气昼夜温差极大；自转方向自西向东，自转周期=公转周期（约27.3天）形成潮汐锁定，所以总是同一面朝向地球（有'月之暗面'）；月球引力是海洋潮汐最主要成因（但不是唯一成因）。", "月相（朔望月约29.53天）：新月（朔，农历初一、不可见）、上弦月（初七初八、半圆、亮面朝西）、满月（望，十五十六、圆形）、下弦月（廿二廿三、半圆、亮面朝东）。", "日食=月球运行到太阳与地球之间，只可能发生在农历初一前后；月食=地球运行到太阳与月球之间，只可能在农历十五前后；'血月'是阳光经地球大气散射、低频红光折射到月面形成。"]}, {"id": 110, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "降水的类型", "nblank": 14, "blocks": [{"type": "p", "toks": [{"t": "根据成因不同，可将降雨划分为对流雨、地形雨、锋面雨、台风雨。"}]}, {"type": "h2", "toks": [{"t": "1.对流雨\n对流雨，也叫热雷雨，是近地面空气局部受热或高层空气强烈降温，导致上\n下层空气发生对流，使低层空气上升，水汽在高空冷却、凝结而形成的降水。\n强烈的对流雨常伴有强风、雷电、冰雹或龙卷风，但雨时"}, {"a": "较短", "ul": 8}, {"t": "，雨区范\n围也"}, {"a": "较小", "ul": 8}, {"t": "，或呈不连续的条块分布。多发生在夏季酷热的午后。"}, {"a": "赤道", "ul": 8}, {"t": "地\n带全年以对流雨为主。"}]}, {"type": "h2", "toks": [{"t": "2.地形雨\n当潮湿的气团前进时，遇到高山阻挡，气流被迫缓慢上升，引起绝热降温，\n发生凝结而形成的降水。地形雨多降在"}, {"a": "迎风", "ul": 8}, {"t": "面的山坡（"}, {"a": "迎风", "ul": 8}, {"t": "坡）上，背\n风坡面则因空气下沉引起绝热增温，反使云量消减，降雨减少。"}]}, {"type": "h2", "toks": [{"t": "3.锋面雨\n冷、暖两种性质不同的气团相遇时，暖湿空气被抬升，在高空冷却凝结而形\n成的降水。雨势通常比较和缓。降水区域呈带状分布，水平范围"}, {"a": "很大", "ul": 8}, {"t": "。降雨\n持续时间"}, {"a": "较长", "ul": 8}, {"t": "，短则几天，长则半个月以上。常见的有梅雨、"}, {"a": "春雨", "ul": 8}, {"t": "等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n梅雨\n梅雨，是在每年"}, {"a": "6、7月份", "ul": 8}, {"t": "的东南季风带来的太平洋暖湿气流，经过中国长江\n中下游地区、中国台湾地区、日本中南部以及韩国南部等地出现的持续天阴有雨\n的气候现象。由于正是江南梅子的成熟期，故称其为“梅雨”。"}]}, {"type": "h2", "toks": [{"t": "4.台风雨\n台风雨是由热带气旋（台风或飓风）带来的降水。降水主要集中在台风眼周\n围的“"}, {"a": "云墙区", "ul": 8}, {"t": "”，这里上升气流最强，降雨最猛烈；而"}, {"a": "台风眼", "ul": 8}, {"t": "内部气流下沉，\n通常是晴朗无风的。主要影响热带、亚热带沿海地区，多发生在夏秋季节。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n暴雨"}]}, {"type": "h2", "toks": [{"t": "1.等级划分\n暴雨：24 小时降水量为50-99.9 毫米\n大暴雨：24 小时降水量为100-249.9 毫米\n特大暴雨：24 小时降水量为250 毫米以上"}]}, {"type": "h2", "toks": [{"t": "2.预警信号\n暴雨预警信号分为"}, {"a": "蓝色", "ul": 8}, {"t": "、黄色、"}, {"a": "橙色", "ul": 8}, {"t": "、红色四级。"}, {"a": "红色", "ul": 8}, {"t": "暴雨预警\n信号为最高级，表示3 小时内降雨量达到100 毫米以上，或者已达到100 毫米以\n上且降雨可能持续。"}]}], "quiz": [{"src": "真题", "stem": "下列关于锋面雨说法不正确的是：", "opts": {"A": "主要成因是地形抬升导致暖湿气流冷凝", "B": "常常形成带状分布的大范围降水区域", "C": "降水带的平均位置有随季节移动的特点", "D": "我国江淮流域的梅雨就是该类型的降水"}, "ans": "A"}, {"src": "母题", "stem": "我国某个时节的雨水天气形成原因主要有：①来自北边的西伯利亚冷空气和来自太平洋的暖气流相遇；②太阳直射点北移，北半球日照增强；③气温升高，气压不稳定。下列哪项描述了这个季节的雨水？", "opts": {"A": "清明时节雨纷纷，路上行人欲断魂", "B": "帆开青草湖中去，衣湿黄梅雨里行", "C": "何当共剪西窗烛，却话巴山夜雨时", "D": "四山多风溪水急，寒雨飒飒枯树湿"}, "ans": "A"}, {"src": "拓展", "stem": "强烈的对流雨常伴有强风、雷电、冰雹或龙卷风，但雨时____，雨区范", "opts": {"A": "较短", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "较短"}, {"src": "拓展", "stem": "地形雨多降在____面的山坡（迎风坡）上，背", "opts": {"A": "迎风", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "迎风"}, {"src": "拓展", "stem": "常见的有梅雨、____等。", "opts": {"A": "春雨", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "春雨"}], "branches": [{"h": "1.对流雨", "terms": ["较短", "较小", "赤道"]}, {"h": "2.地形雨", "terms": ["迎风"]}, {"h": "3.锋面雨", "terms": ["很大", "较长", "春雨"]}, {"h": "4.台风雨", "terms": ["云墙区", "台风眼"]}, {"h": "2.预警信号", "terms": ["蓝色", "橙色", "红色"]}], "notes": ["成雨条件=充足水汽+遇冷凝结、云滴变重。对流雨（热雷雨、'东边日出西边雨'）：近地面受热上升、时短范围小、伴雷电冰雹，夏季午后和赤道地区常见；地形雨：潮湿气团遇山被迫抬升，多降在迎风坡（迎风坡植被茂盛）、背风坡下沉增温形成雨影区；锋面雨：冷暖气团相遇、暖湿空气抬升，雨势和缓、范围大、持续久（春雨、梅雨）；台风雨：降水集中在台风眼周围'云墙区'，台风眼内反而下沉晴朗无风。", "梅雨=每年6–7月东南季风带来的太平洋暖湿气流在长江中下游（及台湾、日韩南部）形成的持续阴雨，正值江南梅子成熟期。", "暴雨等级（24小时）：50–99.9mm暴雨、100–249.9mm大暴雨、≥250mm特大暴雨；气象预警蓝黄橙红、红色最高（3小时将达100mm以上）。"]}, {"id": 111, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "气象灾害", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.台风\n台风是指发生在热带或副热带洋面上的热带气旋，中心附近最大风力在12\n级或以上。\n"}, {"a": "台风眼", "ul": 8}, {"t": "区风力很小，天气晴朗。\n每年夏秋季节，我国"}, {"a": "东南沿海", "ul": 8}, {"t": "地区是台风登陆的主要地区。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n热带气旋\n热带气旋，在北半球热带气旋中的气流绕中心呈"}, {"a": "逆时针", "ul": 8}, {"t": "方向旋转，在南半\n球热带气旋中的气流绕中心呈"}, {"a": "顺时针", "ul": 8}, {"t": "方向旋转。\n西太平洋沿岸称热带气旋为台风，大西洋称热带气旋为飓风。"}]}, {"type": "h2", "toks": [{"t": "2.洪涝\n我国洪涝灾害四季都可能发生，主要发生在"}, {"a": "夏秋", "ul": 8}, {"t": "季节。"}]}, {"type": "h2", "toks": [{"t": "3.干旱\n在我国，干旱天气，在春夏季节分布普遍，以西北、"}, {"a": "华北", "ul": 8}, {"t": "及东北地区为\n主。旱灾是我国发生范围"}, {"a": "最广", "ul": 8}, {"t": "、频率最高、持续时间最长的渐发性气象灾害。"}]}, {"type": "h2", "toks": [{"t": "4.沙尘暴\n主要发生在"}, {"a": "冬春", "ul": 8}, {"t": "季节，我国"}, {"a": "西北", "ul": 8}, {"t": "地区是沙尘暴频繁发生的地区。"}]}, {"type": "h2", "toks": [{"t": "5.寒潮\n确定寒潮的标准是某一地区冷空气过境后，气温24 小时内下降"}, {"a": "8℃", "ul": 8}, {"t": "以\n上，且最低气温下降到"}, {"a": "4℃", "ul": 8}, {"t": "以下；或48 小时内气温下降10℃以上，且最低\n气温下降到4℃以下；或72 小时内气温连续下降12℃以上，并且最低气温在4℃\n以下。\n我国寒潮主要发生在"}, {"a": "冬半年", "ul": 7}, {"t": "，影响范围大，西北、华北及东北地区较为严重。"}]}], "quiz": [{"src": "真题", "stem": "我国是台风多发的国家，下列关于台风的说法，正确的是：", "opts": {"A": "我国台风源地主要位于太平洋东部", "B": "台风眼是台风的中心部分，盛行下沉气流，天气晴朗，风平浪静", "C": "台风登陆能带来丰沛的降水是因为盛行下沉气流", "D": "夏秋季节我国东南部沿海登陆的台风属于反气旋控制下的天气"}, "ans": "B"}, {"src": "母题", "stem": "关于我国主要气象灾害的时空分布特征，下列说法正确的是：", "opts": {"A": "洪涝灾害具有明显的季节性，仅集中发生在夏季的长江中下游地区", "B": "干旱是我国影响范围最广的气象灾害，尤其是西南地区最为严重", "C": "沙尘暴主要发生在冬春季节，其沙源主要来自我国西北及邻近的蒙古国地区", "D": "寒潮是影响我国冬半年的主要气象灾害，青藏高原由于海拔高，受其影响最为严重"}, "ans": "C"}, {"src": "拓展", "stem": "____区风力很小，天气晴朗。", "opts": {"A": "台风眼", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "台风眼"}, {"src": "拓展", "stem": "我国洪涝灾害四季都可能发生，主要发生在____季节。", "opts": {"A": "夏秋", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "夏秋"}, {"src": "拓展", "stem": "主要发生在冬春季节，我国____地区是沙尘暴频繁发生的地区。", "opts": {"A": "西北", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "西北"}], "branches": [{"h": "1.台风", "terms": ["台风眼", "东南沿海", "逆时针", "顺时针"]}, {"h": "2.洪涝", "terms": ["夏秋"]}, {"h": "3.干旱", "terms": ["华北", "最广"]}, {"h": "4.沙尘暴", "terms": ["冬春", "西北"]}, {"h": "5.寒潮", "terms": ["8℃", "4℃", "冬半年"]}], "notes": ["台风是生成于热带副热带洋面的热带气旋，中心附近最大风力≥12级，台风眼内风小天晴；北半球气旋逆时针、南半球顺时针；东太平洋和大西洋称飓风、西太平洋称台风；夏秋在东南沿海登陆。", "我国各类气象灾害：洪涝主要发生在夏秋（锋面雨+台风雨）；干旱是我国范围最广、频率最高、持续时间最长的渐发性灾害，以西北、华北、东北为主；沙尘暴冬春多发于西北；寒潮（24h降温8℃以上且最低温≤4℃等标准）主要在冬半年影响北方；凌汛是北方江河特有现象，在结冰或融冰阶段冰凌堵塞河道导致水位暴涨。"]}, {"id": 112, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "二十四节气", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.二十四节气的内容\n春天的节气：立春、雨水、"}, {"a": "惊蛰", "ul": 8}, {"t": "、春分、清明、谷雨。\n夏天的节气：立夏、小满、"}, {"a": "芒种", "ul": 8}, {"t": "、夏至、小暑、大暑。\n秋天的节气：立秋、"}, {"a": "处暑", "ul": 8}, {"t": "、白露、秋分、寒露、霜降。\n冬天的节气：立冬、小雪、大雪、"}, {"a": "冬至", "ul": 8}, {"t": "、小寒、大寒。\n节气歌：春雨惊春清谷天，夏满芒夏暑相连。秋处露秋寒霜降，冬雪雪冬小\n大寒。"}]}, {"type": "h2", "toks": [{"t": "2.二十四节气反映的特征\n反映的特征\n节气\n季节变化\n立春、春分、立夏、夏至、立秋、秋分、立冬、冬至\n其中立春、立夏、立秋、立冬表示四季的"}, {"a": "开始", "ul": 8}, {"t": "\n"}, {"a": "反映太阳直射点", "ul": 15}, {"t": "变化\n春分、夏至、秋分、冬至\n温度变化\n小暑、大暑、处暑、小寒、大寒\n天气现象\n雨水、谷雨、白露、寒露、霜降、小雪、大雪\n物候现象\n惊蛰、"}, {"a": "清明", "ul": 8}, {"t": "、"}, {"a": "小满", "ul": 8}, {"t": "、"}, {"a": "芒种", "ul": 8}]}], "quiz": [{"src": "真题", "stem": "下列描述与所指节气对应正确的是：", "opts": {"A": "至于仲春之月，阳在正东，阴在正西——立春", "B": "麦至是而始可收，稻过是而不可种——夏至", "C": "阴极之至，阳气始生，日南至——秋分", "D": "水始冰，地始冻，雉入大水为蜃——立冬"}, "ans": "D"}, {"src": "母题", "stem": "关于二十四节气，下列表述错误的是：", "opts": {"A": "惊蛰、小满和处暑是反映物候现象的节气", "B": "夏至是北半球一年中白昼最长的一天", "C": "立春、秋分是反映季节的节气", "D": "白露、寒露、霜降反映气温逐渐下降的过程和程度"}, "ans": "A"}, {"src": "拓展", "stem": "春天的节气：立春、雨水、____、春分、清明、谷雨。", "opts": {"A": "惊蛰", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "惊蛰"}, {"src": "拓展", "stem": "秋天的节气：立秋、____、白露、秋分、寒露、霜降。", "opts": {"A": "处暑", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "处暑"}, {"src": "拓展", "stem": "其中立春、立夏、立秋、立冬表示四季的____", "opts": {"A": "开始", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "开始"}], "branches": [{"h": "1.二十四节气的内容", "terms": ["惊蛰", "芒种", "处暑", "冬至"]}, {"h": "2.二十四节气反映的特征", "terms": ["开始", "反映太阳直射点", "清明", "小满", "芒种"]}], "notes": ["节气歌：春雨惊春清谷天，夏满芒夏暑相连，秋处露秋寒霜降，冬雪雪冬小大寒；每节气约15天。", "按含义分类：表四季开始=立春立夏立秋立冬；表太阳直射点=春分夏至秋分冬至（赤道/北回归线/赤道/南回归线）；表温度（冷热）=小暑大暑处暑小寒大寒；表天气现象=雨水谷雨白露寒露霜降小雪大雪；表物候农事=惊蛰清明小满芒种。"]}, {"id": 113, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的邻国", "nblank": 10, "blocks": [{"type": "p", "toks": [{"t": "我国共有"}, {"a": "14", "ul": 8}, {"t": "个陆上邻国，"}, {"a": "6", "ul": 8}, {"t": "个隔海相望的国家。\n14 个与我国接壤的国家：朝鲜、蒙古、俄罗斯、"}, {"a": "哈萨克斯坦", "ul": 16}, {"t": "、吉尔吉斯斯坦、塔吉克斯坦、印度、尼泊尔、不丹、阿富汗、"}, {"a": "巴基斯坦", "ul": 8}, {"t": "、缅甸、老挝、"}, {"a": "越南", "ul": 8}, {"t": "。\n6 个隔海相望的国家："}, {"a": "日本", "ul": 8}, {"t": "、韩国、菲律宾、"}, {"a": "马来西亚", "ul": 8}, {"t": "、文莱、印度尼西亚。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n邻国之最\n"}, {"a": "俄罗斯", "ul": 8}, {"t": "：世界上面积最大的国家\n"}, {"a": "哈萨克斯坦", "ul": 16}, {"t": "：世界上最大的内陆国\n"}, {"a": "印度尼西亚", "ul": 16}, {"t": "：世界上最大的群岛国家，被称为“万岛之国”"}]}], "quiz": [{"src": "真题", "stem": "和我国陆地接壤的国家不包括：", "opts": {"A": "哈萨克斯坦", "B": "塔吉克斯坦", "C": "乌兹别克斯坦", "D": "阿富汗"}, "ans": "C"}, {"src": "母题", "stem": "中国的陆上国境线漫长，与多个国家相邻，下列对于中国陆上邻国的表述正确的是：", "opts": {"A": "朝鲜是最早与中国建交的国家", "B": "俄罗斯是世界上面积最大的国家", "C": "马来西亚被称为“万岛之国”", "D": "蒙古是最大的内陆国"}, "ans": "B"}, {"src": "拓展", "stem": "我国共有____个陆上邻国，6个隔海相望的国家。", "opts": {"A": "14", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "14"}, {"src": "拓展", "stem": "6 个隔海相望的国家：日本、韩国、菲律宾、____、文莱、印度尼西亚。", "opts": {"A": "马来西亚", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "马来西亚"}, {"src": "拓展", "stem": "____：世界上最大的内陆国", "opts": {"A": "哈萨克斯坦", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "哈萨克斯坦"}], "branches": [{"h": "要点", "terms": ["14", "哈萨克斯坦", "巴基斯坦", "越南", "日本", "马来西亚", "俄罗斯"]}], "notes": ["14个陆上邻国=朝鲜、蒙古、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、印度、尼泊尔、不丹、阿富汗、巴基斯坦、缅甸、老挝、越南（注意没有乌兹别克斯坦、泰国、孟加拉国）；6个隔海相望=日本、韩国、菲律宾、马来西亚、文莱、印尼；周边外交理念=亲诚惠容。", "邻国之最：俄罗斯面积最大；哈萨克斯坦是世界最大内陆国；印尼是最大群岛国（'万岛之国'）；第一个与新中国建交的是苏联；唯一未与我国建交的邻国是不丹；人口最多的是印度；社会主义邻国=朝鲜、越南、老挝（古巴不是邻国）。"]}, {"id": 114, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的地势与地形", "nblank": 32, "blocks": [{"type": "h2", "toks": [{"t": "1.地势\n我国地势"}, {"a": "西高东低", "ul": 8}, {"t": "，大致呈三级阶梯状分布。"}]}, {"type": "h3", "toks": [{"t": "（1）第一阶梯\n平均海拔4000 米以上，分布着"}, {"a": "青藏", "ul": 8}, {"t": "高原、"}, {"a": "柴达木", "ul": 8}, {"t": "盆地。"}]}, {"type": "h3", "toks": [{"t": "（2）第二阶梯\n平均海拔1000—2000 米，分布着内蒙古高原、黄土高原、"}, {"a": "云贵", "ul": 8}, {"t": "高原、\n"}, {"a": "塔里木", "ul": 8}, {"t": "盆地、准噶尔盆地、四川盆地。"}]}, {"type": "h3", "toks": [{"t": "（3）第三阶梯\n大部分海拔在500 米以下，分布着东北平原、华北平原、长江中下游平原、\n辽东丘陵、山东丘陵、东南丘陵。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n三级阶梯的分界线\n一、二阶梯分界线："}, {"a": "昆仑山脉", "ul": 8}, {"t": "—祁连山脉—横断山脉\n二、三阶梯分界线：大兴安岭—"}, {"a": "太行山脉", "ul": 8}, {"t": "—巫山—雪峰山"}]}, {"type": "h2", "toks": [{"t": "2.地形\n我国地形复杂多样，山区面积广大，占陆地总面积的三分之二。在山地中，\n镶嵌着高原、盆地、平原和丘陵等。\n四\n大\n高\n原\n"}, {"a": "青藏", "ul": 6}, {"t": "高原\n世界海拔最高的高原，被称为“世界屋脊”“世界第三极”。\n"}, {"a": "内蒙古", "ul": 6}, {"t": "高原\n称为“瀚海”，我国最平坦的高原，有典型的风蚀地貌。\n"}, {"a": "黄土", "ul": 6}, {"t": "高原\n世界黄土分布最广，流水侵蚀，地表千沟万壑。\n"}, {"a": "云贵", "ul": 6}, {"t": "高原\n喀斯特地貌发育典型，地势崎岖不平，有许多“坝子”。\n四\n大\n盆\n地\n"}, {"a": "塔里木", "ul": 6}, {"t": "盆地\n我国面积最大的盆地、最大的"}, {"a": "内流盆地", "ul": 8}, {"t": "。分布有塔克拉玛\n干沙漠（我国面积最大的沙漠，世界"}, {"a": "第二大", "ul": 8}, {"t": "流动沙漠）。\n"}, {"a": "准噶尔", "ul": 6}, {"t": "盆地\n我国位置最北、纬度最高的盆地，有典型的风蚀雅丹地貌。\n柴达木盆地\n我国地势"}, {"a": "最高", "ul": 8}, {"t": "的盆地，有盐、石油、煤以及多种金属\n矿藏，被称为“"}, {"a": "聚宝盆", "ul": 8}, {"t": "”，有风蚀雅丹地貌。\n四川盆地\n我国四大盆地中地势"}, {"a": "最低", "ul": 8}, {"t": "的盆地、我国最大的外流盆\n地，被称为“"}, {"a": "红色盆地", "ul": 8}, {"t": "”“紫色盆地”。\n三\n大\n平\n原\n东北平原\n我国"}, {"a": "面积最大", "ul": 8}, {"t": "的平原，地跨黑、吉、辽和内蒙古四个省区，\n由三江平原、"}, {"a": "松嫩平原", "ul": 8}, {"t": "（面积最大）、辽河平原组成。这\n是全球仅有的三大"}, {"a": "黑土", "ul": 8}, {"t": "区域之一。\n华北平原\n跨越京、津、冀、鲁、豫、皖、苏7 省市，又称黄淮海平\n原，由黄河、淮河、海河等含沙量河流合力冲积而成。\n长江中下游\n平原\n地跨鄂、湘、赣、皖、苏、浙、沪等7 省市，湖泊密布，\n素有“"}, {"a": "鱼米之乡", "ul": 8}, {"t": "”“水乡泽国”的美誉。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n喀斯特、雅丹、丹霞地貌"}]}, {"type": "h2", "toks": [{"t": "1.喀斯特地貌：可溶性岩石（石灰岩等）被"}, {"a": "水", "ul": 8}, {"t": "溶蚀、侵蚀形成的地貌。\n常见于温暖湿润、降水丰富的地区。我国典型代表有"}, {"a": "云南石林", "ul": 8}, {"t": "、广西"}, {"a": "桂林山水", "ul": 8}, {"t": "、\n贵州织金洞等。"}]}, {"type": "h2", "toks": [{"t": "2.雅丹地貌：河湖相土状沉积物（泥岩、粉砂岩等）被"}, {"a": "风力", "ul": 8}, {"t": "吹蚀、磨蚀形\n成的地貌。常见于极端干旱的荒漠区。我国典型代表有新疆乌尔禾魔鬼城、新疆\n"}, {"a": "罗布泊", "ul": 8}, {"t": "、青海柴达木盆地等。"}]}, {"type": "h2", "toks": [{"t": "3.丹霞地貌：红色陆相碎屑岩（砂砾岩）被流水和重力作用侵蚀，形成以\n"}, {"a": "陡崖坡", "ul": 8}, {"t": "为特征的地貌。可形成于多种气候区。我国典型代表有广东"}, {"a": "丹霞山", "ul": 8}, {"t": "（丹\n霞地貌的命名地，被誉为“中国红石公园”）、福建"}, {"a": "武夷山", "ul": 8}, {"t": "、江西龙虎山、甘\n肃"}, {"a": "张掖", "ul": 8}, {"t": "七彩丹霞等。"}]}], "quiz": [{"src": "真题", "stem": "关于我国四大高原的主要特征，下列说法错误的是：", "opts": {"A": "云贵高原——石灰岩广布，地表崎岖，多喀斯特地貌", "B": "内蒙古高原——温带大陆性气候，煤、铁、稀土资源丰富", "C": "黄土高原——位于我国季风区、属于暖温带，主要作物是玉米", "D": "青藏高原——湖泊众多，为东亚、东南亚、南亚许多河流的发源地"}, "ans": "C"}, {"src": "母题", "stem": "下列说法错误的是：", "opts": {"A": "青藏高原上雪山连绵、冰川耸立，是世界上最大的固体水库", "B": "准噶尔盆地位于天山以北，是我国纬度最高的盆地", "C": "柴达木盆地存储丰富的盐、石油、煤以及多种金属矿藏，被誉为“聚宝盆”", "D": "长江中下游平原，湖泊密布，素有“鱼米之乡”“水乡泽国”的美誉"}, "ans": "A"}, {"src": "拓展", "stem": "我国地势____，大致呈三级阶梯状分布。", "opts": {"A": "西高东低", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "西高东低"}, {"src": "拓展", "stem": "干沙漠（我国面积最大的沙漠，世界____流动沙漠）。", "opts": {"A": "第二大", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "第二大"}, {"src": "拓展", "stem": "素有“____”“水乡泽国”的美誉。", "opts": {"A": "鱼米之乡", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "鱼米之乡"}], "branches": [{"h": "1.地势", "terms": ["西高东低", "青藏", "柴达木", "云贵", "塔里木", "昆仑山脉", "太行山脉"]}, {"h": "2.地形", "terms": ["青藏", "内蒙古", "黄土", "云贵", "塔里木", "内流盆地", "第二大"]}, {"h": "1.喀斯特地貌：可溶性岩石（石灰岩等）被", "terms": ["云南石林", "桂林山水"]}, {"h": "2.雅丹地貌：河湖相土状沉积物（泥岩、粉砂岩等）被", "terms": ["风力", "罗布泊"]}, {"h": "3.丹霞地貌：红色陆相碎屑岩（砂砾岩）被流水和重力作用侵蚀，形成以", "terms": ["陡崖坡", "丹霞山", "武夷山", "张掖"]}], "notes": ["地势西高东低、分三级阶梯：第一级（≥4000m）=青藏高原、柴达木盆地；第二级（1000–2000m）=内蒙古/黄土/云贵高原+塔里木/准噶尔/四川盆地；第三级（≤500m）=东北/华北/长江中下游平原+辽东/山东/东南丘陵。一二阶梯分界=昆仑山—祁连山—横断山；二三阶梯分界=大兴安岭—太行山—巫山—雪峰山；山区约占陆地面积2/3。", "四大高原：青藏（最高、世界屋脊/第三极）、内蒙古（最平坦、风蚀雅丹地貌）、黄土（世界黄土分布最广、千沟万壑）、云贵（喀斯特典型、地形崎岖、多坝子）。", "四大盆地：塔里木（面积最大、内流盆地，内有最大沙漠塔克拉玛干——世界第二大流动沙漠）、准噶尔（最北、纬度最高）、柴达木（地势最高、盐石油有色金属多，'聚宝盆'）、四川（地势最低、最大外流盆地、紫色/红色盆地）。", "三大平原：东北平原（面积最大、跨黑吉辽内蒙古、全球三大黑土区之一、提供最多商品粮）、华北平原（黄淮海冲积、人口最多）、长江中下游平原（湖泊密布、鱼米之乡、经济总量最高）。"]}, {"id": 115, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的河流与湖泊", "nblank": 33, "blocks": [{"type": "p", "toks": [{"t": "一、主要河流"}]}, {"type": "h2", "toks": [{"t": "1.长江和黄河\n长江\n黄河\n源头\n青藏高原唐古拉山\n青藏高原巴颜喀拉山\n流经省份\n青、藏、川、云、"}, {"a": "渝", "ul": 6}, {"t": "、鄂、湘、\n"}, {"a": "赣", "ul": 6}, {"t": "、皖、苏、沪11 个省区\n青、川、甘、宁、"}, {"a": "内蒙古", "ul": 6}, {"t": "、晋、\n陕、"}, {"a": "豫", "ul": 6}, {"t": "、鲁9 个省区\n注入海洋\n于上海崇明岛入"}, {"a": "东海", "ul": 6}, {"t": "\n于山东东营入"}, {"a": "渤海", "ul": 6}, {"t": "\n地位\n中国第一长河、世界"}, {"a": "第三", "ul": 6}, {"t": "长河\n中国第二长河\n主要支流\n"}, {"a": "汉江", "ul": 6}, {"t": "是长江的最长的支流\n"}, {"a": "嘉陵江", "ul": 6}, {"t": "是长江流域面积最大的支流\n"}, {"a": "岷江", "ul": 6}, {"t": "是长江径流量最大的支流\n"}, {"a": "渭河", "ul": 6}, {"t": "是黄河最长、最大的支\n流\n特点\n我国水量最大的河流，地跨三级阶\n梯，水能资源丰富，有“"}, {"a": "黄金水道", "ul": 8}, {"t": "”\n“水能宝库”之称。\n呈“ 几” 字形，是世界上\n"}, {"a": "含沙量", "ul": 8}, {"t": "最多的河流。在冬春\n季节，可能有凌汛现象出现，\n被称为“母亲河”“中华民族\n的摇篮”。"}]}, {"type": "h2", "toks": [{"t": "2.其他河流"}]}, {"type": "h3", "toks": [{"t": "（1）珠江：由西江、北江、东江及珠江三角洲诸河汇聚而成的复合水系，通\n常以西江为主干，主要经虎门、蕉门、洪奇门、横门、磨刀门、鸡啼门、虎跳门、崖门等八大入海口注入南海，因此被称为“"}, {"a": "三龙吐珠", "ul": 8}, {"t": "，八门入海”。这是我国"}, {"a": "汛期", "ul": 8}, {"t": "最长的河流，水运量仅次于长江居全国第二位。"}]}, {"type": "h3", "toks": [{"t": "（2）雅鲁藏布江：世界"}, {"a": "海拔最高", "ul": 8}, {"t": "的大河，注入"}, {"a": "印度洋", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）三江源：长江、黄河、"}, {"a": "澜沧江", "ul": 8}, {"t": "三条大河的发源地。三江源自然保护区\n是我国"}, {"a": "面积最大", "ul": 8}, {"t": "的天然湿地分布区，最大的自然保护区，有“"}, {"a": "中华水塔", "ul": 8}, {"t": "”之称。"}]}, {"type": "h3", "toks": [{"t": "（4）"}, {"a": "塔里木河", "ul": 8}, {"t": "：我国最长的内流河，被誉为“生命之河”“母亲之河”。"}]}, {"type": "h3", "toks": [{"t": "（5）额尔齐斯河：中国唯一注入"}, {"a": "北冰洋", "ul": 8}, {"t": "的河流。"}]}, {"type": "h3", "toks": [{"t": "（6）"}, {"a": "京杭大运河", "ul": 16}, {"t": "：世界上里程最长、工程最大、开凿最早的古代人工\n运河。北起北京、南到杭州，纵贯京津两市和冀、"}, {"a": "鲁", "ul": 8}, {"t": "、苏、浙四省，沟通海河、"}, {"a": "黄河", "ul": 8}, {"t": "、淮河、"}, {"a": "长江", "ul": 8}, {"t": "、钱塘江五大水系。\n二、主要湖泊"}]}, {"type": "h2", "toks": [{"t": "1.五大淡水湖："}, {"a": "鄱阳湖", "ul": 8}, {"t": "（赣）、"}, {"a": "洞庭湖", "ul": 8}, {"t": "（湘）、太湖（苏）、洪泽湖（苏）、\n巢湖（皖）为我国主要淡水湖泊。其中"}, {"a": "鄱阳湖", "ul": 8}, {"t": "是我国面积最大的淡水湖，也是\n我国第二大湖。"}]}, {"type": "h2", "toks": [{"t": "2."}, {"a": "青海湖", "ul": 8}, {"t": "：位于青海省，是我国最大的内陆湖泊，也是我国最大的咸水湖。"}]}, {"type": "h2", "toks": [{"t": "3.纳木错：位于西藏自治区，是我国第三大咸水湖，是世界"}, {"a": "海拔最高", "ul": 8}, {"t": "的咸水湖。"}]}, {"type": "h2", "toks": [{"t": "4.艾丁湖：位于新疆吐鲁番盆地，是我国"}, {"a": "海拔最低", "ul": 8}, {"t": "的湖泊，属于内陆咸水湖。"}]}, {"type": "h2", "toks": [{"t": "5."}, {"a": "赛里木湖", "ul": 8}, {"t": "：新疆海拔最高、面积最大的高山冷水湖，被称为“大西洋最后\n一滴眼泪”。"}]}], "quiz": [{"src": "真题", "stem": "下列关于河流入海口的描述与河流对应错误的是：", "opts": {"A": "浑浊的河水奔流而至，汇入清澈的渤海，形成一条清晰的分界线——黄河", "B": "“三龙吐珠，八门入海”，生动地描绘出了它的奇特形态——淮河", "C": "在入海口的潮间带上，会看到一片耀眼的红色，又被称为“红海滩”——辽河", "D": "在其与东海海潮的相互激荡下，造就了我国第三大岛崇明岛——长江"}, "ans": "B"}, {"src": "母题", "stem": "下列关于我国长江和黄河概况说法正确的是：①长江、黄河的发源地都在青海省②长江流经省的数量比黄河流经的多③岷江、嘉陵江都是长江的支流④黄河的入海口位于山东省东营市", "opts": {"A": "①②④", "B": "②③④", "C": "①③④", "D": "①②③④"}, "ans": "D"}, {"src": "母题", "stem": "下列关于我国湖泊的说法中错误的是：", "opts": {"A": "位于新疆的艾丁湖是我国海拔最低的湖", "B": "我国最大的内陆湖是青海湖", "C": "我国最大的淡水湖是洞庭湖", "D": "赛里木湖被称为“大西洋最后一滴眼泪”"}, "ans": "C"}, {"src": "拓展", "stem": "青、川、甘、宁、____、晋、", "opts": {"A": "内蒙古", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "内蒙古"}, {"src": "拓展", "stem": "____最多的河流。", "opts": {"A": "含沙量", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "含沙量"}, {"src": "拓展", "stem": "（6）____：世界上里程最长、工程最大、开凿最早的古代人工", "opts": {"A": "京杭大运河", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "京杭大运河"}], "branches": [{"h": "1.长江和黄河", "terms": ["内蒙古", "东海", "渤海", "第三", "汉江", "嘉陵江", "岷江"]}, {"h": "2.其他河流", "terms": ["三龙吐珠", "汛期", "海拔最高", "印度洋", "澜沧江", "面积最大", "中华水塔"]}, {"h": "1.五大淡水湖：", "terms": ["鄱阳湖", "洞庭湖"]}, {"h": "2.", "terms": ["青海湖"]}, {"h": "3.纳木错：位于西藏自治区，是我国第三大咸水湖，是世界", "terms": ["海拔最高"]}, {"h": "4.艾丁湖：位于新疆吐鲁番盆地，是我国", "terms": ["海拔最低"]}, {"h": "5.", "terms": ["赛里木湖"]}], "notes": ["世界长河=尼罗河、亚马逊河、长江、密西西比河、黄河。长江发源于唐古拉山，流经11个省级行政区，在上海崇明岛注入东海；最长支流汉江、流域面积最大支流嘉陵江、径流量最大支流岷江；是我国水量最大的河流，水能丰（最大水电站三峡），被称'黄金水道''水能宝库'。", "黄河发源于巴颜喀拉山、呈'几'字形、在山东东营入渤海，是世界含沙量最大的河流、冬春有凌汛，最大支流渭河，被称'母亲河'。珠江由西江北江东江汇成、八门入海，汛期最长、水运量第二；雅鲁藏布江是世界海拔最高的大河、注入印度洋、水能蕴藏世界第一；三江源（长江、黄河、澜沧江发源地）被称'中华水塔'；塔里木河是最长内流河；额尔齐斯河是我国唯一注入北冰洋的河流。", "京杭大运河是世界里程最长、工程最大、开凿最早的人工运河，北起北京南到杭州，沟通海河、黄河、淮河、长江、钱塘江五大水系（春秋吴国始挖、隋代贯通、元代裁弯取直）。", "五大淡水湖=鄱阳湖（赣、最大淡水湖）、洞庭湖、太湖、洪泽湖、巢湖；青海湖是最大内陆湖、最大咸水湖；纳木错是世界海拔最高的咸水湖（内流湖）；艾丁湖（吐鲁番）海拔-154m是我国陆地最低点；赛里木湖被称'大西洋最后一滴眼泪'。"]}, {"id": 116, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的地理分界线", "nblank": 19, "blocks": [{"type": "h2", "toks": [{"t": "1.秦岭—淮河一线\n具体内容如下表所示：\n秦岭—淮河以北\n秦岭—淮河以南\n1 月均温\n0℃"}, {"a": "以下", "ul": 8}, {"t": "\n0℃"}, {"a": "以上", "ul": 8}, {"t": "\n温度带\n暖温带\n亚热带\n气候类型\n温带季风气候\n亚热带季风气候\n年降水量\n"}, {"a": "少于", "ul": 8}, {"t": "800 毫米\n"}, {"a": "大于", "ul": 8}, {"t": "800 毫米\n干湿地区\n半湿润区\n湿润区\n土壤类型\n多肥沃的褐土（"}, {"a": "黄壤", "ul": 8}, {"t": "）\n多贫瘠的"}, {"a": "红壤", "ul": 8}, {"t": "\n耕地类型\n"}, {"a": "旱地", "ul": 8}, {"t": "农业\n"}, {"a": "水田", "ul": 8}, {"t": "农业\n农作物\n以小麦、玉米、花生、甜菜为主\n以水稻、小麦、油菜、甘蔗为主\n作物熟制\n一年一熟或两年三熟\n一年两熟到三熟\n民居特点\n屋顶坡度"}, {"a": "较小", "ul": 8}, {"t": "，墙体较厚\n屋顶坡度"}, {"a": "较大", "ul": 8}, {"t": "，墙体较高\n地理分区\n"}, {"a": "北方", "ul": 8}, {"t": "\n"}, {"a": "南方", "ul": 8}]}, {"type": "h2", "toks": [{"t": "2.其他地理分界线"}]}, {"type": "h3", "toks": [{"t": "（1）季风区与非季风区的分界线：大兴安岭—阴山山脉—贺兰山—巴颜喀拉\n山脉—冈底斯山脉。"}]}, {"type": "h3", "toks": [{"t": "（2）半湿润区与半干旱区、"}, {"a": "400", "ul": 8}, {"t": "毫米等降水量线的分界线：从大兴安岭\n向西南，经张家口、兰州、拉萨附近，到喜马拉雅山的南坡。"}]}, {"type": "h3", "toks": [{"t": "（3）半干旱区与干旱区、"}, {"a": "200", "ul": 8}, {"t": "毫米等降水量线的分界线：大致通过阴山、\n贺兰山、祁连山、巴颜喀拉山到冈底斯山一线。"}]}, {"type": "h3", "toks": [{"t": "（4）外流区与内流区的分界线：北段大体沿大兴安岭——阴山——贺兰山—\n—祁连山（东端）一线，南段比较接近200 毫米等降水量线。"}]}, {"type": "h3", "toks": [{"t": "（5）冬小麦与春小麦的分界线："}, {"a": "长城", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（6）旱作农业区与畜牧业区的分界线：阴山山脉。"}]}, {"type": "h3", "toks": [{"t": "（7）人口地理分界线："}, {"a": "黑河", "ul": 8}, {"t": "—腾冲线（胡焕庸线），线"}, {"a": "东南", "ul": 8}, {"t": "居住着\n约94%的人口；线"}, {"a": "西北", "ul": 8}, {"t": "则地广人稀。"}]}, {"type": "h3", "toks": [{"t": "（8）长江水系与黄河水系分界线：巴颜喀拉山—秦岭。"}]}, {"type": "h3", "toks": [{"t": "（9）长江水系与珠江水系分界线："}, {"a": "南岭", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "以下关于中国重要地理分界线说法正确的是：", "opts": {"A": "季风区与非季风区的界限：大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山", "B": "半湿润区与半干旱区、400 毫米等降水量线的分界线：秦岭—淮河一线", "C": "外流区域与内流区域的界限：大兴安岭—阴山—贺兰山—秦岭", "D": "冬小麦与春小麦的分界线：黄河"}, "ans": "A"}, {"src": "母题", "stem": "下列关于我国主要地理分界线的说法，表述正确的是：", "opts": {"A": "长江水系和黄河水系的分水岭是南岭", "B": "旱地农业和水田农业的分界线是阴山山脉", "C": "秦岭—淮河一线是我国南方和北方的分界线", "D": "人口地理分界线是胡焕庸线，线西北居住着约94%的人口"}, "ans": "C"}, {"src": "拓展", "stem": "____800 毫米", "opts": {"A": "少于", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "少于"}, {"src": "拓展", "stem": "屋顶坡度____，墙体较高", "opts": {"A": "较大", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "较大"}, {"src": "拓展", "stem": "（7）人口地理分界线：____—腾冲线（胡焕庸线），线东南居住着", "opts": {"A": "黑河", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "黑河"}], "branches": [{"h": "1.秦岭—淮河一线", "terms": ["以下", "以上", "少于", "大于", "黄壤", "红壤", "旱地"]}, {"h": "2.其他地理分界线", "terms": ["400", "200", "长城", "黑河", "东南", "西北", "南岭"]}], "notes": ["秦岭—淮河一线是南北方分界，两侧对比：1月均温北<0℃/南>0℃；温度带北暖温带/南亚热带；年降水量北<800mm/南>800mm；干湿区北半湿润/南湿润；土壤北褐土/南红壤；耕地北旱地/南水田；作物北小麦玉米花生甜菜/南水稻油菜甘蔗；熟制北一年一熟或两年三熟/南一年两熟到三熟；民居北屋顶坡度小墙体厚（防寒）/南坡度大墙体高（防雨）。", "等降水量线：200mm（干旱/半干旱）=阴山—贺兰山—祁连山—巴颜喀拉山—冈底斯山一线；400mm（半湿润/半干旱）=大兴安岭—张家口—兰州—拉萨—喜马拉雅山东南端一线；季风区与非季风分界=大兴安岭—阴山—贺兰山—巴颜喀拉山—冈底斯山。", "其他分界：冬小麦与春小麦分界=长城；旱作农业与畜牧业分界=阴山；人口地理分界线=黑河—腾冲线（胡焕庸线，东南侧居住约94%人口）；长江黄河水系分界=巴颜喀拉山—秦岭；长江珠江水系分界=南岭。"]}, {"id": 117, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的自然资源", "nblank": 18, "blocks": [{"type": "h2", "toks": [{"t": "1.土地资源\n我国土地资源的特点：（1）土地"}, {"a": "总量大", "ul": 8}, {"t": "，人均占有少。（2）"}, {"a": "山地", "ul": 8}, {"t": "多\n于平地，耕地比例小。（3）土地资源地区"}, {"a": "分布不均", "ul": 8}, {"t": "。（4）后备土地资源有限。"}]}, {"type": "h3", "toks": [{"t": "（5）水土资源不平衡。"}]}, {"type": "h2", "toks": [{"t": "2.水资源\n我国水资源的特点：（1）总量大，而人均水资源占有量少。（2）时空分布\n不均。"}, {"a": "东多西少", "ul": 8}, {"t": "、南多北少。"}, {"a": "夏秋多", "ul": 8}, {"t": "、冬春少。（3）水资源与人口、耕地分布\n不匹配。中国水资源的分布情况是南多北少，而耕地的分布却是南少北多。（4）\n水环境形势严峻，地下水严重超采。"}]}, {"type": "h2", "toks": [{"t": "3.能源和矿产资源"}]}, {"type": "h3", "toks": [{"t": "（1）主要能源分布及其特点\n能源分布及特点水能蕴藏量居世界"}, {"a": "第一位", "ul": 8}, {"t": "。"}, {"a": "西南", "ul": 8}, {"t": "地区分布最多。按河流统计，以"}, {"a": "长江", "ul": 8}, {"t": "水系为最多，占全国的近40%，其次是雅鲁藏布江水系。\n风能我国风能一般"}, {"a": "北多、南少", "ul": 8}, {"t": "，从海边向内地迅速减弱，内陆又增强。从时间来说，冬春两季风力普遍大于夏秋两季。\n地热能我国"}, {"a": "东南沿海", "ul": 8}, {"t": "和西藏、云南一带，是地热资源丰富地区。\n太阳能"}, {"a": "青藏高原", "ul": 8}, {"t": "日照时间及辐射量均居全国之冠。云雾、阴天特多的四川盆地和有“天无三日晴”之称的贵州高原是我国辐射能低值中心。"}]}, {"type": "h3", "toks": [{"t": "（2）矿产资源\n我国三大化石能源（煤炭、石油、天然气）的现状是"}, {"a": "富煤、少油、缺气", "ul": 16}, {"t": "。\n矿产资源分布及其特点煤被誉为“工业的粮食”。我国"}, {"a": "第一大", "ul": 8}, {"t": "能源，产量居世界"}, {"a": "第一位", "ul": 8}, {"t": "，呈现出"}, {"a": "北多南少", "ul": 8}, {"t": "的分布特点。\n石油我国石油资源，东部主要分布在大庆、辽河、大港、胜利、华北油田。西部主要分布在塔里木、柴达木、准噶尔三大盆地及吐鲁番—哈密盆地。\n天然气我国天然气主要分布在中部和西部地区，其中四川盆地是我国天然气生产的主力地区。\n稀土常被称为“工业维生素”“新材料之母”等。我国是"}, {"a": "唯一", "ul": 8}, {"t": "能提供全部17 种稀土元素的国家，稀土的储备量、生产量、加工能力均为世界"}, {"a": "第一", "ul": 8}, {"t": "。内蒙古"}, {"a": "白云鄂博", "ul": 8}, {"t": "稀土矿是世界最大的稀土矿。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n全球第二大在产轻稀土矿\n2026 年3 月24 日，四川冕宁牦牛坪矿区新增稀土氧化物资源量966.56 万吨，\n经权威评审备案，累计保有量达1040.8 万吨，一跃成为全球第二大在产轻稀土矿，\n仅次于内蒙古包头白云鄂博矿。"}]}], "quiz": [{"src": "真题", "stem": "下列表述，不符合我国土地资源特点的是：", "opts": {"A": "山地少，平地多，耕地比重小", "B": "土地资源绝对量大，人均量少", "C": "土地资源分布不平均，土地生产力地区差异大", "D": "耕地后备资源少，难利用的土地多"}, "ans": "A"}, {"src": "母题", "stem": "下列有关我国能源分布的说法正确的是：", "opts": {"A": "石油资源主要分布在中国西南地区", "B": "天然气主要分布在西部高原", "C": "太阳能主要分布在青藏高原和四川盆地", "D": "煤炭分布西多东少，北富南贫"}, "ans": "D"}, {"src": "拓展", "stem": "我国土地资源的特点：（1）土地____，人均占有少。", "opts": {"A": "总量大", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "总量大"}, {"src": "拓展", "stem": "____地区分布最多。", "opts": {"A": "西南", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "西南"}, {"src": "拓展", "stem": "我国____能源，产量居世界第一位，呈现出北多南少的分布特点。", "opts": {"A": "第一大", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "第一大"}], "branches": [{"h": "1.土地资源", "terms": ["总量大", "山地", "分布不均"]}, {"h": "2.水资源", "terms": ["东多西少", "夏秋多"]}, {"h": "3.能源和矿产资源", "terms": ["第一位", "西南", "长江", "东南沿海", "青藏高原", "第一大", "北多南少"]}], "notes": ["土地国情：总量大、人均少，山地多平地少、耕地比重小、后备资源有限、水土资源不匹配（以约世界6.5%的陆地、9%的耕地养活约20%人口）。水资源总量大、人均少，时空分布不均（南多北少、夏秋多冬春少），水南多北少而耕地南少北多，存在地下水超采。", "水能蕴藏量世界第一、西南最多、长江水系最丰富；风能北多南少、沿海和内陆多、冬春大于夏秋；地热能集中在板块交界（藏南、云南、东南沿海）；太阳能青藏高原最丰富、四川盆地和贵州是低值中心（'天无三日晴'）。", "化石能源'富煤、少油、缺气'：煤是第一大能源（'工业粮食'、产量世界第一、北多南少，内蒙古山西最多）；石油分布在东部大庆/辽河/大港/胜利/华北和西部三大盆地+吐哈盆地；天然气主力产区在四川盆地；稀土被称'工业维生素''新材料之母'，我国储量、生产、加工均世界第一，内蒙古白云鄂博是世界最大稀土矿。"]}, {"id": 118, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的少数民族", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.民族分布特点\n我国民族分布的特点是大杂居、小聚居、交错杂居。"}]}, {"type": "h3", "toks": [{"t": "（2）少数民族的节日及特色"}]}, {"type": "table", "ncol": 3, "head": [[{"t": "民族"}], [{"t": "节日"}], [{"t": "民族特色"}]], "rows": [[{"toks": [{"a": "蒙古族", "ul": 8}, {"t": " “那达慕”大会、"}], "span": 0}, {"toks": [{"t": "“白节”、马奶节"}], "span": 0}, {"toks": [{"t": "图腾崇拜、萨满教、腾格里汗、蒙古包，马头琴、长调民歌、马背民族，献“哈达”，安代舞"}], "span": 0}], [{"toks": [{"t": "藏族"}], "span": 0}, {"toks": [{"a": "雪顿节", "ul": 8}], "span": 0}, {"toks": [{"t": "《"}, {"a": "格萨尔王传", "ul": 16}, {"t": "》，献“哈达”、锅庄舞，酥油茶、青稞酒，唐卡"}], "span": 0}], [{"toks": [{"a": "回族", "ul": 8}], "span": 0}, {"toks": [{"t": "古尔邦节、开斋节、圣纪节"}], "span": 0}, {"toks": [{"t": "信仰伊斯兰教、不吃猪肉，男子多带小白帽，女子带各种花色的头巾"}], "span": 0}], [{"toks": [{"t": "苗族"}], "span": 0}, {"toks": [{"t": "苗年、跳水节"}], "span": 0}, {"toks": [{"t": "银饰、苗绣、蜡染，"}, {"a": "芦笙舞", "ul": 7}, {"t": "、飞歌、盘歌"}], "span": 0}], [{"toks": [{"a": "维吾尔族", "ul": 8}], "span": 0}, {"toks": [{"t": "肉孜节、古尔邦节、诺鲁孜节"}], "span": 0}, {"toks": [{"t": "“尕巴”（四楞花帽）、阿凡提、十二木卡姆（大型古典音乐）、手鼓舞"}], "span": 0}], [{"toks": [{"a": "壮族", "ul": 8}], "span": 0}, {"toks": [{"t": "“三月三”歌节"}], "span": 0}, {"toks": [{"t": "“干栏”式建筑，《布洛陀》长诗、天琴"}], "span": 0}], [{"toks": [{"a": "傣族", "ul": 8}], "span": 0}, {"toks": [{"t": "泼水节、关（开）门节"}], "span": 0}, {"toks": [{"t": "有“水的民族”的美称，建筑以“干栏”为主"}], "span": 0}], [{"toks": [{"t": "白族"}], "span": 0}, {"toks": [{"t": "三月街节、火把节"}], "span": 0}, {"toks": [{"t": "“三道茶”、崇尚白色、石雕"}], "span": 0}], [{"toks": [{"t": "彝族"}], "span": 0}, {"toks": [{"t": "彝族年、火把节"}], "span": 0}, {"toks": [{"t": "花腰刺绣"}], "span": 0}]]}, {"type": "h3", "toks": [{"t": "（1）少数民族之“最”\n人口最多的少数民族是"}, {"a": "壮族", "ul": 8}, {"t": "，分布最广的少数民族是"}, {"a": "回族", "ul": 8}, {"t": "，少数民\n族种类最多的省份是"}, {"a": "云南", "ul": 8}, {"t": "省，少数民族总人口最多的省份是"}, {"a": "广西", "ul": 8}, {"t": "省。"}]}], "quiz": [{"src": "真题", "stem": "五十六个民族，五十六朵花，五十六个民族团结一条心，就能把祖国建设得繁荣富强。下列关于我国56 个民族的说法，错误的是：", "opts": {"A": "全国55 个少数民族中人口最多的是壮族", "B": "满族的前身是女真族", "C": "献“哈达”是维吾尔族人民的一种礼节", "D": "汉族是世界上人口最多的民族"}, "ans": "C"}, {"src": "母题", "stem": "下列关于少数民族特征的说法正确的是：", "opts": {"A": "黎族的主要节日为泼水节", "B": "高山族主要信仰喇嘛教", "C": "傣族喜欢摔跤、善骑射", "D": "壮族的山歌令人陶醉"}, "ans": "D"}, {"src": "拓展", "stem": "人口最多的少数民族是____，分布最广的少数民族是回族，少数民", "opts": {"A": "壮族", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "壮族"}, {"src": "拓展", "stem": "人口最多的少数民族是壮族，分布最广的少数民族是____，少数民", "opts": {"A": "回族", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "回族"}, {"src": "拓展", "stem": "族种类最多的省份是____省，少数民族总人口最多的省份是广西省。", "opts": {"A": "云南", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "云南"}], "branches": [{"h": "1.民族分布特点", "terms": ["蒙古族", "雪顿节", "格萨尔王传", "回族", "芦笙舞", "维吾尔族", "壮族"]}], "notes": ["民族分布特点=大杂居、小聚居、交错杂居（56个民族、55个少数民族）：人口最多=壮族；分布最广=回族；民族种类最多的省=云南（25个世居少数民族、15个云南独有）；少数民族总人口最多=广西。", "民族节日与文化：蒙古族那达慕（马头琴、长调、献哈达）；藏族雪顿节（酥油茶、青稞酒、唐卡、信藏传佛教）；回族古尔邦节/开斋节（伊斯兰教、不吃猪肉、男戴小白帽）；苗族苗年、跳花节（银饰、蜡染、芦笙舞）；维吾尔族肉孜节/古尔邦节/诺鲁孜节（十二木卡姆）；壮族三月三歌节；傣族泼水节（'水的民族'、干栏式建筑）；白族三月街、三道茶；彝族火把节、彝族年。"]}, {"id": 119, "part": "常识判断", "pian": "地理常识", "zhang": "", "jie": "", "kind": "zsd", "title": "中国的旅游资源", "nblank": 19, "blocks": [{"type": "h2", "toks": [{"t": "1.重要景观\n五岳：东岳"}, {"a": "泰山", "ul": 8}, {"t": "（山东，“五岳之首”）、西岳"}, {"a": "华山", "ul": 8}, {"t": "（陕西）、北\n岳恒山（山西）、南岳衡山（湖南）、中岳嵩山（河南）。\n四大佛教名山：山西五台山、浙江"}, {"a": "普陀山", "ul": 8}, {"t": "、四川峨眉山、安徽"}, {"a": "九华山", "ul": 8}, {"t": "。\n四大道教名山：安徽齐云山、湖北"}, {"a": "武当山", "ul": 8}, {"t": "、四川青城山、江西"}, {"a": "龙虎山", "ul": 8}, {"t": "。\n四大石窟：甘肃敦煌"}, {"a": "莫高窟", "ul": 8}, {"t": "、山西大同云冈石窟、河南洛阳"}, {"a": "龙门石窟", "ul": 8}, {"t": "、甘\n肃天水麦积山石窟。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n四大石窟\n"}, {"a": "莫高窟", "ul": 8}, {"t": "：开凿时间从十六国时期至元代，以壁画和彩塑为主要表现形式。\n它是世界上现存规模最大、内容最丰富的佛教艺术地。1987 年列入世界文化遗产。\n"}, {"a": "云冈石窟", "ul": 8}, {"t": "：北魏时期开凿，是中国第一个由皇室直接主持开凿的大型石窟群，\n被誉为“北魏皇家石窟典范”。2001 年列入世界文化遗产。\n"}, {"a": "龙门石窟", "ul": 8}, {"t": "：开凿于北魏孝文帝年间，唐宋时期扩建，被誉为“中国石刻艺术\n的最高峰”，是中国现存窟龛最多的石窟，也是中国古碑刻最多的一处，有“古\n碑林”之称。2000 年列入世界文化遗产。\n"}, {"a": "麦积山石窟", "ul": 8}, {"t": "：始建于十六国后秦时期，后经十余个王朝的扩建和修缮，以泥塑\n艺术见长，被誉为“东方雕塑陈列馆”。2014 年列入世界文化遗产。\n四大名楼：山西鹳雀楼、江西"}, {"a": "滕王阁", "ul": 8}, {"t": "、湖北黄鹤楼、湖南岳阳楼。\n长江三峡：西起重庆"}, {"a": "白帝城", "ul": 8}, {"t": "，东至湖北南津关，由瞿塘峡、"}, {"a": "巫峡", "ul": 8}, {"t": "、西\n陵峡组成。\n"}, {"a": "黄果树", "ul": 8}, {"t": "瀑布：位于贵州省，是我国最大的瀑布。\n"}, {"a": "壶口", "ul": 8}, {"t": "瀑布：位于陕西省和山西省交界处，是我国第二大瀑布，也是世界\n上最大的黄色瀑布。"}]}, {"type": "h2", "toks": [{"t": "2.世界遗产\n截至2025 年7 月11 日，中国世界遗产总数达到60 项。其中，文化遗产41\n项，自然遗产15 项，文化与自然双遗产4 项。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n西夏陵\n2025 年7 月11 日，联合国教科文组织第47 届世界遗产大会通过决议，将“西\n夏陵”列入《世界遗产名录》。\n西夏陵是11 至13 世纪由"}, {"a": "党项族", "ul": 8}, {"t": "建立的西夏王朝的皇家陵园，位于宁夏回\n族自治区银川市西夏区贺兰山东麓，是我国现存规模最大、地面遗迹保存最为完\n整的帝王陵园之一。"}]}, {"type": "h3", "toks": [{"t": "（1）世界文化与自然双遗产\n福建省"}, {"a": "武夷山", "ul": 8}, {"t": "、四川峨眉山─乐山风景名胜区、安徽黄山、山东泰山（世界首个双重遗产）。"}]}, {"type": "h3", "toks": [{"t": "（2）非物质文化遗产\n截至2024 年年底，我国入选联合国教科文组织的非遗名录、名册的项目已达44 个，总数居世界第一。包括京剧、中医针灸、珠算、二十四节气、藏医药浴法、太极拳、送王船、中国传统制茶技艺及其相关习俗等。\n2009 年通过的端午节是我国首个入选世界非遗的节日，2024 年“春节——中国人庆祝传统新年的社会实践”列入人类非物质文化遗产代表作名录。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n茶"}]}, {"type": "h2", "toks": [{"t": "1.分类：绿茶、白茶、黄茶、红茶、乌龙茶、黑茶、再加工茶"}]}, {"type": "h2", "toks": [{"t": "2.绿茶的制作过程：采摘→摊晾→杀青→揉捻→干燥。红茶多了发酵环节，\n黄茶多了闷黄环节，白茶少了杀青环节。"}]}, {"type": "h2", "toks": [{"t": "3.茶圣：唐代陆羽，著有《茶经》（中国乃至世界现存最早、最完整、最全\n面介绍茶的第一部专著）。"}]}, {"type": "h2", "toks": [{"t": "4.国际茶日：5 月21 日。"}]}, {"type": "h2", "toks": [{"t": "5.普洱茶：未经发酵的是生普洱茶（茶性较烈），发酵后的是熟普洱茶（茶\n性温和、适合日常饮用）。"}]}], "quiz": [{"src": "真题", "stem": "下列关于地理常识正确的是：", "opts": {"A": "峨眉山—乐山大佛是世界文化与自然双重遗产", "B": "中国的“五岳”指：泰山、华山、衡山、嵩山、黄山", "C": "喀喇昆仑山是世界第三高山脉，有“亚洲脊柱”之称", "D": "黄果树瀑布和壶口瀑布的成因是喀斯特地貌的侵蚀作用"}, "ans": "A"}, {"src": "母题", "stem": "我国下列名胜古迹的说法中错误的是：", "opts": {"A": "华山位于陕西省，被誉为“五岳之首”", "B": "云冈石窟位于山西省，创建于北魏", "C": "莫高窟位于敦煌市东南，始建于东晋", "D": "三星堆位于四川，史学界普遍认为其与古蜀国文化相关"}, "ans": "A"}, {"src": "拓展", "stem": "五岳：东岳____（山东，“五岳之首”）、西岳华山（陕西）、北", "opts": {"A": "泰山", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "泰山"}, {"src": "拓展", "stem": "四大石窟：甘肃敦煌____、山西大同云冈石窟、河南洛阳龙门石窟、甘", "opts": {"A": "莫高窟", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "莫高窟"}, {"src": "拓展", "stem": "四大名楼：山西鹳雀楼、江西____、湖北黄鹤楼、湖南岳阳楼。", "opts": {"A": "滕王阁", "B": "光球层", "C": "色球层", "D": "电磁波"}, "ans": "A", "real": "滕王阁"}], "branches": [{"h": "1.重要景观", "terms": ["泰山", "华山", "普陀山", "九华山", "武当山", "龙虎山", "莫高窟"]}, {"h": "2.世界遗产", "terms": ["党项族", "武夷山"]}], "notes": ["五岳=东岳泰山（山东、五岳之首）、西岳华山（陕）、北岳恒山（晋）、南岳衡山（湘）、中岳嵩山（豫）；四大佛教名山=五台山（晋）、普陀山（浙）、峨眉山（川）、九华山（皖）；四大道教名山=齐云山（皖）、武当山（鄂）、青城山（川）、龙虎山（赣）。", "四大石窟：莫高窟（甘敦煌、规模最大内容最丰、壁画彩塑）、云冈石窟（晋大同、北魏、首个皇室直接主持开凿的大型石窟）、龙门石窟（豫洛阳、古碑刻最多、'中国石刻艺术最高峰'）、麦积山石窟（甘天水、以泥塑见长、'东方雕塑陈列馆'）；四大名楼=鹳雀楼、滕王阁、黄鹤楼、岳阳楼。", "黄果树瀑布是我国最大瀑布（喀斯特地貌）；壶口瀑布是第二大、世界最大黄色瀑布（陕晋交界）。", "世界遗产：泰山是世界首个文化与自然双遗产（另三个双遗产=黄山、峨眉山-乐山、武夷山）；2025.7.11西夏陵申遗成功后我国世界遗产共60项；人类非遗代表作2024年新增'春节'，昆曲是我国首个入选项目、端午节是首个入选的节日；茶分类=绿白黄红乌龙黑再加工，绿茶无发酵、制作流程为采摘→摊晾→杀青→揉捻→干燥；茶圣=唐陆羽《茶经》；国际茶日5月21日；普洱生茶未发酵茶性烈、熟茶发酵后温和。"]}, {"id": 120, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "自然人的民事权利能力和民事行为能力", "nblank": 17, "blocks": [{"type": "h2", "toks": [{"t": "1.民法概念\n调整平等主体"}, {"a": "自然人", "ul": 8}, {"t": "、"}, {"a": "法人", "ul": 8}, {"t": "和非法人组织的财产关系和人身关系的法\n律规范的总称。"}]}, {"type": "h2", "toks": [{"t": "2.自然人的民事权利能力"}]}, {"type": "h3", "toks": [{"t": "（1）自然人的民事权利能力，是指自然人依法享有民事权利和承担民事义务\n的"}, {"a": "资格", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）自然人的民事权利能力始于"}, {"a": "出生", "ul": 8}, {"t": "，终于"}, {"a": "死亡", "ul": 8}, {"t": "。涉及"}, {"a": "遗产继承", "ul": 8}, {"t": "、\n"}, {"a": "接受赠与", "ul": 8}, {"t": "等胎儿利益保护的，胎儿视为"}, {"a": "具有", "ul": 8}, {"t": "民事权利能力。但是胎儿娩出时为死体的，其民事权利能力自始不存在。"}]}, {"type": "h2", "toks": [{"t": "3.自然人的民事行为能力"}]}, {"type": "h3", "toks": [{"t": "（1）自然人的民事行为能力，是指自然人能以"}, {"a": "自己的行为", "ul": 8}, {"t": "享有民事权利、承担\n民事义务的能力。即自然人依法"}, {"a": "独立", "ul": 8}, {"t": "进行民事活动的资格。"}]}, {"type": "h3", "toks": [{"t": "（2）分类"}]}, {"type": "h4", "toks": [{"t": "①完全民事行为能力人：已满"}, {"a": "18周岁", "ul": 8}, {"t": "的成年人；"}, {"a": "16周岁", "ul": 8}, {"t": "以上的未成年人，\n以自己的"}, {"a": "劳动收入", "ul": 8}, {"t": "为主要生活来源的。"}]}, {"type": "h4", "toks": [{"t": "②限制民事行为能力人：已满"}, {"a": "8周岁", "ul": 8}, {"t": "，不满"}, {"a": "18周岁", "ul": 8}, {"t": "的未成年人；不能完\n全辨认自己行为的成年人。"}]}, {"type": "h4", "toks": [{"t": "③无民事行为能力人：不满"}, {"a": "8周岁", "ul": 8}, {"t": "的未成年人；"}, {"a": "不能辨认", "ul": 8}, {"t": "自己行为的成年\n人以及8 周岁以上不能辨认自己行为的未成年人。"}]}], "quiz": [{"src": "真题", "stem": "根据《中华人民共和国民法典》关于自然人民事行为能力的规定，下列表述正确的是：", "opts": {"A": "17 周岁的网红小周靠直播打赏月入过万，其与游戏公司签订的价值50 万元的装备转让合同效力待定", "B": "15 周岁的高中生李某用自己的压岁钱购买了一台价值8000 元的笔记本电脑，该购买行为未经父母追认不发生法律效力", "C": "7 周岁的小学生王某获赠祖父赠与的价值10 万元的钢琴一台，该受赠行为有效", "D": "22 周岁的间歇性精神病人张某，在病情发作完全无法辨认自己行为时购买的手机，其监护人有权主张该购买行为无效"}, "ans": "D"}, {"src": "母题", "stem": "王某，6 岁，在重庆某幼儿园学习绘画数年。2018 年夏天，某机构组织儿童绘画展，王某的画被选中参展并获得一等奖，得到了奖金1000 元。王某的父母已离异，其母张某为王某的监护人，王某的父亲每月给王某600 元抚养费。这1000 元奖金应归：", "opts": {"A": "王某的母亲", "B": "王某的父亲", "C": "幼儿园", "D": "王某"}, "ans": "D"}, {"src": "母题", "stem": "张强今年17 岁，由于学习成绩不理想，辍学跟随朋友外出打工，每月收入3000 元。根据《民法典》规定，张强：", "opts": {"A": "属于无民事行为能力人", "B": "属于限制民事行为能力人", "C": "可视为完全民事行为能力人", "D": "属于部分民事行为能力人"}, "ans": "C"}, {"src": "拓展", "stem": "调整平等主体____、法人和非法人组织的财产关系和人身关系的法", "opts": {"A": "自然人", "B": "法人", "C": "资格", "D": "出生"}, "ans": "A", "real": "自然人"}, {"src": "拓展", "stem": "接受赠与等胎儿利益保护的，胎儿视为____民事权利能力。", "opts": {"A": "具有", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "具有"}, {"src": "拓展", "stem": "以自己的____为主要生活来源的。", "opts": {"A": "劳动收入", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "劳动收入"}], "branches": [{"h": "1.民法概念", "terms": ["自然人", "法人"]}, {"h": "2.自然人的民事权利能力", "terms": ["资格", "出生", "死亡", "遗产继承", "接受赠与", "具有"]}, {"h": "3.自然人的民事行为能力", "terms": ["自己的行为", "独立", "18周岁", "16周岁", "劳动收入", "8周岁", "不能辨认"]}], "notes": ["民法调整平等主体（自然人、法人、非法人组织）之间的人身关系和财产关系，'平等主体'是区别于其他法律关系的核心。", "民事权利能力='做人的资格'，始于出生、终于死亡、人人平等；涉及遗产继承、接受赠与等胎儿利益保护时，胎儿视为具有民事权利能力，但娩出时为死体的自始不存在；年龄时间证明顺序：出生（死亡）证明→户籍登记→其他证据。例：父亲遗100万、妻子怀孕，预留10万给胎儿——活体出生则继承、娩出死体则预留份额回归遗产、出生后死亡则由其继承人（母亲）继承。", "民事行为能力='做事的资格'：完全=年满18周岁（16–18周岁以自己劳动收入为主要生活来源的视为完全民事行为能力人）；限制=8周岁以上不满18周岁、不能完全辨认自己行为的成年人；无=不满8周岁、完全不能辨认的成年人。", "行为效力：完全民事行为能力人订立的合同原则上有效；限制民事行为能力人——纯获利益有效、与年龄智力相适应的有效、超出能力的单方行为无效、超出能力的双方合同效力待定（看父母是否追认）；无民事行为能力人实施的一律无效。"]}, {"id": 121, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "民事法律行为的效力", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.有效的民事法律行为（同时满足）"}]}, {"type": "h3", "toks": [{"t": "（1）行为人具有相应的民事行为能力"}, {"a": "", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）意思表示"}, {"a": "真实", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）不违反法律、行政法规的强制性规定；不违背"}, {"a": "公序良俗", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.无效的民事法律行为（满足一条即可）"}]}, {"type": "h3", "toks": [{"t": "（1）无民事行为能力人实施的民事法律行为。"}]}, {"type": "h3", "toks": [{"t": "（2）行为人与相对人以"}, {"a": "虚假的", "ul": 8}, {"t": "意思表示实施的民事法律行为无效。"}]}, {"type": "h3", "toks": [{"t": "（3）违反法律、行政法规的强制性规定的民事法律行为无效，但是该强制性\n规定不导致该民事法律行为无效的除外。"}]}, {"type": "h3", "toks": [{"t": "（4）违背"}, {"a": "公序良俗", "ul": 8}, {"t": "的民事法律行为无效。"}]}, {"type": "h3", "toks": [{"t": "（5）行为人与相对人"}, {"a": "恶意串通", "ul": 8}, {"t": "，损害他人合法权益的民事法律行为无效。"}]}, {"type": "h2", "toks": [{"t": "3.效力待定的民事法律行为。"}]}, {"type": "h3", "toks": [{"t": "（1）类型"}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "限制", "ul": 8}, {"t": "民事行为能力人实施的"}, {"a": "超越", "ul": 8}, {"t": "能力范围的民事法律行为，经法\n定代理人同意或者追认后有效。拒绝追认，民事法律行为无效。"}]}, {"type": "h4", "toks": [{"t": "②行为人"}, {"a": "没有代理权", "ul": 8}, {"t": "、"}, {"a": "超越代理权", "ul": 8}, {"t": "或者"}, {"a": "代理权终止", "ul": 8}, {"t": "后仍然实施代理行为，未经被代\n理人追认的，对被代理人不发生效力。"}]}, {"type": "h3", "toks": [{"t": "（2）法律后果"}]}, {"type": "h4", "toks": [{"t": "①相对人的催告权及法定代理人（被代理人）的"}, {"a": "追认权", "ul": 8}, {"t": "：相对人可以催告\n法定代理人（被代理人）自收到通知之日起"}, {"a": "30日", "ul": 8}, {"t": "内予以追认。法定代理人（被代理人）未作表示的，视为拒绝追认。"}]}, {"type": "h4", "toks": [{"t": "②善意相对人的"}, {"a": "撤销权", "ul": 8}, {"t": "：民事法律行为被追认前，善意相对人有撤销的权\n利。撤销应当以"}, {"a": "通知", "ul": 8}, {"t": "的方式作出。"}]}, {"type": "h2", "toks": [{"t": "4.可撤销的民事法律行为"}]}], "quiz": [{"src": "真题", "stem": "M公司在网络购物平台销售一款智能门锁，宣称该门锁具有“生成临时密码”功能，韩某购买安装该款门锁后，发现并不具备所宣称的功能，该公司回复说需要额外付费升级系统后才能安装该功能。对此，下列说法不正确的是：", "opts": {"A": "M公司对产品的不实宣传构成欺诈", "B": "M公司与韩某之间的买卖合同无效", "C": "韩某有权向M公司主张惩罚性赔偿", "D": "韩某有权请求M公司承担违约责任"}, "ans": "B"}, {"src": "母题", "stem": "甲（10 岁）开发出一套游戏软件，以1000 元价格卖给了某软件公司。下列说法正确的是：", "opts": {"A": "该买卖行为有效", "B": "该买卖行为效力待定", "C": "未签署书面合同，该买卖行为无效", "D": "甲为限制民事行为能力人，该买卖行为无效"}, "ans": "B"}, {"src": "拓展", "stem": "（2）意思表示____", "opts": {"A": "真实", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "真实"}, {"src": "拓展", "stem": "①____民事行为能力人实施的超越能力范围的民事法律行为，经法", "opts": {"A": "限制", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "限制"}, {"src": "拓展", "stem": "②行为人没有代理权、超越代理权或者____后仍然实施代理行为，未经被代", "opts": {"A": "代理权终止", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "代理权终止"}], "branches": [{"h": "1.有效的民事法律行为（同时满足）", "terms": ["真实", "公序良俗"]}, {"h": "2.无效的民事法律行为（满足一条即可）", "terms": ["虚假的", "公序良俗", "恶意串通"]}, {"h": "3.效力待定的民事法律行为。", "terms": ["限制", "超越", "没有代理权", "超越代理权", "代理权终止", "追认权", "30日"]}], "notes": ["有效三要件（同时满足）=主体具有相应行为能力+意思表示真实+不违反法律强制性规定、不违背公序良俗。", "无效（一条即可）：无民事行为能力人实施、虚假意思表示（阴阳合同）、违反强制性规定、违背公序良俗（如代孕、买卖器官）、恶意串通损害他人。", "效力待定：限制民事行为能力人超出能力范围、无权代理（没有/超越/代理权终止后仍代理）；相对人有催告权，法代/被代理人30日内追认、未作表示视为拒绝，善意相对人在追认前有权撤销。", "可撤销：重大误解（自身原因认识错误，知道之日起90日内）、欺诈（知道之日起1年）、显失公平（趁人之危、折损超30%，1年）、胁迫（胁迫终止起1年）；最长保护期=行为发生之日起5年（例：住了7年才发现中介隐瞒凶宅，已过5年最长期间不能撤销）。"]}, {"id": 122, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "诉讼时效", "nblank": 20, "blocks": [{"type": "p", "toks": [{"t": "诉讼时效，是指权利人在法定期间内不行使"}, {"a": "请求权", "ul": 8}, {"t": "，即依法丧失依诉讼程序强制义务人履行义务的权利的法律制度。"}]}, {"type": "h2", "toks": [{"t": "1.诉讼时效期间"}]}, {"type": "h3", "toks": [{"t": "（1）普通诉讼时效期间及起算\n类型撤销权消灭短期期间撤销权消灭最长期间"}, {"a": "重大误解", "ul": 7}, {"t": "自知道或者应当知道撤销事由行为发生之日起"}, {"a": "5年内", "ul": 4}, {"t": "欺诈自知道或应当知道撤销事由之日起1 年"}, {"a": "显失公平", "ul": 7}, {"t": "胁迫自胁迫行为终止之日起1 年"}]}, {"type": "h4", "toks": [{"t": "①一般诉讼时效期间及起算\n期间："}, {"a": "三年", "ul": 8}, {"t": "。法律另有规定的，依照其规定。\n起算：自权利人知道或者应当知道"}, {"a": "权利受到损害", "ul": 8}, {"t": "以及"}, {"a": "义务人", "ul": 8}, {"t": "之日起计算。无民事行为能力人或者限制民事行为能力人的权利受到损害的，诉讼时效期间自其法定代理人知道或者应当知道权利受到损害以及义务人之日起计算，但是法律另有规定的除外。"}]}, {"type": "h4", "toks": [{"t": "②最长诉讼时效期间及起算\n期间："}, {"a": "二十年", "ul": 8}, {"t": "。\n起算：自"}, {"a": "权利受到损害", "ul": 8}, {"t": "之日起计算；有特殊情况的，人民法院可以根据权利人的申请决定延长。"}]}, {"type": "h3", "toks": [{"t": "（2）诉讼时效期间的特殊起算规则"}]}, {"type": "h4", "toks": [{"t": "①当事人约定同一债务分期履行的，诉讼时效期间自"}, {"a": "最后一期", "ul": 8}, {"t": "履行期限届满\n之日起计算。"}]}, {"type": "h4", "toks": [{"t": "②无民事行为能力人或者限制民事行为能力人对其法定代理人的请求权的诉\n讼时效期间，自该法定"}, {"a": "代理终止", "ul": 8}, {"t": "之日起计算。"}]}, {"type": "h4", "toks": [{"t": "③未成年人遭受"}, {"a": "性侵害", "ul": 8}, {"t": "的损害赔偿请求权的诉讼时效期间，自受害人年满\n"}, {"a": "十八周岁", "ul": 8}, {"t": "之日起计算。"}]}, {"type": "h2", "toks": [{"t": "2.不适用诉讼时效的情形"}]}, {"type": "h3", "toks": [{"t": "（1）请求"}, {"a": "停止侵害", "ul": 8}, {"t": "、排除妨碍、"}, {"a": "消除危险", "ul": 8}, {"t": "；"}]}, {"type": "h3", "toks": [{"t": "（2）"}, {"a": "不动产物权", "ul": 8}, {"t": "和登记的"}, {"a": "动产物权", "ul": 8}, {"t": "的权利人请求返还财产；"}]}, {"type": "h3", "toks": [{"t": "（3）请求支付"}, {"a": "抚养费", "ul": 8}, {"t": "、"}, {"a": "赡养费", "ul": 8}, {"t": "或者"}, {"a": "扶养费", "ul": 8}, {"t": "；"}]}, {"type": "h3", "toks": [{"t": "（4）依法不适用诉讼时效的其他请求权。"}]}], "quiz": [{"src": "真题", "stem": "诉讼时效是指民事权利受到侵害的权利人在法定的时效期间内不行使权利，当时效期间届满时，人民法院对权利人的权利不再进行保护的制度。下列情形不适用诉讼时效的是：①甲要求邻居拆除妨碍通行的围墙②乙要求物业修复可能导致儿童坠落的下水道③丙要求长期占用其名下房屋的人搬离④丁要求某公司支付其专利使用费", "opts": {"A": "①③④", "B": "②③④", "C": "①②③", "D": "①②④"}, "ans": "C"}, {"src": "母题", "stem": "丁某在回家途中不慎掉入没有设置明显标志且未采取安全措施的坑中，造成骨折。遂于2016 年12 月10 日找到建设项目的发包人和承包人要求赔偿，但两单位相互推诿。丁某于12 月13 日前往法院提起诉讼，途遇台风阻挡，只好折回。下列说法正确的是：", "opts": {"A": "本案诉讼时效期间于2019 年12 月10 日届满", "B": "丁某12 月13 日的行为引起诉讼时效中断", "C": "发包人应承担民事赔偿责任", "D": "承包人不承担民事赔偿责任"}, "ans": "A"}, {"src": "拓展", "stem": "诉讼时效，是指权利人在法定期间内不行使____，即依法丧失依诉讼程序强制义务人履行义务的权利的法律制度。", "opts": {"A": "请求权", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "请求权"}, {"src": "拓展", "stem": "讼时效期间，自该法定____之日起计算。", "opts": {"A": "代理终止", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "代理终止"}, {"src": "拓展", "stem": "（2）____和登记的动产物权的权利人请求返还财产；", "opts": {"A": "不动产物权", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "不动产物权"}], "branches": [{"h": "要点", "terms": ["请求权"]}, {"h": "1.诉讼时效期间", "terms": ["重大误解", "5年内", "显失公平", "三年", "权利受到损害", "义务人", "二十年"]}, {"h": "2.不适用诉讼时效的情形", "terms": ["停止侵害", "消除危险", "不动产物权", "动产物权", "抚养费", "赡养费", "扶养费"]}], "notes": ["诉讼时效=法定期间内不行使请求权，将丧失请求法院强制义务人履行的权利（胜诉权消灭、实体权利不消灭）。一般诉讼时效3年，自权利人知道或应当知道权利受损及义务人之日起算；最长20年（自权利受损之日起，特殊情况可申请延长）。", "特殊起算：同一债务分期履行的，自最后一期届满之日起算；无/限制民事行为能力人对法定代理人的请求权，自代理终止之日起算；未成年人遭受性侵害的损害赔偿请求权，自年满18周岁之日起算。", "不适用诉讼时效：请求停止侵害、排除妨碍、消除危险（物权请求权）；不动产物权和登记动产物权人请求返还财产；请求支付抚养费、赡养费、扶养费（'救命钱'）等。"]}, {"id": 123, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "物权", "nblank": 61, "blocks": [{"type": "h2", "toks": [{"t": "1.物权：物权是指权利人依法对特定的物享有直接支配和排他的权利，包括\n"}, {"a": "所有权", "ul": 8}, {"t": "、"}, {"a": "用益物权", "ul": 8}, {"t": "和"}, {"a": "担保物权", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.物权变动基本规则"}]}, {"type": "h3", "toks": [{"t": "（1）不动产物权变动：不动产物权的设立、变更、转让和消灭，经"}, {"a": "依法登记", "ul": 8}, {"t": "，\n发生效力；未经登记，不发生效力，但法律另有规定的除外。"}]}, {"type": "h3", "toks": [{"t": "（2）动产物权变动：对于一般动产，其物权的设立和转让，自"}, {"a": "交付", "ul": 8}, {"t": "时发\n生效力；对于特殊动产，如"}, {"a": "船舶", "ul": 8}, {"t": "、"}, {"a": "航空器", "ul": 8}, {"t": "和机动车等，由于其价值较大，其物权的设立、变更、转让和消灭，"}, {"a": "未经登记", "ul": 8}, {"t": "，不得对抗善意第三人。"}]}, {"type": "h2", "toks": [{"t": "3.所有权"}]}, {"type": "h3", "toks": [{"t": "（1）所有权的取得"}]}, {"type": "h4", "toks": [{"t": "①先占：以所有人的意思占有"}, {"a": "无主动产", "ul": 8}, {"t": "而取得其所有权。"}]}, {"type": "h4", "toks": [{"t": "②善意取得："}, {"a": "无权处分", "ul": 8}, {"t": "他人财产的占有人，在不法将其占有的他人财产让与\n第三人后，如果受让人在取得该财产时系出于善意，即取得该财产的所有权，原财产所有人不得要求受让人返还。\n构成要件：出让人"}, {"a": "无处分权", "ul": 8}, {"t": "；受让人受让该不动产或者动产时是"}, {"a": "善意的", "ul": 8}, {"t": "；\n以合理的价格"}, {"a": "转让", "ul": 8}, {"t": "；应当登记的"}, {"a": "已登记", "ul": 8}, {"t": "，不需要登记的"}, {"a": "已交付", "ul": 8}, {"t": "。\n法律后果：原所有人"}, {"a": "无权", "ul": 8}, {"t": "请求善意第三人"}, {"a": "返还原物", "ul": 8}, {"t": "，善意受让人取得不动产或者动产的所有权，原所有权人有权向"}, {"a": "无处分权人", "ul": 8}, {"t": "请求赔偿损失。\n"}, {"a": "遗失物", "ul": 8}, {"t": "、盗赃物、"}, {"a": "埋藏物", "ul": 8}, {"t": "不适用善意取得。"}]}, {"type": "h4", "toks": [{"t": "③拾得遗失物：拾得遗失物应当返还权利人。拾得人应当"}, {"a": "及时通知", "ul": 8}, {"t": "权利人领\n取，或者送交公安等有关部门。有关部门收到遗失物，知道权利人的，应当及时通知其领取；不知道的，应当及时发布招领公告。遗失物自发布"}, {"a": "招领公告", "ul": 8}, {"t": "之日起"}, {"a": "一年内", "ul": 8}, {"t": "无人认领的，归"}, {"a": "国家", "ul": 8}, {"t": "所有。"}]}, {"type": "h3", "toks": [{"t": "（2）共有：某项财产由两个或两个以上的权利主体共有享有所有权，包括公\n民之间的共有、法人之间的共有以及公民和法人之间的共有。"}]}, {"type": "h4", "toks": [{"t": "①分类\n按份共有：又称分别共有，是共有人按"}, {"a": "各自的份额", "ul": 8}, {"t": "对同一财产享有所有权。共有人对份额，没有约定或者约定不明确的，按照"}, {"a": "出资额", "ul": 8}, {"t": "确定；不能确定出资额的，视为"}, {"a": "等额", "ul": 8}, {"t": "享有。\n共同共有：又称公同共有，是基于共同关系发生的、各共有人对共有财产享有平等的所有权。在对外关系上，共有人享有"}, {"a": "连带债权", "ul": 8}, {"t": "、承担"}, {"a": "连带债务", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②其他要点：如无约定，除共有人具有"}, {"a": "家庭关系", "ul": 8}, {"t": "、"}, {"a": "继承关系", "ul": 8}, {"t": "、"}, {"a": "夫妻关系", "ul": 8}, {"t": "外，\n视为按份共有。一方转让份额，共有人享有优先购买权。"}]}, {"type": "h2", "toks": [{"t": "4.担保物权"}]}, {"type": "h3", "toks": [{"t": "（1）抵押权"}]}, {"type": "h4", "toks": [{"t": "①含义：抵押权，是指债权人对于债务人或者第三人"}, {"a": "不转移", "ul": 8}, {"t": "占有而提供担\n保的财产，于债务人不履行债务或发生当事人约定的实现抵押权的情形时，依法享有的就该财产"}, {"a": "优先受偿", "ul": 8}, {"t": "的权利。"}]}, {"type": "h4", "toks": [{"t": "②不能设立抵押的财产：土地"}, {"a": "所有权", "ul": 8}, {"t": "；宅基地、自留地、自留山等集体所\n有土地的"}, {"a": "使用权", "ul": 8}, {"t": "，但是法律规定可以抵押的除外；学校、幼儿园、医疗机构等为公益目的成立的非营利法人的教育设施、医疗卫生设施和其他"}, {"a": "公益设施", "ul": 8}, {"t": "；所有权、使用权不明或者有争议的财产；依法被"}, {"a": "查封", "ul": 8}, {"t": "、"}, {"a": "扣押", "ul": 8}, {"t": "、监管的财产；\n法律、行政法规规定不得抵押的其他财产。"}]}, {"type": "h4", "toks": [{"t": "③抵押权的设立：设立抵押权，当事人应当以"}, {"a": "书面", "ul": 8}, {"t": "形式订立抵押合同。\n以不动产抵押，应当办理抵押物登记，抵押权自"}, {"a": "登记时", "ul": 8}, {"t": "设立。以动产抵押的，抵押权自"}, {"a": "抵押合同", "ul": 8}, {"t": "生效时设立；未经登记，不得对抗善意第三人。以动产抵押的，不得对抗正常经营活动中已经支付合理价款并取得抵押财产的买受人。"}]}, {"type": "h3", "toks": [{"t": "（2）质押权"}]}, {"type": "h4", "toks": [{"t": "①含义：质权，是指为了担保债务的履行，债务人或者第三人将其动产或者\n权利"}, {"a": "移交", "ul": 8}, {"t": "债权人占有，当债务人不履行债务时，债权人有就其占有的财产优先受偿的权利。"}]}, {"type": "h4", "toks": [{"t": "②设立："}, {"a": "书面", "ul": 8}, {"t": "质押合同；动产质权自出质人"}, {"a": "交付", "ul": 8}, {"t": "质押财产时设立，\n权利质权自权利凭证交付或办理出质"}, {"a": "登记", "ul": 8}, {"t": "时设立。"}]}, {"type": "h3", "toks": [{"t": "（3）留置权\n债权人按合同约定占有债务人的财产，债权"}, {"a": "已届清偿期", "ul": 8}, {"t": "，在债务人逾期不履行债务时，有留置该财产以迫使债务人履行债务，并在债务人仍不履行债务时就该财产优先受偿的权利。它是"}, {"a": "法定担保物权", "ul": 8}, {"t": "，权利人不得擅自使用、出租、处分留置物。"}]}, {"type": "callout", "toks": [{"t": "【知识链接】其他担保方式"}]}, {"type": "h2", "toks": [{"t": "1.定金：合同当事人为确保合同的履行，依据法律规定或者当事人双方的约\n定，由当事人一方在合同订立时或订立后、履行前，按合同标的额的一定比例，\n预先给付对方当事人的金钱或其他代替物。定金与违约金"}, {"a": "不得", "ul": 8}, {"t": "同时适用。"}]}, {"type": "h4", "toks": [{"t": "①定金的数额：由当事人"}, {"a": "约定", "ul": 8}, {"t": "，但不得超过主合同标的额的"}, {"a": "20％", "ul": 8}, {"t": "，\n超过部分"}, {"a": "不产生", "ul": 8}, {"t": "定金的效力。"}]}, {"type": "h4", "toks": [{"t": "②定金罚则：债务人履行债务的，定金应当抵作价款或者收回。"}, {"a": "给付", "ul": 8}, {"t": "定\n金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，无权请求"}, {"a": "返还定金", "ul": 8}, {"t": "；"}, {"a": "收受", "ul": 8}, {"t": "定金的一方不履行债务或者履行债务不符合约定，致使不能实现合同目的的，应当"}, {"a": "双倍", "ul": 8}, {"t": "返还定金。"}]}, {"type": "h2", "toks": [{"t": "2.保证"}]}, {"type": "h4", "toks": [{"t": "①不得为保证人："}, {"a": "国家机关", "ul": 8}, {"t": "，除经国务院批准为外国政府和国际经济组织贷\n款进行转贷外，不得为保证人；"}, {"a": "学校", "ul": 8}, {"t": "、"}, {"a": "幼儿园", "ul": 8}, {"t": "、医院等以公益为目的的事业单位、社会团体，不得为保证人。"}]}, {"type": "h4", "toks": [{"t": "②保证方式：分为"}, {"a": "一般保证", "ul": 8}, {"t": "和"}, {"a": "连带责任保证", "ul": 10}, {"t": "两种，保证人和债权人应当在保证\n合同中约定保证的方式。"}]}], "quiz": [{"src": "真题", "stem": "甲因遭乙欺骗而将一套房出卖给乙，签订买卖合同后随即办理了过户登记并交付。关于该买卖合同以及房屋的权利归属，下列说法正确的是：", "opts": {"A": "因已经办理过户登记，乙取得房屋的所有权", "B": "买卖合同自双方签字后永久有效", "C": "因欺诈订立的买卖合同无效", "D": "房屋的所有权仍然归甲所有"}, "ans": "B"}, {"src": "母题", "stem": "根据我国《民法典》的规定，下列情况不能够取得所有权的是：", "opts": {"A": "甲在自家果园中摘下成熟的苹果", "B": "乙拾得他人丢失的手机", "C": "丙从垃圾站拾起他人丢弃的电风扇", "D": "陈某在商场花了两千元购得一部手机"}, "ans": "B"}, {"src": "母题", "stem": "甲将其汽车送于乙汽车维修厂维修，在甲拒不给付维修费时，乙可以行使________，继续占有汽车，并将汽车拍卖变卖用于清偿债务。", "opts": {"A": "保证债权", "B": "抵押权", "C": "质权", "D": "留置权"}, "ans": "D"}, {"src": "拓展", "stem": "____、用益物权和担保物权", "opts": {"A": "所有权", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "所有权"}, {"src": "拓展", "stem": "遗失物自发布招领公告之日起____无人认领的，归国家所有。", "opts": {"A": "一年内", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "一年内"}, {"src": "拓展", "stem": "以不动产抵押，应当办理抵押物登记，抵押权自____设立。", "opts": {"A": "登记时", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "登记时"}], "branches": [{"h": "1.物权：物权是指权利人依法对特定的物享有直接支配和排他的权利，包括", "terms": ["所有权", "用益物权", "担保物权"]}, {"h": "2.物权变动基本规则", "terms": ["依法登记", "交付", "船舶", "航空器", "未经登记"]}, {"h": "3.所有权", "terms": ["无主动产", "无权处分", "无处分权", "善意的", "转让", "已登记", "已交付"]}, {"h": "4.担保物权", "terms": ["不转移", "优先受偿", "所有权", "使用权", "公益设施", "查封", "扣押"]}, {"h": "1.定金：合同当事人为确保合同的履行，依据法律规定或者当事人双方的约", "terms": ["不得", "约定", "20％", "不产生", "给付", "返还定金", "收受"]}, {"h": "2.保证", "terms": ["国家机关", "学校", "幼儿园", "一般保证", "连带责任保证"]}], "notes": ["物权=依法对特定物直接支配和排他的权利，含所有权、用益物权、担保物权。区分原则：合同签订产生债权效力；登记/交付才产生物权效力。不动产经依法登记发生效力（未登记不生效）；动产一般自交付时生效，特殊动产（船舶、航空器、机动车）未登记不得对抗善意第三人。", "观念交付三种：简易交付（'先租后买'，合同生效时物权变动）、指示交付（物在第三人处，生效后向第三人要）、占有改定（'先卖后租'，买卖合同生效但卖方继续占有）。", "善意取得=无权处分人把他人财产转让给第三人，受让人善意+合理价格+已登记或已交付，即取得所有权，原所有人只能向无权处分人索赔；遗失物、盗赃物、埋藏物原则上不适用善意取得；拾得遗失物应返还或送交公安，招领公告1年内无人认领归国家，权利人自知道受让人起2年内可请求返还。", "共有：按份共有（按份额、无约定按出资额、不明视为等额）、共同共有（基于夫妻/家庭/合伙等共同关系、对外连带）；转让按份份额时其他共有人有优先购买权。", "【担保物权补充】抵押权=不转移占有（不动产登记时设立、动产抵押合同生效时设立但未登记不得对抗善意第三人）；土地所有权、宅基地等集体土地使用权、公益设施、权属有争议或被查封的财产不得抵押。质权=转移占有（动产交付时设立、权利质权凭证交付或登记时设立）；不动产只能抵押、不能质押。留置权是法定担保物权、受偿最优先。", "【其他担保】定金数额不得超过主合同标的额20%（10万合同最多2万），给付方违约不退、收受方违约双倍返还，定金与违约金不能同时主张；国家机关、公益事业单位和社会团体原则上不得作保证人。"]}, {"id": 124, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "债权", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.债：特定当事人之间得请求为特定行为的民事法律关系。享有权利的人是\n债权人，负有义务的人是债务人。"}]}, {"type": "h3", "toks": [{"t": "（1）债权和物权区别："}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "义务主体", "ul": 8}, {"t": "不同：物权是绝对权；债权是相对权，义务主体是特定的债务人。"}]}, {"type": "h4", "toks": [{"t": "②"}, {"a": "权利客体", "ul": 8}, {"t": "不同：物权以物为客体，这里所说的物，是指人身之外，为人力\n所能支配，并且有一定使用价值的物质资料，行为和精神产品均不能作为物权的客体。"}]}, {"type": "h3", "toks": [{"t": "（2）产生：债的发生根据是引起债的法律关系发生的事实。主要有：不当得\n利、无因管理、合同、侵权行为。"}]}, {"type": "h2", "toks": [{"t": "2.不当得利：没有合法根据，使他人受到损失而自己获得利益的事实。"}]}, {"type": "h3", "toks": [{"t": "（1）构成要件：一方"}, {"a": "获得利益", "ul": 8}, {"t": "；他方"}, {"a": "受损失", "ul": 8}, {"t": "；获得利益和受到损失之间有\n因果关系；获得利益"}, {"a": "没有", "ul": 8}, {"t": "合法根据。"}]}, {"type": "h3", "toks": [{"t": "（2）不成立不当得利的情形：为履行"}, {"a": "道德义务", "ul": 8}, {"t": "进行的给付；债务"}, {"a": "到期之前", "ul": 8}, {"t": "的\n清偿；明知无给付义务而进行的债务清偿。"}]}, {"type": "h3", "toks": [{"t": "（3）不当得利的法律效力"}]}, {"type": "h4", "toks": [{"t": "①受益人的返还义务：不当得利成立后，受害人有权请求受益人返还不当得\n利，受益人负有返还不当得利的义务。"}]}, {"type": "h4", "toks": [{"t": "②第三人的返还义务：得利人已经将取得的利益"}, {"a": "无偿转让", "ul": 8}, {"t": "给第三人的，受损\n失的人可以请求第三人在"}, {"a": "相应范围内", "ul": 8}, {"t": "承担返还义务。"}]}, {"type": "h2", "toks": [{"t": "3.无因管理：没有法定或约定的义务，为避免他人利益受损，自愿管理他人\n事务的行为。管理他人事务的人，为管理人；事务被他人管理的人，为本人。"}]}, {"type": "h3", "toks": [{"t": "（1）构成要件：没有法定或约定的"}, {"a": "义务", "ul": 8}, {"t": "；有"}, {"a": "为他人谋利", "ul": 10}, {"t": "益的意思；为他\n人管理事务；符合受益人"}, {"a": "真实意思", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）无因管理之债：管理人有权要求本人偿还因管理事务所支出的"}, {"a": "必要费用", "ul": 8}, {"t": "；\n管理人可以请求受益人对其因管理受到的损失给予适当"}, {"a": "补偿", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "甲的牛不慎走失，乙在路边发现，遂牵回家去饲养，并请邻居帮忙寻找失主，一周后，甲听说乙曾捡到一头牛，登门辨认后，确认是自家走失的牛并要求其归还，乙同意返还，但是要求甲支付报酬2000 元和饲养牛所用的青草、杂粮等费用200 元，共计2200 元。甲拒绝支付，两人发生争议。下列说法正确的是：", "opts": {"A": "甲无需支付任何费用", "B": "甲应当支付2200 元", "C": "甲应当支付2000 元", "D": "甲应当支付200 元"}, "ans": "D"}, {"src": "母题", "stem": "下列各选项中，乙对甲的行为不构成不当得利的是：", "opts": {"A": "甲航务局投资5 千万修一灯塔，附近渔民乙利用灯塔夜航捕鱼，收入大增", "B": "甲借了乙500 元钱后不久归还，后来甲忘了已还钱，又还给了乙500 元", "C": "甲因疏忽在给乙转账付货款时误将应付金额1 千输成了1 万汇出，乙转走", "D": "乙的三只羊混入甲的羊群中，甲当作自家羊饲养了半年才发现自己弄错了"}, "ans": "A"}, {"src": "拓展", "stem": "①____不同：物权是绝对权；", "opts": {"A": "义务主体", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "义务主体"}, {"src": "拓展", "stem": "获得利益____合法根据。", "opts": {"A": "没有", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "没有"}, {"src": "拓展", "stem": "失的人可以请求第三人在____承担返还义务。", "opts": {"A": "相应范围内", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "相应范围内"}], "branches": [{"h": "1.债：特定当事人之间得请求为特定行为的民事法律关系。享有权利的人是", "terms": ["义务主体", "权利客体"]}, {"h": "2.不当得利：没有合法根据，使他人受到损失而自己获得利益的事实。", "terms": ["获得利益", "受损失", "没有", "道德义务", "到期之前", "无偿转让", "相应范围内"]}, {"h": "3.无因管理：没有法定或约定的义务，为避免他人利益受损，自愿管理他人", "terms": ["义务", "为他人谋利", "真实意思", "必要费用", "补偿"]}], "notes": ["债是特定当事人之间请求为特定行为的法律关系，具有相对性（只约束合同双方，如买卖合同只在买卖双方间生效）。债权是相对权（义务主体特定）、物权是绝对权；物权的客体只能是物（人身之外、可支配、有使用价值），行为和精神产品不能成为物权客体。", "债的发生根据=合同、侵权、无因管理、不当得利。", "不当得利=没有合法根据、一方获益、他方受损、获益与受损有因果关系（如话费充错号）；不成立情形：道德义务给付、债务到期前清偿、明知无给付义务仍清偿；返还规则：善意受益人只返还现存利益、恶意受益人返还一切。", "无因管理=没有法定或约定义务、为避免他人受损而自愿管理他人事务（'学雷锋'），管理人可请求偿还必要费用、对损失请求适当补偿（不是足额赔偿）；纯粹为自己利益的'误信管理'（认错猫还喂养一周）不能要费用。"]}, {"id": 125, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "结婚与离婚", "nblank": 29, "blocks": [{"type": "h2", "toks": [{"t": "1.结婚条件"}]}, {"type": "h3", "toks": [{"t": "（1）实质条件"}]}, {"type": "h4", "toks": [{"t": "①应当男女双方"}, {"a": "完全自愿", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②必须达到法定的结婚年龄。法律规定准予结婚的最低年龄男性不得早于\n"}, {"a": "22周岁", "ul": 8}, {"t": "，女性不得早于"}, {"a": "20周岁", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③必须符合"}, {"a": "一夫一妻", "ul": 8}, {"t": "制。"}]}, {"type": "h4", "toks": [{"t": "④禁止一定范围的血亲结婚。"}, {"a": "直系血亲", "ul": 8}, {"t": "和"}, {"a": "三代以内", "ul": 8}, {"t": "的旁系血亲禁止结婚。"}]}, {"type": "h3", "toks": [{"t": "（2）形式条件："}, {"a": "结婚登记", "ul": 8}, {"t": "是我国自然人结婚的法定形式要件。"}]}, {"type": "h2", "toks": [{"t": "2.婚姻的效力"}]}, {"type": "h3", "toks": [{"t": "（1）无效婚姻情形：①"}, {"a": "重婚", "ul": 8}, {"t": "；②有禁止结婚的"}, {"a": "亲属关系", "ul": 8}, {"t": "；③未到"}, {"a": "法定婚龄", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）可撤销的婚姻"}]}, {"type": "h4", "toks": [{"t": "①因"}, {"a": "胁迫", "ul": 8}, {"t": "结婚的，受胁迫的一方可以向"}, {"a": "人民法院", "ul": 8}, {"t": "请求撤销婚姻。请求应\n当自胁迫行为终止之日起"}, {"a": "一年内", "ul": 8}, {"t": "提出。被非法限制人身自由的当事人请求撤销婚姻的，应当自恢复人身自由之日起"}, {"a": "一年", "ul": 8}, {"t": "内提出。"}]}, {"type": "h4", "toks": [{"t": "②一方患有"}, {"a": "重大疾病", "ul": 8}, {"t": "的，应当在结婚"}, {"a": "登记前", "ul": 8}, {"t": "如实告知另一方；不如实告知\n的，另一方可以向"}, {"a": "人民法院", "ul": 8}, {"t": "请求撤销婚姻。请求应当自知道或应当知道撤销事由之日起"}, {"a": "一年内", "ul": 8}, {"t": "提出。"}]}, {"type": "h2", "toks": [{"t": "3.协议离婚：协议离婚要经过"}, {"a": "30天", "ul": 8}, {"t": "冷静期。自婚姻登记机关收到离婚登\n记申请之日起"}, {"a": "30日内", "ul": 8}, {"t": "，任何一方不愿意离婚的，可以向婚姻登记机关撤回离婚\n登记申请。该期限届满后"}, {"a": "30日内", "ul": 8}, {"t": "，双方应当亲自到婚姻登记机关申请发给离婚\n证；未申请的，视为"}, {"a": "撤回", "ul": 8}, {"t": "离婚登记申请。"}]}, {"type": "h2", "toks": [{"t": "4.夫妻财产\n夫妻共同财产\n夫妻一方个人财产"}]}, {"type": "h3", "toks": [{"t": "（1）工资、奖金、劳务报酬；"}]}, {"type": "h3", "toks": [{"t": "（2）生产、经营、"}, {"a": "投资", "ul": 8}, {"t": "的收益；"}]}, {"type": "h3", "toks": [{"t": "（3）"}, {"a": "知识产权", "ul": 8}, {"t": "的收益；"}]}, {"type": "h3", "toks": [{"t": "（4）继承或者受赠的财产，但是遗\n嘱或者赠与合同中确定只归一方的财产除外；"}]}, {"type": "h3", "toks": [{"t": "（5）其他应当归共同所有的财产"}]}, {"type": "h3", "toks": [{"t": "（1）一方的"}, {"a": "婚前财产", "ul": 8}, {"t": "；"}]}, {"type": "h3", "toks": [{"t": "（2）一方因受到"}, {"a": "人身损害", "ul": 8}, {"t": "获得的赔偿或者\n补偿；"}]}, {"type": "h3", "toks": [{"t": "（3）"}, {"a": "遗嘱", "ul": 8}, {"t": "或"}, {"a": "赠与合同", "ul": 8}, {"t": "中确定只归夫或\n妻一方的财产；"}]}, {"type": "h3", "toks": [{"t": "（4）一方"}, {"a": "专用的", "ul": 8}, {"t": "生活用品；"}]}, {"type": "h3", "toks": [{"t": "（5）其他应当归一方的财产"}]}], "quiz": [{"src": "真题", "stem": "根据《中华人民共和国民法典》婚姻家庭编的规定，下列说法正确的是：", "opts": {"A": "男女双方补办结婚登记的，婚姻关系的效力从双方补办登记手续完成之日起计算", "B": "子女对父母的赡养义务，因父母再婚或婚姻关系解除而自动终止", "C": "非婚生子女享有与婚生子女同等的权利，任何组织或者个人不得加以危害和歧视", "D": "三代以内的旁系血亲只要双方自愿，且不存在医学上认为不应当结婚的疾病，就可以登记结婚"}, "ans": "C"}, {"src": "母题", "stem": "下列关于夫妻在婚姻关系存续期间所得财产表述正确的是：", "opts": {"A": "工资、奖金归夫妻一方所有", "B": "生产、经营的收益归夫或妻一方所有", "C": "知识产权的收益归夫妻共同所有", "D": "夫妻对共同所有财产，各有独立的处理权"}, "ans": "C"}, {"src": "拓展", "stem": "①应当男女双方____", "opts": {"A": "完全自愿", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "完全自愿"}, {"src": "拓展", "stem": "①因____结婚的，受胁迫的一方可以向人民法院请求撤销婚姻。", "opts": {"A": "胁迫", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "胁迫"}, {"src": "拓展", "stem": "记申请之日起____，任何一方不愿意离婚的，可以向婚姻登记机关撤回离婚", "opts": {"A": "30日内", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "30日内"}], "branches": [{"h": "1.结婚条件", "terms": ["完全自愿", "22周岁", "20周岁", "一夫一妻", "直系血亲", "三代以内", "结婚登记"]}, {"h": "2.婚姻的效力", "terms": ["重婚", "亲属关系", "法定婚龄", "胁迫", "人民法院", "一年内", "一年"]}, {"h": "3.协议离婚：协议离婚要经过", "terms": ["30天", "30日内", "撤回"]}, {"h": "4.夫妻财产", "terms": ["投资", "知识产权", "婚前财产", "人身损害", "遗嘱", "赠与合同", "专用的"]}], "notes": ["结婚条件（同时满足）：男女双方完全自愿、男年满22周岁女年满20周岁、一夫一妻、直系血亲和三代以内旁系血亲禁止结婚；结婚登记是法定形式要件。", "无效婚姻=重婚、有禁止结婚的亲属关系、未到法定婚龄；可撤销婚姻=受胁迫（胁迫终止起1年内）、婚前隐瞒重大疾病（知道或应知起1年内）。", "协议离婚有30天离婚冷静期：申请后30日内任一方可撤回；冷静期届满后再30日内双方亲自申请发证，逾期未申请视为撤回。", "夫妻共同财产（婚姻存续期间）=工资奖金劳务报酬、生产经营投资收益、知识产权收益、继承或受赠财产（遗嘱或赠与中确定只归一方的除外）；个人财产=婚前财产、人身损害赔偿、遗嘱赠与确定只归一方的、一方专用生活用品。"]}, {"id": 126, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "法定继承", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.法定继承人的继承顺序"}]}, {"type": "h3", "toks": [{"t": "（1）第一顺序："}, {"a": "配偶", "ul": 8}, {"t": "、"}, {"a": "子女", "ul": 8}, {"t": "、"}, {"a": "父母", "ul": 8}, {"t": "。\n"}, {"a": "丧偶儿媳", "ul": 8}, {"t": "对公、婆，"}, {"a": "丧偶女婿", "ul": 8}, {"t": "对岳父、岳母，尽了主要赡养义务的，作为第一顺序继承人。“尽了主要赡养义务”是指对被继承人生前生活提供了主要经济来源，或在照顾方面给予了主要扶助。"}]}, {"type": "h3", "toks": [{"t": "（2）第二顺序："}, {"a": "兄弟姐妹", "ul": 8}, {"t": "、"}, {"a": "祖父母", "ul": 8}, {"t": "、"}, {"a": "外祖父母", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.代位继承与转继承"}]}, {"type": "h3", "toks": [{"t": "（1）代位继承\n代位继承，是指在"}, {"a": "法定继承", "ul": 8}, {"t": "中，被继承人的子女"}, {"a": "先于", "ul": 8}, {"t": "被继承人死亡或宣告死亡时，本应由继承人继承的遗产，由被继承人的子女的"}, {"a": "直系晚辈", "ul": 8}, {"t": "血亲代位继承；被继承人的兄弟姐妹先于被继承人死亡的，由被继承人的兄弟姐妹的"}, {"a": "子女", "ul": 8}, {"t": "代位继承的法律制度。"}]}, {"type": "h3", "toks": [{"t": "（2）转继承\n转继承，是指继承人在被继承人"}, {"a": "死亡后", "ul": 8}, {"t": "、"}, {"a": "遗产分割", "ul": 8}, {"t": "之前死亡且没有放弃继承的，应由该继承人继承的遗产份额，转由其合法继承人继承的法律制度。"}]}], "quiz": [{"src": "真题", "stem": "老张和老伴李某育有两儿一女，小儿子早逝。老张不幸去世后，没有留下遗嘱，下列关于遗产继承的说法错误的是：", "opts": {"A": "遗产分割时，应当先将老张和李某共有的财产分出一半，归李某所有，其余的属于老张的遗产", "B": "大儿子在外地工作，长期对老张不闻不问，应当不分或少分遗产", "C": "女儿因工伤丧失了劳动能力，她的配偶患病长期服药，两个孩子都还在读中学，女儿与其他继承人均等继承遗产份额", "D": "小儿子的妻子陈某念及公婆二人无人照顾、行动不便，平日里悉心照料二老的生活，陈某作为第一顺序继承人"}, "ans": "C"}, {"src": "母题", "stem": "甲见义勇为不幸牺牲，早年丧妻的甲父得知消息后悲痛欲绝，引发心脏病不治身亡，甲有妻子乙、儿子丙、弟弟丁。据此，甲父遗产的继承人应为：", "opts": {"A": "甲、乙、丙、丁", "B": "乙、丙、丁", "C": "丙、丁", "D": "丁"}, "ans": "C"}, {"src": "拓展", "stem": "（1）第一顺序：____、子女、父母", "opts": {"A": "配偶", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "配偶"}, {"src": "拓展", "stem": "____对公、婆，丧偶女婿对岳父、岳母，尽了主要赡养义务的，作为第一顺序继承人。", "opts": {"A": "丧偶儿媳", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "丧偶儿媳"}, {"src": "拓展", "stem": "（2）第二顺序：兄弟姐妹、____、外祖父母", "opts": {"A": "祖父母", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "祖父母"}], "branches": [{"h": "1.法定继承人的继承顺序", "terms": ["配偶", "子女", "父母", "丧偶儿媳", "丧偶女婿", "兄弟姐妹", "祖父母"]}, {"h": "2.代位继承与转继承", "terms": ["法定继承", "先于", "直系晚辈", "子女", "死亡后", "遗产分割"]}], "notes": ["法定继承顺序：第一顺序=配偶、子女、父母（丧偶儿媳/丧偶女婿对公婆/岳父母尽了主要赡养义务的，作为第一顺序继承人）；第二顺序=兄弟姐妹、祖父母、外祖父母（注意孙子女、外孙子女不是法定继承人）；同一顺序一般均等。", "代位继承=被继承人的子女先于被继承人死亡，由其晚辈直系血亲代位继承（爷爷→父亲先死→孙子代位）；转继承=继承人在被继承人死亡后、遗产分割前死亡，其应继份额转给他自己的继承人。"]}, {"id": 127, "part": "常识判断", "pian": "法律常识", "zhang": "民法", "jie": "", "kind": "zsd", "title": "侵权责任", "nblank": 38, "blocks": [{"type": "h2", "toks": [{"t": "1.监护人责任\n无民事行为能力人或限制民事行为能力人因自己的行为致人损害，由行为人\n的"}, {"a": "父母", "ul": 8}, {"t": "或"}, {"a": "其他监护人", "ul": 8}, {"t": "承担赔偿责任的特殊侵权责任。"}]}, {"type": "h2", "toks": [{"t": "2.职务侵权责任\n用人单位的工作人员因执行工作任务造成他人损害的，由"}, {"a": "用人单位", "ul": 8}, {"t": "承担侵权\n责任。用人单位承担侵权责任后，可以向有"}, {"a": "故意", "ul": 8}, {"t": "或者"}, {"a": "重大过失", "ul": 8}, {"t": "的工作人员追\n偿。"}]}, {"type": "h2", "toks": [{"t": "3.环境污染和生态破坏责任\n环境污染和生态破坏责任由侵权人承担"}, {"a": "无过错", "ul": 8}, {"t": "责任。侵权人违反法律规定\n故意污染环境、破坏生态造成严重后果的，被侵权人有权请求相应"}, {"a": "的惩罚性", "ul": 8}, {"t": "赔偿。"}]}, {"type": "h2", "toks": [{"t": "4.产品责任"}]}, {"type": "h3", "toks": [{"t": "（1）产品生产者、销售者因生产、销售缺陷产品造成他人的损害，应当承担\n损害赔偿责任的特殊侵权责任。"}]}, {"type": "h3", "toks": [{"t": "（2）产品责任适用于"}, {"a": "无过错", "ul": 8}, {"t": "责任原则，由产品的生产者或销售者承担。产\n品缺陷致人损害，受害人可以向产品的"}, {"a": "生产者", "ul": 8}, {"t": "要求赔偿，也可向产品的"}, {"a": "销售者", "ul": 8}, {"t": "要求赔偿。"}]}, {"type": "h2", "toks": [{"t": "5.机动车交通事故责任\n机动车与机动车之间适用"}, {"a": "过错责任", "ul": 8}, {"t": "。双方都有过错的，按各自过错的\n"}, {"a": "比例分担", "ul": 8}, {"t": "。机动车与非机动车驾驶人、行人之间适用"}, {"a": "无过错责任", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "6.饲养动物损害责任"}]}, {"type": "h3", "toks": [{"t": "（1）一般主体饲养的动物致人损害，由动物"}, {"a": "饲养人", "ul": 8}, {"t": "或"}, {"a": "管理人", "ul": 8}, {"t": "承担"}, {"a": "无过错", "ul": 8}, {"t": "\n责任。"}]}, {"type": "h3", "toks": [{"t": "（2）对于动物园饲养的动物致人损害，则适用"}, {"a": "过错推定", "ul": 8}, {"t": "责任。动物园应当承\n担侵权责任，但能够证明尽到管理职责的，"}, {"a": "不承担", "ul": 8}, {"t": "责任。"}]}, {"type": "h3", "toks": [{"t": "（3）因第三人的过错致使动物造成他人损害的，被侵权人可以向动物"}, {"a": "饲养人", "ul": 8}, {"t": "\n或者"}, {"a": "管理人", "ul": 8}, {"t": "请求赔偿，也可以向"}, {"a": "第三人", "ul": 8}, {"t": "请求赔偿。动物饲养人或者管理人赔偿后，有权向第三人追偿。"}]}, {"type": "h2", "toks": [{"t": "7.教育机构的责任"}]}, {"type": "h3", "toks": [{"t": "（1）无民事行为能力人在幼儿园、学校或者其他教育机构学习、生活期间受\n到人身损害的，"}, {"a": "幼儿园", "ul": 8}, {"t": "、"}, {"a": "学校", "ul": 8}, {"t": "或者其他教育机构应当承担责任，但能够证明尽到教育、管理职责的，不承担责任。此时教育机构承担"}, {"a": "过错推定", "ul": 8}, {"t": "责任。"}]}, {"type": "h3", "toks": [{"t": "（2）限制民事行为能力人在学校或者其他教育机构学习、生活期间受到人身\n损害，学校或者其他教育机构"}, {"a": "未尽到", "ul": 8}, {"t": "教育、管理职责的，应当"}, {"a": "承担", "ul": 8}, {"t": "责任。\n此时教育机构适用过错责任原则。"}]}, {"type": "h3", "toks": [{"t": "（3）无民事行为能力人或者限制民事行为能力人在幼儿园、学校或者其他教\n育机构学习、生活期间，受到幼儿园、学校或者其他教育机构以外的人员人身损害的，由"}, {"a": "侵权人", "ul": 8}, {"t": "承担侵权责任；幼儿园、学校或者其他教育机构未尽到管理职责的，承担相应的补充责任。幼儿园、学校或者其他教育机构承担补充责任后，可以向第三人"}, {"a": "追偿", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "8.物件损害责任"}]}, {"type": "h3", "toks": [{"t": "（1）建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成\n他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权责任。所有人、管理人或者使用人赔偿后，有其他责任人的，有权向其他责任人追偿。"}]}, {"type": "h3", "toks": [{"t": "（2）建筑物、构筑物或者其他设施倒塌造成他人损害的，由建设单位与施工\n单位承担"}, {"a": "连带责任", "ul": 8}, {"t": "，但是建设单位与施工单位能够证明不存在质量缺陷的除外。"}]}, {"type": "h3", "toks": [{"t": "（3）从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害，由\n"}, {"a": "侵权人", "ul": 8}, {"t": "依法承担侵权责任；经调查难以确定具体侵权人的，除能够证明自己不是侵权人的外，由"}, {"a": "可能加害", "ul": 8}, {"t": "的建筑物使用人给予"}, {"a": "补偿", "ul": 8}, {"t": "。可能加害的建筑物使用人补偿后，有权向侵权人追偿。"}, {"a": "物业服务企业", "ul": 9}, {"t": "等建筑物管理人未采取必要的安全保障措施的，应当依法承担未履行安全保障义务的侵权责任。"}]}, {"type": "h3", "toks": [{"t": "（4）在公共道路上堆放、倾倒、遗撒妨碍通行的物品造成他人损害的，行为\n人应当承担侵权责任，公共道路管理人不能证明已经尽到清理、防护、警示等义务的，应当承担相应的责任。"}]}, {"type": "h3", "toks": [{"t": "（5）在公共场所或者道路上挖掘、修缮安装地下设施等造成他人损害，施工\n人"}, {"a": "不能证明", "ul": 8}, {"t": "已经设置明显标志和采取安全措施的，应当承担侵权责任。窨井等地下设施造成他人损害，管理人不能证明尽到管理职责的，应当承担侵权责任。"}]}, {"type": "h2", "toks": [{"t": "9.违反安全保障义务的责任"}]}, {"type": "h3", "toks": [{"t": "（1）宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公\n共场所的"}, {"a": "经营者", "ul": 8}, {"t": "、"}, {"a": "管理者", "ul": 8}, {"t": "或者群众性活动的"}, {"a": "组织者", "ul": 8}, {"t": "，未尽到安全保障义务，造成他人损害的，应当承担侵权责任。"}]}, {"type": "h3", "toks": [{"t": "（2）因第三人的行为造成他人损害的，由"}, {"a": "第三人", "ul": 8}, {"t": "承担侵权责任；经营者、\n管理者或者组织者未尽到安全保障义务的，承担相应的补充责任。经营者、管理者或者组织者承担补充责任后，可以向第三人追偿。"}]}], "quiz": [{"src": "真题", "stem": "业主万某将汽车临时停在小区标有禁止停车标志的地点，取车时发现车子被剐蹭。万某要求物业公司调取监控录像，但物业公司因监控设施故障无法告知相关情况，万某起诉物业公司请求赔偿损害，对此，下列说法正确的是：", "opts": {"A": "万某的汽车是他人剐蹭的，物业公司不承担责任", "B": "万某违反了禁止停车规定，应自行承担所受损失", "C": "物业公司对监控未尽管理义务，应对万某承担相应责任", "D": "万某和物业公司对汽车被剐蹭都存在过错，应均等分担损失"}, "ans": "C"}, {"src": "母题", "stem": "小钱是健身爱好者，从某健身用品商行购买了一台跑步机在家锻炼，谁料刚使用不到一个月就因跑步机故障导致其摔下受伤。经查得知该型号跑步机在数年前就被认定为不合格产品，而该健身用品商行是依正规渠道从总经销商A公司处进的货。以下说法错误的是：", "opts": {"A": "小钱有权向该跑步机的生产商索赔", "B": "小钱只能向A公司和健身用品商行索赔", "C": "健身用品商行向小钱赔偿后，有权向生产厂商索赔", "D": "健身用品商行向小钱赔偿后，有权向经销商A公司索赔"}, "ans": "B"}, {"src": "母题", "stem":
