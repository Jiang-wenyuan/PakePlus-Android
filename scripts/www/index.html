 "甲（中年女士）到商场购买项链，试戴结束后在协商价格过程中，因商场地面湿滑而摔倒，致使腿部骨折，住院治疗月余后方才痊愈。关于本案，下列说法正确的是：", "opts": {"A": "甲的损失全部由其自行承担", "B": "商场的售货员应当承担赔偿责任，商场不承担责任", "C": "因甲系完全民事行为能力人，故商场不承担责任", "D": "商场应承担侵权责任"}, "ans": "D"}, {"src": "拓展", "stem": "的____或其他监护人承担赔偿责任的特殊侵权责任。", "opts": {"A": "父母", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "父母"}, {"src": "拓展", "stem": "（1）一般主体饲养的动物致人损害，由动物____或管理人承担无过错", "opts": {"A": "饲养人", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "饲养人"}, {"src": "拓展", "stem": "损害，学校或者其他教育机构未尽到教育、管理职责的，应当____责任。", "opts": {"A": "承担", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "承担"}], "branches": [{"h": "1.监护人责任", "terms": ["父母", "其他监护人"]}, {"h": "2.职务侵权责任", "terms": ["用人单位", "故意", "重大过失"]}, {"h": "3.环境污染和生态破坏责任", "terms": ["无过错", "的惩罚性"]}, {"h": "4.产品责任", "terms": ["无过错", "生产者", "销售者"]}, {"h": "5.机动车交通事故责任", "terms": ["过错责任", "比例分担", "无过错责任"]}, {"h": "6.饲养动物损害责任", "terms": ["饲养人", "管理人", "无过错", "过错推定", "不承担", "第三人"]}, {"h": "7.教育机构的责任", "terms": ["幼儿园", "学校", "过错推定", "未尽到", "承担", "侵权人", "追偿"]}, {"h": "8.物件损害责任", "terms": ["连带责任", "侵权人", "可能加害", "补偿", "物业服务企业", "不能证明"]}, {"h": "9.违反安全保障义务的责任", "terms": ["经营者", "管理者", "组织者", "第三人"]}], "notes": ["侵权责任归责原则：过错责任（有过错才赔）、无过错责任（不管有无过错都要赔）、过错推定（默认有过错，能自证无错才免责）。", "特殊主体：监护人责任（无/限制民事行为能力人致害由父母等监护人担责）；用人单位责任（执行工作任务致害由单位担责、事后可向有故意或重大过失的工作人员追偿）；环境污染是无过错责任、恶意违规可处惩罚性赔偿（不超损失2倍）；产品责任是无过错责任，受害人可向生产者或销售者择一求偿；机动车之间是过错责任、机动车对非机动车行人是无过错责任；饲养动物一般为无过错责任、动物园为过错推定。", "教育机构责任：无民事行为能力人在校受害→教育机构过错推定；限制民事行为能力人在校受害→过错责任；被校外第三人侵权由第三人担责、机构未尽管理义务负补充责任。", "高空抛物：能确定侵权人的由其担责；难以确定的由可能加害的使用人补偿（能自证不是侵权人的除外）、补偿后可向真正侵权人追偿；物业未尽安保义务承担相应责任。", "安全保障义务：经营场所、公共场所经营者管理者和群众活动组织者未尽安保义务致害要担责；第三人致害时由第三人担责、经营者组织者未尽安保的负补充责任。"]}, {"id": 128, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "刑法的基本原则", "nblank": 4, "blocks": [{"type": "h2", "toks": [{"t": "1."}, {"a": "罪刑法定", "ul": 8}, {"t": "原则：法律明文规定为犯罪行为的，依照法律定罪处罚；法律没\n有明文规定为犯罪行为的，不得定罪处罚。"}]}, {"type": "h2", "toks": [{"t": "2.刑法面前人人平等原则：对任何人犯罪，在适用法律上"}, {"a": "一律平等", "ul": 8}, {"t": "。"}, {"a": "不允许", "ul": 8}, {"t": "\n任何人有超越法律的特权。"}]}, {"type": "h2", "toks": [{"t": "3."}, {"a": "罪刑相适应", "ul": 8}, {"t": "原则：刑罚的轻重，应当与犯罪分子所犯罪行和承担的刑事责任\n相适应。"}]}], "quiz": [{"src": "真题", "stem": "我国刑法规定了若干基本原则，下列情形与刑法基本原则的对应关系正确的是：①某地法院对涉黑犯罪集团首要分子判处的刑罚与其所犯罪行及应承担的刑事责任相适应——罪责刑相适应原则②某省高院审理职务犯罪案件时，对厅级官员与普通公职人员适用相同的定罪量刑标准——法律面前人人平等原则③刑法修正案将袭警行为明确规定为独立罪名后，法院方可依照该条文对袭警行为人定罪处罚——罪刑法定原则④对于在中华人民共和国领域外犯罪的我国公民，一律适用我国刑法追究刑事责任——普遍管辖原则", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "A"}, {"src": "母题", "stem": "我国《刑法》中“法律面前人人平等的原则”表明对所有的犯罪人在________一律平等。", "opts": {"A": "制定刑法上", "B": "解释刑法上", "C": "执行刑法时", "D": "适用刑法上"}, "ans": "D"}, {"src": "拓展", "stem": "1.____原则：法律明文规定为犯罪行为的，依照法律定罪处罚；", "opts": {"A": "罪刑法定", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "罪刑法定"}, {"src": "拓展", "stem": "2.刑法面前人人平等原则：对任何人犯罪，在适用法律上____", "opts": {"A": "一律平等", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "一律平等"}, {"src": "拓展", "stem": "3.____原则：刑罚的轻重，应当与犯罪分子所犯罪行和承担的刑事责任", "opts": {"A": "罪刑相适应", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "罪刑相适应"}], "branches": [{"h": "1.", "terms": ["罪刑法定"]}, {"h": "2.刑法面前人人平等原则：对任何人犯罪，在适用法律上", "terms": ["一律平等", "不允许"]}, {"h": "3.", "terms": ["罪刑相适应"]}], "notes": ["刑法三原则：罪刑法定（法无明文规定不为罪、不处罚）、刑法面前人人平等（不允许特权、同案同判）、罪刑相适应（刑罚轻重与罪行和责任相适应）。"]}, {"id": 129, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "刑法的效力范围", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.空间效力"}]}, {"type": "h3", "toks": [{"t": "（1）属地管辖\n凡是在我国领域内犯罪，除法律有特别规定之外，一律适用我国刑法。"}]}, {"type": "h4", "toks": [{"t": "①“领域内”："}, {"a": "领陆", "ul": 8}, {"t": "、领水、"}, {"a": "领空", "ul": 8}, {"t": "；我国船舶或者"}, {"a": "航空器", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②“犯罪地”：犯罪的"}, {"a": "行为", "ul": 8}, {"t": "或者"}, {"a": "结果", "ul": 8}, {"t": "有一项发生在我国领域内。"}]}, {"type": "h3", "toks": [{"t": "（2）属人管辖\n我国公民在我国"}, {"a": "领域外", "ul": 8}, {"t": "犯罪的，适用我国刑法。"}]}, {"type": "h4", "toks": [{"t": "①最高刑为"}, {"a": "3年以下", "ul": 8}, {"t": "有期徒刑的，可以不予追究。"}]}, {"type": "h4", "toks": [{"t": "②国家工作人员和军人"}, {"a": "一律追究", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）保护管辖\n"}, {"a": "外国人", "ul": 8}, {"t": "在中华人民共和国领域外对中国公民或者国家犯罪。"}]}, {"type": "h4", "toks": [{"t": "①最低刑为"}, {"a": "3年以上", "ul": 8}, {"t": "有期徒刑。"}]}, {"type": "h4", "toks": [{"t": "②犯罪地的法律认为应予以处罚。"}]}, {"type": "h3", "toks": [{"t": "（4）普遍管辖\n对于我国缔结或者参加的国际条约所规定的罪行，我国在所承担条约义务的范围内行使刑事管辖权。"}]}, {"type": "h2", "toks": [{"t": "2.时间效力"}]}, {"type": "h3", "toks": [{"t": "（1）生效时间：1997 年10 月1 日。"}]}, {"type": "h3", "toks": [{"t": "（2）溯及力："}, {"a": "从旧兼从轻", "ul": 8}, {"t": "原则。"}]}], "quiz": [{"src": "真题", "stem": "下列哪种情形，我国刑法不具有管辖权?", "opts": {"A": "甲国公民在我国国际机场里给乙国公民下毒，乙国公民出境后毒发身亡", "B": "在从我国出发已行驶至甲国的国际列车上，甲国公民对乙国公民实施抢劫", "C": "我国公民在我国境内，通过电话教唆在甲国的甲国公民故意杀人", "D": "我国公民在甲国境内，对甲国公民实施绑架行为"}, "ans": "B"}, {"src": "母题", "stem": "关于刑法的效力，下列说法错误的是：", "opts": {"A": "我国公民甲教唆美国公民在法国领土上杀害日本人，根据我国刑法，甲的教唆杀人行为有罪，依法予以追究", "B": "我国公民乙在中欧班列行驶在别国境内时向车上其他人员贩售海洛因，依据我国刑法对其追究刑事责任", "C": "外国商人在我国领域内犯重婚罪，应适用我国刑法追究其刑事责任", "D": "法国公民乘坐我国游轮，在该游轮上实施的犯罪行为，不适用我国刑法"}, "ans": "D"}, {"src": "拓展", "stem": "①“领域内”：____、领水、领空", "opts": {"A": "领陆", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "领陆"}, {"src": "拓展", "stem": "②“犯罪地”：犯罪的____或者结果有一项发生在我国领域内。", "opts": {"A": "行为", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "行为"}, {"src": "拓展", "stem": "①最高刑为____有期徒刑的，可以不予追究。", "opts": {"A": "3年以下", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "3年以下"}], "branches": [{"h": "1.空间效力", "terms": ["领陆", "领空", "航空器", "行为", "结果", "领域外", "3年以下"]}, {"h": "2.时间效力", "terms": ["从旧兼从轻"]}], "notes": ["空间效力：属地管辖（在我国领域[领陆领水领空+船舶、航空器]内犯罪，行为或结果有一项在境内即可；享有外交特权豁免者除外）；属人管辖（我国公民在境外犯罪，最高刑3年以下的可以不追究，国家工作人员和军人一律追究）；保护管辖（外国人在境外对我国国家或公民犯罪，须最低刑3年以上且犯罪地法律也认为是犯罪=双重犯罪）；普遍管辖（国际犯罪，依我国刑法定罪量刑）。外国已作刑事审判的我国可再追究、已受刑罚可减免。", "时间效力：现行刑法1997.10.1生效；溯及力采用'从旧兼从轻'（原则上不溯及既往，新法更轻时从新法）。"]}, {"id": 130, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "犯罪构成要件", "nblank": 24, "blocks": [{"type": "h2", "toks": [{"t": "1.犯罪主体：实施危害社会的行为，依法应当负刑事责任的自然人和单位。"}]}, {"type": "h3", "toks": [{"t": "（1）自然人的刑事责任年龄\n年龄刑事责任不满12 周岁（年龄＜12）"}, {"a": "不负", "ul": 8}, {"t": "刑事责任已满12 周岁不满14 周岁（12≤年龄＜14）犯"}, {"a": "故意杀人", "ul": 8}, {"t": "、故意伤害罪，致人死亡或者以特别残忍手段致人重伤造成严重残疾，情节恶劣，经最高人民"}, {"a": "检察院", "ul": 8}, {"t": "核准追诉的，应当负刑事责任已满14 周岁不满16 周岁（14≤年龄＜16）只对8 种严重犯罪负刑事责任：故意杀人、故意伤害致人重伤或者死亡、"}, {"a": "抢劫", "ul": 8}, {"t": "、强奸、"}, {"a": "贩卖毒品", "ul": 8}, {"t": "、放火、"}, {"a": "爆炸", "ul": 8}, {"t": "、投放危险物质已满16 周岁（年龄≥16）"}, {"a": "应当", "ul": 8}, {"t": "负刑事责任"}]}, {"type": "h3", "toks": [{"t": "（2）刑事责任能力"}]}, {"type": "h4", "toks": [{"t": "①完全无："}, {"a": "精神病人", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②完全有：间歇性精神病人"}, {"a": "精神正常", "ul": 8}, {"t": "；醉酒的人。"}]}, {"type": "h4", "toks": [{"t": "③限制有：尚未完全丧失辨认或者控制能力，可以从轻或者减轻处罚。又聋\n又哑的人或者"}, {"a": "盲人", "ul": 8}, {"t": "，可以从轻、减轻或者免除处罚。"}]}, {"type": "h2", "toks": [{"t": "2.犯罪主观方面：刑法规定成立犯罪必须具备的、犯罪主体对其实施的危害\n行为及其危害结果所持的心理态度。"}]}, {"type": "h3", "toks": [{"t": "（1）犯罪故意"}]}, {"type": "h4", "toks": [{"t": "①直接故意：行为人"}, {"a": "明知", "ul": 8}, {"t": "自己的行为必然或可能发生危害社会的结果，\n并且"}, {"a": "希望", "ul": 8}, {"t": "这种结果发生的心理态度。"}]}, {"type": "h4", "toks": [{"t": "②间接故意：行为人"}, {"a": "明知", "ul": 8}, {"t": "自己的行为可能发生危害社会的结果，并且\n"}, {"a": "放任", "ul": 8}, {"t": "这种结果发生的心理态度。"}]}, {"type": "h3", "toks": [{"t": "（2）犯罪过失"}]}, {"type": "h4", "toks": [{"t": "①疏忽大意的过失：行为人"}, {"a": "应当预见", "ul": 8}, {"t": "自己的行为可能发生危害社会的结果，\n因为疏忽大意而"}, {"a": "没有预见", "ul": 8}, {"t": "，以致发生这种结果的心理态度。"}]}, {"type": "h4", "toks": [{"t": "②过于自信的过失：行为人"}, {"a": "已经预见", "ul": 8}, {"t": "到自己的行为可能发生危害社会的结果，\n但"}, {"a": "轻信能够避免", "ul": 12}, {"t": "，以致发生这种结果的心理态度。"}]}, {"type": "h3", "toks": [{"t": "（3）不可抗力和意外事件：行为在客观上虽然造成了损害结果，但是不是出\n于故意或者过失，而是由于不能抗拒或者不能预见的原因所引起的，"}, {"a": "不是犯罪", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.犯罪客体：我国刑法所保护而为犯罪行为所侵害的社会主义关系。"}]}, {"type": "h2", "toks": [{"t": "4.犯罪客观方面：刑法所规定的、说明行为对刑法所保护的社会关系造成损\n害的客观外在事实特征。"}]}, {"type": "h3", "toks": [{"t": "（1）危害行为：在人的意志或者意志支配下实施的危害社会的身体动静，“无\n行为则无犯罪”。"}]}, {"type": "h4", "toks": [{"t": "①作为：积极行为，是指以积极的身体举动实施刑法所禁止的行为。"}]}, {"type": "h4", "toks": [{"t": "②不作为：消极行为，是指行为人在能够履行自己应尽义务的情况下不履行\n该义务。作为义务来源于法律"}, {"a": "明文规定", "ul": 8}, {"t": "的义务；"}, {"a": "职务", "ul": 8}, {"t": "或"}, {"a": "业务", "ul": 8}, {"t": "上要求的义务；基于"}, {"a": "法律行为", "ul": 8}, {"t": "承担的义务；"}, {"a": "先行行为", "ul": 8}, {"t": "引起的义务。"}]}, {"type": "h3", "toks": [{"t": "（2）危害结果：危害行为对犯罪客体即刑法所保护的社会关系所造成的实际\n损害或现实危险。"}]}, {"type": "h3", "toks": [{"t": "（3）因果关系：危害行为与危害结果之间存在的引起与被引起的关系。"}]}], "quiz": [{"src": "真题", "stem": "根据《中华人民共和国刑法》关于刑事责任年龄的规定，下列说法正确的是：①15 周岁的张某参与走私毒品并暴力抗拒抓捕，造成警察重伤，应当负刑事责任②13 周岁的李某因琐事持刀杀害邻居，情节恶劣，经最高人民法院核准追诉的，应当负刑事责任③17 周岁的王某初次盗窃他人财物数额较大，量刑时应当对其从轻或者减轻处罚④76 周岁的赵某过失引发火灾造成重大财产损失，量刑时可以对其从轻或者减轻处罚", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "根据我国《刑法》，下列关于刑事责任能力或年龄的表述不正确的是：", "opts": {"A": "已满14 周岁未满16 周岁的人贩卖并运送毒品，应当追究其刑事责任", "B": "间歇性精神病人在精神正常时候的犯罪，应当追究刑事责任", "C": "已满14 周岁未满16 周岁的人绑架他人，应当追究其刑事责任", "D": "尚未完全丧失辨认或能控制自己行为能力的精神病人犯罪，应追究刑责"}, "ans": "C"}, {"src": "母题", "stem": "甲、乙二人携带猎枪同去山里打猎，甲擦枪时不慎致猎枪走火，打死了乙，自己也身受重伤。甲的行为：", "opts": {"A": "构成故意杀人罪", "B": "构成过失致人死亡罪", "C": "属于紧急避险，应当减轻处罚", "D": "属于意外事件，不构成犯罪"}, "ans": "B"}, {"src": "拓展", "stem": "②完全有：间歇性精神病人____", "opts": {"A": "精神正常", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "精神正常"}, {"src": "拓展", "stem": "____这种结果发生的心理态度。", "opts": {"A": "放任", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "放任"}, {"src": "拓展", "stem": "于故意或者过失，而是由于不能抗拒或者不能预见的原因所引起的，____", "opts": {"A": "不是犯罪", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "不是犯罪"}], "branches": [{"h": "1.犯罪主体：实施危害社会的行为，依法应当负刑事责任的自然人和单位。", "terms": ["不负", "故意杀人", "检察院", "抢劫", "贩卖毒品", "爆炸", "应当"]}, {"h": "2.犯罪主观方面：刑法规定成立犯罪必须具备的、犯罪主体对其实施的危害", "terms": ["明知", "希望", "放任", "应当预见", "没有预见", "已经预见", "轻信能够避免"]}, {"h": "4.犯罪客观方面：刑法所规定的、说明行为对刑法所保护的社会关系造成损", "terms": ["明文规定", "职务", "业务", "法律行为", "先行行为"]}], "notes": ["犯罪构成四要件=犯罪主体、主观方面、犯罪客体、客观方面（主客观相一致）。", "刑事责任年龄：不满12周岁不负刑责；12–14周岁只对故意杀人、故意伤害致人死亡或以特别残忍手段致人重伤造成严重残疾且情节恶劣、并经最高人民检察院（注意不是最高法）核准追诉的才负责；14–16周岁只对8种犯罪负责=故意杀人、故意伤害致人重伤或死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质（口诀'两故两抢两火两毒'）；已满16周岁应负刑责；已满75周岁故意犯罪可以从轻减轻、过失犯罪应当从轻减轻。", "刑事责任能力：精神病人发病时完全无责；间歇性精神病人正常时犯罪、醉酒的人犯罪应当负责；尚未完全丧失辨认控制能力的（限制责任能力）可从轻减轻；又聋又哑的人或盲人可以从轻、减轻或免除。", "主观方面：直接故意（明知必然/可能+希望）、间接故意（明知可能+放任）；疏忽大意过失（应预见而没预见）、过于自信过失（已预见但轻信能避免）；不可抗力和意外事件（不能抗拒/不能预见）不是犯罪；梦游、条件反射、纯思想活动、生活行为无罪。", "客观方面：危害行为分作为和不作为；不作为犯罪的义务来源=法律明文规定、职务业务要求、法律行为承担、先行行为引起（应为→能为→不为→结果发生）。"]}, {"id": 131, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "犯罪排除事由", "nblank": 16, "blocks": [{"type": "h2", "toks": [{"t": "1.正当防卫\n为了使国家、公共利益、本人或者他人的人身、财产和其他权利免受正在进\n行的不法侵害，而采取的制止不法侵害的行为，对不法侵害人造成损害的，属于\n正当防卫，不负刑事责任。"}]}, {"type": "h3", "toks": [{"t": "（1）构成正当防卫的条件"}]}, {"type": "h4", "toks": [{"t": "①起因：不法侵害"}, {"a": "现实存在", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②时间：不法侵害已经"}, {"a": "开始", "ul": 8}, {"t": "尚未"}, {"a": "结束", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③对象：针对不法侵害者"}, {"a": "本人", "ul": 8}, {"t": "实施。"}]}, {"type": "h4", "toks": [{"t": "④主观："}, {"a": "防卫意图", "ul": 8}, {"t": "明显。"}]}, {"type": "h4", "toks": [{"t": "⑤限度：没有"}, {"a": "明显超过", "ul": 8}, {"t": "必要限度造成重大损害。"}]}, {"type": "h3", "toks": [{"t": "（2）防卫过当：应当"}, {"a": "减轻", "ul": 8}, {"t": "或"}, {"a": "免除", "ul": 8}, {"t": "处罚。注：无防卫过当罪。"}]}, {"type": "h3", "toks": [{"t": "（3）特殊防卫：正在进行"}, {"a": "行凶", "ul": 8}, {"t": "、"}, {"a": "杀人", "ul": 8}, {"t": "、"}, {"a": "抢劫", "ul": 8}, {"t": "、强奸、绑架以及\n其他严重危及人身安全的暴力犯罪。"}]}, {"type": "h2", "toks": [{"t": "2.紧急避险\n为了使国家、公共利益、本人或者他人的人身和其他权利免受正在发生的危\n险，不得已而采取的损害另一较小的合法利益，以保护较大的合法权益的行为。\n紧急避险行为造成损害的不负刑事责任。"}]}, {"type": "h3", "toks": [{"t": "（1）构成紧急避险的条件"}]}, {"type": "h4", "toks": [{"t": "①起因："}, {"a": "现实危险", "ul": 8}, {"t": "（威胁合法利益的危险）。"}]}, {"type": "h4", "toks": [{"t": "②时间：危险已经"}, {"a": "发生", "ul": 8}, {"t": "尚未"}, {"a": "结束", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③对象：无辜"}, {"a": "第三人", "ul": 8}, {"t": "的合法权益。"}]}, {"type": "h4", "toks": [{"t": "④主观：必须有避险意图，迫不得已。"}]}, {"type": "h4", "toks": [{"t": "⑤限度：没有超过"}, {"a": "必要限度", "ul": 8}, {"t": "造成不应有的损害。"}]}, {"type": "h3", "toks": [{"t": "（2）避险过当：应当减轻或免除。"}]}], "quiz": [{"src": "真题", "stem": "李某深夜潜入赵某家实施盗窃，被回家的赵某当场发现，李某为抗拒抓捕当场对赵某使用暴力，二人扭打过程中李某被赵某推倒撞击头部后失去意识、昏迷倒地。赵某见状仍捡起李某掉落的铁棍猛击李某头部数下，致李某当场死亡。关于赵某的行为性质，下列说法正确的是：", "opts": {"A": "赵某的行为属于正当防卫，对李某的死亡不负刑事责任", "B": "赵某的行为属于防卫过当，构成过失致人死亡罪", "C": "赵某的行为属于防卫过当，构成故意伤害致人死亡罪", "D": "赵某的行为属于故意杀人，应当负刑事责任"}, "ans": "D"}, {"src": "母题", "stem": "甲深夜盗窃5 万元财物，逃离现场后在偏僻路段遇到乙。乙见甲形迹可疑，紧紧拽住甲，要甲给5000 元才能走，否则就报警。甲见无法脱身，顺手一拳打中乙的眼睛，致其眼部受到轻伤，甲乘机离去。关于甲伤害乙的行为定性，下列选项正确的是：", "opts": {"A": "构成转化型抢劫罪", "B": "构成故意伤害罪", "C": "属于正当防卫，不构成犯罪", "D": "系过失致人轻伤，不构成犯罪"}, "ans": "C"}, {"src": "母题", "stem": "甲持刀追杀乙，乙看到路边有一辆未熄火的摩托车，情急之下便驾车逃跑，给摩托车主造成严重损失。乙的行为属于：", "opts": {"A": "执行命令", "B": "紧急避险", "C": "正当防卫", "D": "故意损坏财物"}, "ans": "B"}, {"src": "拓展", "stem": "①起因：不法侵害____", "opts": {"A": "现实存在", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "现实存在"}, {"src": "拓展", "stem": "⑤限度：没有____必要限度造成重大损害。", "opts": {"A": "明显超过", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "明显超过"}, {"src": "拓展", "stem": "（3）特殊防卫：正在进行行凶、杀人、____、强奸、绑架以及", "opts": {"A": "抢劫", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "抢劫"}], "branches": [{"h": "1.正当防卫", "terms": ["现实存在", "开始", "结束", "本人", "防卫意图", "明显超过", "减轻"]}, {"h": "2.紧急避险", "terms": ["现实危险", "发生", "结束", "第三人", "必要限度"]}], "notes": ["正当防卫（'正对不正'）：为保护国家、公共、本人或他人的人身财产权利，对正在进行的不法侵害予以制止、对侵害人造成损害的不负刑责。要件：不法侵害现实存在（事前、事后防卫是防卫不适时）、侵害已经开始尚未结束、只能针对不法侵害人本人（互殴斗殴中无防卫）、有防卫意图、没有明显超过必要限度造成重大损害；防卫过当应担责但应减轻或免除处罚，且没有'防卫过当罪'这个罪名。", "特殊正当防卫：对正在进行的行凶、杀人、抢劫、强奸、绑架及其他严重危及人身安全的暴力犯罪，造成侵害人伤亡的不属于防卫过当、不负刑责。", "紧急避险（'正对正'）：为保全较大合法利益、不得已损害无辜第三人较小利益；要件：危险现实存在且正在发生、针对无辜第三人、迫不得已、没有超过必要限度（利益排序：生命>身体>财产）；避险过当应减轻或免除处罚。"]}, {"id": 132, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "故意犯罪的形态", "nblank": 21, "blocks": [{"type": "h2", "toks": [{"t": "1.犯罪预备：犯罪预备是指为了犯罪，准备工具，制造条件，但由于行为人\n意志以外的原因而未能着手实行犯罪的情形。"}]}, {"type": "h3", "toks": [{"t": "（1）犯罪预备的特征"}]}, {"type": "h4", "toks": [{"t": "①主观上为了犯罪，即为了"}, {"a": "自己", "ul": 8}, {"t": "实行犯罪和为了"}, {"a": "他人", "ul": 8}, {"t": "实行犯罪。"}]}, {"type": "h4", "toks": [{"t": "②客观上实施了犯罪预备行为，包括准备实行"}, {"a": "犯罪工具", "ul": 8}, {"t": "与制造一切为实行犯\n罪的条件。"}]}, {"type": "h4", "toks": [{"t": "③事实上"}, {"a": "未能着手", "ul": 8}, {"t": "实行犯罪，包括“预备行为没有完成而不可能着手实行犯\n罪”和“预备行为虽已完成，但由于某种原因未能着手实行犯罪”。"}]}, {"type": "h4", "toks": [{"t": "④未能着手实行犯罪是由于行为人"}, {"a": "意志以外", "ul": 8}, {"t": "的原因。"}]}, {"type": "h3", "toks": [{"t": "（2）对于预备犯，可以比照既遂犯"}, {"a": "从轻", "ul": 8}, {"t": "、"}, {"a": "减轻", "ul": 8}, {"t": "处罚或"}, {"a": "者免除", "ul": 8}, {"t": "处罚。"}]}, {"type": "h2", "toks": [{"t": "2.犯罪中止：在犯罪过程中，"}, {"a": "自动放弃", "ul": 8}, {"t": "犯罪或者自动"}, {"a": "有效地防止", "ul": 8}, {"t": "犯罪结果发生\n的情形。"}]}, {"type": "h3", "toks": [{"t": "（1）犯罪中止的特征"}]}, {"type": "h4", "toks": [{"t": "①中止的时间性：犯罪中止必须发生在“"}, {"a": "犯罪过程中", "ul": 8}, {"t": "”，即犯罪中止既可以发\n生在犯罪"}, {"a": "预备", "ul": 8}, {"t": "阶段，也可以发生在犯罪"}, {"a": "实行", "ul": 8}, {"t": "阶段；犯罪既遂后自动恢复原状的，不成立犯罪中止，犯罪未遂后也不可能出现犯罪中止。"}]}, {"type": "h4", "toks": [{"t": "②中止的自动性；即行为人认识到客观上可能继续实施犯罪或者可能既遂，\n但自愿放弃原来的犯罪犯罪意图。"}]}, {"type": "h4", "toks": [{"t": "③中止的客观性。"}]}, {"type": "h4", "toks": [{"t": "④中止的有效性。"}]}, {"type": "h3", "toks": [{"t": "（2）对于中止犯，没有造成损害的，应"}, {"a": "免除", "ul": 8}, {"t": "处罚；造成损害，应当"}, {"a": "减轻", "ul": 8}, {"t": "\n处罚。"}]}, {"type": "h2", "toks": [{"t": "3.犯罪未遂："}, {"a": "已经着手", "ul": 8}, {"t": "实行犯罪，由于犯罪分子意志以外的原因而未得逞的\n情形。"}]}, {"type": "h3", "toks": [{"t": "（1）犯罪未遂的特征"}]}, {"type": "h4", "toks": [{"t": "①已经着手实行犯罪，犯罪行为进入了"}, {"a": "实行", "ul": 8}, {"t": "阶段。"}]}, {"type": "h4", "toks": [{"t": "②犯罪未得逞。"}]}, {"type": "h4", "toks": [{"t": "③犯罪未得逞是由于犯罪分子"}, {"a": "意志以外", "ul": 8}, {"t": "的原因。"}]}, {"type": "h3", "toks": [{"t": "（2）对于未遂犯，可以比照既遂犯"}, {"a": "从轻", "ul": 8}, {"t": "或者"}, {"a": "减轻", "ul": 8}, {"t": "处罚。"}]}, {"type": "h2", "toks": [{"t": "4.犯罪既遂：故意犯罪的完成形态，是指行为人所实施的犯罪行为已经具备\n了刑法分则所规定的某一犯罪的"}, {"a": "全部", "ul": 8}, {"t": "构成要件。\n注：只有直接故意犯罪才存在上述犯罪形态，过失犯罪和间接故意不存在犯\n罪预备、犯罪未遂"}]}], "quiz": [{"src": "真题", "stem": "某男子因生活困难，在公交上趁老大爷不备窃取其口袋内8000 元现金，下车后因担心老大爷养老钱受损心生悔意，悄悄返回公交站将7500 元塞回老大爷的背包侧袋，自己仅留下500 元，后该男子被警方抓获。根据刑法规定，该男子窃取8000 元后又返还7500 元的行为，其犯罪形态属于：", "opts": {"A": "犯罪中止", "B": "犯罪未遂", "C": "犯罪预备", "D": "犯罪既遂"}, "ans": "D"}, {"src": "母题", "stem": "下列属于犯罪中止的是：", "opts": {"A": "已经着手实行犯罪但犯罪未发生", "B": "在犯罪过程中，自动有效地防止犯罪结果发生", "C": "在犯罪过程中，由于行为人意志以外的原因，犯罪结果未发生", "D": "行为人为实施犯罪而准备了工具，但没有着手实施犯罪"}, "ans": "B"}, {"src": "拓展", "stem": "①主观上为了犯罪，即为了____实行犯罪和为了他人实行犯罪。", "opts": {"A": "自己", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "自己"}, {"src": "拓展", "stem": "（2）对于预备犯，可以比照既遂犯从轻、减轻处罚或____处罚。", "opts": {"A": "者免除", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "者免除"}, {"src": "拓展", "stem": "造成损害，应当____", "opts": {"A": "减轻", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "减轻"}], "branches": [{"h": "1.犯罪预备：犯罪预备是指为了犯罪，准备工具，制造条件，但由于行为人", "terms": ["自己", "他人", "犯罪工具", "未能着手", "意志以外", "从轻", "减轻"]}, {"h": "2.犯罪中止：在犯罪过程中，", "terms": ["自动放弃", "有效地防止", "犯罪过程中", "预备", "实行", "免除", "减轻"]}, {"h": "3.犯罪未遂：", "terms": ["已经着手", "实行", "意志以外", "从轻", "减轻"]}, {"h": "4.犯罪既遂：故意犯罪的完成形态，是指行为人所实施的犯罪行为已经具备", "terms": ["全部"]}], "notes": ["犯罪预备=为犯罪准备工具、制造条件，因意志以外原因未能着手（主观想犯罪+客观有预备行为+未着手+意志以外原因），可比照既遂从轻、减轻或免除处罚。", "犯罪未遂=已经着手实行，因意志以外原因未得逞，可比照既遂从轻或减轻。", "犯罪中止=犯罪过程中自动放弃或自动有效防止结果发生（能继续而自愿放弃），没造成损害的应当免除、造成损害的应当减轻。", "判断两步走：先看是否已着手（没着手只可能是预备），再看停下来是'不能'（未遂/预备）还是'不想'（中止）；只有直接故意犯罪才有这些形态，过失和间接故意没有；各形态互相排斥。"]}, {"id": 133, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "共同犯罪", "nblank": 9, "blocks": [{"type": "p", "toks": [{"t": "共同犯罪，是指二人以上共同故意犯罪。"}]}, {"type": "h2", "toks": [{"t": "1.共同犯罪构成要件"}]}, {"type": "h3", "toks": [{"t": "（1）必须是"}, {"a": "两个", "ul": 8}, {"t": "或两个以上达到法定刑事责任年龄、具有刑事责任能力\n的人。"}]}, {"type": "h3", "toks": [{"t": "（2）共同犯罪 "领导", "ul": 8}, {"t": "职务的权利。"}]}, {"type": "h4", "toks": [{"t": "②适用对象\n应当附加剥夺政治权利：对于"}, {"a": "危害国家安全", "ul": 8}, {"t": "的犯罪分子，以及对于被判处"}, {"a": "死刑", "ul": 8}, {"t": "、"}, {"a": "无期徒刑", "ul": 8}, {"t": "的犯罪分子，应当附加剥夺政治权利。\n可以附加剥夺政治权利：对于故意杀人、强奸、放火、爆炸、投毒、抢劫等严重破坏社会秩序的犯罪分子，可以附加剥夺政治权利。"}]}, {"type": "h4", "toks": [{"t": "③剥夺期限：对于被判处死刑、无期徒刑的犯罪分子，应当剥夺政治权利\n"}, {"a": "终身", "ul": 8}, {"t": "。附加剥夺政治权利的刑期，从徒刑、拘役"}, {"a": "执行完毕", "ul": 8}, {"t": "之日或者从"}, {"a": "假释", "ul": 8}, {"t": "之日起计算；剥夺政治权利的效力当然施用于"}, {"a": "主刑", "ul": 8}, {"t": "执行期间。"}]}, {"type": "h4", "toks": [{"t": "④剥夺政治权利的执行机关剥夺政治权利由"}, {"a": "公安机关", "ul": 8}, {"t": "执行。"}]}, {"type": "h3", "toks": [{"t": "（2）没收财产：将犯罪分子个人所有财产的部分或者全部强制"}, {"a": "无偿", "ul": 8}, {"t": "地收\n归国有的刑罚方法。"}]}, {"type": "h4", "toks": [{"t": "①没收范围：必须是犯罪分子所有的"}, {"a": "合法财产", "ul": 8}, {"t": "；不得没收属于犯罪分子家属\n所有或者应有的财产；没收全部财产时，应当给犯罪分子个人及其扶养的家属保留必要的生活费用。"}]}, {"type": "h4", "toks": [{"t": "②执行机关：没收财产的判决，无论附加适用或者独立适用，都由人民法院\n执行；在必要时，可以会同公安机关执行。"}]}], "quiz": [{"src": "真题", "stem": "根据我国刑法关于管制刑的规定，下列判决符合法律要求的是：①以危险作业罪判处陈某管制3 个月，并处没收违法所得②以非法狩猎罪判处刘某管制1 个月③以偷越国（边）境罪判处张某管制2 年6 个月，并处罚金2000 元④以赌博罪判处王某管制8 个月，并处罚金10000 元", "opts": {"A": "①②", "B": "①④", "C": "②③", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "下列描述中，错误的是：", "opts": {"A": "拘役的期限，为一个月以上六个月以下", "B": "拘役的刑期，从判决执行之日起计算", "C": "有期徒刑的刑期，从判决执行之日起计算", "D": "有期徒刑判决执行以前先行羁押的，羁押一日折抵刑期二日"}, "ans": "D"}, {"src": "拓展", "stem": "（1）管制：对犯罪分子____关押，依法实行社区矫正，限制其一定自由。", "opts": {"A": "不实行", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "不实行"}, {"src": "拓展", "stem": "和不满____，最高不能超过20年，总和刑期在35年以上的，最高不能超过25年", "opts": {"A": "35年", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "35年"}, {"src": "拓展", "stem": "死刑采用枪决或者____等方法执行。", "opts": {"A": "注射", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "注射"}], "branches": [{"h": "1.主刑", "terms": ["不实行", "3个月", "2年", "3年", "判决执行", "二日", "应当"]}, {"h": "2.附加刑", "terms": ["罚金", "没收财产", "选举权", "言论", "集会", "国家机关", "领导"]}], "notes": ["主刑五种（只能单独适用）：①管制=不关押、依法社区矫正，期限3个月以上2年以下、数罪并罚不超3年（'3-2-3'），先前羁押1日折抵2日，劳动中同工同酬；②拘役=就近强制劳动，1–6个月、并罚不超1年（'1-6-1'），羁押1日折抵1日，每月可回家1–2天、参加劳动可酌量发报酬，由公安机关就近执行；③有期徒刑=6个月以上15年以下，并罚时总和刑期不满35年最高不超20年、35年以上最高不超25年，折抵1日抵1日，交付执行时余刑3个月以下由看守所代为执行；④无期徒刑=终身剥夺自由，必须附加剥夺政治权利终身，羁押时间不折抵；⑤死刑=最严厉，犯罪时不满18周岁、审判时怀孕的妇女不适用，审判时已满75周岁原则上不适用（特别残忍手段致人死亡的除外）；除最高院判决外都应报最高人民法院核准，由最高院院长签发执行令，采用枪决或注射；死缓=缓期2年执行。", "附加刑四种（可附加、也可独立适用）=罚金、剥夺政治权利、没收财产、驱逐出境。剥夺政治权利内容：选举权被选举权；言论出版集会结社游行示威自由；担任国家机关职务；担任国有企事业单位和人民团体领导职务；危害国家安全犯罪和被判死缓、无期的应当附加，其效力当然及于主刑执行期间，由公安机关执行。", "没收财产只能没收犯罪分子个人的合法财产，要为其本人和扶养家属保留必要生活费用，不得没收家属财产；由人民法院执行（必要时会同公安）。"]}, {"id": 135, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "量刑", "nblank": 19, "blocks": [{"type": "h2", "toks": [{"t": "1.累犯\n累犯，是指因犯罪而受过一定的刑罚处罚，在刑罚执行完毕或者赦免以后，\n在法定期限内犯一定之罪的罪犯。"}]}, {"type": "h3", "toks": [{"t": "（1）一般累犯：被判处"}, {"a": "有期", "ul": 8}, {"t": "徒刑以上刑罚的犯罪分子，刑罚"}, {"a": "执行完毕", "ul": 8}, {"t": "或\n者赦免以后，在"}, {"a": "5年内", "ul": 8}, {"t": "再犯应当判处"}, {"a": "有期", "ul": 8}, {"t": "徒刑以上刑罚之罪的犯罪分子。"}]}, {"type": "h3", "toks": [{"t": "（2）特别累犯：危害"}, {"a": "国家安全", "ul": 8}, {"t": "犯罪、"}, {"a": "恐怖活动", "ul": 8}, {"t": "犯罪、"}, {"a": "黑社会性质", "ul": 8}, {"t": "的组织犯罪的\n犯罪分子，在刑罚执行完毕或赦免以后，在"}, {"a": "任何时候", "ul": 8}, {"t": "再犯上述任一类罪的情形。"}]}, {"type": "h3", "toks": [{"t": "（3）累犯的处罚：对累犯应当"}, {"a": "从重", "ul": 8}, {"t": "处罚，对累犯不适用"}, {"a": "缓刑", "ul": 8}, {"t": "和\n"}, {"a": "假释", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.自首\n自首，是指犯罪以后"}, {"a": "自动投案", "ul": 8}, {"t": "，如实供述自己罪行的行为，或者被采取强制\n措施的犯罪嫌疑人、被告人和正在服刑的罪犯，如实供述司法机关还未掌握的本\n人其他罪行的行为。对于自首的犯罪分子，可以"}, {"a": "从轻", "ul": 8}, {"t": "或者"}, {"a": "减轻", "ul": 8}, {"t": "处罚。其\n中，犯罪较轻的，可以免除处罚。"}]}, {"type": "h2", "toks": [{"t": "3.立功\n立功，是指犯罪分子"}, {"a": "揭发", "ul": 8}, {"t": "他人的犯罪行为，查证属实的，或者提供重要\n线索，从而得以侦破其他案件的行为，或者协助司法机关抓获其他嫌疑人的。\n犯罪人有立功表现的，可以"}, {"a": "从轻", "ul": 8}, {"t": "或者"}, {"a": "减轻", "ul": 8}, {"t": "处罚；有重大立功表现的，\n可以"}, {"a": "减轻", "ul": 8}, {"t": "或者"}, {"a": "免除", "ul": 8}, {"t": "处罚。"}]}], "quiz": [{"src": "真题", "stem": "根据我国相关法律规定，下列哪一情形可以认定为自首？", "opts": {"A": "小孙因聚众斗殴被捕，在被讯问时主动交代自己曾在1 个月前陆续偷过10部手机", "B": "小马主动投案交代自己电信诈骗的犯罪行为，但在审讯期间隐瞒了本案同伙的犯罪行为", "C": "小张醉酒驾车造成车祸，致1 人死亡，后主动报案，但在审讯结束后担心处罚过重又逃跑了", "D": "小沈过失致人重伤，惊慌失措时被朋友发现，朋友规劝其主动投案无果后被其扭送至公安局，小沈遂交代案情"}, "ans": "A"}, {"src": "母题", "stem": "自首是犯罪分子犯罪后，在未被发现或虽被发觉但尚未被抓获时自动投案，交待自己所犯罪行，愿意接受法律审判的行为。下面行为属于自首的是：", "opts": {"A": "甲盗窃五枚戒指后非常害怕，又将这五枚戒指悄悄送回了原来的地方", "B": "乙打伤邻居的孩子后逃跑，被邻居发现，并将其扭送至公安局。后乙态度诚恳，彻底交待了自己的罪行，并表示愿意接受法律制裁", "C": "丙骗取了朋友10 万元住院费后良心不安，主动到公安机关承认了犯罪事实，并承诺将钱款退还其朋友", "D": "丁抢劫银行被抓获后，供述了自己的罪行"}, "ans": "D"}, {"src": "拓展", "stem": "（1）一般累犯：被判处____徒刑以上刑罚的犯罪分子，刑罚执行完毕或", "opts": {"A": "有期", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "有期"}, {"src": "拓展", "stem": "（2）特别累犯：危害国家安全犯罪、恐怖活动犯罪、____的组织犯罪的", "opts": {"A": "黑社会性质", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "黑社会性质"}, {"src": "拓展", "stem": "对于自首的犯罪分子，可以从轻或者____处罚。", "opts": {"A": "减轻", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "减轻"}], "branches": [{"h": "1.累犯", "terms": ["有期", "执行完毕", "5年内", "国家安全", "恐怖活动", "黑社会性质", "任何时候"]}, {"h": "2.自首", "terms": ["自动投案", "从轻", "减轻"]}, {"h": "3.立功", "terms": ["揭发", "从轻", "减轻", "免除"]}], "notes": ["累犯：一般累犯=被判处有期徒刑以上、刑罚执行完毕或赦免后5年内再犯应当判处有期徒刑以上之罪（前后罪都是故意犯罪）；特别累犯=危害国家安全、恐怖活动、黑社会性质组织犯罪，任何时候再犯任一类都构成；累犯应当从重处罚，且不适用缓刑、假释。", "自首=犯罪后自动投案并如实供述（一般自首），或被采取强制措施的嫌疑人、被告人、在押罪犯如实供述司法机关尚未掌握的本人其他罪行（特殊自首），可从轻减轻、犯罪较轻可免除；注意'坦白'是被动归案+如实供述已被掌握的罪行，不是自首。", "立功=揭发他人犯罪查证属实、提供重要线索得以侦破其他案件或协助抓获其他嫌疑人，可从轻减轻；重大立功可减轻或免除处罚。"]}, {"id": 136, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "危害公共安全罪", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.交通肇事罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：交通肇事罪，是指违反交通运输管理法规，因而发生重大事故，\n致人重伤、死亡或者使公私财产遭受重大损失的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）常见情形："}]}, {"type": "h4", "toks": [{"t": "①“因逃逸致人死亡”即因为行为人逃逸使得被害人得不到及时救助而死亡。"}]}, {"type": "h4", "toks": [{"t": "②单位主管人员、机动车辆所有人或者机动车辆承包人指使、强令他人违章\n驾驶造成重大交通事故的，以"}, {"a": "交通肇事罪", "ul": 8}, {"t": "定罪处罚。"}]}, {"type": "h4", "toks": [{"t": "③交通肇事后，单位主管人员、机动车辆所有人、承包人或者乘车人指使肇\n事人逃逸，致使被害人因得不到救助而死亡的，以交通肇事罪的"}, {"a": "共犯", "ul": 8}, {"t": "论处。"}]}, {"type": "h4", "toks": [{"t": "④行为人在交通肇事后为逃避法律追究，将被害人带离事故现场后隐藏或者\n遗弃，致使被害人无法得到救助而死亡或者严重残疾的，应当以"}, {"a": "故意杀人罪", "ul": 8}, {"t": "或者"}, {"a": "故意伤害罪", "ul": 8}, {"t": "定罪处罚。"}]}, {"type": "h2", "toks": [{"t": "2.危险驾驶罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：危险驾驶罪是指在道路上驾驶机动车，实施刑法所禁止的危险驾\n驶行为。"}]}, {"type": "h3", "toks": [{"t": "（2）具体情形："}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "追逐竞驶", "ul": 8}, {"t": "，情节恶劣。"}]}, {"type": "h4", "toks": [{"t": "②醉酒驾驶机动车（血液酒精含量达到"}, {"a": "80", "ul": 8}, {"t": "毫克/"}, {"a": "100", "ul": 8}, {"t": "毫升以上）。"}]}, {"type": "h4", "toks": [{"t": "③从事"}, {"a": "校车", "ul": 8}, {"t": "业务或者"}, {"a": "旅客", "ul": 8}, {"t": "运输，严重超过额定乘员载客，或者严重\n超过规定时速行驶的。"}]}, {"type": "h4", "toks": [{"t": "④违反危险化学品安全管理规定运输危险化学品，危及公共安全的。"}]}, {"type": "h2", "toks": [{"t": "3.妨害安全驾驶罪\n妨害安全驾驶罪，是指对"}, {"a": "行驶中", "ul": 8}, {"t": "的公共交通工具的驾驶人员使用暴力或者\n抢控驾驶操纵装置，以及"}, {"a": "驾驶人员", "ul": 8}, {"t": "在行驶的公共交通工具上擅离职守，与他人互\n殴或者殴打他人，危及公共安全的行为。"}]}], "quiz": [{"src": "真题", "stem": "刘某是某公司总经理，王某是刘某的专职司机。某日刘某要赶去参加重要商务谈判，催促王某在高速公路上超速行驶，王某起初提出超速可能出事，但刘某表示“出了问题我负责”，王某无奈按要求超速驾驶，后因车速过快避让不及发生五车追尾事故，造成1 人死亡、3 人重伤的严重后果。关于刘某的行为定性，下列说法正确的是：", "opts": {"A": "刘某构成以危险方法危害公共安全罪", "B": "刘某构成危险驾驶罪", "C": "刘某构成交通肇事罪", "D": "刘某未实际驾驶车辆，不构成犯罪"}, "ans": "C"}, {"src": "母题", "stem": "李某在上班途中，因掉头时反应速度过慢未及时踩刹车，将正在过马路的行人撞伤，造成行人脚踝骨折，李某随即送受伤行人前往附近医院就诊。李某的行为属于：", "opts": {"A": "一般的交通肇事行为", "B": "交通肇事罪", "C": "故意犯罪", "D": "危害国家安全罪"}, "ans": "A"}, {"src": "母题", "stem": "某公务员钱某饮酒后驾驶机动车交通肇事，后经检测构成醉驾。根据相关法律的规定，以下关于该公务员可能受到的处理或承担的法律责任，正确的是：①监察机关对公务员钱某进行政务处分②司法机关追究公务员钱某的刑事责任③公安机关交通管理部门对钱某进行相应的行政处罚④若交通肇事中的受害人提起民事诉讼，法院还可能追究钱某的民事责任", "opts": {"A": "①④", "B": "①③", "C": "②③", "D": "①②③④"}, "ans": "D"}, {"src": "拓展", "stem": "驾驶造成重大交通事故的，以____定罪处罚。", "opts": {"A": "交通肇事罪", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "交通肇事罪"}, {"src": "拓展", "stem": "遗弃，致使被害人无法得到救助而死亡或者严重残疾的，应当以故意杀人罪或者____定罪处罚。", "opts": {"A": "故意伤害罪", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "故意伤害罪"}, {"src": "拓展", "stem": "②醉酒驾驶机动车（血液酒精含量达到80毫克/____毫升以上）。", "opts": {"A": "100", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "100"}], "branches": [{"h": "1.交通肇事罪", "terms": ["交通肇事罪", "共犯", "故意杀人罪", "故意伤害罪"]}, {"h": "2.危险驾驶罪", "terms": ["追逐竞驶", "80", "100", "校车", "旅客"]}, {"h": "3.妨害安全驾驶罪", "terms": ["行驶中", "驾驶人员"]}], "notes": ["交通肇事罪是过失犯罪：①'因逃逸致人死亡'指逃逸使被害人得不到及时救助而死亡；②单位主管人员、车辆所有人、承包人指使强令他人违章驾驶造成重大事故的以本罪论处；③肇事后上述人员或乘车人指使肇事人逃逸致被害人死亡的以共犯论处；④肇事后为逃避追究把被害人带离现场隐藏或遗弃、致其死亡或重残的，以故意杀人罪或故意伤害罪定罪（因为剥夺了被害人被其他人救助的可能性）。量刑三档：一般违章+一死或三重伤→肇事后逃逸→因逃逸致人死亡（对应超速、闯红灯、强行变道等情形）。", "危险驾驶罪是故意犯罪（行为犯），四种情形：追逐竞驶情节恶劣；醉酒驾驶（血液酒精含量达到80mg/100ml以上）；校车/旅客运输严重超员或严重超速；违规运输危险化学品危及公共安全。", "妨害安全驾驶罪=对行驶中公共交通工具的驾驶人员使用暴力或抢控操纵装置，以及驾驶人员擅离职守与他人互殴、危及公共安全（乘客打司机、司机与乘客互殴）。"]}, {"id": 137, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "危害国家安全罪", "nblank": 6, "blocks": [{"type": "h2", "toks": [{"t": "1.间谍罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：间谍罪是指参加间谍组织或者接受间谍组织及其代理人的任务，\n或者为敌人指示轰击目标，危害国家安全的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）三种危害国家安全的行为："}, {"a": "参加间谍组织", "ul": 13}, {"t": "充当间谍；"}, {"a": "接受", "ul": 8}, {"t": "间谍组织\n及其代理人任务，在我国进行间谍活动；为敌人指示"}, {"a": "轰炸目标", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.为境外窃取、刺探、收买、非法提供国家秘密、情报罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：为境外窃取、刺探、收买、非法提供国家秘密、情报罪，是指为\n境外的机构、组织、个人窃取、刺探、收买、非法提供国家秘密或者情报的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）特征："}]}, {"type": "h4", "toks": [{"t": "①必须是为"}, {"a": "境外", "ul": 8}, {"t": "的机构、组织、个人窃取、刺探、收买、非法提供国家\n秘密或者情报。"}]}, {"type": "h4", "toks": [{"t": "②行为表现方式为"}, {"a": "窃取", "ul": 8}, {"t": "、刺探、"}, {"a": "收买", "ul": 8}, {"t": "、非法提供。"}]}, {"type": "h4", "toks": [{"t": "③行为的对象是国家秘密或者情报。"}]}], "quiz": [{"src": "真题", "stem": "维护国家安全，人人有责。今年以来，国家安全机关破获间谍案的新闻时有报道，下列有关间谍罪的说法正确的是：", "opts": {"A": "犯间谍罪，情节较轻的，处三年以下有期徒刑", "B": "为敌人指示轰击目标的行为是间谍罪的一种行为表现", "C": "为境外组织刺探国家秘密的行为是间谍罪的一种行为表现", "D": "掌握国家秘密的国家工作人员叛逃境外属于间谍罪的加重情节"}, "ans": "B"}, {"src": "母题", "stem": "下列关于为境外窃取、刺探、收买、非法提供国家秘密、情报罪的表述，正确的是：", "opts": {"A": "某机关工作人员甲在工作中不慎将涉密文件遗失，被境外机构人员拾获，甲构成本罪", "B": "乙为获取经济利益，向境外媒体记者泄露内部工作文件，经鉴定该文件不属于国家秘密或情报，乙构成本罪", "C": "丙明知境外组织从事危害我国国家安全活动，仍将自己参与编制的涉密科研数据出售给该组织，丙构成本罪", "D": "丁在互联网上公开下载已经解密的政府文件，转发给境外留学的同学，丁构成本罪"}, "ans": "C"}, {"src": "拓展", "stem": "（2）三种危害国家安全的行为：____充当间谍；", "opts": {"A": "参加间谍组织", "B": "遗产继承", "C": "接受赠与", "D": "自己的行为"}, "ans": "A", "real": "参加间谍组织"}, {"src": "拓展", "stem": "①必须是为____的机构、组织、个人窃取、刺探、收买、非法提供国家", "opts": {"A": "境外", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "境外"}, {"src": "拓展", "stem": "②行为表现方式为____、刺探、收买、非法提供。", "opts": {"A": "窃取", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "窃取"}], "branches": [{"h": "1.间谍罪", "terms": ["参加间谍组织", "接受", "轰炸目标"]}, {"h": "2.为境外窃取、刺探、收买、非法提供国家秘密、情报罪", "terms": ["境外", "窃取", "收买"]}], "notes": ["间谍罪三种行为：参加间谍组织充当间谍；接受间谍组织及其代理人的任务；为敌人指示轰击目标（情节较轻的处3年以上10年以下）。", "为境外窃取、刺探、收买、非法提供国家秘密、情报罪：服务对象必须是境外的机构、组织或个人；行为方式=窃取、刺探、收买、非法提供；行为对象=国家秘密或情报。"]}, {"id": 138, "part": "常识判断", "pian": "法律常识", "zhang": "刑法", "jie": "", "kind": "zsd", "title": "贪污贿赂罪", "nblank": 18, "blocks": [{"type": "h2", "toks": [{"t": "1.贪污罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：贪污罪是指国家工作人员利用职务上的便利，侵吞、窃取、骗取\n或者以其他手段非法占有公共财物的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）主体"}]}, {"type": "h4", "toks": [{"t": "①国家工作人员：在"}, {"a": "国家机关", "ul": 8}, {"t": "中从事公务的人员；"}, {"a": "国有公司", "ul": 8}, {"t": "、企业、事业单\n位、人民团体中从事公务的人员；国家机关、国有公司、企业、事业单位"}, {"a": "委派", "ul": 8}, {"t": "到非国有公司、企业、事业单位、社会团体从事公务的人员；村委会等村基层组织人员"}, {"a": "协助", "ul": 8}, {"t": "政府从事七类行政管理工作，属于“其他依照法律从事公务的人员”（人大关于《刑法》第93 条第2 款的立法解释）。"}]}, {"type": "h4", "toks": [{"t": "②受国家机关、国有公司、企业、事业单位、人民团体委托管理、经营国有\n财产的人员。"}]}, {"type": "h3", "toks": [{"t": "（3）贪污罪的认定"}]}, {"type": "h4", "toks": [{"t": "①国家工作人员在国内公务活动或者对外交往中"}, {"a": "接受礼物", "ul": 8}, {"t": "，依照国家规定应\n当交公而不交公，数额较大的，以贪污罪定罪处罚。"}]}, {"type": "h4", "toks": [{"t": "②公司、企业或者其他单位中，不具有国家工作人员身份的人与国家工作人\n员勾结，分别利用各自的职务便利，共同将本单位财物非法占为己有，按照"}, {"a": "主犯", "ul": 8}, {"t": "的犯罪性质定罪。"}]}, {"type": "h2", "toks": [{"t": "2.挪用公款罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：挪用公款罪，是指国家工作人员利用职务上的便利，挪用公款归\n个人使用，进行非法活动的，或者挪用公款数额较大、进行营利活动的，或者挪用公款数额较大、超过3 个月未还的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）挪用公款行为分为三种类型："}]}, {"type": "h4", "toks": [{"t": "①挪用公款进行"}, {"a": "非法活动", "ul": 8}, {"t": "：不要求挪用的数额较大，也不论挪用的时间长短。"}]}, {"type": "h4", "toks": [{"t": "②挪用公款数额较大，进行"}, {"a": "营利活动", "ul": 8}, {"t": "：不受挪用时间和是否归还的限制。"}]}, {"type": "h4", "toks": [{"t": "③挪用公款数额较大，归个人使用（进行其他活动）：超过"}, {"a": "3个月", "ul": 8}, {"t": "未还。\n挪用用于救灾、抢险、防汛、优抚、扶贫、移民、救济款物归个人使用的，从重处罚。"}]}, {"type": "h3", "toks": [{"t": "（3）本罪与挪用特定款物罪的主要区分"}]}, {"type": "h4", "toks": [{"t": "①主体不同：本罪主体是"}, {"a": "国家工作人员", "ul": 13}, {"t": "，而挪用特定款物罪的主体则是主管、\n经营、经手特定款物的"}, {"a": "直接责任人员", "ul": 14}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②挪用的用途不同：本罪一般是挪用公款归个人使用，实质是“"}, {"a": "公款私用", "ul": 8}, {"t": "”；\n挪用特定款物罪归单位其他事项使用，未能专款专用，实质上具有“"}, {"a": "公款公用", "ul": 8}, {"t": "”的性质。"}]}, {"type": "h2", "toks": [{"t": "3.受贿罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：受贿罪，是指国家工作人员，利用职务上的便利，索取他人财物，\n或者非法收受他人财物并为他人谋取利益的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）认定"}]}, {"type": "h4", "toks": [{"t": "①“为他人谋取利益”既包括"}, {"a": "正当", "ul": 8}, {"t": "利益，也包括"}, {"a": "不正当", "ul": 8}, {"t": "利益。"}]}, {"type": "h4", "toks": [{"t": "②国家工作人员在经济往来中，违反国家规定，收受各种名义的回扣、手续\n费，归个人所有的，以受贿论处。"}]}, {"type": "h4", "toks": [{"t": "③"}, {"a": "斡旋受贿", "ul": 8}, {"t": "：国家工作人员利用本人职权或者地位形成的便利条件，通过其\n他国家工作人员职务上的行为，为请托人谋取不正当利益，索取请托人财物或者收受请托人财物的，以受贿论处。"}]}, {"type": "h2", "toks": [{"t": "4.行贿罪"}]}, {"type": "h3", "toks": [{"t": "（1）含义：行贿罪，是指为谋取不正当利益，给予国家工作人员以财物的行\n为。“不正当利益”不限于非法利益，获取不公平的竞争优势也属于不正当利益。"}]}, {"type": "h3", "toks": [{"t": "（2）认定"}]}, {"type": "h4", "toks": [{"t": "①因被勒索给予财物，没有获得不正当利益的，"}, {"a": "不是", "ul": 8}, {"t": "行贿；"}]}, {"type": "h4", "toks": [{"t": "②为了谋取正当利益而给予国家工作人员财物的，"}, {"a": "不是", "ul": 8}, {"t": "行贿；"}]}, {"type": "h4", "toks": [{"t": "③在经济往来中，违反国家规定，给予国家工作人员以财物，数额较大的，\n或者违反国家规定，给予国家工作人员以各种名义的回扣、手续费的，行贿论处。"}]}], "quiz": [{"src": "真题", "stem": "下列甲乙丙丁的行为构成利用影响力受贿罪的是：", "opts": {"A": "甲为某生态环境局副局长，某项目经理王某为减轻环境行政罚款向其行贿5 万元，后甲向下属监察大队负责人打招呼撤销罚款决定", "B": "乙为某市场监督管理局局长，某项目经理张某为减轻国土资源行政罚款向其行贿5 万元，后乙向自然资源局领导打招呼撤销罚款决定", "C": "丙为某税务局公务员，其夫为教育局局长，丙收受李某5 万元并通过其夫职权解决李某小孩跨区入学问题，其夫不知情", "D": "丁为某教育局局长，其妻为私企员工，私下收受刘某5 万元并通过其夫职权解决刘某小孩跨区入学问题，丁知情后未反对"}, "ans": "C"}, {"src": "母题", "stem": "某群众在马路上捡拾到一个钱包（内有人民币33000 元），送交值勤民警寻找失主。民警寻找失主未果，乘机据为己有，民警的行为构成：", "opts": {"A": "诈骗罪", "B": "贪污罪", "C": "侵占罪", "D": "职务侵占罪"}, "ans": "B"}, {"src": "拓展", "stem": "①国家工作人员：在____中从事公务的人员；", "opts": {"A": "国家机关", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "国家机关"}, {"src": "拓展", "stem": "①挪用公款进行____：不要求挪用的数额较大，也不论挪用的时间长短。", "opts": {"A": "非法活动", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "非法活动"}, {"src": "拓展", "stem": "②挪用的用途不同：本罪一般是挪用公款归个人使用，实质是“____”；", "opts": {"A": "公款私用", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "公款私用"}], "branches": [{"h": "1.贪污罪", "terms": ["国家机关", "国有公司", "委派", "协助", "接受礼物", "主犯"]}, {"h": "2.挪用公款罪", "terms": ["非法活动", "营利活动", "3个月", "国家工作人员", "直接责任人员", "公款私用", "公款公用"]}, {"h": "3.受贿罪", "terms": ["正当", "不正当", "斡旋受贿"]}, {"h": "4.行贿罪", "terms": ["不是"]}], "notes": ["贪污罪主体（国家工作人员）：国家机关中从事公务的人员；国有公司企事业单位、人民团体中从事公务的人员；国家机关、国有单位委派到非国有单位从事公务的人员；村委会等基层组织人员协助政府从事七类行政管理工作时属于'其他依照法律从事公务的人员'；另外受委托管理、经营国有财产的人员也可构成。在公务活动或对外交往中接受礼物、依规定应交公而不交公、数额较大的以贪污论；与非国家工作人员勾结共同侵占本单位财物的按主犯性质定罪。", "挪用公款罪 vs 挪用资金罪：后者主体是一般公司企业人员。挪用公款三种类型：非法活动（不要求数额较大、不论时间长短）；营利活动（要求数额较大、不看时间和是否归还）；归个人使用（数额较大+超过3个月未还）；挪用救灾、抢险、防汛、优抚、扶贫、移民、救济款物归个人使用的从重处罚。与挪用特定款物罪区分：本罪是'公款私用'，挪用特定款物罪是挪作单位其他公用（'公款公用'、未能专款专用）。", "受贿罪（权钱交易）：'为他人谋取利益'包括正当和不正当利益；经济往来中违规收受回扣手续费归个人的以受贿论；斡旋受贿=利用本人职权或地位形成的便利条件、通过其他国家工作人员职务行为为请托人谋不正当利益。", "行贿罪=为谋取不正当利益给予国家工作人员财物；被勒索且未获得不正当利益的不是行贿；为正当利益送财不是行贿；经济往来中违规给国家工作人员财物、回扣手续费数额较大的以行贿论。"]}, {"id": 139, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政法概述", "nblank": 10, "blocks": [{"type": "h2", "toks": [{"t": "1.行政法\n行政法，是指行政主体在行使行政职权和接受行政法治监督过程中而与行政\n相对人、行政法制监督主体之间发生的各种关系，以及行政主体内部发生的各种\n关系的法律规范的总称。"}]}, {"type": "h2", "toks": [{"t": "2.具体行政行为与抽象行政行为（针对相对人是否特定）"}]}, {"type": "h3", "toks": [{"t": "（1）"}, {"a": "抽象", "ul": 8}, {"t": "行政行为，是指国家行政机关制定行政法规、规章和有普遍约\n束力的决定、命令等行政规则的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）"}, {"a": "具体", "ul": 8}, {"t": "行政行为，是国家行政机关依法就特定事项对特定的公民、法\n人和其他组织权利义务作出的单方行政职权行为。"}]}, {"type": "h2", "toks": [{"t": "3.行政法基本原则"}]}, {"type": "h3", "toks": [{"t": "（1）合法行政原则："}, {"a": "法律优先", "ul": 8}, {"t": "（法已规定不可违）；"}, {"a": "法律保留", "ul": 8}, {"t": "（法无规定不\n可为）。"}]}, {"type": "h3", "toks": [{"t": "（2）合理行政原则：公平公正原则；考虑相关因素；"}, {"a": "比例原则", "ul": 8}, {"t": "（合目的性、\n适当性、"}, {"a": "损害最小", "ul": 8}, {"t": "）。"}]}, {"type": "h3", "toks": [{"t": "（3）程序正当原则：行政公开原则；"}, {"a": "公众参与", "ul": 8}, {"t": "原则；"}, {"a": "回避", "ul": 8}, {"t": "原则。"}]}, {"type": "h3", "toks": [{"t": "（4）高效便民原则：行政效率原则（积极履行法定职责、遵守法定时限）；\n便利当事人原则。"}]}, {"type": "h3", "toks": [{"t": "（5）诚实守信原则：行政信息"}, {"a": "真实", "ul": 8}, {"t": "原则；保护公民"}, {"a": "信赖利益", "ul": 8}, {"t": "原则。"}]}, {"type": "h3", "toks": [{"t": "（6）权责统一原则：行政效能原则（赋予执法手段，保证政令有效）；行政\n责任原则。"}]}], "quiz": [{"src": "真题", "stem": "行政行为是行政主体行使行政职权、履行行政职责所实施的能够产生行政法律效果的行为。关于行政行为的分类与效力，下列说法不正确的是：", "opts": {"A": "按照所针对的相对人是否特定为标准，行政行为可分为抽象行政行为与具体行政行为", "B": "具体行政行为一经生效，行政机关与相对人都必须遵守，其他国家机关和社会成员也必须予以尊重，这体现了具体行政行为的拘束力", "C": "具体行政行为作出后，非经法定程序不得随意撤销、变更，该效力被称为确定力", "D": "国务院制定行政法规、地方政府发布行政规范性文件等行为属于具体行政行为"}, "ans": "D"}, {"src": "母题", "stem": "下列做法符合比例原则的是：", "opts": {"A": "某主管部门在打击盗窃活动时表示，要把盗窃者打个倾家荡产，永远不得翻身", "B": "甲乙两人因纠纷发生口角，公安机关以扰乱社会秩序为由给予两人15 天的行政拘留", "C": "某地政府认为核辐射可能污染海水，对当地居民生活造成不良影响，遂取消建设核电站的计划，而改用成本较低的风力发电", "D": "王某经过房管局批准建栋五层小楼，但在施工过程中，私自加到七层，房管局以其违章建房为由要求把楼房全部拆除"}, "ans": "C"}, {"src": "拓展", "stem": "（1）____行政行为，是指国家行政机关制定行政法规、规章和有普遍约", "opts": {"A": "抽象", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "抽象"}, {"src": "拓展", "stem": "（1）合法行政原则：____（法已规定不可违）；", "opts": {"A": "法律优先", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "法律优先"}, {"src": "拓展", "stem": "____（合目的性、", "opts": {"A": "比例原则", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "比例原则"}], "branches": [{"h": "2.具体行政行为与抽象行政行为（针对相对人是否特定）", "terms": ["抽象", "具体"]}, {"h": "3.行政法基本原则", "terms": ["法律优先", "法律保留", "比例原则", "损害最小", "公众参与", "回避", "真实"]}], "notes": ["行政法关系框架（手写）：官管民=行政行为，分抽象行政行为（行政立法，针对不特定对象、有普遍约束力，如行政法规、规章）和具体行政行为（针对特定对象，如行政处罚、许可、强制、确认、征用）；民告官=行政救济，含行政复议、行政诉讼、国家赔偿。", "行政法六原则：合法行政（法律优先[法已规定不可违]+法律保留[法无授权不可为]）；合理行政（同等情况同等对待、考虑相关因素、比例原则[合目的性、适当性、损害最小]）；程序正当（行政公开、公众参与、回避；国家秘密一律不公开、商业秘密和个人隐私原则不公开）；高效便民；诚实守信（行政信息真实+保护公民信赖利益，非经法定事由和程序不得撤销更改已生效决定）；权责统一（行政效能+行政责任）。", "行政行为四效力：拘束力（生效后必须遵守）、公定力（一经成立推定有效）、确定力（不得随意更改撤销）、执行力（可强制执行）。"]}, {"id": 140, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政处罚", "nblank": 32, "blocks": [{"type": "h2", "toks": [{"t": "1.行政处罚\n行政处罚是指行政机关依法对违反行政管理秩序的公民、法人或者其他组织，\n以"}, {"a": "减损", "ul": 8}, {"t": "权益或者"}, {"a": "增加", "ul": 8}, {"t": "义务的方式予以惩戒的行为。"}]}, {"type": "h2", "toks": [{"t": "2.一事不再罚原则\n对当事人的"}, {"a": "同一个", "ul": 8}, {"t": "违法行为，不得给予"}, {"a": "两次", "ul": 8}, {"t": "以上罚款的行政处罚。同\n一个违法行为违反多个法律规范应当给予罚款处罚的，按照罚款数额高的规定处\n罚。"}]}, {"type": "h2", "toks": [{"t": "3.行政处罚的种类"}]}, {"type": "h3", "toks": [{"t": "（1）精神罚："}, {"a": "警告", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）财产罚："}, {"a": "罚款", "ul": 8}, {"t": "、没收违法所得和没收非法财物。"}]}, {"type": "h3", "toks": [{"t": "（3）能力罚（行为罚）：责令停产停业、"}, {"a": "暂扣", "ul": 8}, {"t": "或吊销许可证和营业执照。"}]}, {"type": "h3", "toks": [{"t": "（4）人身自由罚："}, {"a": "行政拘留", "ul": 8}, {"t": "。只有"}, {"a": "公安机关", "ul": 8}, {"t": "有权决定和执行；期限为1 日以\n上，15 日以下。"}]}, {"type": "h2", "toks": [{"t": "4.行政处罚的设定"}]}, {"type": "h3", "toks": [{"t": "（1）"}, {"a": "法律", "ul": 8}, {"t": "→可以设定各种行政处罚。"}]}, {"type": "h3", "toks": [{"t": "（2）行政法规→可以设定除"}, {"a": "限制人身自由", "ul": 13}, {"t": "以外的行政处罚。"}]}, {"type": "h3", "toks": [{"t": "（3）地方性法规→可以设定除限制人身自由、"}, {"a": "吊销营业执", "ul": 8}, {"t": "照以外的行政处罚。"}]}, {"type": "h3", "toks": [{"t": "（4）部门规章→可以设定警告、通报批评或一定数量罚款的处罚。"}]}, {"type": "h3", "toks": [{"t": "（5）地方政府规章→可以设定警告、通报批评或一定数量罚款的行政处罚。"}]}, {"type": "h2", "toks": [{"t": "5.行政处罚的适用（不予处罚）"}]}, {"type": "h3", "toks": [{"t": "（1）不满"}, {"a": "14周岁", "ul": 8}, {"t": "或精神病人、智力残疾人在不能辨认或者不能控制自己行\n为时违法。"}]}, {"type": "h3", "toks": [{"t": "（2）违法行为轻微＋及时纠正＋没有造成危害后果。"}]}, {"type": "h3", "toks": [{"t": "（3）有证据足以证明没有"}, {"a": "主观过错", "ul": 8}, {"t": "的，但法律、行政法规另有规定的除外。"}]}, {"type": "h3", "toks": [{"t": "（4）超过"}, {"a": "追责时效", "ul": 8}, {"t": "的。"}]}, {"type": "h2", "toks": [{"t": "6.行政处罚的程序"}]}, {"type": "h3", "toks": [{"t": "（1）一般规定"}]}, {"type": "h4", "toks": [{"t": "①行政处罚应当由具有行政执法资格的执法人员实施。"}]}, {"type": "h4", "toks": [{"t": "②执法人员不得少于"}, {"a": "2人", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③作出行政处罚"}, {"a": "决定", "ul": 8}, {"t": "之前，应当告知当事人拟作出的行政处罚内容及事\n实、理由、依据以及依法享有的陈述、申辩、要求听证等权利。行政机关不得因当事人陈述、申辩而给予更重的处罚。"}]}, {"type": "h3", "toks": [{"t": "（2）一般程序"}]}, {"type": "h4", "toks": [{"t": "①立案。"}]}, {"type": "h4", "toks": [{"t": "②调查取证：执法人员不少于"}, {"a": "两人", "ul": 8}, {"t": "，并应当向当事人或者有关人员出示\n证件。"}]}, {"type": "h4", "toks": [{"t": "③告知处罚的事实、理由、依据和有关权利。"}]}, {"type": "h4", "toks": [{"t": "④听取陈述、申辩或者举行听证，行政机关不得因当事人申辩而加重处罚。"}]}, {"type": "h4", "toks": [{"t": "⑤决定处罚：行政机关负责人（集体）做出处罚决定。"}]}, {"type": "h4", "toks": [{"t": "⑥当事人不在场，"}, {"a": "7日", "ul": 8}, {"t": "内送达。"}]}, {"type": "h3", "toks": [{"t": "（3）简易程序"}]}, {"type": "h4", "toks": [{"t": "①特点：一人执法、"}, {"a": "当场", "ul": 8}, {"t": "决定、"}, {"a": "当场", "ul": 8}, {"t": "送达。"}]}, {"type": "h4", "toks": [{"t": "②条件：警告；对公民罚款"}, {"a": "200元", "ul": 8}, {"t": "以下，对法人、其他组织罚款"}, {"a": "3000元", "ul": 8}, {"t": "\n以下。另有规定从其规定。"}]}, {"type": "h4", "toks": [{"t": "③程序：当场决定，当场交付处罚决定书。"}]}, {"type": "h3", "toks": [{"t": "（4）听证程序"}]}, {"type": "h4", "toks": [{"t": "①适用：针对较大数额"}, {"a": "罚款", "ul": 8}, {"t": "；没收较大数额违法所得、没收较大价值非\n法财物；降低"}, {"a": "资质等级", "ul": 8}, {"t": "、吊销"}, {"a": "许可证件", "ul": 8}, {"t": "；责令停产停业、责令关闭、限制从业；\n其他较重的行政处罚等情形。"}]}, {"type": "h4", "toks": [{"t": "②程序：\n时间：当事人要求听证的，应在行政机关告知后"}, {"a": "5日内", "ul": 8}, {"t": "提出；行政机关应在听证的"}, {"a": "7日", "ul": 8}, {"t": "前，通知当事人举行听证的时间、地点方式：公开举行，涉及"}, {"a": "国家秘密", "ul": 8}, {"t": "、"}, {"a": "商业秘密", "ul": 8}, {"t": "或者"}, {"a": "个人隐私", "ul": 8}, {"t": "的除外。"}]}, {"type": "h2", "toks": [{"t": "7.行政处罚的执行程序\n原则上罚缴"}, {"a": "分离", "ul": 8}, {"t": "，以下情形可以当场收缴："}]}, {"type": "h3", "toks": [{"t": "（1）适用简易程序且符合下列情形之一的：依法给予100 元以下的罚款；不\n当场收缴事后难以执行。"}]}, {"type": "h3", "toks": [{"t": "（2）在特殊地区罚款的：在边远、水上、交通不便地区，到指定的银行或者\n通过电子支付系统缴纳罚款确有困难，经当事人提出。"}]}], "quiz": [{"src": "真题", "stem": "下列做法符合《中华人民共和国行政处罚法》规定的是：", "opts": {"A": "甲综合行政执法局责令孙某限期拆除其违法建筑", "B": "某变电站项目建成六年后，乙生态环境局发现其“未批先建”，处以罚款", "C": "某公司因某次违规代开发票被丙税务部门罚款三次", "D": "丁市场监督管理局对王某作出行政拘留七日并罚款一千元的处罚"}, "ans": "A"}, {"src": "母题", "stem": "下列关于行政处罚的表述正确的是：", "opts": {"A": "每个行政机关都有对任何行政违法行为的行政处罚权和有权适用任何一种行政处罚", "B": "行政处罚是行政机关依法对实施了违反行政法律规范的违法行为人进行的制裁", "C": "行政处罚的对象是实施了违反行政法律规范的违法行为的行政相对人，不包括法人、组织", "D": "各行政机关不仅享有与其执法权相适应的行政处罚权，还享有其他法律规定之外的行政处罚权"}, "ans": "B"}, {"src": "母题", "stem": "关于行政处罚的设定及听证，下列说法错误的是：", "opts": {"A": "地方性法规可以设定责令停产停业的行政处罚", "B": "行政法规可以设定吊销营业执照的行政处罚", "C": "限制人身自由的行政处罚只能由法律设定", "D": "当事人要求听证的，由当事人承担行政机关组织听证的费用"}, "ans": "D"}, {"src": "拓展", "stem": "以____权益或者增加义务的方式予以惩戒的行为。", "opts": {"A": "减损", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "减损"}, {"src": "拓展", "stem": "（2）行政法规→可以设定除____以外的行政处罚。", "opts": {"A": "限制人身自由", "B": "遗产继承", "C": "接受赠与", "D": "自己的行为"}, "ans": "A", "real": "限制人身自由"}, {"src": "拓展", "stem": "①特点：一人执法、____决定、当场送达。", "opts": {"A": "当场", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "当场"}], "branches": [{"h": "1.行政处罚", "terms": ["减损", "增加"]}, {"h": "2.一事不再罚原则", "terms": ["同一个", "两次"]}, {"h": "3.行政处罚的种类", "terms": ["警告", "罚款", "暂扣", "行政拘留", "公安机关"]}, {"h": "4.行政处罚的设定", "terms": ["法律", "限制人身自由", "吊销营业执"]}, {"h": "5.行政处罚的适用（不予处罚）", "terms": ["14周岁", "主观过错", "追责时效"]}, {"h": "6.行政处罚的程序", "terms": ["2人", "决定", "两人", "7日", "当场", "200元", "3000元"]}, {"h": "7.行政处罚的执行程序", "terms": ["分离"]}], "notes": ["行政处罚是行政机关对违反行政管理秩序者以减损权益或增加义务方式予以的惩戒。一事不再罚：同一个违法行为不得给予两次以上罚款（但可以'罚款+吊销执照'并用）；同一行为违反多个规范都该罚款的，按罚款数额高的规定处罚。", "种类：申诫罚=警告、通报批评；财产罚=罚款、没收违法所得和非法财物；行为罚（能力罚）=责令停产停业、暂扣或吊销许可证执照、降低资质；人身自由罚=行政拘留（只有公安机关有权决定和执行，单个1–15日、合并执行不超20日）。", "设定权限：法律可设定各种处罚（限制人身自由只能由法律设定）；行政法规设定除限制人身自由外的处罚；地方性法规设定除限制人身自由、吊销营业执照外的处罚；部门规章和地方政府规章只能设定警告、通报批评和一定数量罚款。", "不予处罚：不满14周岁、不能辨认控制自己行为的精神/智力残疾人；违法行为轻微并及时纠正、没有造成危害后果；有证据证明没有主观过错；超过追责时效（一般2年、涉及生命健康/金融安全5年、治安管理6个月）。", "程序：普通程序执法人员不少于2人、要出示证件、处罚前告知并听取陈述申辩（不得因申辩加重处罚）、立案之日起90日内作出决定、当事人不在场7日内送达；简易程序=一人执法、当场决定当场送达（警告、公民200元以下或法人3000元以下罚款）；听证在告知后5日内提出、行政机关听证7日前通知时间地点、原则公开；罚缴分离，100元以下罚款或事后难以执行等情形可当场收缴。"]}, {"id": 141, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "治安管理处罚", "nblank": 9, "blocks": [{"type": "p", "toks": [{"t": "治安管理处罚，是公安机关给予实施治安违法行为的公民、法人和其他组织的行政制裁。"}]}, {"type": "h2", "toks": [{"t": "1.治安管理处罚的种类"}]}, {"type": "h3", "toks": [{"t": "（1）主罚："}, {"a": "警告", "ul": 8}, {"t": "；罚款；"}, {"a": "行政拘留", "ul": 8}, {"t": "；吊销"}, {"a": "公安机关", "ul": 8}, {"t": "发放的许可证。"}]}, {"type": "h3", "toks": [{"t": "（2）附加罚：限期出境或者驱逐出境，对象仅限于违反治安管理的"}, {"a": "外国人", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.治安管理处罚的适用"}]}, {"type": "h3", "toks": [{"t": "（1）不满14 周岁："}, {"a": "不予", "ul": 8}, {"t": "处罚，但是应当责令其监护人严加管教。"}]}, {"type": "h3", "toks": [{"t": "（2）已满14 不满18 周岁：从轻或者减轻处罚。"}]}, {"type": "h3", "toks": [{"t": "（3）从轻、减轻或者不予处罚。"}]}, {"type": "h3", "toks": [{"t": "（4）从重处罚：有较严重后果的；教唆、胁迫、诱骗他人违反治安管理的；\n对报案人、控告人、举报人、证人打击报复的；"}, {"a": "一年内", "ul": 8}, {"t": "曾受过治安管理处罚的。"}]}, {"type": "h3", "toks": [{"t": "（5）处罚但不执行行政拘留的情形：已满14 周岁不满16 周岁的；已满16\n周岁不满18 周岁，"}, {"a": "初次", "ul": 8}, {"t": "违反治安管理的；70 周岁以上的；怀孕或者哺乳自己不满"}, {"a": "1周岁", "ul": 8}, {"t": "婴儿的。"}]}, {"type": "h2", "toks": [{"t": "3.治安处罚的追究时效：在"}, {"a": "6个月", "ul": 8}, {"t": "内没有被发现的，不再处罚。"}]}, {"type": "h2", "toks": [{"t": "4.治安调解：公安机关对因民间纠纷引起的违反治安管理行为可以调解处理。"}]}, {"type": "h2", "toks": [{"t": "5.违反治安管理的行为"}]}, {"type": "h3", "toks": [{"t": "（1）扰乱公共秩序的行为—对生产和生活等正常社会活动秩序的侵害。"}]}, {"type": "h3", "toks": [{"t": "（2）妨害公共安全的行为—对不特定多数人生命健康和财产安全的危害。"}]}, {"type": "h3", "toks": [{"t": "（3）侵犯人身权利、财产权利的行为—对特定人和特定财产的侵。"}]}, {"type": "h3", "toks": [{"t": "（4）妨害社会管理的行为—以危害国家机关正常管理为中心内容。"}]}], "quiz": [{"src": "真题", "stem": "根据《治安管理处罚法》关于处罚种类的规定，下列公安机关作出的处罚决定符合法律规定的是：", "opts": {"A": "公民陈某因殴打他人致轻微伤，公安机关对其作出拘役5 日并处300 元罚款的处罚", "B": "某酒店未按规定登记住宿旅客信息且情节严重，公安机关对其作出吊销营业执照的处罚", "C": "越南公民阮某在中国境内参与寻衅滋事违反治安管理，公安机关对其作出行政拘留3 日并驱逐出境的处罚", "D": "个体工商户刘某违规销售烟花爆竹，公安机关对其作出没收全部烟花爆竹并处1000 元罚款的处罚"}, "ans": "C"}, {"src": "母题", "stem": "根据《治安管理处罚法》的规定，下列说法正确的是：", "opts": {"A": "15 周岁张某初次殴打他人致轻微伤，应对其作出行政拘留处罚并实际执行", "B": "李某2025 年3 月参与赌博，2025 年10 月被公安机关发现，已过追究时效，不再给予治安管理处罚", "C": "美国游客汤姆在中国扰乱公共场所秩序，公安机关可对其作出罚款并处限期出境的处罚", "D": "王某因邻里纠纷将邻居打成轻微伤，公安机关必须先进行调解，调解不成再作出处罚"}, "ans": "C"}, {"src": "拓展", "stem": "（1）主罚：____", "opts": {"A": "警告", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "警告"}, {"src": "拓展", "stem": "（2）附加罚：限期出境或者驱逐出境，对象仅限于违反治安管理的____", "opts": {"A": "外国人", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "外国人"}, {"src": "拓展", "stem": "____曾受过治安管理处罚的。", "opts": {"A": "一年内", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "一年内"}], "branches": [{"h": "1.治安管理处罚的种类", "terms": ["警告", "行政拘留", "公安机关", "外国人"]}, {"h": "2.治安管理处罚的适用", "terms": ["不予", "一年内", "初次", "1周岁"]}, {"h": "3.治安处罚的追究时效：在", "terms": ["6个月"]}], "notes": ["治安管理处罚由公安机关作出。主罚=警告、罚款、行政拘留、吊销公安机关发放的许可证；附加罚=限期出境或驱逐出境（只适用于外国人）。", "适用：不满14周岁不予处罚但责令监护人严加管教；14–18周岁从轻或减轻；从重情形包括有较严重后果、教唆胁迫诱骗他人、对报案人控告人举报人证人打击报复、一年内曾受过治安处罚。", "应当给予行政拘留但不执行：已满14不满16周岁；已满16不满18周岁且初次违反；70周岁以上；怀孕或哺乳自己不满1周岁婴儿的。追究时效=6个月内没有被发现不再处罚；因民间纠纷引起的可以治安调解。"]}, {"id": 142, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政许可", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.行政许可\n行政许可，是指行政机关根据公民、法人或者其他组织的"}, {"a": "申请", "ul": 8}, {"t": "，经依法\n审查，"}, {"a": "准予", "ul": 8}, {"t": "其从事特定活动的行为。许可内容是国家一般禁止的活动。"}]}, {"type": "h2", "toks": [{"t": "2.行政许可的设定权限"}]}, {"type": "h3", "toks": [{"t": "（1）经常性行政许可的设定："}, {"a": "法律", "ul": 8}, {"t": "、行政法规、"}, {"a": "地方性法规", "ul": 8}, {"t": "可以设定经常\n性行政许可。"}]}, {"type": "h3", "toks": [{"t": "（2）非经常性行政许可的设定："}, {"a": "国务院", "ul": 8}, {"t": "决定和"}, {"a": "省级", "ul": 8}, {"t": "政府规章可以设定\n非经常性行政许可。"}]}, {"type": "h2", "toks": [{"t": "3.行政许可的实施"}]}, {"type": "h3", "toks": [{"t": "（1）决定时间：除可以当场作出行政许可决定的外，行政机关应当自受理行\n政许可申请之日起"}, {"a": "20日内", "ul": 8}, {"t": "作出行政许可决定。20 日内不能作出决定的，经本行政机关"}, {"a": "负责人", "ul": 8}, {"t": "批准，可以延长"}, {"a": "10日", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）听证程序：\n行政机关可依职权主动听证，可依当事人申请听证（申请人、利害关系人在被告知听证权利之日起"}, {"a": "5日内", "ul": 8}, {"t": "提出申请，行政机关在"}, {"a": "20日内", "ul": 8}, {"t": "组织听证）。"}]}, {"type": "h2", "toks": [{"t": "4.行政许可的撤销"}]}, {"type": "h3", "toks": [{"t": "（1）可以撤销："}, {"a": "许可机关", "ul": 8}, {"t": "违法，包括：滥用职权、玩忽职守；超越职权；违\n反法定程序；对不具备申请资格或者不符合法定条件的申请人准予行政许可。"}]}, {"type": "h3", "toks": [{"t": "（2）应当撤销："}, {"a": "被许可人", "ul": 8}, {"t": "以欺骗、贿赂等不正当手段取得行政许可的。取得\n的行政许可属于直接关系公共安全、人身健康、生命财产安全事项的，申请人在"}, {"a": "3年内", "ul": 8}, {"t": "不得再次申请该行政许可。"}]}, {"type": "h3", "toks": [{"t": "（3）不予撤销：有以上情形，可能对公共利益造成重大损害的，不予撤销。"}]}], "quiz": [{"src": "真题", "stem": "某炒货店的食品经营许可证即将到期，向所在县的市场监督管理局申请延续经营许可，县市场监督管理局经审核确认，炒货店经营许可的案件与原发证条件相比无本质变化，但周边的居民反映炒货店开业以来，人流量大，有噪声污染和用电安全隐患。对此，县市场监督管理局的合法处理方式应是：", "opts": {"A": "可对炒货店提出的延续申请作出暂停许可", "B": "按照原标准对炒货店的延续申请进行审查", "C": "按照初次许可申请要件重新审核延续申请", "D": "将相邻关系因素作为延续申请的考量因素"}, "ans": "B"}, {"src": "母题", "stem": "根据《行政许可法》的规定，下列关于行政许可的表述正确的是：", "opts": {"A": "某地省政府规章设定的非经常性行政许可，实施满1 年需要继续实施的，应当提请本级人大及其常委会制定地方性法规", "B": "某企业以贿赂手段取得的矿山开采许可，经查该许可直接关系生产安全，该企业在5 年内不得再次申请该类许可", "C": "申请人在被告知听证权利之日起3 日内提出听证申请的，行政机关应当在15 日内组织听证", "D": "行政机关发现其工作人员滥用职权作出的准予行政许可决定可能损害公共利益的，应当予以撤销"}, "ans": "A"}, {"src": "拓展", "stem": "行政许可，是指行政机关根据公民、法人或者其他组织的____，经依法", "opts": {"A": "申请", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "申请"}, {"src": "拓展", "stem": "（2）非经常性行政许可的设定：____决定和省级政府规章可以设定", "opts": {"A": "国务院", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "国务院"}, {"src": "拓展", "stem": "20 日内不能作出决定的，经本行政机关负责人批准，可以延长____", "opts": {"A": "10日", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "10日"}], "branches": [{"h": "1.行政许可", "terms": ["申请", "准予"]}, {"h": "2.行政许可的设定权限", "terms": ["法律", "地方性法规", "国务院", "省级"]}, {"h": "3.行政许可的实施", "terms": ["20日内", "负责人", "10日", "5日内"]}, {"h": "4.行政许可的撤销", "terms": ["许可机关", "被许可人", "3年内"]}], "notes": ["行政许可性质上是对'一般禁止的解除'（授益行政行为），依相对人申请启动，许可的内容是国家一般禁止的活动。", "设定权限（规章原则上不能设）：法律、行政法规、地方性法规可设定经常性许可；国务院决定和省级政府规章可设定非经常性许可（省级规章设定的临时性许可实施满1年需继续的应提请制定地方性法规）。", "时限：一般自受理申请之日起20日内决定，经本机关负责人批准可延长10日（最长30日）。听证：行政许可既可依职权也可依申请启动（对比：行政处罚听证只能依申请），当事人在被告知权利后5日内提出、行政机关20日内组织、听证7日前通知。", "撤销：许可机关违法（滥用职权、玩忽职守、超越职权、违反程序、给不合格者发证）→可以撤销；被许可人以欺骗、贿赂等不正当手段取得→应当撤销，且直接关系公共安全、人身健康、生命财产安全的许可，申请人3年内不得再次申请；撤销可能对公共利益造成重大损害的→不予撤销。"]}, {"id": 143, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政强制", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.行政强制措施"}]}, {"type": "h3", "toks": [{"t": "（1）含义：行政强制措施是指行政机关在行政管理过程中，为制止违法行为、\n防止证据损毁、避免危害发生、控制危险扩大等情形，依法对公民的人身自由实施暂时性限制，或者对公民、法人或者其他组织的财物实施"}, {"a": "暂时性", "ul": 8}, {"t": "控制的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）种类：限制公民人身自由；查封场所、设施或者财物；扣押财物；冻结\n存款、汇款；其他行政强制措施。"}]}, {"type": "h3", "toks": [{"t": "（3）实施"}]}, {"type": "h4", "toks": [{"t": "①实施主体：由"}, {"a": "法律", "ul": 8}, {"t": "、"}, {"a": "法规", "ul": 8}, {"t": "规定的行政机关（不得委托）。"}]}, {"type": "h4", "toks": [{"t": "②不得查封、扣押公民个人及其所扶养家属的"}, {"a": "生活必需品", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③冻结存款、汇款的数额应当与违法行为涉及的金额相当；已被其他国家机\n关依法冻结的，"}, {"a": "不得", "ul": 8}, {"t": "重复冻结。"}]}, {"type": "h2", "toks": [{"t": "2.行政强制执行"}]}, {"type": "h3", "toks": [{"t": "（1）含义：行政强制执行是指行政机关或者行政机关申请人民法院，对不履\n行行政决定的公民、法人或者其他组织，依法强制履行义务的行为。"}]}, {"type": "h3", "toks": [{"t": "（2）种类：加处罚款或者"}, {"a": "滞纳金", "ul": 8}, {"t": "；划拨存款、汇款；拍卖或者依法处理查\n封、扣押的场所、设施或者财物；排除妨碍、恢复原状；"}, {"a": "代履行", "ul": 8}, {"t": "；其他强制执行方式。"}]}, {"type": "h3", "toks": [{"t": "（3）实施"}]}, {"type": "h4", "toks": [{"t": "①行政机关不得在"}, {"a": "夜间", "ul": 8}, {"t": "或者"}, {"a": "法定节假日", "ul": 8}, {"t": "实施行政强制执行。但是，情况紧\n急的除外。"}]}, {"type": "h4", "toks": [{"t": "②行政机关不得对"}, {"a": "居民", "ul": 8}, {"t": "生活采取停止"}, {"a": "供水", "ul": 8}, {"t": "、供电、供热、供燃气等\n方式迫使当事人履行相关行政决定。"}]}, {"type": "h4", "toks": [{"t": "③需要立即清除道路、河道、航道或者公共场所的遗洒物、障碍物或者污染\n物，当事人不能清除的，行政机关可以决定立即实施代履行；当事人不在场的，行政机关应当在事后立即通知当事人，并依法作出处理。"}]}], "quiz": [{"src": "真题", "stem": "关于强制执行，下列说法错误的是：", "opts": {"A": "强制执行一般由权利人提出申请，法院不会主动执行", "B": "强制执行措施包括查封、扣押、冻结、拍卖、变卖等", "C": "如果被执行人丧失了劳动能力，法院可以裁定终结执行", "D": "强制执行不仅限于财务，也可以要求当事人履行特定行为"}, "ans": "C"}, {"src": "母题", "stem": "李某一家在某干涸的河道内修建了“星空大本营”俱乐部，供旅客在河道内搭建帐篷观测星空并提供食宿服务。在紧急防汛期，防汛指挥中心认为该俱乐部存在巨大安全隐患，要求其立即清除相关建筑物，但李某一家表示无法拆除。下列说法正确的是：", "opts": {"A": "在法定节假日，防汛指挥中心也可以强制清除", "B": "如果李某提起行政诉讼，防汛指挥中心应该暂停强制清除", "C": "防汛指挥中心只能与李某一家协调，待其同意之后才能拆除", "D": "防汛指挥中心可以与李某一家签订执行协议，约定分阶段清除"}, "ans": "A"}, {"src": "拓展", "stem": "①实施主体：由____、法规规定的行政机关（不得委托）。", "opts": {"A": "法律", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "法律"}, {"src": "拓展", "stem": "关依法冻结的，____重复冻结。", "opts": {"A": "不得", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "不得"}, {"src": "拓展", "stem": "①行政机关不得在夜间或者____实施行政强制执行。", "opts": {"A": "法定节假日", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "法定节假日"}], "branches": [{"h": "1.行政强制措施", "terms": ["暂时性", "法律", "法规", "生活必需品", "不得"]}, {"h": "2.行政强制执行", "terms": ["滞纳金", "代履行", "夜间", "法定节假日", "居民", "供水"]}], "notes": ["行政强制措施（为了控制局面、具有暂时性、预防性）：限制公民人身自由；查封场所设施财物；扣押财物；冻结存款汇款；其他。实施主体必须是法律、法规规定的行政机关且不得委托；不得查封扣押个人及其所扶养家属的生活必需品；冻结数额应与涉案金额相当、不得重复冻结。", "行政强制执行（为了迫使履行义务）：加处罚款或滞纳金、划拨存款汇款、拍卖或处理查封扣押财物、排除妨碍恢复原状、代履行等；间接强制执行=执行罚（加处罚款/滞纳金）+代履行。", "执行限制：不得在夜间或法定节假日实施（情况紧急除外）；不得用停止供水、供电、供热、供燃气方式迫使履行；道路河道等公共场所遗洒物当事人不能清除的行政机关可立即代履行、事后通知当事人。"]}, {"id": 144, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政复议", "nblank": 16, "blocks": [{"type": "p", "toks": [{"t": "行政复议，是指行政机关根据上级行政机关对下级行政机关的监督权，在当事人的申请和参加下，按照行政复议程序对行政行为进行合法性和适当性审查，并作出裁决解决行政侵权争议的活动。"}]}, {"type": "h2", "toks": [{"t": "1.行政复议的范围\n审查具体行政行为、行政不作为、行政协议、政府信息公开，附带性审查部\n分抽象行政行为（不含规章）。不审查抽象行政行为、国防外交、行政处分、行\n政调解。"}]}, {"type": "h2", "toks": [{"t": "2.行政复议机关\n复议机关\n管辖范围\n县以上\n"}, {"a": "政府", "ul": 8}]}, {"type": "h3", "toks": [{"t": "（1）对本级人民政府工作部门作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（2）对下一级人民政府作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（3）对本级人民政府依法设立的派出机关作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（4）对本级人民政府或者其工作部门管理的法律、法规、规章授权\n的组织作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（5）省、自治区、直辖市人民政府同时管辖对本机关作出的行政行\n为不服的行政复议案件；"}]}, {"type": "h3", "toks": [{"t": "（6）县级以上地方各级人民政府工作部门依法设立的派出机构依照\n法律、法规、规章规定，以派出机构的名义作出的行政行为不服的行政复议案件。\n上一级主管"}]}, {"type": "h3", "toks": [{"t": "（1）对"}, {"a": "海关", "ul": 8}, {"t": "、金融、"}, {"a": "外汇", "ul": 8}, {"t": "管理等实行垂直领导的行政机关、\n税务和国家安全机关的行政行为不服的，向上一级主管部门申请行政复议；"}]}, {"type": "h3", "toks": [{"t": "（2）对履行行政复议机构职责的地方人民政府司法行政部门的行政\n行为不服的，可以向"}, {"a": "本级", "ul": 8}, {"t": "人民政府申请行政复议，也可以向"}, {"a": "上一级", "ul": 8}, {"t": "司法行政部门申请行政复议国务院部门"}]}, {"type": "h3", "toks": [{"t": "（1）对本部门作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（2）对本部门依法设立的派出机构依照法律、行政法规、部门规章\n规定，以派出机构的名义作出的行政行为不服的；"}]}, {"type": "h3", "toks": [{"t": "（3）对本部门管理的法律、行政法规、部门规章授权的组织作出的\n行政行为不服的"}]}, {"type": "h2", "toks": [{"t": "3.行政复议的程序"}]}, {"type": "h3", "toks": [{"t": "（1）申请：自知道或应当知道该具体行政行为之日起"}, {"a": "60日", "ul": 8}, {"t": "内提出；但法\n律规定的申请期限超过"}, {"a": "60日", "ul": 8}, {"t": "的，从其规定。可以"}, {"a": "书面", "ul": 8}, {"t": "申请，书面有困难的，也可以"}, {"a": "口头", "ul": 8}, {"t": "申请。"}]}, {"type": "h3", "toks": [{"t": "（2）受理：复议机关应当在收到复议申请的"}, {"a": "5日", "ul": 8}, {"t": "内进行审查，决定是否\n受理。"}]}, {"type": "h3", "toks": [{"t": "（3）决定：行政复议机关应当自受理申请之日起"}, {"a": "60日", "ul": 8}, {"t": "内作出行政复议决\n定；但法律规定的行政复议期限少于60 日的，从其规定。"}]}, {"type": "h2", "toks": [{"t": "4.行政复议调解\n行政复议机关办理行政复议案件，可以进行"}, {"a": "调解", "ul": 8}, {"t": "。调解应当遵循合法、\n自愿的原则，不得损害国家利益、社会公共利益和他人合法权益，不得违反法律、\n法规的强制性规定。"}]}, {"type": "h2", "toks": [{"t": "5.复议前置\n复议前置是申请人应当先向行政复议机关申请行政复议，对行政复议决定不\n服的，可以再依法向人民法院提起行政诉讼。具体包括："}]}, {"type": "h3", "toks": [{"t": "（1）对"}, {"a": "当场", "ul": 8}, {"t": "作出的行政处罚决定不服。"}]}, {"type": "h3", "toks": [{"t": "（2）对行政机关作出的侵犯其已经依法取得的"}, {"a": "自然资源", "ul": 8}, {"t": "的所有权或者使用权\n的决定不服。"}]}, {"type": "h3", "toks": [{"t": "（3）认为行政机关存在"}, {"a": "未履行", "ul": 8}, {"t": "法定职责情形。"}]}, {"type": "h3", "toks": [{"t": "（4）申请政府"}, {"a": "信息公开", "ul": 8}, {"t": "，行政机关不予公开。"}]}, {"type": "h3", "toks": [{"t": "（5）法律、行政法规规定应当先向行政复议机关申请行政复议的其他情形。"}]}], "quiz": [{"src": "真题", "stem": "下列情形不在申请行政复议范围之内的是：", "opts": {"A": "餐馆甲因食品卫生不达标，被吊销餐饮服务许可证，甲不服", "B": "建设单位乙在申请建筑工程施工许可时，因申请材料不全被拒绝，乙不服", "C": "公务员丙不能胜任工作，其所属行政机关作出降职处理决定，丙不服", "D": "工人丁提出工伤认定申请，当地人力资源和社会保障局作出不予受理决定，丁不服"}, "ans": "C"}, {"src": "母题", "stem": "行政相对人对下列行为不服，但是不能提起行政复议的是：", "opts": {"A": "县生态环境局认为某造纸厂超标排污，决定吊销其排污许可证", "B": "县公安局认为某化工企业涉嫌制造冰毒，遂扣押了该厂全部生产设备", "C": "两公民因发生争议，互殴致伤，后在派出所的调解下，双方就对方的医疗费用问题达成协议", "D": "镇人民政府命令解除村民李某与该村村委会签订的农场承包合同"}, "ans": "C"}, {"src": "拓展", "stem": "（1）对____、金融、外汇管理等实行垂直领导的行政机关、", "opts": {"A": "海关", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "海关"}, {"src": "拓展", "stem": "律规定的申请期限超过____的，从其规定。", "opts": {"A": "60日", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "60日"}, {"src": "拓展", "stem": "行政复议机关办理行政复议案件，可以进行____", "opts": {"A": "调解", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "调解"}], "branches": [{"h": "2.行政复议机关", "terms": ["政府", "海关", "外汇", "本级", "上一级"]}, {"h": "3.行政复议的程序", "terms": ["60日", "书面", "口头", "5日"]}, {"h": "4.行政复议调解", "terms": ["调解"]}, {"h": "5.复议前置", "terms": ["当场", "自然资源", "未履行", "信息公开"]}], "notes": ["行政复议是上级行政机关根据监督权对下级行政行为进行合法性+适当性（合理性）审查的活动（行政诉讼只审查合法性）；申请人是民、被申请人是官（公务员属于'官'内部，不能申请复议，走申诉）。", "复议范围：具体行政行为+可对部分抽象行政行为申请附带审查（规章以下的规范性文件，不含规章）；不审查国家行为（国防外交）、行政处分（内部）、行政调解。", "复议机关找上级：对县级以上政府工作部门不服→本级政府或上一级主管部门；对下一级政府不服→上一级政府；对海关、金融、税务、外汇管理、国家安全等垂直领导机关不服→上一级主管部门；对省级政府和国务院部门不服→先由其自己复议。", "程序：自知道行政行为之日起60日内申请（法律规定更长的从其规定），可书面也可口头；复议机关5日内审查是否受理；一般自受理之日起60日内作出决定（法律规定少于60日的从其规定）；复议可以调解。", "复议前置（必须先复议、对复议结果不服才能起诉）：当场作出的行政处罚；侵犯已依法取得的自然资源所有权或使用权；认为行政机关未履行法定职责；政府信息公开申请被拒；法律行政法规规定的其他情形。"]}, {"id": 145, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政诉讼", "nblank": 17, "blocks": [{"type": "h2", "toks": [{"t": "1.行政诉讼原则"}]}, {"type": "h3", "toks": [{"t": "（1）行政机关负责人出庭应诉原则（告官要见官）\n行政机关及其工作人员不得干预、阻碍人民法院受理行政案件。被诉行政机关负责人"}, {"a": "应当", "ul": 8}, {"t": "出庭应诉。不能出庭的，应当委托"}, {"a": "行政机关", "ul": 8}, {"t": "相应的工作人员出庭。"}]}, {"type": "h3", "toks": [{"t": "（2）行政行为的合法性审查原则\n人民法院审理行政案件，对行政行为是否"}, {"a": "合法", "ul": 8}, {"t": "进行审查。"}]}, {"type": "h2", "toks": [{"t": "2.行政诉讼管辖"}]}, {"type": "h3", "toks": [{"t": "（1）中级人民法院管辖"}]}, {"type": "h4", "toks": [{"t": "①国务院"}, {"a": "部门", "ul": 8}, {"t": "或"}, {"a": "县级", "ul": 8}, {"t": "以上地方人民政府所作的行政行为提起诉讼的\n案件。"}]}, {"type": "h4", "toks": [{"t": "②"}, {"a": "海关", "ul": 8}, {"t": "处理的案件。"}]}, {"type": "h4", "toks": [{"t": "③本辖区内重大、复杂的案件。"}]}, {"type": "h4", "toks": [{"t": "④其他法律规定由中级人民法院管辖的案件。"}]}, {"type": "h3", "toks": [{"t": "（2）地域管辖"}]}, {"type": "h4", "toks": [{"t": "①一般地域管辖：原告就"}, {"a": "被告", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②特殊地域管辖\n经复议的案件，可以由最初作出行政行为的机关所在地法院管辖，也可以由复议机关所在地人民法院管辖。\n对限制人身自由的行政强制措施不服提起诉讼由"}, {"a": "被告", "ul": 8}, {"t": "所在地或"}, {"a": "原告", "ul": 8}, {"t": "所在地（包括原告户籍地、经常居住地和被限制人身自由地）人民法院管辖。\n因不动产提起诉讼的由"}, {"a": "不动产", "ul": 8}, {"t": "所在地人民法院管辖。"}]}, {"type": "h2", "toks": [{"t": "3.行政诉讼参加人"}]}, {"type": "h3", "toks": [{"t": "（1）行政诉讼原告\n行政行为的相对人以及认为行政行为侵犯其合法权益，而依法向法院提起诉讼的公民、法人或者其他组织。"}]}, {"type": "h3", "toks": [{"t": "（2）行政诉讼被告\n情形被告复议后再起诉复议改变（只包括改变处理结果）"}, {"a": "复议机关", "ul": 8}, {"t": "复议维持"}, {"a": "原机关", "ul": 8}, {"t": "和复议机关复议机关不作为对复议机关不服，以"}, {"a": "复议机关", "ul": 8}, {"t": "为被告；\n对原具体行政行为不服，以"}, {"a": "原机关", "ul": 8}, {"t": "为被告行政机关委托的组织所作出的行政行为委托的行政机关法律、法规、规章授权的组织作出行政行为"}, {"a": "该组织", "ul": 8}, {"t": "经上级机关批准而作出行政行为对外发生法律效力的文书上"}, {"a": "署名", "ul": 8}, {"t": "的机关两个以上行政机关作出同一行政行为"}, {"a": "共同被告", "ul": 8}]}], "quiz": [{"src": "真题", "stem": "某县自然资源和规划局向县政府请示回收某地块的土地使用权。县政府批复同意后，县自然资源和规划局并未制作回收决定书，也未通知该地块的使用权人，而是直接将回收事项交由县土地储备中心付诸实施。韩某合法的房屋位于该地块内，对回收土地使用权的决定不服，遂提起行政诉讼。对此，下列说法不正确的是：", "opts": {"A": "县政府的批复属于内部行政行为，并没有对韩某的权益产生影响", "B": "县自然资源和规划局虽未制作回收决定书，但回收土地的决定已生效", "C": "县自然资源和规划局直接将县政府批复付诸实施的行为具有可诉性", "D": "韩某提起行政诉讼应列的被告是县政府而不是县自然资源和规划局"}, "ans": "D"}, {"src": "母题", "stem": "当事人不服以下行政行为，可以提起行政诉讼的是：", "opts": {"A": "某政府部门以张某试用期不合格为由取消其公务员录用资格", "B": "某社保局给李某记大过的处分", "C": "王某去当地派出所报案，派出所不予理会", "D": "某财政局对工作人员田某提出的辞职申请不批准"}, "ans": "C"}, {"src": "母题", "stem": "对国务院各部门所作的具体行政行为不服提起行政诉讼的，管辖法院是：", "opts": {"A": "基层人民法院", "B": "中级人民法院", "C": "高级人民法院", "D": "最高人民法院"}, "ans": "B"}, {"src": "拓展", "stem": "被诉行政机关负责人____出庭应诉。", "opts": {"A": "应当", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "应当"}, {"src": "拓展", "stem": "人民法院审理行政案件，对行政行为是否____进行审查。", "opts": {"A": "合法", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "合法"}, {"src": "拓展", "stem": "①国务院部门或____以上地方人民政府所作的行政行为提起诉讼的", "opts": {"A": "县级", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "县级"}], "branches": [{"h": "1.行政诉讼原则", "terms": ["应当", "行政机关", "合法"]}, {"h": "2.行政诉讼管辖", "terms": ["部门", "县级", "海关", "被告", "原告", "不动产"]}, {"h": "3.行政诉讼参加人", "terms": ["复议机关", "原机关", "该组织", "署名", "共同被告"]}], "notes": ["原则：行政机关负责人应当出庭应诉（'告官要见官'，确有正当理由不能出庭的应委托工作人员出庭）；人民法院只审查行政行为的合法性（复议审查合法性+合理性）。", "级别管辖：中级法院管辖三类一审案件——对国务院部门或县级以上地方政府提起的诉讼、海关处理案件、本辖区内重大复杂案件。地域管辖：一般'原告就被告'；经复议的案件，原机关所在地和复议机关所在地法院都可管辖；对限制人身自由强制措施不服，被告所在地和原告所在地（户籍地、经常居住地、被限制人身自由地）都可管辖；不动产案件由不动产所在地法院专属管辖；起诉期限一般是知道行政行为之日起6个月。", "被告确认：复议维持→原机关和复议机关是共同被告；复议改变→复议机关单独被告；复议机关不作为→原告可择一告。行政机关委托的组织作出行为→委托机关被告；经上级批准→以对外生效文书上署名的机关为被告；两个以上行政机关共同作出→共同被告。"]}, {"id": 146, "part": "常识判断", "pian": "法律常识", "zhang": "行政法", "jie": "", "kind": "zsd", "title": "行政赔偿", "nblank": 7, "blocks": [{"type": "h2", "toks": [{"t": "1.行政赔偿的范围"}]}, {"type": "h3", "toks": [{"t": "（1）国家承担赔偿责任：行政机关及其工作人员在行使"}, {"a": "行政职权", "ul": 8}, {"t": "时侵犯人身\n权、财产权；行政机关不履行、拖延履行法定职责。"}]}, {"type": "h3", "toks": [{"t": "（2）国家不承担赔偿责任：行政机关工作人员与行使职权无关的"}, {"a": "个人行为", "ul": 8}, {"t": "；\n因公民、法人和其他组织"}, {"a": "自己的行为", "ul": 8}, {"t": "致使损害发生的；法律规定的其他情形。"}]}, {"type": "h2", "toks": [{"t": "2.行政赔偿义务机关\n情形\n行政赔偿义务机关\n行政机关及其工作人员行使行政职权侵权\n"}, {"a": "该机关", "ul": 8}, {"t": "（“谁侵权找谁”）\n两个以上行政机关共同侵权\n"}, {"a": "共同赔偿", "ul": 8}, {"t": "（“谁侵权找谁”）\n法律法规授权的组织侵权\n该组织（“谁侵权找谁”）\n受行政机关委托的组织或者个人侵权\n委托的行政机关（“找老大”）\n派出机构侵权\n派出它的行政机关（“找老大”）\n经复议机关复议\n复议未加重损害\n"}, {"a": "原机关", "ul": 8}, {"t": "\n复议加重损害\n原机关赔，复议机关对"}, {"a": "加重部分", "ul": 8}, {"t": "履\n行赔偿义务"}]}], "quiz": [{"src": "真题", "stem": "根据《国家赔偿法》关于行政赔偿的相关规定，下列说法正确的是：", "opts": {"A": "某市市场监管局工作人员王某下班途中驾车不慎撞伤路人李某，李某有权要求市场监管局承担行政赔偿责任", "B": "某县公安局委托辖区村委会对流动人口进行管理，村委会工作人员在查验居住证时违法损毁村民张某的财物，张某应向村委会主张行政赔偿", "C": "赵某因不服区生态环境局的罚款决定申请行政复议，市生态环境局复议后将罚款金额从5 万元提高至8 万元，后该处罚决定被确认违法，赵某可要求市生态环境局对3 万元的加重部分承担赔偿责任", "D": "个体户陈某为逃避检查，在城管部门执法时自行损毁待售的水果，陈某有权要求城管部门承担水果损毁的行政赔偿责任"}, "ans": "C"}, {"src": "母题", "stem": "下列属于国家不承担赔偿责任情形的是：", "opts": {"A": "违法征收、征用财物", "B": "因违法吊销许可证的行为致使损害发生", "C": "行政机关工作人员实施的与行使职权无关的个人行为", "D": "行政机关采取暴力形式导致损害发生"}, "ans": "C"}, {"src": "拓展", "stem": "（1）国家承担赔偿责任：行政机关及其工作人员在行使____时侵犯人身", "opts": {"A": "行政职权", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "行政职权"}, {"src": "拓展", "stem": "因公民、法人和其他组织____致使损害发生的；", "opts": {"A": "自己的行为", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "自己的行为"}, {"src": "拓展", "stem": "____（“谁侵权找谁”）", "opts": {"A": "共同赔偿", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "共同赔偿"}], "branches": [{"h": "1.行政赔偿的范围", "terms": ["行政职权", "个人行为", "自己的行为"]}, {"h": "2.行政赔偿义务机关", "terms": ["该机关", "共同赔偿", "原机关", "加重部分"]}], "notes": ["国家赔偿范围：行政机关及其工作人员行使职权时侵犯人身权、财产权的要赔，不履行、拖延履行法定职责造成损害的也要赔；工作人员与职权无关的个人行为、因相对人自己行为致害、法律规定的其他情形国家不赔。", "赔偿义务机关确认口诀'谁侵权找谁、找老大'：行政机关自己侵权→该机关；两个以上共同侵权→共同赔偿；法律法规授权组织侵权→该组织；受委托组织或个人侵权→委托的行政机关；派出机构侵权→设立它的机关；经复议的案件，复议未加重损害→原机关赔，复议加重损害→原机关对原损害赔、复议机关对加重部分赔。"]}, {"id": 147, "part": "常识判断", "pian": "法律常识", "zhang": "宪法", "jie": "", "kind": "zsd", "title": "宪法特点", "nblank": 8, "blocks": [{"type": "h2", "toks": [{"t": "1.内容：国家"}, {"a": "最根本", "ul": 8}, {"t": "、"}, {"a": "最重要", "ul": 8}, {"t": "的问题。\n宪法所规定的是一个国家带有根本性的问题，也就是说规定了国家的社会性\n质，政权的组织形式、经济制度、公民的权利和义务、国家机构体系及组织活动\n原则等等国家和社会的根本制度。"}]}, {"type": "h2", "toks": [{"t": "2.效力：法律效力"}, {"a": "最高", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（1）宪法是制定"}, {"a": "普通法律", "ul": 8}, {"t": "的依据，普通法律是宪法的派生。"}]}, {"type": "h3", "toks": [{"t": "（2）任何法律法规都不得与宪法的精神原则相违背。"}]}, {"type": "h3", "toks": [{"t": "（3）宪法是一切国家机关社会团体和全体公民的最高"}, {"a": "行为准则", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.制定和修改的程序：比其他法律更加严格。"}]}, {"type": "h3", "toks": [{"t": "（1）宪法的制定和修改往往需要依法成立特别的机关。"}]}, {"type": "h3", "toks": [{"t": "（2）批准通过宪法或者修正案的程序往往严格于普通法律。宪法的修改是由\n全国人们代表大会常务委员会或者"}, {"a": "五分之一", "ul": 8}, {"t": "以上的全国人民代表大会代表提议，并由全国人民代表大会以全体代表的"}, {"a": "三分之二", "ul": 8}, {"t": "以上的多数通过。法律和其他议案由全国人民代表大会以全体代表的"}, {"a": "过半数", "ul": 8}, {"t": "通过。"}]}], "quiz": [{"src": "真题", "stem": "中国共产党登上中国历史舞台后，经过艰辛探索和实践，成功在中华大地上制定和实施了具有鲜明社会主义性质的宪法、真正意义上的人民宪法，在我国宪法发展史乃至世界宪法制度史上都具有开创性意义，为人类法治文明进步贡献了中国智慧、中国方案。下列有关我国宪法的表述正确的有几项？①我国宪法确认了中国共产党的领导地位，这是我国宪法最显著的特征②宪法是治国安邦的总章程，是中国共产党治国理政的根本法律依据③要全面发挥宪法在立法中的核心地位功能，每一个立法环节都把好宪法关④必须坚持宪法监督制度化法规化，宪法的生命在于监督，宪法的权威也在于监督", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "C"}, {"src": "母题", "stem": "宪法的最高效力表现在：", "opts": {"A": "宪法的内容涉及国家的根本制度", "B": "宪法是普通法律制定的基础和依据", "C": "宪法的制定和修改程序均不同于普通法律", "D": "宪法是一国政治力量对比关系的全面、集中表现"}, "ans": "B"}, {"src": "拓展", "stem": "1.内容：国家____、最重要的问题。", "opts": {"A": "最根本", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "最根本"}, {"src": "拓展", "stem": "2.效力：法律效力____", "opts": {"A": "最高", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "最高"}, {"src": "拓展", "stem": "（3）宪法是一切国家机关社会团体和全体公民的最高____", "opts": {"A": "行为准则", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "行为准则"}], "branches": [{"h": "1.内容：国家", "terms": ["最根本", "最重要"]}, {"h": "2.效力：法律效力", "terms": ["最高", "普通法律", "行为准则"]}, {"h": "3.制定和修改的程序：比其他法律更加严格。", "terms": ["五分之一", "三分之二", "过半数"]}], "notes": ["宪法是国家根本法（母法）：内容上规定国家最根本最重要的问题；法律效力最高——是制定普通法律的依据（普通法是宪法的派生）、任何法律法规都不得同宪法相违背、是一切组织和全体公民的最高行为准则。", "制定修改程序比普通法律更严格：宪法修正案只能由全国人大常委会或者1/5以上全国人大代表提议，并由全国人大以全体代表的2/3以上多数通过；普通法律和其他议案只需全体代表过半数通过。"]}, {"id": 148, "part": "常识判断", "pian": "法律常识", "zhang": "宪法", "jie": "", "kind": "zsd", "title": "宪法的修改", "nblank": 6, "blocks": [{"type": "h2", "toks": [{"t": "1.我国宪法修改\n新中国先后颁布了一个宪法性文件和四部宪法，即《中国人民政治协商会议\n共同纲领》（临时宪法）、1954 年宪法（中国"}, {"a": "第一部", "ul": 8}, {"t": "社会主义类型的宪法）、\n1975 年宪法、1978 年宪法、"}, {"a": "1982年", "ul": 8}, {"t": "宪法（现行宪法）。\n1982 年宪法，分别于1988 年、1993 年、1999 年、2004 年和2018 年以宪法\n修正案的形式进行了5 次部分修改。"}]}, {"type": "h2", "toks": [{"t": "2.2018 年宪法修正案"}]}, {"type": "h3", "toks": [{"t": "（1）确立习近平新时代中国特色社会主义思想。"}]}, {"type": "h3", "toks": [{"t": "（2）中国共产党领导是中国特色社会主义最本质的特征。"}]}, {"type": "h3", "toks": [{"t": "（3）国家行政机关、"}, {"a": "监察机关", "ul": 8}, {"t": "、审判机关、检察机关都由人民代表大会产生，\n对它负责，受它监督。"}]}, {"type": "h3", "toks": [{"t": "（4）维护和发展各民族的平等团结互助和谐关系。"}]}, {"type": "h3", "toks": [{"t": "（5）增加倡导社会主义核心价值观。"}]}, {"type": "h3", "toks": [{"t": "（6）国家工作人员就职时应当依照法律规定公开进行"}, {"a": "宪法宣誓", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（7）中华人民共和国主席、副主席每届任期同全人大每届任期相同。"}]}, {"type": "h3", "toks": [{"t": "（8）增加国务院行使职权：生态文明建设。"}]}, {"type": "h3", "toks": [{"t": "（9）"}, {"a": "设区的市", "ul": 8}, {"t": "的人民代表大会和它们的常务委员会，在不同宪法、法律、行\n政法规和本省、自治区的地方性法规相抵触的前提下，可以依照法律规定制定地方性法规，报本省、自治区人民代表大会常务委员会"}, {"a": "批准", "ul": 8}, {"t": "后施行。"}]}, {"type": "h3", "toks": [{"t": "（10）增加监察委员会。"}]}], "quiz": [{"src": "真题", "stem": "《中华人民共和国宪法》（1982 年）实施以来，先后五次以修正案的形式进了修改。下列宪法条款与宪法修正案对应正确的是：", "opts": {"A": "公民的合法的私有财产不受侵犯——1993 年宪法修正案", "B": "农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制——2004 年宪法修正案", "C": "国家尊重和保障人权——1999 年宪法修正案", "D": "中国共产党领导是中国特色社会主义最本质的特征——2018年宪法修正案"}, "ans": "D"}, {"src": "母题", "stem": "根据我国宪法的规定，有权提出宪法修改有效议案的主体是：", "opts": {"A": "全国人民代表大会常务委员会", "B": "人民代表大会的一个代表团", "C": "十分之一以上的全国人民代表大会代表", "D": "全国人民代表大会主席团"}, "ans": "A"}, {"src": "母题", "stem": "“中华人民共和国主席、副主席每届任期同全国人民代表大会每届任期相同，连续任职不得超
