义爆发于1911 年10 月10 日，揭开辛亥革命序幕", "D": "1912 年中华民国临时政府成立，定都北京"}, "ans": "C"}, {"src": "母题", "stem": "下列不属于洋务运动主要内容的是：", "opts": {"A": "创办了近代军事、民用工业", "B": "兴办近代学校和派遣留学生", "C": "创建近代海军和训练新式海军", "D": "改革政治制度、整治吏治"}, "ans": "D"}, {"src": "拓展", "stem": "____：组织翻译编写《四洲志》等，被称为中国“开眼看世界的第一人”。", "opts": {"A": "林则徐", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "林则徐"}, {"src": "拓展", "stem": "曾国藩：在安徽创办____（我国第一个近代军工厂）。", "opts": {"A": "安庆内军械所", "B": "彩陶文化", "C": "半坡遗址", "D": "中华五千年文明史"}, "ans": "A", "real": "安庆内军械所"}, {"src": "拓展", "stem": "1905 年，孙中山在东京成立中国____", "opts": {"A": "同盟会", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "同盟会"}], "branches": [{"h": "1.鸦片战争期间", "terms": ["林则徐", "海国图志", "师夷长技以制夷"]}, {"h": "2.洋务运动", "terms": ["军事工业", "新式学堂", "安庆内军械所", "江南制造总局"]}, {"h": "3.戊戌变法", "terms": ["光绪", "京师大学堂"]}, {"h": "4.辛亥革命", "terms": ["革命团体", "同盟会", "民权主义", "武昌起义", "南京", "中华民国临时约法", "君主专制"]}], "notes": ["开眼看世界：林则徐《四洲志》（'开眼看世界第一人'）、魏源《海国图志》（'师夷长技以制夷'）。", "洋务运动（19世纪60–90年代，学技术）：口号'自强''求富'，指导思想'中学为体、西学为用'；军事工业：曾国藩安庆内军械所（第一个近代军工厂）、李鸿章江南制造总局（当时最大兵工厂）、左宗棠福州船政局（最大船舶制造中心）、张之洞汉阳铁厂（最早官办钢铁企业）；创办京师同文馆、派留学生、建近代海军。", "戊戌变法（学制度，主张君主立宪）：1895公车上书揭幕、1898光绪推行、历时103天=百日维新、9·21戊戌政变失败；保留京师大学堂（北大前身，第一所国立大学、近代国立高等教育开端）。", "辛亥革命：1894檀香山兴中会（第一个资产阶级革命团体）、1905东京同盟会（第一个资产阶级革命政党）；十六字纲领概括为三民主义（民族、民权、民生，民权是核心）；1911.10.10武昌起义；1912.1.1中华民国成立、定都南京；1912.3《中华民国临时约法》=第一部具有资产阶级共和国宪法性质的文件；推翻清朝、结束两千多年君主专制，但没有改变半殖民地半封建社会性质。"]}, {"id": 50, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "党的诞生和国民大革命", "nblank": 12, "blocks": [{"type": "p", "toks": [{"t": "中共一大：1921 年7 月23 日，中共一大在"}, {"a": "上海", "ul": 8}, {"t": "（后转移至浙江嘉兴南湖）召开。会议确定党的名称为“中国共产党”，通过了党的第一个"}, {"a": "纲领", "ul": 8}, {"t": "，选举陈独秀为中央局书记。党的一大的召开标志着中国共产党的成立。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n中国共产党早期组织\n1920 年8 月，"}, {"a": "陈独秀", "ul": 8}, {"t": "在上海成立了中国第一个共产党早期组织，随后创办\n中国共产党历史上第一个党刊——《"}, {"a": "共产党", "ul": 8}, {"t": "》。\n1920 年10 月，李大钊在北京成立共产党早期组织。\n中共二大：1922 年7 月，中共二大在上海召开。会议制定了党的"}, {"a": "最高纲领", "ul": 8}, {"t": "（实\n现共产主义）和"}, {"a": "最低纲领", "ul": 8}, {"t": "（打倒军阀，推翻国际帝国主义的压迫，统一中国为真\n正的民主共和国），这是在中国近代史上第一次明确地提出了彻底的反帝反封建\n的民主革命纲领。会议通过了第一部《"}, {"a": "中国共产党章程", "ul": 16}, {"t": "》。\n中共三大：1923 年6 月，中共三大在"}, {"a": "广州", "ul": 8}, {"t": "召开。会议决定共产党员\n"}, {"a": "以个人身份", "ul": 16}, {"t": "加入国民党的形式实现国共合作，同时保持共产党在政治上、\n思想上和组织上的独立性。\n国民党一大：1924 年，国民党一大在广州召开。会议确立了“联俄、联共、\n扶助农工”三大政策，标志着第一次"}, {"a": "国共合作", "ul": 8}, {"t": "正式形成。\n中共四大：1925 年1 月，中共四大在上海召开。会议明确地提出了\n"}, {"a": "无产阶级领导权", "ul": 16}, {"t": "和工农联盟问题。\n中共五大：1927 年4 月，中共五大在武汉召开。会议选举产生了党的历史上\n第一个中央纪律检查监督机构——"}, {"a": "中央监察委员会", "ul": 16}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "关于中国共产党的发展历程，下列说法错误的是：", "opts": {"A": "1921 年7 月，陈独秀并未亲自参加中国共产党第一次全国代表大会", "B": "中国共产党的最早组织是在上海建立的", "C": "最早提出“中国共产党”这一名称的是蔡和森", "D": "中国共产党历史上第一个党刊是《新青年》"}, "ans": "D"}, {"src": "母题", "stem": "中国共产党自诞生以来，召开了一系列具有重大历史意义的全国代表大会。下列关于中共历次全国代表大会及其历史贡献的对应关系，正确的是：", "opts": {"A": "中共一大——通过了党的第一部《中国共产党章程》，确立了党的名称为“中国共产党”", "B": "中共二大——在中国近代史上第一次明确提出了彻底的反帝反封建的民主革命纲领", "C": "中共三大——明确提出了无产阶级在民主革命中的领导权问题和工农联盟问题", "D": "中共五大——确立了“联俄、联共、扶助农工”三大政策，标志着第一次国共合作正式形成"}, "ans": "B"}, {"src": "拓展", "stem": "中共一大：1921 年7 月23 日，中共一大在____（后转移至浙江嘉兴南湖）召开。", "opts": {"A": "上海", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "上海"}, {"src": "拓展", "stem": "会议制定了党的____（实", "opts": {"A": "最高纲领", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "最高纲领"}, {"src": "拓展", "stem": "____加入国民党的形式实现国共合作，同时保持共产党在政治上、", "opts": {"A": "以个人身份", "B": "彩陶文化", "C": "半坡遗址", "D": "玉猪龙"}, "ans": "A", "real": "以个人身份"}], "branches": [{"h": "要点", "terms": ["上海", "纲领", "陈独秀", "共产党", "最高纲领", "最低纲领", "中国共产党章程"]}], "notes": ["早期组织：1920.8陈独秀在上海建立第一个共产党早期组织；1920.10李大钊建立北京早期组织；'中国共产党'名称由蔡和森提出。", "一大（1921.7.23上海→嘉兴南湖）：定名中国共产党、通过第一个纲领、选陈独秀为中央局书记，标志党诞生；二大（1922.7上海）：最高纲领+最低纲领（打倒军阀、推翻帝国主义压迫），是近代中国第一次彻底的反帝反封建民主革命纲领，通过第一部党章；三大（1923.6广州）决定党员以个人身份加入国民党、同时保持独立性。", "国民党一大（1924.1广州）确立'联俄、联共、扶助农工'，第一次国共合作正式形成；四大（1925.1）首次提出无产阶级领导权和工农联盟；五大（1927.4武汉）选举产生第一个中央纪律检查监督机构=中央监察委员会。", "【旁批】1927.4.12蒋介石发动反革命政变；中共六大1928年在莫斯科召开，是唯一一次在国外召开的党代会。"]}, {"id": 51, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "土地革命", "nblank": 15, "blocks": [{"type": "p", "toks": [{"t": "南昌起义：1927 年8 月1 日，周恩来等人领导南昌起义，打响"}, {"a": "武装反抗国民党", "ul": 16}, {"t": " 的第一枪。这是中国共产党"}, {"a": "独立领导革命战争", "ul": 16}, {"t": " 、"}, {"a": "创建人民军队", "ul": 16}, {"t": "和武装夺取政权的开端。\n八七会议：1927 年8 月7 日，中共中央在汉口秘密召开紧急会议，彻底清算了大革命后期陈独秀的"}, {"a": "右倾机会主义", "ul": 16}, {"t": "错误，"}, {"a": "毛泽东", "ul": 8}, {"t": "在会上提出“须知政权是由枪杆子中取得的”。\n秋收起义：1927 年9 月，毛泽东领导的湘赣边界秋收起义爆发，首次公开打出“"}, {"a": "工农革命军", "ul": 16}, {"t": "”的旗帜。\n三湾改编：1927 年9 月底开始，毛泽东领导三湾改编，确立了“"}, {"a": "支部建在连上", "ul": 16}, {"t": "”的原则，从政治上组织上保证了党对军队的绝对领导，标志着毛泽东建设人民军队思想的开始形成。\n"}, {"a": "古田会议", "ul": 8}, {"t": "：1929 年12 月，在福建上杭古田召开，确立了思想建党、政治建军的原则，解决了如何把以农民为主要成分的军队建设成为无产阶级领导的新型人民军队的根本问题。\n中华苏维埃共和国成立：1931 年11 月，中华苏维埃第一次全国代表大会在江西"}, {"a": "瑞金", "ul": 8}, {"t": "召开，宣布成立中华苏维埃共和国临时中央政府，毛泽东当选为主席。这是中国共产党领导建立的第一个全国性红色政权。\n红军长征：王明等人的"}, {"a": "“左”倾机会主义", "ul": 16}, {"t": "错误，使红军在第五次反“围剿”中遭到失败，被迫开始长征。1934 年10 月10 日，红军从江西省瑞金、古城等地出发。1936 年10 月9 日，红四方面军指挥部到达"}, {"a": "甘肃会宁", "ul": 8}, {"t": "，同红一方面军会师；\n10 月22 日，红二方面军指挥部到达甘肃隆德将台堡（今属宁夏回族自治区），同红一方面军胜利会师。红军三大主力会师，宣告红军二万五千里长征胜利结束。\n遵义会议：1935 年1 月，在贵州遵义召开中共中央政治局扩大会议。会议结束了“左”倾教条主义在军事上的错误指挥，会后成立了由毛泽东、"}, {"a": "周恩来", "ul": 8}, {"t": "、"}, {"a": "王稼祥", "ul": 8}, {"t": "组成的三人军事领导小组，事实上确立了"}, {"a": "毛泽东", "ul": 8}, {"t": "在党中央和红军的领导地位。遵义会议是党的历史上一个生死攸关的转折点，是中国共产党第一次自主地运用马克思列宁主义基本原理解决中国革命的问题，标志着中国共产党在政治上"}, {"a": "开始走向成熟", "ul": 16}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "下列关于中国共产党党史军史上三大起义的说法正确的是：", "opts": {"A": "秋收起义打响了武装反抗国民党反动派的第一枪", "B": "南昌起义开辟了第一个在农村的革命根据地", "C": "广州起义建立了中国第一个城市苏维埃政府", "D": "秋收起义是中国共产党开始创建人民军队的标志"}, "ans": "C"}, {"src": "母题", "stem": "以下关于中国共产党早期武装斗争与政权建设的史实，表述正确的是：", "opts": {"A": "南昌起义后，中国共产党立即在井冈山地区建立了全国性红色政权，标志着“工农武装割据”思想的成熟", "B": "八七会议确立了“支部建在连上”的原则，为新型人民军队的建设奠定了政治基础", "C": "从秋收起义到古田会议，中国共产党逐步解决了如何建设无产阶级领导的新型人民军队这一根本问题", "D": "中华苏维埃共和国的成立，源于三湾改编期间“政权是由枪杆子中取得的”重要论断的实践落实"}, "ans": "C"}, {"src": "母题", "stem": "1935 年1 月，中共中央政治局在贵州遵义召开扩大会议。这次会议是在红军第五次反“围剿”失败和长征初期严重受挫的历史关头召开的。下列关于遵义会议的表述，正确的是：", "opts": {"A": "会议结束了“左”倾教条主义在中央的统治，确立了毛泽东思想为党的指导思想", "B": "会后成立了由毛泽东、朱德、王稼祥组成的三人军事领导小组，全权负责军事指挥", "C": "会议标志着中国共产党从幼年走向成熟，是因为它第一次独立自主地运用马克思列宁主义基本原理解决中国革命的问题", "D": "会议通过了《中央关于目前政治形势与党的任务决议》，确定了建立抗日民族统一战线的策略方针"}, "ans": "C"}, {"src": "拓展", "stem": "南昌起义：1927 年8 月1 日，周恩来等人领导南昌起义，打响____ 的第一枪。", "opts": {"A": "武装反抗国民党", "B": "中华五千年文明史", "C": "最早的中国", "D": "有文献可考"}, "ans": "A", "real": "武装反抗国民党"}, {"src": "拓展", "stem": "这是中国共产党____ 、创建人民军队和武装夺取政权的开端。", "opts": {"A": "独立领导革命战争", "B": "中华五千年文明史", "C": "长江文明之源", "D": "海上丝绸之路"}, "ans": "A", "real": "独立领导革命战争"}, {"src": "拓展", "stem": "这是中国共产党独立领导革命战争 、____和武装夺取政权的开端。", "opts": {"A": "创建人民军队", "B": "彩陶文化", "C": "半坡遗址", "D": "中华五千年文明史"}, "ans": "A", "real": "创建人民军队"}], "branches": [{"h": "要点", "terms": ["武装反抗国民党", "独立领导革命战争", "创建人民军队", "右倾机会主义", "毛泽东", "工农革命军", "支部建在连上"]}], "notes": ["南昌起义（1927.8.1，周恩来等）：打响武装反抗国民党反动派第一枪，是独立领导革命战争、创建人民军队、武装夺取政权的开端；八七会议（1927.8.7汉口）清算陈独秀右倾错误，毛泽东提出'政权是由枪杆子中取得'。", "秋收起义（1927.9）首次公开打出'工农革命军'旗帜；三湾改编（1927.9底）'支部建在连上'，保证党对军队的绝对领导；古田会议（1929.12福建上杭）确立思想建党、政治建军；1931.11一苏大在江西瑞金成立中华苏维埃共和国临时中央政府（第一个全国性红色政权），毛泽东任主席。", "【旁批辨析】'左'倾=激进冒险（加引号）、左倾=积极进步、右倾=消极妥协投降。", "长征：第五次反'围剿'因王明'左'倾错误失败，1934.10从瑞金出发，1936.10三大主力甘肃会宁（10.22将台堡）会师，二万五千里长征结束；遵义会议（1935.1）结束'左'倾教条主义错误、确立毛泽东领导，是生死攸关的转折点，也是党第一次独立自主运用马列主义解决自身问题，标志政治上从幼稚走向成熟。", "革命道路=农村包围城市、武装夺取政权（《星星之火，可以燎原》）；第一个农村革命根据地=井冈山（最大的中央苏区在瑞金）；第一个抗日根据地=晋察冀（最大的陕甘宁边区在延安）；最后一个农村指挥所=西柏坡。"]}, {"id": 52, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "抗日战争", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.日本侵华战争的开始\n"}, {"a": "九一八事变", "ul": 16}, {"t": "：1931 年9 月18 日，日本炸毁柳条湖铁路，炮轰北大营。\n这是中国抗日战争的起点，揭开了世界反法西斯战争的序幕。\n"}, {"a": "七七事变", "ul": 8}, {"t": "：1937 年7 月7 日，日军挑起卢沟桥事变。这是中国全民族抗战的\n开端，开辟了世界反法西斯战争的东方主战场。"}]}, {"type": "h2", "toks": [{"t": "2.抗日民族统一战线的建立\n"}, {"a": "瓦窑堡会议", "ul": 16}, {"t": "：1935 年底召开，通过了《中央关于目前政治形势与党的\n任务决议》，确定了建立抗日民族统一战线的方针。\n西安事变：1936 年12 月12 日，张学良、杨虎城逼蒋抗日，又称双十二事变。\n西安事变的和平解决，标志着十年内战基本结束，抗日民族统一战线"}, {"a": "初步形成", "ul": 8}, {"t": "。\n洛川会议：1937 年洛川会议通过《抗日救国十大纲领》，制定\n"}, {"a": "全面抗战路线", "ul": 16}, {"t": "。\n《中共中央为公布国共合作宣言》：1937 年9 月，国民党发表《中共中央为\n公布国共合作宣言》，标志着第二次国共合作开始，抗日民族统一战线"}, {"a": "正式形成", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.正面战场与敌后战场\n"}, {"a": "淞沪会战", "ul": 8}, {"t": "：1937 年8 月至11 月，是抗战初期规模最大、战斗最惨烈的战役，\n粉碎了日本“三个月灭亡中国”的狂妄计划。\n平型关大捷（属于太原会战）：1937 年9 月，林彪率领八路军115 师取得平\n型关大捷。这是全民族抗战以来中国军队主动对日作战取得的第一个重大胜利，\n打破了“"}, {"a": "日军不可战胜", "ul": 16}, {"t": "”的神话。\n"}, {"a": "台儿庄战役", "ul": 16}, {"t": "（属于徐州会战）：1938 年3 月至4 月，在李宗仁指挥下\n获得抗战以来正面战场取得的最大胜利。\n武汉会战：1938 年6 月至10 月。战后抗日战争进入"}, {"a": "战略相持", "ul": 8}, {"t": "阶段。\n百团大战：1940 年8 月至1941 年1 月，彭德怀指挥八路军一百多个团对日\n作战。这是抗日战争时期，由中国共产党独立发动的"}, {"a": "规模最大", "ul": 8}, {"t": "、持续时间最长、\n战果最丰富的战役。"}]}, {"type": "h2", "toks": [{"t": "4.抗日战争的胜利\n1945 年8 月15 日，日本宣布无条件投降。9 月2 日，日本签署投降书。10\n月25 日，台湾回到祖国的怀抱。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】"}]}, {"type": "h2", "toks": [{"t": "1.抗日战争胜利纪念日\n2014 年中国以立法的形式，将"}, {"a": "9月3日", "ul": 8}, {"t": "定为中国人民抗日战争胜利的纪念日。"}]}, {"type": "h2", "toks": [{"t": "2.台湾光复纪念日\n2025 年10 月24 日，由第十四届全国人民代表大会常务委员会第十八次会议\n决定，以法律形式将"}, {"a": "10月25日", "ul": 8}, {"t": "设立为台湾光复纪念日。"}]}, {"type": "h2", "toks": [{"t": "3.伟大的抗战精神\n"}, {"a": "天下兴亡、匹夫有责", "ul": 16}, {"t": "的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、\n血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。"}]}], "quiz": [{"src": "真题", "stem": "下列对“七七事变”的描述，不正确的是：", "opts": {"A": "发生于1937 年7 月7 日的北平西南卢沟桥附近，因此又称“卢沟桥事变”", "B": "是日本帝国主义全面侵华战争的开始，也是中华民族进行全面抗战的起点", "C": "促成了第一次国共合作及抗日民族统一战线的建立", "D": "1937 年7 月17 日，蒋介石在庐山发表抗战声明，指出“再没有妥协的机会”"}, "ans": "C"}, {"src": "母题", "stem": "下列关于抗日战争时期重要历史事件的表述，正确的是：", "opts": {"A": "西安事变的和平解决，标志着抗日民族统一战线正式形成", "B": "平型关大捷是抗战以来中国军队在正面战场取得的最大胜利，打破了日军不可战胜的神话", "C": "武汉会战结束后，抗日战争进入战略相持阶段", "D": "百团大战是抗战初期国民党军队发动的规模最大、持续时间最长的战役"}, "ans": "C"}, {"src": "母题", "stem": "下列按照事件发生时间的先后排序，正确的是：①西安事变②淞沪会战③七七事变④台儿庄战役", "opts": {"A": "①②③④", "B": "④①②③", "C": "①③②④", "D": "④①③②"}, "ans": "C"}, {"src": "拓展", "stem": "____：1931 年9 月18 日，日本炸毁柳条湖铁路，炮轰北大营。", "opts": {"A": "九一八事变", "B": "彩陶文化", "C": "半坡遗址", "D": "玉猪龙"}, "ans": "A", "real": "九一八事变"}, {"src": "拓展", "stem": "公布国共合作宣言》，标志着第二次国共合作开始，抗日民族统一战线____", "opts": {"A": "正式形成", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "正式形成"}, {"src": "拓展", "stem": "战后抗日战争进入____阶段。", "opts": {"A": "战略相持", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "战略相持"}], "branches": [{"h": "1.日本侵华战争的开始", "terms": ["九一八事变", "七七事变"]}, {"h": "2.抗日民族统一战线的建立", "terms": ["瓦窑堡会议", "初步形成", "全面抗战路线", "正式形成"]}, {"h": "3.正面战场与敌后战场", "terms": ["淞沪会战", "日军不可战胜", "台儿庄战役", "战略相持", "规模最大"]}, {"h": "1.抗日战争胜利纪念日", "terms": ["9月3日"]}, {"h": "2.台湾光复纪念日", "terms": ["10月25日"]}], "notes": ["起点：九一八事变（1931.9.18，日军炸柳条湖铁路、炮轰北大营）是中国人民抗日战争起点，揭开世界反法西斯战争序幕；七七事变（1937.7.7卢沟桥）标志全民族抗战开端，开辟了世界反法西斯战争东方主战场。", "统一战线：瓦窑堡会议（1935底）确定建立抗日民族统一战线方针；西安事变（1936.12.12张杨'双十二'）和平解决→十年内战基本结束、统一战线初步形成；洛川会议（1937）通过《抗日救国十大纲领》（全面抗战路线）；1937.9国民党公布《中共中央为公布国共合作宣言》=第二次国共合作开始、统一战线正式形成。", "正面战场：淞沪会战（初期规模最大最惨烈、粉碎日军三个月灭亡中国的妄想）；平型关大捷（1937.9林彪115师，全民族抗战以来中国军队主动对日作战第一个重大胜利）；台儿庄大捷（1938李宗仁，正面战场最大胜利）；武汉会战（1938.6–10，此后进入战略相持）；百团大战（1940.8–1941.1彭德怀，中共独立发动的规模最大、持续时间最长、战果最丰的战役）。", "1945.8.15日本宣布无条件投降、9.2签署投降书、10.25台湾回归；2014年立法确定9月3日为中国人民抗日战争胜利纪念日，10月25日为台湾光复纪念日。"]}, {"id": 53, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "解放战争", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.重庆谈判\n1945 年8 月28 日，毛泽东率领中国共产党代表团从延安飞抵重庆，经过43\n天谈判，国共双方达成《政府与中共代表会谈纪要》，即“双十协定”。"}]}, {"type": "h2", "toks": [{"t": "2.内战爆发\n1946 年6 月26 日，国民党统治集团全面撕毁“双十协定”，向中原解放区\n发动大规模进攻，全面内战爆发。"}]}, {"type": "h2", "toks": [{"t": "3.战略进攻\n1947 年6 月，"}, {"a": "刘邓大军挺进大别山", "ul": 24}, {"t": "揭开了人民解放军战略进攻的序幕，\n是解放战争由战略防御转为战略进攻的历史转折点。"}]}, {"type": "h2", "toks": [{"t": "4.战略决战\n1948 年9 月至1949 年1 月，中国人民解放军同国民党军队进行的战略决战，\n包括"}, {"a": "辽沈战役", "ul": 8}, {"t": "、"}, {"a": "淮海战役", "ul": 8}, {"t": "、平津战役三场战略性战役。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n"}, {"a": "淮海战役", "ul": 8}, {"t": "\n1948 年11 月—1949 年1 月。被称为是“小推车推出来的胜利”，是三大战\n役中解放军牺牲最重、歼敌数量最多、政治影响最大、战争样式最复杂的战役。"}]}, {"type": "h2", "toks": [{"t": "5.七届二中全会\n1949 年3 月，党的七届二中全会在河北省西柏坡召开。会议讨论和决定的主\n要问题有：一是确定了彻底推翻国民党统治，夺取全国的方针；二是指出工作重\n心应从"}, {"a": "农村", "ul": 8}, {"t": "转向"}, {"a": "城市", "ul": 8}, {"t": "，并以生产建设为中心；三是阐述了在全国胜利后\n仍会存在两种基本矛盾，一种是"}, {"a": "无产阶级同资产阶级", "ul": 24}, {"t": "的矛盾，一种是中国\n人民和帝国主义的矛盾。同时告诫全党在革命胜利后要警惕资产阶级“糖衣炮弹”\n的袭击，务必继续地保持谦虚、谨慎、不骄、不躁和"}, {"a": "艰苦奋斗", "ul": 8}, {"t": "的作风。"}]}, {"type": "h2", "toks": [{"t": "6.渡江战役\n1949年4月21日，中国人民解放军强渡长江。4月23日，解放军占领"}, {"a": "南京", "ul": 8}, {"t": "，\n统治中国22 年的国民政府覆灭。"}]}], "quiz": [{"src": "真题", "stem": "三大战役的胜利奠定了人民解放战争在全国胜利的基础，三大战役不包括：", "opts": {"A": "辽沈战役", "B": "济南战役", "C": "淮海战役", "D": "平津战役"}, "ans": "B"}, {"src": "母题", "stem": "1949 年3 月中共中央七届二中全会的会议内容不包括的是：", "opts": {"A": "提出了彻底推翻国民党统治，迅速夺取民主革命在全国胜利的各项方针", "B": "提出党的工作重心必须由武装斗争转到经济建设", "C": "分析了全国胜利后中国社会的基本矛盾", "D": "提出要集中力量发展生产力，把我国尽快地从落后农业国变为先进的工业国"}, "ans": "B"}, {"src": "拓展", "stem": "1947 年6 月，____揭开了人民解放军战略进攻的序幕，", "opts": {"A": "刘邓大军挺进大别山", "B": "中华五千年文明史", "C": "师夷长技以制夷", "D": "中华民国临时约法"}, "ans": "A", "real": "刘邓大军挺进大别山"}, {"src": "拓展", "stem": "包括辽沈战役、____、平津战役三场战略性战役。", "opts": {"A": "淮海战役", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "淮海战役"}, {"src": "拓展", "stem": "心应从农村转向____，并以生产建设为中心；", "opts": {"A": "城市", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "城市"}], "branches": [{"h": "3.战略进攻", "terms": ["刘邓大军挺进大别山"]}, {"h": "4.战略决战", "terms": ["辽沈战役", "淮海战役"]}, {"h": "5.七届二中全会", "terms": ["农村", "城市", "无产阶级同资产阶级", "艰苦奋斗"]}, {"h": "6.渡江战役", "terms": ["南京"]}], "notes": ["重庆谈判（1945.8.28毛泽东飞赴重庆，历时43天）达成《政府与中共代表会谈纪要》=双十协定；1946.6.26国民党进攻中原解放区，全面内战爆发。", "1947.6刘邓大军千里挺进大别山，揭开战略进攻序幕（由战略防御转入战略进攻的转折点）；战略决战三大战役（1948.9–1949.1）=辽沈、淮海、平津，其中淮海战役牺牲最重、歼敌最多、影响最大、战争样式最复杂，是'小推车推出来的胜利'。", "七届二中全会（1949.3西柏坡，最后一个农村指挥所）：确定推翻国民党、夺取全国胜利的方针；提出工作重心由农村转向城市、以生产建设为中心；胜利后两种基本矛盾（无产阶级同资产阶级、中国人民同帝国主义）；警惕资产阶级糖衣炮弹；提出'两个务必'（务必继续保持谦虚谨慎不骄不躁、务必继续保持艰苦奋斗的作风）。", "渡江战役1949.4.21强渡长江、4.23占领南京，统治中国22年的国民党政权覆灭。"]}, {"id": 54, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "先秦诗歌", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.《诗经》\n《诗经》，又称《诗》或《诗三百》，共收入自"}, {"a": "西周", "ul": 8}, {"t": "初期至春秋中叶约\n500 年间的诗歌305 篇。\n《诗经》是我国第一部"}, {"a": "诗歌总集", "ul": 8}, {"t": "，开创了中国诗歌"}, {"a": "现实主义", "ul": 8}, {"t": "\n的源头。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n《诗经》六义\n《诗经》分风、雅、颂三部分，大量运用了赋、比、兴表现手法。“风、雅、\n颂”与“赋、比、兴”合称“六义”。\n"}, {"a": "风", "ul": 8}, {"t": "——周代各地的歌谣，大部分是黄河流域的民间乐歌。常见名篇有\n《关雎》、《硕鼠》、《蒹葭》、《桃夭》等。\n雅——周人的正声雅乐，分小雅、大雅。常见名篇有《鹿鸣》、《采薇》等。\n颂——周王庭和贵族宗庙"}, {"a": "祭祀", "ul": 8}, {"t": "的乐歌，又分为周颂、鲁颂、商颂。常见\n名篇有《清庙》等。\n"}, {"a": "赋", "ul": 8}, {"t": "——铺陈直叙，即诗人把思想感情及其有关的事物平铺直叙地表达\n出来。\n比——比方，以彼物比此物，借一个事物来作比喻。\n"}, {"a": "兴", "ul": 8}, {"t": "——触物兴词，客观事物触发了诗人的情感，大多在诗歌的开端。"}]}, {"type": "h2", "toks": [{"t": "2.《楚辞》\n西汉末年，刘向辑录屈原、宋玉等人辞赋，编成《楚辞》。《楚辞》是我国\n第一部"}, {"a": "浪漫主义", "ul": 8}, {"t": "诗歌总集。\n屈原，我国浪漫主义文学的奠基人、"}, {"a": "辞赋之祖", "ul": 8}, {"t": "，其作品主要有《离骚》《天\n问》《招魂》《九歌》《怀沙》《哀郢》等。\n《"}, {"a": "离骚", "ul": 8}, {"t": "》，是我国第一首长篇政治抒情诗。\n《诗经·"}, {"a": "国风", "ul": 8}, {"t": "》和《楚辞·"}, {"a": "离骚", "ul": 8}, {"t": "》并称为“风骚”。"}]}], "quiz": [{"src": "真题", "stem": "《诗经》是中国最早的诗歌总集，由“风”“雅”“颂”三部分组成。下列名句出自“雅”篇的是：", "opts": {"A": "关关雎鸠，在河之洲。窈窕淑女，君子好逑", "B": "知我者，谓我心忧；不知我者，谓我何求。悠悠苍天，此何人哉", "C": "呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙", "D": "投我以木桃，报之以琼瑶。匪报也，永以为好也"}, "ans": "C"}, {"src": "母题", "stem": "“赋”“比”“兴”是《诗经》中的三种基本表现手法。其中“兴”有感发兴起之意，是因某一事物之触发而引出所欲叙写之事物的一种表达方法。下列不属于“兴”手法的诗句是：", "opts": {"A": "苕之华，芸其黄矣。心之忧矣，维其伤矣", "B": "硕鼠硕鼠，无食我黍！三岁贯女，莫我肯顾", "C": "关关雎鸠，在河之洲。窈窕淑女，君子好逑", "D": "桃之夭夭，灼灼其华。之子于归，宜其室家"}, "ans": "B"}, {"src": "母题", "stem": "下列说法正确的是：", "opts": {"A": "“路曼曼其修远兮，吾将上下而求索”出自屈原的《诗经》", "B": "《诗经》是中国最早的一部浪漫主义诗歌总集", "C": "《诗经》分“风”“雅”“颂”三类，其中“颂”指的是宫廷正乐", "D": "火星探测器“天问一号”的名称源于作品《楚辞·天问》"}, "ans": "D"}, {"src": "拓展", "stem": "《诗经》，又称《诗》或《诗三百》，共收入自____初期至春秋中叶约", "opts": {"A": "西周", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "西周"}, {"src": "拓展", "stem": "颂——周王庭和贵族宗庙____的乐歌，又分为周颂、鲁颂、商颂。", "opts": {"A": "祭祀", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "祭祀"}, {"src": "拓展", "stem": "《____》，是我国第一首长篇政治抒情诗。", "opts": {"A": "离骚", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "离骚"}], "branches": [{"h": "1.《诗经》", "terms": ["西周", "诗歌总集", "现实主义", "祭祀"]}, {"h": "2.《楚辞》", "terms": ["浪漫主义", "辞赋之祖", "离骚", "国风"]}], "notes": ["《诗经》收录西周初至春秋中叶约500年的诗歌305篇，是我国第一部诗歌总集，开现实主义源头；'六义'=风雅颂（分类）+赋比兴（手法）：风=各地民间乐歌（关雎、蒹葭、硕鼠）、雅=正声雅乐分小雅大雅（鹿鸣、采薇）、颂=宗庙祭祀乐歌；赋=铺陈直叙、比=以彼物比此物、兴=先言他物以引起所咏之词（多在开头）。", "《楚辞》由西汉末年刘向辑录屈原、宋玉等人作品，是第一部浪漫主义诗歌总集；屈原是浪漫主义奠基人、'辞赋之祖'，《离骚》是第一首长篇政治抒情诗；《诗经·国风》与《楚辞·离骚》并称'风骚'。"]}, {"id": 55, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "魏晋诗歌", "nblank": 7, "blocks": [{"type": "h2", "toks": [{"t": "1.三曹\n曹操：字孟德，开创建安之风，代表作品《短歌行》《观沧海》《龟虽寿》。\n曹丕：字子桓，《"}, {"a": "燕歌行", "ul": 8}, {"t": "》是现存最早的完整的七言诗。著有《"}, {"a": "典论·论文", "ul": 8}, {"t": "》，\n这是中国文学史上第一部有系统的文学批评专论。\n曹植：字子建，作品有《洛神赋》《七步诗》等，谢灵运赞其“"}, {"a": "才高八斗", "ul": 8}, {"t": "”。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n经典名句\n《观沧海》：日月之行，若出其中；星汉灿烂，若出其里。\n《龟虽寿》：老骥伏枥，志在千里；烈士暮年，壮心不已。\n《燕歌行》：秋风萧瑟天气凉，草木摇落露为霜。\n《洛神赋》：翩若惊鸿，婉若游龙，荣曜秋菊，华茂春松。"}]}, {"type": "h2", "toks": [{"t": "2.陶谢\n陶渊明：字元亮，别号"}, {"a": "五柳先生", "ul": 8}, {"t": "，东晋人，我国第一位"}, {"a": "田园诗人", "ul": 8}, {"t": "，被称为\n“"}, {"a": "古今隐逸诗人之宗", "ul": 24}, {"t": "”。代表作有《饮酒》《归园田居》《桃花源记》《归\n去来兮辞》等。\n谢灵运：东晋人，诗歌史上自觉以"}, {"a": "山水", "ul": 8}, {"t": "入诗的第一人。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n经典名句\n《饮酒·其五》：采菊东篱下，悠然见南山。\n《归园田居》：种豆南山下，草盛豆苗稀。\n《归去来兮辞》：悟已往之不谏，知来者之可追。"}]}], "quiz": [{"src": "真题", "stem": "下列选项中，与诗句“少无适俗韵，性本爱丘山”出自同一作者的是：", "opts": {"A": "对酒当歌，人生几何", "B": "木欣欣以向荣，泉涓涓而始流", "C": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马", "D": "野火烧不尽，春风吹又生"}, "ans": "B"}, {"src": "母题", "stem": "下列诗句的作者，不是建安文学代表人物的是：", "opts": {"A": "东临碣石，以观沧海", "B": "本是同根生，相煎何太急", "C": "秋风萧瑟天气凉，草木摇落露为霜", "D": "种豆南山下，草盛豆苗稀"}, "ans": "D"}, {"src": "母题", "stem": "下列关于陶渊明说法正确的是：①西晋时期的诗人、辞赋家、散文家②他不为五斗米折腰，八十多天便弃职而去，从此归隐田园③他是中国第一位山水诗人，被誉为“古今隐逸诗人之宗④诗句“五柳把菊笑我痴，笑面人生，寿于灵霄石”描写的诗人指的是陶渊明", "opts": {"A": "①②③④", "B": "②③④", "C": "①③", "D": "②④"}, "ans": "D"}, {"src": "拓展", "stem": "曹丕：字子桓，《____》是现存最早的完整的七言诗。", "opts": {"A": "燕歌行", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "燕歌行"}, {"src": "拓展", "stem": "曹植：字子建，作品有《洛神赋》《七步诗》等，谢灵运赞其“____”。", "opts": {"A": "才高八斗", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "才高八斗"}, {"src": "拓展", "stem": "陶渊明：字元亮，别号五柳先生，东晋人，我国第一位____，被称为", "opts": {"A": "田园诗人", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "田园诗人"}], "branches": [{"h": "1.三曹", "terms": ["燕歌行", "典论·论文", "才高八斗"]}, {"h": "2.陶谢", "terms": ["五柳先生", "田园诗人", "古今隐逸诗人之宗", "山水"]}], "notes": ["三曹：曹操开建安文学之风（短歌行、观沧海、龟虽寿）；曹丕《燕歌行》是现存最早完整的七言诗，《典论·论文》是第一部系统的文学批评专论；曹植（七步诗、洛神赋），谢灵运评其'才高八斗'。", "陶渊明（号五柳先生）是东晋第一位田园诗人（注意不是山水诗人），被称'古今隐逸诗人之宗'，代表作饮酒、归园田居、桃花源记、归去来兮辞；谢灵运是诗歌史上自觉以山水入诗的第一人。"]}, {"id": 56, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "唐宋八大家", "nblank": 8, "blocks": [{"type": "h2", "toks": [{"t": "1.唐宋八大家：主持唐宋古文运动的中心人物，包括唐二家（"}, {"a": "韩愈、柳宗元", "ul": 14}, {"t": "）\n和宋六家（苏轼、苏洵、苏辙、欧阳修、曾巩、王安石）。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n古文运动\n古文运动是唐宋时期提倡古文、反对骈文的文体改革运动。其核心是反对六\n朝以来形式僵化、内容空洞的骈文，提倡恢复先秦两汉时期质朴自由、言之有物\n的散文传统，以复兴"}, {"a": "儒学", "ul": 8}, {"t": "，挽救时局。"}]}, {"type": "h2", "toks": [{"t": "2.韩愈：世称韩昌黎、"}, {"a": "昌黎先生", "ul": 8}, {"t": "。代表作有《"}, {"a": "师说", "ul": 8}, {"t": "》《祭十二郎文》《马\n说》《杂说》《进学解》等。在古文运动中提出“文以载道”的核心主张。被誉\n为唐宋八大家之首，苏轼称韩愈“文起八代之衰”。与柳宗元并称“韩柳”。"}]}, {"type": "h2", "toks": [{"t": "3.柳宗元：世称柳河东、"}, {"a": "河东先生", "ul": 8}, {"t": "、柳柳州。代表作有《永州八记》《捕蛇\n者说》《黔之驴》等，是我国第一位把"}, {"a": "寓言", "ul": 8}, {"t": "正式写成独立的文学作品的作家。"}]}, {"type": "h2", "toks": [{"t": "4.欧阳修：号醉翁，晚年号“"}, {"a": "六一居士", "ul": 8}, {"t": "”。代表作有《醉翁亭记》《卖油翁》。"}]}, {"type": "h2", "toks": [{"t": "5.王安石：号半山，世称王荆公、王临川。代表作有《伤仲永》《游褒禅山\n记》等。列宁称其为“"}, {"a": "十一世纪", "ul": 8}, {"t": "中国最伟大的改革家”。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n经典名句\n《师说》：闻道有先后，术业有专攻，如是而已。\n《醉翁亭记》：醉翁之意不在酒，在乎山水之间也。\n《游褒禅山记》：世之奇伟、瑰怪，非常之观，常在于险远，而人之所罕至焉，\n故非有志者不能至也。"}]}], "quiz": [{"src": "真题", "stem": "下列作者、朝代和作品对应正确的是：", "opts": {"A": "韩愈——唐代——《师说》", "B": "柳宗元——宋代——《捕蛇者说》", "C": "欧阳修——唐代——《祭十二郎文》", "D": "王安石——宋代——《醉翁亭记》"}, "ans": "A"}, {"src": "母题", "stem": "下列关于“唐宋八大家”及其代表作品的表述，正确的是：", "opts": {"A": "柳宗元世称“柳河东”，其代表作《捕蛇者说》是我国文学史上第一篇独立的寓言作品", "B": "韩愈被苏轼誉为“文起八代之衰”，他在古文运动中提出了“文以载道”的核心主张", "C": "王安石世称“王临川”，列宁称赞他是“十一世纪中国最伟大的改革家”，其代表作《醉翁亭记》千古流传", "D": "欧阳修号“醉翁”，晚年号“六一居士”，他与韩愈、柳宗元共同倡导了唐代的古文运动"}, "ans": "B"}, {"src": "母题", "stem": "关于古文运动，下列描述错误的是：", "opts": {"A": "韩愈、柳宗元、欧阳修、王安石、曾巩、苏洵、苏轼、苏辙是代表人物", "B": "古文是相对于骈文而言的，特点是质朴自由，有利于反映现实生活、表达思想", "C": "自唐代中期至明代初期", "D": "目的是恢复儒家道统"}, "ans": "C"}, {"src": "拓展", "stem": "的散文传统，以复兴____，挽救时局。", "opts": {"A": "儒学", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "儒学"}, {"src": "拓展", "stem": "代表作有《____》《祭十二郎文》《马", "opts": {"A": "师说", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "师说"}, {"src": "拓展", "stem": "者说》《黔之驴》等，是我国第一位把____正式写成独立的文学作品的作家。", "opts": {"A": "寓言", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "寓言"}], "branches": [{"h": "1.唐宋八大家：主持唐宋古文运动的中心人物，包括唐二家（", "terms": ["儒学"]}, {"h": "2.韩愈：世称韩昌黎、", "terms": ["昌黎先生", "师说"]}, {"h": "3.柳宗元：世称柳河东、", "terms": ["河东先生", "寓言"]}, {"h": "4.欧阳修：号醉翁，晚年号“", "terms": ["六一居士"]}, {"h": "5.王安石：号半山，世称王荆公、王临川。代表作有《伤仲永》《游褒禅山", "terms": ["十一世纪"]}], "notes": ["唐宋八大家=唐二家（韩愈、柳宗元）+宋六家（欧阳修、苏洵、苏轼、苏辙、曾巩、王安石），都是古文运动代表，主张复兴先秦两汉质朴散文、反对六朝以来形式僵化的骈文，以复兴儒学挽救时局。", "韩愈（韩昌黎）是八大家之首，主张'文以载道'，苏轼评其'文起八代之衰'，与柳宗元并称'韩柳'；柳宗元（柳河东/柳柳州）是第一位把寓言写成独立文学作品的作家（黔之驴、捕蛇者说、永州八记）。", "欧阳修（号醉翁、晚号六一居士，醉翁亭记、卖油翁）；王安石（号半山，列宁称'十一世纪中国最伟大改革家'，伤仲永、游褒禅山记）。"]}, {"id": 57, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "唐诗", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.初唐诗歌\n“初唐四杰”是初唐文学家王勃、杨炯、卢照邻、"}, {"a": "骆宾王", "ul": 8}, {"t": "的并称，其中"}, {"a": "王勃", "ul": 8}, {"t": "\n被称为四杰之首，人称“诗杰”。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n王勃的经典名句\n《送杜少府之任蜀州》：海内存知己，天涯若比邻。\n《滕王阁序》：落霞与孤鹜齐飞，秋水共长天一色。"}]}, {"type": "h2", "toks": [{"t": "2.盛唐诗歌\n"}, {"a": "王维", "ul": 8}, {"t": "：人称“"}, {"a": "诗佛", "ul": 8}, {"t": "”。代表作有《使至塞上》《送元二使安西》《九\n月九日忆山东兄弟》等。苏轼曾说“味摩诘之诗，诗中有画；观摩诘之画，画中\n有诗”。\n李白：号"}, {"a": "青莲居士", "ul": 8}, {"t": "，人称“谪仙人”“"}, {"a": "诗仙", "ul": 8}, {"t": "”，唐代浪漫主义诗人。代\n表作有《蜀道难》《将进酒》等。\n杜甫：自号少陵野老，人称“"}, {"a": "诗圣", "ul": 8}, {"t": "”，唐代现实主义诗人。代表作有“三\n吏”\n“三别”以及《望岳》\n《闻官军收河南河北》等。其诗歌被后人评价为“"}, {"a": "诗史", "ul": 8}, {"t": "”。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸1】\n“三吏”“三别”\n“三吏”：《石壕吏》《新安吏》《潼关吏》\n“三别”：《新婚别》《无家别》《垂老别》"}]}, {"type": "callout", "toks": [{"t": "【知识延伸2】\n作品与名句\n人物\n代表作品\n名句\n王维\n《使至塞上》\n大漠孤烟直，长河落日圆。\n《九月九日忆山东兄弟》\n遥知兄弟登高处，遍插茱萸少一人。\n《送元二使安西》\n劝君更尽一杯酒，西出阳关无故人。\n李白\n《望庐山瀑布》\n飞流直下三千尺，疑是银河落九天。\n《将进酒》\n天生我材必有用，千金散尽还复来。\n《黄鹤楼送孟浩然之广陵》\n孤帆远影碧空尽，唯见长江天际流。\n杜甫\n《望岳》\n会当凌绝顶，一览众山小。\n《闻官军收河南河北》\n剑外忽传收蓟北，初闻涕泪满衣裳。\n《蜀相》\n三顾频烦天下计，两朝开济老臣心。\n《寄李太白二十韵》\n笔落惊风雨，诗成泣鬼神。\n《春望》\n感时花溅泪，恨别鸟惊心。"}]}, {"type": "h2", "toks": [{"t": "3.中唐诗歌\n"}, {"a": "白居易", "ul": 8}, {"t": "：号香山居士，人称“"}, {"a": "诗魔", "ul": 8}, {"t": "”“诗王”，中唐现实主义诗人。\n代表作有《长恨歌》《琵琶行》等。与元稹等倡导新乐府运动，提出“文章合为\n时而著，歌诗合为事而作”。\n刘禹锡：人称“诗豪”，代表作有《陋室铭》《乌衣巷》等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n作品与名句\n人物\n代表作品\n名句\n白居易\n《琵琶行》\n同是天涯沦落人，相逢何必曾相识。\n《长恨歌》\n在天愿作比翼鸟，在地愿为连理枝。\n刘禹锡\n《乌衣巷》\n旧时王谢堂前燕，飞入寻常百姓家。\n《陋室铭》\n山不在高，有仙则名。水不在深，有龙则灵。"}]}, {"type": "h2", "toks": [{"t": "4.晚唐诗歌\n杜牧：号樊川居士，与李商隐合称“"}, {"a": "小李杜", "ul": 8}, {"t": "”。代表作有《过华清宫》《阿\n房宫赋》等。\n李商隐：创写了以男女之情为题材的"}, {"a": "无题诗", "ul": 8}, {"t": "。代表作有《夜雨寄北》《锦\n瑟》《无题》等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n作品与名句\n人物\n代表作品\n名句\n杜牧\n《清明》\n清明时节雨纷纷，路上行人欲断魂。\n《过华清宫》\n一骑红尘妃子笑，无人知是荔枝来。\n李商隐\n《无题·相见时难别亦难》\n春蚕到死丝方尽，蜡炬成灰泪始干。\n《无题·昨夜星辰昨夜风》\n身无彩凤双飞翼，心有灵犀一点通。"}]}], "quiz": [{"src": "真题", "stem": "下列有关文学常识和文化常识的表述，不正确的是：", "opts": {"A": "《滕王阁序》的作者王勃，与杨炯、陈子昂、骆宾王合称为“初唐四杰”，他们开创了高俊雄浑、刚健有力的新诗风", "B": "在《游褒禅山记》中感慨“世之奇伟、瑰怪、非常之观，常在于险远”的王安石是“唐宋八大家”之一", "C": "江南三大楼吸引了众多文人吟诗作赋，其中关于岳阳楼的诗文就有杜甫的《登岳阳楼》、范仲淹的《岳阳楼记》等", "D": "“待到重阳日，还来就菊花”、“遥知兄弟登高处，遍插茱萸少一人”中提及的赏菊、登高、插茱萸都是重阳节的习俗"}, "ans": "A"}, {"src": "母题", "stem": "被称为“诗仙”、“诗圣”、“诗魔”的三位唐代诗人分别是：", "opts": {"A": "李白、杜甫、白居易", "B": "杜甫、李白、李贺", "C": "李白、白居易、刘禹锡", "D": "白居易、刘禹锡、李贺"}, "ans": "A"}, {"src": "母题", "stem": "下列关于唐诗表述正确的有几项？①李白，字太白，号青莲居士，被誉为“诗圣”，是伟大的现实主义诗人②高适是我国著名的山水田园诗人，代表作有《归园田居》③初唐四杰是李白、杜甫、高适、岑参④李商隐开创了“无题”诗", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "A"}, {"src": "拓展", "stem": "“初唐四杰”是初唐文学家王勃、杨炯、卢照邻、____的并称，其中王勃", "opts": {"A": "骆宾王", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "骆宾王"}, {"src": "拓展", "stem": "李白：号____，人称“谪仙人”“诗仙”，唐代浪漫主义诗人。", "opts": {"A": "青莲居士", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "青莲居士"}, {"src": "拓展", "stem": "____：号香山居士，人称“诗魔”“诗王”，中唐现实主义诗人。", "opts": {"A": "白居易", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "白居易"}], "branches": [{"h": "1.初唐诗歌", "terms": ["骆宾王", "王勃"]}, {"h": "2.盛唐诗歌", "terms": ["王维", "诗佛", "青莲居士", "诗仙", "诗圣", "诗史"]}, {"h": "3.中唐诗歌", "terms": ["白居易", "诗魔"]}, {"h": "4.晚唐诗歌", "terms": ["小李杜", "无题诗"]}], "notes": ["初唐四杰=王勃、杨炯、卢照邻、骆宾王，王勃居首（'海内存知己，天涯若比邻''落霞与孤鹜齐飞'）。", "盛唐：王维（诗佛，苏轼评'诗中有画、画中有诗'）；李白（号青莲居士、谪仙人、诗仙，浪漫主义代表）；杜甫（号少陵野老、诗圣，现实主义，三吏三别，其诗被称'诗史'）。", "中唐：白居易（号香山居士、诗魔/诗王，长恨歌、琵琶行，与元稹倡导新乐府运动，主张'文章合为时而著，歌诗合为事而作'）；刘禹锡（诗豪，陋室铭、乌衣巷）。", "晚唐：杜牧、李商隐并称'小李杜'；李商隐创'无题诗'（锦瑟、夜雨寄北）。"]}, {"id": 58, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "宋词", "nblank": 5, "blocks": [{"type": "h2", "toks": [{"t": "1.豪放派\n豪放派创作的气象恢弘雄放，不拘守音律。代表人物有苏轼、辛弃疾、陆游等。\n苏轼：号"}, {"a": "东坡居士", "ul": 8}, {"t": "，与父苏洵、弟苏辙合称“三苏”。豪放派的开创者，代\n表作是《念奴娇》《水调歌头》《江城子》《定风波》《水龙吟》《赤壁赋》等。\n辛弃疾：别号稼轩，人称“"}, {"a": "词中之龙", "ul": 8}, {"t": "”，南宋爱国词人。与苏轼并称“苏辛”，\n与"}, {"a": "李清照", "ul": 8}, {"t": "并称“济南二安”。在文学史上第一次把金戈铁马的铿锵之声带入词，\n代表作是《鹧鸪天》《水龙吟》《青玉案·元夕》《菩萨蛮》和作品集《稼轩长\n短句》等。"}]}, {"type": "h2", "toks": [{"t": "2.婉约派\n内容侧重儿女风情，语言有柔婉之美。代表人物有柳永、李清照、秦观、晏\n殊等。\n"}, {"a": "柳永", "ul": 8}, {"t": "：原名三变，又称柳七，是第一位对宋词进行全面革新的词人，也\n是两宋词坛上创用词调最多的词人。代表作是《雨霖铃》《蝶恋花》等。\n李清照：号易安居士，创立“易安体”，有“千古第一才女”之称，也被称\n为“"}, {"a": "三瘦", "ul": 8}, {"t": "”词人。代表作有《一剪梅》《声声慢》等。\n秦观：“苏门四学士”（黄庭坚、秦观、晁补之、张耒）之一，代表作《鹊\n桥仙》等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n作品与名句"}]}, {"type": "h3", "toks": [{"t": "（1）豪放派\n人物\n代表作品名句苏轼《念奴娇·赤壁怀古》大江东去，浪淘尽，千古风流人物。\n《水调歌头·明月几时有》但愿人长久，千里共婵娟。\n《和董传留别》粗缯大布裹生涯，腹有诗书气自华。\n辛弃疾《永遇乐·京口北固亭怀古》想当年，金戈铁马，气吞万里如虎。\n《破阵子·为陈同甫赋壮词以寄之》醉里挑灯看剑，梦回吹角连营。"}]}, {"type": "h3", "toks": [{"t": "（2）婉约派\n人物\n代表作品名句李清照《夏日绝句》生当作人杰，死亦为鬼雄。\n《醉花阴·薄雾浓云愁永昼》东篱把酒黄昏后，有暗香盈袖。\n柳永《蝶恋花·伫倚危楼风细细》衣带渐宽终不悔，为伊消得人憔悴。\n《雨霖铃·秋别》今宵酒醒何处？杨柳岸，晓风残月。\n秦观《鹊桥仙》两情若是久长时，又岂在朝朝暮暮。"}]}], "quiz": [{"src": "真题", "stem": "下列论文的主标题与副标题匹配不恰当的是：", "opts": {"A": "我欲乘风归去——苏轼豪放词的发生", "B": "春蚕到死丝方尽——李商隐无题诗浅探", "C": "常记溪亭日暮——白居易西湖美景诗赏析", "D": "美人如花隔云端——李白女性诗用典研究"}, "ans": "C"}, {"src": "母题", "stem": "宋词是宋代盛行的一种中国文学体裁，标志着宋代文学的最高成就，宋词句子有长有短，便于歌唱，因是合乐的歌词，故又称曲子词，它始于梁代，形成于唐代，而极盛于宋代。关于宋词，下列说法正确的是：", "opts": {"A": "“人比黄花瘦”是韦应物的名句", "B": "“奉旨填词”的是柳永", "C": "“樯橹灰飞烟灭”说的是官渡之战", "D": "秦观是“豪放派”的代表人物"}, "ans": "B"}, {"src": "母题", "stem": "辛弃疾有“词中之龙”之称。下列诗句不是出自于他的是：", "opts": {"A": "枯藤老树昏鸦，小桥流水人家，古道西风瘦马", "B": "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处", "C": "稻花香里说丰年，听取蛙声一片", "D": "想当年，金戈铁马，气吞万里如虎"}, "ans": "A"}, {"src": "拓展", "stem": "苏轼：号____，与父苏洵、弟苏辙合称“三苏”。", "opts": {"A": "东坡居士", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "东坡居士"}, {"src": "拓展", "stem": "辛弃疾：别号稼轩，人称“____”，南宋爱国词人。", "opts": {"A": "词中之龙", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "词中之龙"}, {"src": "拓展", "stem": "与____并称“济南二安”。", "opts": {"A": "李清照", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "李清照"}], "branches": [{"h": "1.豪放派", "terms": ["东坡居士", "词中之龙", "李清照"]}, {"h": "2.婉约派", "terms": ["柳永", "三瘦"]}], "notes": ["豪放派：苏轼（东坡居士，豪放派开创者，念奴娇·赤壁怀古、水调歌头、定风波）；辛弃疾（号稼轩、词中之龙，首把金戈铁马写入词，永遇乐·京口北固亭怀古、破阵子），二人并称'苏辛'；另有陆游。", "婉约派：柳永（原名三变、柳七，两宋创用词调最多，雨霖铃）；李清照（号易安居士、千古第一才女、'三瘦词人'、创易安体，声声慢、一剪梅、夏日绝句），与辛弃疾同为济南人并称'济南二安'；秦观（鹊桥仙，苏门四学士之一，另为黄庭坚、晁补之、张耒）。"]}, {"id": 59, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "元曲", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.元曲\n元曲四大家："}, {"a": "关汉卿", "ul": 8}, {"t": "、白朴、"}, {"a": "郑光祖", "ul": 8}, {"t": "、马致远\n"}, {"a": "关汉卿", "ul": 8}, {"t": "：被誉为“曲圣”，代表作有《窦娥冤》《拜月亭》《单刀会》等。\n郑光祖：代表作有《"}, {"a": "倩女离魂", "ul": 8}, {"t": "》等。\n"}, {"a": "白朴", "ul": 8}, {"t": "：代表作有《梧桐雨》《墙头马上》等。\n马致远：有“"}, {"a": "曲状元", "ul": 8}, {"t": "”之称。代表作有杂剧《汉宫秋》，小令《天净沙·秋\n思》被誉为“"}, {"a": "秋思之祖", "ul": 8}, {"t": "”。\n王实甫：代表作有《"}, {"a": "西厢记", "ul": 8}, {"t": "》，首次正面提出“愿普天下有情人都成眷属”\n的美好愿望。\n元曲四大悲剧：《"}, {"a": "窦娥冤", "ul": 8}, {"t": "》《汉宫秋》《"}, {"a": "梧桐雨", "ul": 8}, {"t": "》《赵氏孤儿》。"}]}, {"type": "h2", "toks": [{"t": "2.明清戏曲\n"}, {"a": "汤显祖", "ul": 8}, {"t": "：明代戏曲家，被称为“东方的莎士比亚”。代表作有“临川四梦”，\n包括《牡丹亭》（《还魂记》）《紫钗记》《南柯记》《邯郸记》。\n洪昇：清代戏曲家，代表作《"}, {"a": "长生殿", "ul": 8}, {"t": "》。\n孔尚任：清代戏曲家，代表作《"}, {"a": "桃花扇", "ul": 8}, {"t": "》，被誉为“借离合之情，写兴亡\n之感”。\n清代“戏曲双璧”：《"}, {"a": "长生殿", "ul": 8}, {"t": "》、《"}, {"a": "桃花扇", "ul": 8}, {"t": "》"}]}], "quiz": [{"src": "真题", "stem": "在中国文学史上，元曲同唐诗、宋词一样具有极高的艺术成就，下列属于元曲四大悲剧的是：①《窦娥冤》②《汉宫秋》③《赵氏孤儿》④《墙头马上》", "opts": {"A": "①②③", "B": "①②④", "C": "②③④", "D": "①③④"}, "ans": "A"}, {"src": "母题", "stem": "关于文学作品与其作者，下列对应不正确的是：", "opts": {"A": "《桃花扇》——孔尚任", "B": "《西厢记》——王实甫", "C": "《牡丹亭》——汤显祖", "D": "《汉宫秋》——关汉卿"}, "ans": "D"}, {"src": "母题", "stem": "下列人文常识中，错误的是：", "opts": {"A": "王实甫，著有《西厢记》，被称为“东方的莎士比亚”", "B": "“临川四梦”包括《牡丹亭》《紫钗记》《南柯记》《邯郸记》", "C": "初唐四杰指的是王勃、骆宾王、卢照邻、杨炯", "D": "元曲四大家包括关汉卿、郑光祖、白朴、马致远"}, "ans": "A"}, {"src": "拓展", "stem": "元曲四大家：____、白朴、郑光祖、马致远", "opts": {"A": "关汉卿", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "关汉卿"}, {"src": "拓展", "stem": "马致远：有“____”之称。", "opts": {"A": "曲状元", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "曲状元"}, {"src": "拓展", "stem": "____：明代戏曲家，被称为“东方的莎士比亚”。", "opts": {"A": "汤显祖", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "汤显祖"}], "branches": [{"h": "1.元曲", "terms": ["关汉卿", "郑光祖", "倩女离魂", "白朴", "曲状元", "秋思之祖", "西厢记"]}, {"h": "2.明清戏曲", "terms": ["汤显祖", "长生殿", "桃花扇"]}], "notes": ["元曲四大家=关汉卿（曲圣，窦娥冤、拜月亭、单刀会）、白朴（梧桐雨、墙头马上）、郑光祖（倩女离魂）、马致远（曲状元，汉宫秋、天净沙·秋思被称'秋思之祖'）；王实甫《西厢记》提出'愿普天下有情人都成眷属'，是第一个传入欧洲的中国戏剧。", "元四大悲剧=窦娥冤、汉宫秋、梧桐雨、赵氏孤儿；四大爱情剧=拜月亭、倩女离魂、墙头马上、西厢记。", "明清戏曲：汤显祖（'东方的莎士比亚'，临川四梦=牡丹亭[还魂记]、紫钗记、南柯记、邯郸记）；洪昇《长生殿》、孔尚任《桃花扇》（'借离合之情，写兴亡之感'）并称清代戏曲'双璧'。"]}, {"id": 60, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "古代小说", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.小说的雏形\n《搜神记》：东晋时期，干宝所作笔记体志怪小说集，开创了我国古代神话小\n说的先河。\n《"}, {"a": "世说新语", "ul": 8}, {"t": "》：南朝宋时期，刘义庆组织编写，是我国最早的一部文言志人小\n说集。"}]}, {"type": "h2", "toks": [{"t": "2.四大奇书与四大名著\n明代四大奇书\n《水浒传》《三国演义》《西游记》\n《"}, {"a": "金瓶梅", "ul": 8}, {"t": "》\n古代四大名著\n《"}, {"a": "红楼梦", "ul": 8}, {"t": "》\n《"}, {"a": "水浒传", "ul": 8}, {"t": "》：作者为元末明初作家施耐庵，是中国历史上第一部用古白话文\n写成的歌颂农民起义的长篇章回体小说。\n《"}, {"a": "三国演义", "ul": 8}, {"t": "》：作者为元末明初作家罗贯中，我国第一部长篇历史小说，章回\n体小说的开山之作。\n《"}, {"a": "西游记", "ul": 8}, {"t": "》：作者为明代作家吴承恩，属于浪漫主义神话小说，开辟了神魔\n长篇章回小说的新门类。鲁迅评价其“神魔皆有人情，精魅亦通世故”。\n《金瓶梅》：作者署名兰陵笑笑生。中国明代长篇白话世情小说，中国第一部\n"}, {"a": "文人独立创作", "ul": 16}, {"t": "的章回体长篇小说，小说“寄意于时俗”，被誉为“四大奇书\n之首”。\n《红楼梦》：作者清代曹雪芹，原名《"}, {"a": "石头记", "ul": 8}, {"t": "》《风月宝鉴》《金陵十二钗》\n等，成书于乾隆年间，被誉为“封建社会的百科全书”，中国最具文学成就的古\n典小说及章回小说的"}, {"a": "巅峰之作", "ul": 8}, {"t": "。《红楼梦》第一回中写到“满纸荒唐言，一把辛\n酸泪。都云作者痴，谁解其中味？”“字字看来皆是血，"}, {"a": "十年辛苦", "ul": 8}, {"t": "不寻常”出自\n曹雪芹的《回前诗》，是曹雪芹自己对《红楼梦》的评说。"}]}, {"type": "h2", "toks": [{"t": "3.其他明清小说\n《"}, {"a": "聊斋志异", "ul": 8}, {"t": "》：又名《鬼狐传》，作者清代"}, {"a": "蒲松龄", "ul": 8}, {"t": "，中国古典文言短篇小说\n之巅峰。老舍评价“鬼狐有性格，笑骂成文章”，郭沫若评价“写鬼写妖高人一\n等，刺贪刺虐入木三分”。\n《"}, {"a": "儒林外史", "ul": 8}, {"t": "》：作者清代吴敬梓，我国文学史上杰出的现实主义的章回体长篇\n讽刺小说。《"}, {"a": "范进中举", "ul": 8}, {"t": "》是其中的著名篇章。"}]}], "quiz": [{"src": "真题", "stem": "“文不甚深，言不甚俗”和“字字写来都是血，十年辛苦不寻常”分别讲的是中国古典文学中的：", "opts": {"A": "《三国演义》《红楼梦》", "B": "《水浒传》《红楼梦》", "C": "《金瓶梅》《桃花扇》", "D": "《西游记》《聊斋志异》"}, "ans": "A"}, {"src": "母题", "stem": "下列文学常识错误的是：", "opts": {"A": "《水浒传》是一部以北宋末年宋江起义为题材的长篇白话小说", "B": "《三国演义》是我国第一部长篇章回体小说，描写了三国时期的历史故事，集中表现了统治集团之间的政治和军事斗争", "C": "《西游记》是我国古代第一部浪漫主义章回体神魔小说", "D": "《红楼梦》又名《石头记》《桃花扇》，是我国古代小说的顶峰之作"}, "ans": "D"}, {"src": "母题", "stem": "下列关于我国古典文学名著的表述，正确的一项是：", "opts": {"A": "《搜神记》是我国最早的一部文言志人小说集，其“志怪”题材开创了古代神话小说的先河", "B": "《金瓶梅》被誉为“明代四大奇书”之首，是中国文学史上第一部由文人独立创作的长篇小说", "C": "《聊斋志异》是清朝蒲松龄用文言写成的神魔小说集，郭沫若赞其“写鬼写妖高人一等，刺贪刺虐入木三分”", "D": "《儒林外史》是明朝吴敬梓创作的章回体长篇讽刺小说，其中“范进中举”等篇章，深刻揭露了科举制度的弊病"}, "ans": "B"}, {"src": "拓展", "stem": "《____》：南朝宋时期，刘义庆组织编写，是我国最早的一部文言志人小", "opts": {"A": "世说新语", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "世说新语"}, {"src": "拓展", "stem": "____的章回体长篇小说，小说“寄意于时俗”，被誉为“四大奇书", "opts": {"A": "文人独立创作", "B": "彩陶文化", "C": "半坡遗址", "D": "中华五千年文明史"}, "ans": "A", "real": "文人独立创作"}, {"src": "拓展", "stem": "《____》：又名《鬼狐传》，作者清代蒲松龄，中国古典文言短篇小说", "opts": {"A": "聊斋志异", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "聊斋志异"}], "branches": [{"h": "1.小说的雏形", "terms": ["世说新语"]}, {"h": "2.四大奇书与四大名著", "terms": ["金瓶梅", "红楼梦", "水浒传", "三国演义", "西游记", "文人独立创作", "石头记"]}, {"h": "3.其他明清小说", "terms": ["聊斋志异", "蒲松龄", "儒林外史", "范进中举"]}], "notes": ["小说雏形：《搜神记》（东晋干宝，笔记体志怪小说，开神话小说先河）；《世说新语》（南朝宋刘义庆，最早的文言志人小说集）。", "明代四大奇书=水浒传、三国演义、西游记、金瓶梅；四大名著=前三者+红楼梦。《水浒传》（施耐庵）是第一部用古白话文写成的歌颂农民起义的长篇章回体小说；《三国演义》（罗贯中）是第一部长篇历史小说、章回体小说开山之作；《西游记》（吴承恩）开辟神魔长篇章回小说门类；《金瓶梅》（兰陵笑笑生）是第一部文人独立创作的长篇白话世情章回小说、四大奇书之首。", "《红楼梦》（曹雪芹，又名石头记）被誉为'中国封建社会百科全书'，是古典小说和章回小说的巅峰；《聊斋志异》（蒲松龄，文言短篇小说巅峰，郭沫若题'写鬼写妖高人一等，刺贪刺虐入木三分'）；《儒林外史》（吴敬梓，长篇讽刺小说，范进中举）。"]}, {"id": 61, "part": "常识判断", "pian": "文史常识", "zhang": "文学常识", "jie": "", "kind": "zsd", "title": "史学著作", "nblank": 14, "blocks": [{"type": "table", "ncol": 4, "head": [[{"t": "体裁"}], [{"t": "著作"}], [{"t": "作者"}], [{"t": "地位"}]], "rows": [[{"toks": [{"t": "编年体"}], "span": 3}, {"toks": [{"t": "《"}, {"a": "春秋", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "孔子"}], "span": 0}, {"toks": [{"t": "第一部编年体史书"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "《"}, {"a": "左传", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "左丘明"}], "span": ": "《国语》是第一部国别体史书，由司马迁编撰"}, "ans": "B"}, {"src": "拓展", "stem": "西汉司马迁编撰，是我国第一部____通史、“二十四史”之首，记载了", "opts": {"A": "纪传体", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "纪传体"}, {"src": "拓展", "stem": "全书包括十二____（帝王言行政绩）、三十世家（记述子孙世袭的", "opts": {"A": "本纪", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "本纪"}, {"src": "拓展", "stem": "2.史学双璧：《____》和《资治通鉴》。", "opts": {"A": "史记", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "史记"}], "branches": [{"h": "要点", "terms": ["春秋", "左传", "资治通鉴", "史记", "汉书", "国语"]}, {"h": "1.《史记》", "terms": ["纪传体", "西汉武帝", "本纪", "世家"]}, {"h": "2.史学双璧：《", "terms": ["史记", "资治通鉴"]}, {"h": "3.前四史：《", "terms": ["史记", "三国志"]}], "notes": ["编年体（按时间）：《春秋》（孔子修订，第一部编年体史书）、《左传》（左丘明，第一部叙事详备的编年体）、《资治通鉴》（北宋司马光，第一部编年体通史）。", "纪传体（以人物为中心）：《史记》（西汉司马迁，第一部纪传体通史）；《汉书》（东汉班固，第一部纪传体断代史）；国别体：《国语》（左丘明，第一部国别体史书）。", "《史记》记载黄帝到汉武帝约三千年历史，居二十四史之首，鲁迅誉'史家之绝唱，无韵之离骚'，宗旨'究天人之际，通古今之变，成一家之言'；130篇=十二本纪（帝王）+三十世家（王侯封国）+七十列传（人物主体）+十表+八书。史学双璧=史记+资治通鉴；前四史=史记、汉书、后汉书、三国志。"]}, {"id": 62, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代思想", "nblank": 11, "blocks": [{"type": "table", "ncol": 4, "head": [[{"t": "流派"}], [{"t": "代表人物"}], [{"t": "相关作品"}], [{"t": "主张/地位"}]], "rows": [[{"toks": [], "span": 0}, {"toks": [{"t": "孔子（"}, {"a": "至圣", "ul": 7}, {"t": "）"}], "span": 0}, {"toks": [{"t": "《论语》"}], "span": 0}, {"toks": [{"t": "礼和仁，"}, {"a": "为政以德", "ul": 8}, {"t": "创立私学，主张有教无类、"}, {"a": "因材施教", "ul": 8}], "span": 0}], [{"toks": [{"t": "儒家"}], "span": 2}, {"toks": [{"t": "孟子（"}, {"a": "亚圣", "ul": 7}, {"t": "）"}], "span": 0}, {"toks": [{"t": "《孟子》"}], "span": 0}, {"toks": [{"t": "仁政、"}, {"a": "民贵君轻", "ul": 8}, {"t": "、性善论"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "荀子（后圣）"}], "span": 0}, {"toks": [{"t": "《荀子》"}], "span": 0}, {"toks": [{"t": "礼法并用、天行有常、制天命而用之、"}, {"a": "君舟民水", "ul": 8}, {"t": "、性恶论"}], "span": 0}], [{"toks": [{"t": "道家"}], "span": 2}, {"toks": [{"t": "老子"}], "span": 0}, {"toks": [{"t": "《道德经》"}], " 无类、因材施教）；孟子（亚圣，仁政、民贵君轻、性善论）；荀子（礼法并用、'制天命而用之'、君舟民水、性恶论）。", "道家：老子（《道德经》，道是万物本源、无为而治）；庄子（逍遥游、内圣外王）。墨家：墨子（兼爱、非攻、尚贤、节用）。法家：韩非（以法治国、中央集权）、商鞅（重农抑商、严刑峻法、军功授爵）。兵家：孙武（兵圣，《孙子兵法》世界最早军事著作、兵学圣典；注意不是孙膑）。名家：公孙龙（白马非马）。", "汉代董仲舒：'罢黜百家，独尊儒术'、三纲五常（天人三策、春秋繁露）。", "【对应记忆】全面深化改革→法家；节约优先→墨家节用；人与自然和谐共生→道家天人合一；以人民为中心→儒家仁政。"]}, {"id": 63, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代科技", "nblank": 17, "blocks": [{"type": "h2", "toks": [{"t": "1.四大发明\n造纸术：东汉宦官"}, {"a": "蔡伦", "ul": 8}, {"t": "于105 年改进造纸术，制造植物纤维纸。\n印刷术："}, {"a": "北宋", "ul": 8}, {"t": "毕昇利用胶泥发明活字印刷术，比欧洲早400 年。\n指南针：北宋时，指南针开始应用于"}, {"a": "航海", "ul": 8}, {"t": "。南宋时，指南针经传入欧洲。\n火药：唐朝时，发明了火药。"}, {"a": "南宋", "ul": 8}, {"t": "时发明了“突火枪”。"}]}, {"type": "h2", "toks": [{"t": "2.农业和手工业著作\n《"}, {"a": "氾胜之书", "ul": 8}, {"t": "》：西汉晚期的一部重要农学著作，一般认为是我国最早的一部农\n书。\n《"}, {"a": "齐民要术", "ul": 8}, {"t": "》：北魏贾思勰著，是现存最早最完整的农书，被誉为“中国古代\n农业百科全书”。\n《王祯农书》：元朝王祯著，在介绍农业生产工具方面极具特色。\n《"}, {"a": "农政全书", "ul": 8}, {"t": "》：明末徐光启著，提出了治国治民的“农政”思想。\n《"}, {"a": "梦溪笔谈", "ul": 8}, {"t": "》：北宋"}, {"a": "沈括", "ul": 8}, {"t": "著，被称为“中国科学史上里程碑”。\n《"}, {"a": "天工开物", "ul": 8}, {"t": "》：明末清初宋应星所著，被誉为“17 世纪中国工艺百科全书”。"}]}, {"type": "h2", "toks": [{"t": "3.天文历法"}]}, {"type": "h3", "toks": [{"t": "（1）中国古代天文历法成就\n《太初历》："}, {"a": "汉武帝", "ul": 8}, {"t": "时，制定出中国第一部较完整的历书《太初历》，开始以"}, {"a": "正月", "ul": 8}, {"t": "为岁首，正式把"}, {"a": "二十四节气", "ul": 16}, {"t": "定于历法。\n《大明历》：南北朝时期"}, {"a": "祖冲之", "ul": 8}, {"t": "创制，首次引入了“"}, {"a": "岁差", "ul": 8}, {"t": "”的概念。\n《大衍历》：唐朝僧一行制订，是用科学方法实测地球"}, {"a": "子午线", "ul": 8}, {"t": "长度的创始人。\n《授时历》：元朝"}, {"a": "郭守敬", "ul": 8}, {"t": "主持全国范围的天文测量，编《授时历》。"}]}, {"type": "h3", "toks": [{"t": "（2）天干地支\n干支纪年法萌芽于西汉初年，通行于东汉以后，是我国古代一直沿用的纪年法。\n天干：甲、乙、丙、丁、戊、己、庚、辛、壬、癸。\n地支：子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n干支纪年法的计算"}]}, {"type": "h2", "toks": [{"t": "1.计算天干\n公式：（年份-3）÷10，取余数。\n对应：余数是几，就对应天干的第几位。若余数为0，则对应第10 位“癸”。"}]}, {"type": "h2", "toks": [{"t": "2.计算地支\n公式：（年份-3）÷12，取余数。\n对应：余数是几，就对应地支的第几位。若余数为0，则对应第12 位“亥”。"}]}], "quiz": [{"src": "真题", "stem": "下列关于我国古代四大发明的表述，正确的是：", "opts": {"A": "西汉时期蔡伦改进了造纸术", "B": "隋唐时期已经有了活字印刷的书籍", "C": "唐朝时期发明了管形火器“突火枪”", "D": "宋代在航海交通上已普遍使用了指南针"}, "ans": "D"}, {"src": "母题", "stem": "关于我国古代天文学成就，下列说法正确的是：", "opts": {"A": "汉武帝时，制定出中国第一部较完整的历书《太初历》", "B": "祖冲之创制的《大明历》，正式把二十四节气定于历法", "C": "唐朝僧人僧一行，制订《大衍历》首次引入了“岁差”的概念", "D": "元代郭守敬编《授时历》，用科学方法实测地球子午线长度"}, "ans": "A"}, {"src": "母题", "stem": "下列作者与作品对应错误的是：", "opts": {"A": "《农政全书》——徐光启", "B": "《天工开物》——宋应星", "C": "《梦溪笔谈》——沈括", "D": "《齐民要术》——李时珍"}, "ans": "D"}, {"src": "拓展", "stem": "造纸术：东汉宦官____于105 年改进造纸术，制造植物纤维纸。", "opts": {"A": "蔡伦", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "蔡伦"}, {"src": "拓展", "stem": "《____》：北魏贾思勰著，是现存最早最完整的农书，被誉为“中国古代", "opts": {"A": "齐民要术", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "齐民要术"}, {"src": "拓展", "stem": "《太初历》：____时，制定出中国第一部较完整的历书《太初历》，开始以正月为岁首，正式把二十四节气定于历法。", "opts": {"A": "汉武帝", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "汉武帝"}], "branches": [{"h": "1.四大发明", "terms": ["蔡伦", "北宋", "航海", "南宋"]}, {"h": "2.农业和手工业著作", "terms": ["氾胜之书", "齐民要术", "农政全书", "梦溪笔谈", "沈括", "天工开物"]}, {"h": "3.天文历法", "terms": ["汉武帝", "正月", "二十四节气", "祖冲之", "岁差", "子午线", "郭守敬"]}], "notes": ["四大发明：东汉蔡伦105年改进造纸术（植物纤维纸）；北宋毕昇发明胶泥活字印刷术（比欧洲早约400年，唐代是雕版印刷）；北宋指南针应用于航海、南宋经阿拉伯传欧洲；火药唐代出现（与炼丹有关）、南宋有突火枪。", "农书/科技著作：《氾胜之书》（西汉末，最早农书）；《齐民要术》（北魏贾思勰，现存最早最完整农书、'中国古代农业百科全书'）；《王祯农书》（元，以农具图谱为特色）；《农政全书》（明末徐光启）；《梦溪笔谈》（北宋沈括，'中国科学史上的里程碑'）；《天工开物》（明末清初宋应星，'17世纪中国工艺百科全书'）。", "历法：《太初历》（汉武帝，第一部较完整历法、以正月为岁首、二十四节气定入历法）；《大明历》（南北朝祖冲之，首次引入岁差）；《大衍历》（唐僧一行，首次科学实测地球子午线长度）；《授时历》（元郭守敬主持）。", "干支纪年：天干10个、地支12个；天干序号=（年份-3）÷10取余数（余0取第10个'癸'），地支=（年份-3）÷12取余数（余0取第12个'亥'）。"]}, {"id": 64, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代医学", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.中国古代著名医药学家\n扁鹊：战国时期，发明了"}, {"a": "望、闻、问、切", "ul": 8}, {"t": "四诊法，著有《"}, {"a": "难经", "ul": 8}, {"t": "》，被称为“"}, {"a": "脉学之宗", "ul": 8}, {"t": "”\n“医祖”。\n华佗：东汉末年，发明"}, {"a": "麻沸散", "ul": 8}, {"t": "，创编了五禽戏（模仿"}, {"a": "虎、鹿、熊、猿、鸟", "ul": 16}, {"t": "），\n被誉为“外科鼻祖”“外科圣手”。\n张仲景：东汉末年，著有《"}, {"a": "伤寒杂病论", "ul": 16}, {"t": "》，确立了中医“辨证论治”\n的基本原则，被称为“"}, {"a": "医圣", "ul": 8}, {"t": "”。\n孙思邈：唐朝时期，著有《"}, {"a": "千金方", "ul": 8}, {"t": "》，首次主张妇、儿疾病单独设科，被\n称为“"}, {"a": "药王", "ul": 8}, {"t": "”。\n"}, {"a": "宋慈", "ul": 8}, {"t": "：南宋时期，著有《洗冤集录》，开创了“法医鉴定学”，被称为\n“世界法医学鼻祖”。"}]}, {"type": "h2", "toks": [{"t": "2.医学名著\n传统医学四大经典：《黄帝内经》《难经》《神农本草经》《伤寒杂病论》。\n《"}, {"a": "黄帝内经", "ul": 8}, {"t": "》：战国问世，是中国最早的医学典籍，由《素问》和《灵枢》两\n部分组成，提出“不治已病治未病”的著名观点，奠定了中医的理论基础。\n《"}, {"a": "神农本草经", "ul": 16}, {"t": "》：东汉时期编修，是中国第一部完整的药物学著作。\n《"}, {"a": "伤寒杂病论", "ul": 14}, {"t": "》：我国第一部临床治疗学方面的巨著，被誉为“万世宝典”。\n《唐本草》：唐高宗时期编修，是世界上最早的由国家颁行的药典。\n《本草纲目》：明朝"}, {"a": "李时珍", "ul": 8}, {"t": "所著，全面总结了16 世纪以前的中国医药学，\n被誉为“"}, {"a": "东方医药巨典", "ul": 16}, {"t": "”。"}]}], "quiz": [{"src": "真题", "stem": "中国古代医学成就颇丰，曾诞生了许多著名的中医人物。下列人物与称号对应正确的是：", "opts": {"A": "华佗——医圣", "B": "张仲景——药王", "C": "孙思邈——外科鼻祖", "D": "扁鹊——医祖"}, "ans": "D"}, {"src": "母题", "stem": "下列关于中国古代医学成就的表述，正确的是：", "opts": {"A": "《黄帝内经》是东汉编订的药物学著作，奠定中医理论基础", "B": "《伤寒杂病论》是西汉时期的临床治疗学巨著，被誉为“万世宝典”", "C": "《唐本草》是世界上最早由国家颁行的药典，编订于唐朝", "D": "《本草纲目》由李时珍撰写，全面总结了17 世纪以前的中国医药学"}, "ans": "C"}, {"src": "母题", "stem": "下列不属于东汉末年医学成就的是：", "opts": {"A": "使用麻沸散进行外科手术", "B": "创编了医疗体操五禽戏", "C": "编写临床医学名著《伤寒杂病论》", "D": "提出“防重于治”的医疗思想"}, "ans": "D"}, {"src": "拓展", "stem": "扁鹊：战国时期，发明了望、闻、问、切四诊法，著有《____》，被称为“脉学之宗”", "opts": {"A": "难经", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "难经"}, {"src": "拓展", "stem": "的基本原则，被称为“____”。", "opts": {"A": "医圣", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "医圣"}, {"src": "拓展", "stem": "《____》：东汉时期编修，是中国第一部完整的药物学著作。", "opts": {"A": "神农本草经", "B": "彩陶文化", "C": "半坡遗址", "D": "玉猪龙"}, "ans": "A", "real": "神农本草经"}], "branches": [{"h": "1.中国古代著名医药学家", "terms": ["难经", "脉学之宗", "麻沸散", "伤寒杂病论", "医圣", "千金方", "药王"]}, {"h": "2.医学名著", "terms": ["黄帝内经", "神农本草经", "伤寒杂病论", "李时珍", "东方医药巨典"]}], "notes": ["名医：扁鹊（战国，望闻问切四诊法，脉学之宗/医祖，《难经》）；华佗（东汉末，麻沸散、五禽戏[虎鹿熊猿鸟]，外科鼻祖）；张仲景（东汉末，《伤寒杂病论》、辨证论治，医圣）；孙思邈（唐，《千金方》，首主张妇儿单独设科，药王）；宋慈（南宋，《洗冤集录》开创法医鉴定学，世界法医学鼻祖）。", "四大经典=黄帝内经、难经、神农本草经、伤寒杂病论：《黄帝内经》（战国问世，最早医学典籍，'不治已病治未病'奠定理论基础）；《神农本草经》（东汉，第一部完整药物学专著）；《唐本草》（唐高宗时，世界最早由国家颁行的药典）；《本草纲目》（明李时珍，'东方医药巨典'，总结16世纪以前中医药）。"]}, {"id": 65, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代称谓", "nblank": 16, "blocks": [{"type": "h2", "toks": [{"t": "1.年龄称谓\n垂髫：三四岁到八九岁\n而立之年：三十岁\n总角：八九岁到十三四岁\n"}, {"a": "不惑", "ul": 8}, {"t": "之年：四十岁\n"}, {"a": "束发", "ul": 8}, {"t": "：十五岁左右\n"}, {"a": "知天命", "ul": 8}, {"t": "之年：五十岁\n豆蔻年华：女子"}, {"a": "十三四", "ul": 8}, {"t": "岁\n耳顺（花甲）："}, {"a": "六十", "ul": 8}, {"t": "岁\n"}, {"a": "及笄", "ul": 8}, {"t": "之年：女子十五岁\n古稀之年：七十岁\n弱冠：男子"}, {"a": "二十", "ul": 8}, {"t": "岁\n耄耋之年：八九十岁"}]}, {"type": "h2", "toks": [{"t": "2.对人称谓\n古时常见按兄弟长幼排行分别命名为"}, {"a": "伯", "ul": 8}, {"t": "（孟）、仲、"}, {"a": "叔", "ul": 8}, {"t": "、季。"}]}, {"type": "h2", "toks": [{"t": "3.其他称谓\n人/事/物\n称谓\n人/事/物\n称谓\n"}, {"a": "月亮", "ul": 8}, {"t": "\n银钩、玉钩、玉弓、玉轮、银盘\n蟾宫、桂宫、广寒、婵娟、望舒\n银河\n天河、天汉、星汉\n星河、银浦、云汉\n百姓\n黎民、黔首、布衣、庶民\n苍生、生民、黎庶、白丁\n"}, {"a": "酒", "ul": 8}, {"t": "\n杜康、香蚁、浮蚁、绿蚁\n忘忧物、般若汤、浊贤\n朝廷\n庙堂\n故乡\n"}, {"a": "桑梓", "ul": 8}, {"t": "\n绘画\n丹青\n音乐\n丝竹\n女性\n巾帼\n男性\n须眉\n生女儿\n"}, {"a": "弄瓦之喜", "ul": 8}, {"t": "\n生儿子\n"}, {"a": "弄璋之喜", "ul": 8}, {"t": "\n博学的人\n鸿儒\n平民\n白丁\n俘虏\n南冠\n行医\n悬壶\n出嫁\n"}, {"a": "于归", "ul": 8}, {"t": "\n送别\n"}, {"a": "折柳", "ul": 8}, {"t": "\n老师\n先生、夫子、师傅\n学生\n桃李、受业、高足"}]}], "quiz": [{"src": "真题", "stem": "关于古代称谓，下列说法错误的是：", "opts": {"A": "百姓称为“黎庶”“布衣”等", "B": "帝王自称“寡人””官家”等", "C": "表达谦虚的自称有“不才”“鄙人”等", "D": "对尊长者的敬称有“夫子”“先生”等"}, "ans": "B"}, {"src": "母题", "stem": "下列诗词中均有古人对不同年龄人的称谓，按其年龄大小排序正确的是：①娉娉袅袅十三余，豆蔻梢头二月初②忆垂髫、留连节物，逢场游戏③妾年将及笄，嫁与东家儿④弱冠投边急，驱兵夜渡河", "opts": {"A": "①②③④", "B": "①③②④", "C": "②④①③", "D": "②①③④"}, "ans": "D"}, {"src": "母题", "stem": "下列诗文中不包含月亮别称的是：", "opts": {"A": "古曜半升箕斗隐，金乌起灭海山头", "B": "万丈广寒难得到，嫦娥今夜落谁家", "C": "谁为须张烛，凉空有望舒", "D": "但愿人长久，千里共婵娟"}, "ans": "A"}, {"src": "拓展", "stem": "____之年：四十岁", "opts": {"A": "不惑", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "不惑"}, {"src": "拓展", "stem": "____之年：五十岁", "opts": {"A": "知天命", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "知天命"}, {"src": "拓展", "stem": "耳顺（花甲）：____岁", "opts": {"A": "六十", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "六十"}], "branches": [{"h": "1.年龄称谓", "terms": ["不惑", "束发", "知天命", "十三四", "六十", "及笄", "二十"]}, {"h": "3.其他称谓", "terms": ["月亮", "桑梓", "弄瓦之喜", "弄璋之喜", "于归", "折柳"]}], "notes": ["年龄称谓：垂髫（3–4到8–9岁）、总角（8–9到13–14）、束发（15岁左右）、豆蔻（女13–14）、及笄（女15）、弱冠（男20）、而立30、不惑40、知天命50、耳顺/花甲60、古稀70、耄耋80–90；兄弟排行伯（孟）仲叔季。", "代称：月亮=蟾宫、桂宫、广寒、婵娟、玉盘、望舒；银河=天河、天汉、星汉、云汉；百姓=黎民、黔首、布衣、庶民、苍生、白丁；酒=杜康、绿蚁、忘忧物、浊贤；故乡=桑梓；绘画=丹青；音乐=丝竹；女=巾帼、男=须眉；生女=弄瓦之喜、生男=弄璋之喜；博学鸿儒/平民白丁；俘虏=南冠；行医=悬壶；出嫁=于归；送别=折柳；学生=桃李、高足、受业。"]}, {"id": 66, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代建筑", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.北京故宫\n又称紫禁城，是"}, {"a": "明清", "ul": 8}, {"t": "两代的皇家宫殿，始建于"}, {"a": "明成祖", "ul": 8}, {"t": "时期。这是世界\n上现存规模最大、最完整的古代木构建筑群，被誉为“世界五大宫之首”。\n紫禁城内的建筑分为外朝和内廷两部分。外朝的中心为"}, {"a": "太和殿", "ul": 8}, {"t": "、中和殿、\n保和殿，统称三大殿，是举行大典的政治中心。"}, {"a": "内廷", "ul": 8}, {"t": "的中心是乾清宫、交泰\n殿、坤宁宫，统称后三宫，是皇帝与后妃的生活区。"}]}, {"type": "h2", "toks": [{"t": "2.北京天坛\n明清两代皇帝“祭天”和“"}, {"a": "祈谷", "ul": 8}, {"t": "”的场所，始建于明成祖时期。分为内\n坛和外坛，坛域北圆南方，寓意“天圆地方”。核心建筑"}, {"a": "祈年殿", "ul": 8}, {"t": "，是孟春祈谷\n的专用建筑。这是中国现存最大的古代"}, {"a": "祭祀性", "ul": 8}, {"t": "建筑群。"}]}, {"type": "h2", "toks": [{"t": "3.承德避暑山庄\n始建于清朝"}, {"a": "康熙", "ul": 8}, {"t": "年间，历经康熙、雍正、乾隆三朝建成。这是中国现存\n最大的古代皇家园林，也是中国四大名园之一，被誉为“中国地理形貌之缩影”\n和“中国古典园林之最高范例”。"}]}, {"type": "h2", "toks": [{"t": "4.布达拉宫\n位于拉萨市区西北玛布日山上，初建于"}, {"a": "松赞干布", "ul": 8}, {"t": "时期，后毁于战火。现存建\n筑主要为五世达赖喇嘛时期重建，由红宫（居中，宗教功能）和白宫（横贯两翼，\n政治与生活功能）组成。这是世界上海拔最高，集宫殿、城堡、寺院于一体的宏\n伟建筑，被誉为“世界屋脊上的明珠”。"}]}, {"type": "h2", "toks": [{"t": "5.苏州园林\n以拙政园、留园为代表，以山水意境为核心，通过叠山、理水、花木、建筑、\n诗画等元素，在有限空间内营造“咫尺山林”的自然意境，是“文人写意山水园”\n的典范。"}]}, {"type": "h2", "toks": [{"t": "6.赵州桥\n又名安济桥，"}, {"a": "隋朝", "ul": 8}, {"t": "工匠李春设计建造，是世界上现存年代最久远、跨度\n最大、保存最完整的"}, {"a": "单孔敞肩", "ul": 8}, {"t": "石拱桥。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n建筑元素"}]}, {"type": "h2", "toks": [{"t": "1.华表：古代宫殿、陵墓等大型建筑物前面做装饰用的巨大石柱。"}]}, {"type": "h2", "toks": [{"t": "2.牌楼：用于表彰、纪念、装饰、标识和导向的一种建筑物，而且又多建于\n宫苑、寺观、陵墓、祠堂、衙署和街道路口等地方。"}]}, {"type": "h2", "toks": [{"t": "3.水榭：建于水边或水上的亭台，以供游客休息、观赏风景的中国传统式建筑。"}]}, {"type": "h2", "toks": [{"t": "4.影壁：也称作照壁，是古代寺庙、宫殿、官府衙门和深宅大院前的一种建\n筑，即门外正对大门以作屏障的墙壁。"}]}, {"type": "h2", "toks": [{"t": "5.城阙：城门两旁的瞭望阁楼。"}]}], "quiz": [{"src": "真题", "stem": "中国古建筑群是中华民族智慧的结晶。下列相关叙述正确的是：", "opts": {"A": "承德避暑山庄始建于清雍正皇帝在位时期", "B": "北京故宫是中国元明清时期的皇家宫殿，旧称紫禁城", "C": "因县治和府治同在一座城内，故平遥古城是典型的“城套城”风格", "D": "孔府、孔庙、孔林，统称曲阜“三孔”，孔林是孔子家族的专用墓地"}, "ans": "D"}, {"src": "母题", "stem": "下列关于我国著名古代建筑的描述，正确的一项是：", "opts": {"A": "北京故宫的修建始于明成祖朱棣，天坛的修建始于明太祖朱元璋", "B": "承德避暑山庄历经康熙、雍正、乾隆三朝建成，与清代“康乾盛世”的历史进程相吻合", "C": "布达拉宫由松赞干布始建，其现存建筑的主体结构也主要保留了吐蕃时期的原貌", "D": "赵州桥由工匠李春设计建造，是唐代桥梁建筑技术成就的杰出代表"}, "ans": "B"}, {"src": "拓展", "stem": "又称紫禁城，是____两代的皇家宫殿，始建于明成祖时期。", "opts": {"A": "明清", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "明清"}, {"src": "拓展", "stem": "____的中心是乾清宫、交泰", "opts": {"A": "内廷", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "内廷"}, {"src": "拓展", "stem": "这是中国现存最大的古代____建筑群。", "opts": {"A": "祭祀性", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "祭祀性"}], "branches": [{"h": "1.北京故宫", "terms": ["明清", "明成祖", "太和殿", "内廷"]}, {"h": "2.北京天坛", "terms": ["祈谷", "祈年殿", "祭祀性"]}, {"h": "3.承德避暑山庄", "terms": ["康熙"]}, {"h": "4.布达拉宫", "terms": ["松赞干布"]}, {"h": "6.赵州桥", "terms": ["隋朝", "单孔敞肩"]}], "notes": ["北京故宫（紫禁城）：明成祖朱棣始建，现存规模最大最完整的古代木构建筑群、世界五大宫之首；外朝三大殿=太和、中和、保和（大典政治中心），内廷后三宫=乾清宫、交泰殿、坤宁宫。", "天坛：明清祭天祈谷，明成祖始建，北圆南方寓意'天圆地方'，祈年殿是现存最大古代祭祀性建筑群；承德避暑山庄（康熙始建、经康雍乾三朝，现存最大古代皇家园林、'古典园林最高范例'）；布达拉宫（松赞干布初建、现存为五世达赖重建，白宫+红宫，世界海拔最高，集宫殿城堡寺院于一体）。", "苏州园林（拙政园、留园为代表，'文人写意山水园'）；赵州桥（安济桥，隋李春，现存年代最久、跨度最大、保存最完整的单孔敞肩石拱桥）。", "建筑元素：华表（大建筑前石柱）、牌楼（表彰纪念标识）、水榭（水边亭台）、影壁（屏障）、城阙（城门两旁瞭望阁楼）。"]}, {"id": 67, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "汉字与书法", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.汉字\n起源传说：仓颉造字，被称为“造字圣人”。\n汉字六书：清代以后一般指"}, {"a": "象形", "ul": 8}, {"t": "、指事、会意、"}, {"a": "形声", "ul": 8}, {"t": "、转注、假借。\n汉字七体："}, {"a": "甲骨文", "ul": 8}, {"t": "、金文、小篆、"}, {"a": "隶书", "ul": 8}, {"t": "、草书、楷书、行书。"}]}, {"type": "h2", "toks": [{"t": "2.书法家及书法作品\n"}, {"a": "王羲之", "ul": 8}, {"t": "：东晋书法家，被称为“"}, {"a": "书圣", "ul": 8}, {"t": "”，其书法“飘若浮云，矫若惊\n龙”，代表作有《兰亭序》《黄庭经》《快雪时晴帖》等。\n楷书四家：唐朝"}, {"a": "欧阳询", "ul": 8}, {"t": "、唐朝颜真卿、唐朝柳公权、元朝"}, {"a": "赵孟頫", "ul": 8}, {"t": "。\n颜筋柳骨：颜真卿的书法和柳公权的书法。\n颠张醉素：唐朝“草圣”张旭与怀素和尚的并称，张旭的代表作是《古诗四\n帖》，怀素的代表作是《"}, {"a": "自叙帖", "ul": 8}, {"t": "》。\n宋四家：北宋时期四位书法家"}, {"a": "苏轼", "ul": 8}, {"t": "、"}, {"a": "黄庭坚", "ul": 8}, {"t": "、米芾、蔡襄的合称。\n行书代表作：王羲之的“天下第一行书”《"}, {"a": "兰亭序", "ul": 8}, {"t": "》，颜真卿的“天下第\n二行书”《"}, {"a": "祭侄文稿", "ul": 8}, {"t": "》，苏轼的“天下第三行书”《"}, {"a": "寒食帖", "ul": 8}, {"t": "》。"}]}], "quiz": [{"src": "真题", "stem": "汉字字体的演变顺序是：", "opts": {"A": "甲骨文—小篆—金文—隶书—楷书—行书—草书", "B": "甲骨文—金文—小篆—隶书—草书—楷书—行书", "C": "甲骨文—金文—小篆—隶书—楷书—行书—草书", "D": "甲骨文—金文—小篆—隶书—楷书—草书—行书"}, "ans": "B"}, {"src": "母题", "stem": "关于我国古代书法，下列说法正确的是：", "opts": {"A": "“楷书四大家”均为唐朝人", "B": "颜筋柳骨和颠张醉素擅长而闻名的字体为同一种", "C": "张旭的书法具有形体方正，笔画平直的特征", "D": "甲骨文是中国已发现的最早、体系较为完整的文字"}, "ans": "D"}, {"src": "母题", "stem": "下列有关书法常识的表述不正确的是：", "opts": {"A": "张旭被誉为“草圣”，与怀素并称“颠张醉素”", "B": "黄庭坚与赵孟頫、柳公权、欧阳询并称“楷书四大家”", "C": "王羲之的《兰亭集序》被称为“天下第一行书”", "D": "“宋四家”是中国北宋时期四位书法家苏轼、黄庭坚、米芾和蔡襄的合称"}, "ans": "B"}, {"src": "拓展", "stem": "汉字六书：清代以后一般指____、指事、会意、形声、转注、假借。", "opts": {"A": "象形", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "象形"}, {"src": "拓展", "stem": "____：东晋书法家，被称为“书圣”，其书法“飘若浮云，矫若惊", "opts": {"A": "王羲之", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "王羲之"}, {"src": "拓展", "stem": "帖》，怀素的代表作是《____》。", "opts": {"A": "自叙帖", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "自叙帖"}], "branches": [{"h": "1.汉字", "terms": ["象形", "形声", "甲骨文", "隶书"]}, {"h": "2.书法家及书法作品", "terms": ["王羲之", "书圣", "欧阳询", "赵孟頫", "自叙帖", "苏轼", "黄庭坚"]}], "notes": ["仓颉被尊为'造字圣人'；六书=象形、指事、会意、形声、转注、假借；汉字七体演变=甲骨文→金文→小篆→隶书→草书→楷书→行书。", "王羲之（东晋书圣，'飘若浮云、矫若惊龙'，兰亭序、黄庭经、快雪时晴帖）；楷书四大家=唐欧阳询、颜真卿、柳公权+元赵孟頫；'颜筋柳骨'=颜真卿+柳公权；'颠张醉素'=草圣张旭（古诗四帖）+怀素（自叙帖）；宋四家=苏轼、黄庭坚、米芾、蔡襄。", "三大行书：王羲之《兰亭序》'天下第一行书'、颜真卿《祭侄文稿》'天下第二行书'、苏轼《寒食帖》'天下第三行书'。"]}, {"id": 68, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代绘画", "nblank": 18, "blocks": [{"type": "p", "toks": [{"t": "一、著名画家及作品"}]}, {"type": "h2", "toks": [{"t": "1."}, {"a": "顾恺之", "ul": 8}, {"t": "：东晋画家，率先提出“以形写神”的绘画理论，被誉为“才绝、\n画绝、痴绝”。代表作是《女史箴图》《洛神赋图》。"}]}, {"type": "h2", "toks": [{"t": "2.展子虔：隋朝绘画大师，尤长于山水，被称为“唐画之祖”，代表作《"}, {"a": "游春图", "ul": 8}, {"t": "》\n是中国现存最古老的山水画，开创了青绿山水的先河。"}]}, {"type": "h2", "toks": [{"t": "3.阎立本：唐朝画家，代表作是《"}, {"a": "步辇图", "ul": 8}, {"t": "》《历代帝王像》。"}]}, {"type": "h2", "toks": [{"t": "4."}, {"a": "吴道子", "ul": 8}, {"t": "：唐朝画家，被尊称“画圣”，尤精于佛道、人物，长于壁画创\n作，其人物画被称作“吴带当风”。代表作是《地狱变相图》《"}, {"a": "送子天王图", "ul": 16}, {"t": "》。"}]}, {"type": "h2", "toks": [{"t": "5.韩滉：唐朝画家，代表作《"}, {"a": "五牛图", "ul": 8}, {"t": "》是中国现存最古老的纸本中国画。"}]}, {"type": "h2", "toks": [{"t": "6.顾闳中：五代十国时期南唐画家，代表作是《"}, {"a": "韩熙载夜宴图", "ul": 16}, {"t": "》。"}]}, {"type": "h2", "toks": [{"t": "7.张择端："}, {"a": "北宋", "ul": 8}, {"t": "画家，代表作是《清明上河图》，描绘北宋都城东京（又\n称汴京，今河南"}, {"a": "开封", "ul": 8}, {"t": "）的繁荣景象。"}]}, {"type": "h2", "toks": [{"t": "8.王希孟：北宋画家，代表作是《"}, {"a": "千里江山图", "ul": 16}, {"t": "》。"}]}, {"type": "h2", "toks": [{"t": "9.黄公望：元朝画家，代表作《"}, {"a": "富春山居图", "ul": 16}, {"t": "》被誉为“画中之兰亭”。"}]}, {"type": "h2", "toks": [{"t": "10.郑板桥：原名郑燮，清朝画家，一生只画兰、竹、石，自称“四时不谢之\n兰，百节长青之竹，万古不败之石，千秋不变之人”。\n二、绘画相关知识"}]}, {"type": "h2", "toks": [{"t": "1.类型"}]}, {"type": "h3", "toks": [{"t": "（1）按照题材内容分类\n可分为人物画、山水画、花鸟画三类，其中"}, {"a": "人物画", "ul": 8}, {"t": "出现时间最早。"}]}, {"type": "h3", "toks": [{"t": "（2）按照表现技法分类\n"}, {"a": "工笔画", "ul": 8}, {"t": "：用笔工整细腻，刻画细致入微，追求“形似”与“神似”的统一。\n常见作品有《千里江山图》《清明上河图》《韩熙载夜宴图》《步辇图》等。\n"}, {"a": "写意画", "ul": 8}, {"t": "：用笔简练、豪放、洒脱，注重抒发主观情感，强调“神似”。常见作品有《富春山居图》等。"}]}, {"type": "h2", "toks": [{"t": "2.工具"}]}, {"type": "h3", "toks": [{"t": "（1）笔（毛笔）：分软毫（羊毫）、硬毫（狼毫）、兼毫。讲究“尖、齐、\n圆、健”四德。"}]}, {"type": "h3", "toks": [{"t": "（2）墨：主要原料为松烟或油烟，讲究“落纸如漆，色泽黑润”。"}]}, {"type": "h3", "toks": [{"t": "（3）纸（宣纸）\n生宣：吸水性强，易产生墨韵变化，适合"}, {"a": "写意画", "ul": 8}, {"t": "。\n熟宣：经胶矾处理，不吸水，适合"}, {"a": "工笔画", "ul": 8}, {"t": "。\n代表作品：《"}, {"a": "富春山居图", "ul": 16}, {"t": "》《五牛图》等。"}]}, {"type": "h3", "toks": [{"t": "（4）绢：唐代以前主要作画载体，后与纸并用。代表作品有《"}, {"a": "千里江山图", "ul": 16}, {"t": "》\n《洛神赋图》《步辇图》《清明上河图》《韩熙载夜宴图》等。"}]}, {"type": "h3", "toks": [{"t": "（5）砚：以端砚、歙砚最为名贵。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n中国十大传世名画\n《洛神赋图》《清明上河图》《富春山居图》《汉宫春晓图》《百骏图》《步\n辇图》《唐宫仕女图》《五牛图》《韩熙载夜宴图》《千里江山图》"}]}], "quiz": [{"src": "真题", "stem": "下列关于我国古代绘画说法错误的是：", "opts": {"A": "“妙手丹青”中包含两种矿物染料", "B": "《清明上河图》是纸本水墨画", "C": "“胸有成竹”是苏轼对文同的评价", "D": "“点染”是一种古代绘画技法"}, "ans": "B"}, {"src": "母题", "stem": "下列名画根据创作时间先后顺序排列正确的一组是：①《富春山居图》②《洛神赋图》③《清明上河图》④《韩熙载夜宴图》", "opts": {"A": "①②④③", "B": "③①②④", "C": "②④③①", "D": "④①②③"}, "ans": "C"}, {"src": "母题", "stem": "《中国十大传世名画》是中国美术史上的丰碑，华夏文明的巨著，是流动的历史、无声的乐章。下列有关《中国十大传世名画》的说法，正确的是：", "opts": {"A": "《清明上河图》为中国重彩仕女第一长卷", "B": "《汉宫春晓图》是北京故宫博物院的馆藏珍品", "C": "《步辇图》是唐代著名画家吴道子的作品，描绘了吐蕃赞普松赞干布为迎娶文成公主，使禄东赞来长安觐见太宗的画面", "D": "《千里江山图》是一幅既写实又富理想的山水画作品，是中国传统山水画中少见的巨制"}, "ans": "D"}, {"src": "拓展", "stem": "1.____：东晋画家，率先提出“以形写神”的绘画理论，被誉为“才绝、", "opts": {"A": "顾恺之", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "顾恺之"}, {"src": "拓展", "stem": "6.顾闳中：五代十国时期南唐画家，代表作是《____》。", "opts": {"A": "韩熙载夜宴图", "B": "彩陶文化", "C": "半坡遗址", "D": "中华五千年文明史"}, "ans": "A", "real": "韩熙载夜宴图"}, {"src": "拓展", "stem": "____：用笔工整细腻，刻画细致入微，追求“形似”与“神似”的统一。", "opts": {"A": "工笔画", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "工笔画"}], "branches": [{"h": "1.", "terms": ["顾恺之"]}, {"h": "2.展子虔：隋朝绘画大师，尤长于山水，被称为“唐画之祖”，代表作《", "terms": ["游春图"]}, {"h": "3.阎立本：唐朝画家，代表作是《", "terms": ["步辇图"]}, {"h": "4.", "terms": ["吴道子", "送子天王图"]}, {"h": "5.韩滉：唐朝画家，代表作《", "terms": ["五牛图"]}, {"h": "6.顾闳中：五代十国时期南唐画家，代表作是《", "terms": ["韩熙载夜宴图"]}, {"h": "7.张择端：", "terms": ["北宋", "开封"]}, {"h": "8.王希孟：北宋画家，代表作是《", "terms": ["千里江山图"]}, {"h": "9.黄公望：元朝画家，代表作《", "terms": ["富春山居图"]}, {"h": "1.类型", "terms": ["人物画", "工笔画", "写意画"]}, {"h": "2.工具", "terms": ["写意画", "工笔画", "富春山居图", "千里江山图"]}], "notes": ["名家脉络：顾恺之（东晋，以形写神、才绝画绝痴绝，女史箴图、洛神赋图）；展子虔（隋，'唐画之祖'，游春图=现存最古老山水画、开青绿山水先河）；阎立本（唐，步辇图）；吴道子（唐画圣，'吴带当风'，送子天王图）；韩滉（唐，五牛图=现存最古老纸本中国画）；顾闳中（五代，韩熙载夜宴图）；张择端（北宋，清明上河图绘汴京/今开封）；王希孟（北宋，千里江山图）；黄公望（元，富春山居图，'画中之兰亭'）；郑板桥（清郑燮，只画兰竹石）。", "题材出现顺序：人物（最早）→山水→花鸟；手法分工笔（工整细腻、重形似，如千里江山图、清明上河图）和写意（简练重神似，如富春山居图）。", "文房：笔分羊毫（软）、狼毫（硬）、兼毫，讲究尖齐圆健；纸=宣纸，生宣吸水强适写意、熟宣经胶矾不吸水适工笔（五牛图、富春山居图用熟宣/绢）；唐以前主要载体是绢；砚以端砚、歙砚名贵。十大传世名画需混眼熟记。"]}, {"id": 69, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "古代戏曲", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.剧种\n中国五大戏剧：京剧、越剧、黄梅戏、评剧、豫剧。"}]}, {"type": "h2", "toks": [{"t": "2.京剧\n地位：曾称平剧，腔调以"}, {"a": "西皮", "ul": 8}, {"t": "、二黄为主，中国戏曲三鼎甲“榜首”。\n起源："}, {"a": "乾隆", "ul": 8}, {"t": "年间，三庆、四喜、春台、和春四大徽班进京，标志着京剧\n的形成。\n表现手法：唱（唱功）、念（音乐性念白）、"}, {"a": "做", "ul": 8}, {"t": "（表演）、打（武功）。\n角色行当：生（男性）、"}, {"a": "旦", "ul": 8}, {"t": "（女性）、净、丑。\n四大名旦：梅（梅兰芳）、尚（尚小云）、程（程砚秋）、荀（荀慧生）。\n代表剧目：《"}, {"a": "霸王别姬", "ul": 8}, {"t": "》《贵妃醉酒》《空城计》《四郎探母》等。\n脸谱颜色\n人物性格\n代表戏曲人物\n"}, {"a": "红", "ul": 8}, {"t": "脸\n忠贞，英勇\n关羽、姜维\n"}, {"a": "黑", "ul": 8}, {"t": "脸\n正直无私，刚直不阿\n张飞、包拯\n绿脸\n顽强，暴躁\n程咬金\n"}, {"a": "白", "ul": 8}, {"t": "脸\n阴险，疑诈，肃煞\n曹操、高俅\n黄脸\n枭勇，凶猛\n典韦、宇文成都\n"}, {"a": "蓝", "ul": 8}, {"t": "脸\n刚强，骁勇\n单雄信、窦尔敦\n金脸、银脸\n神仙、妖怪\n二郎神、众妖怪"}]}, {"type": "h2", "toks": [{"t": "3.其他剧种\n越剧：发源于浙江嵊州，发祥于上海，多以“"}, {"a": "才子佳人", "ul": 8}, {"t": "”题材为主。代表剧\n目有《梁山伯与祝英台》《红楼梦》等。\n黄梅戏：原名黄梅调、采茶戏，起源于湖北黄梅，发展壮大于安徽安庆。代\n表剧目有《"}, {"a": "天仙配", "ul": 8}, {"t": "》《女驸马》《牛郎织女》等。\n评剧：流传于中国北方，清末在河北滦县一带的“对口莲花落”基础上形成，\n先是在河北农村流行，后进入唐山，称“ 唐山落子” 。代表剧目有\n《"}, {"a": "杨三姐告状", "ul": 16}, {"t": "》等。\n豫剧：发源于河南，是中国第一大"}, {"a": "地方剧种", "ul": 8}, {"t": "。代表剧目有《花木兰》《穆桂\n英挂帅》等。\n昆曲：发源于苏州昆山，被誉为“"}, {"a": "百戏之祖", "ul": 8}, {"t": "”。代表剧目有《"}, {"a": "牡丹亭", "ul": 8}, {"t": "》《西\n厢记》《桃花扇》《长生殿》等。"}]}], "quiz": [{"src": "真题", "stem": "短视频平台掀起“戏曲手势模仿热”，“兰花指”绕手腕的动作最可能出现在以下哪个曲目？", "opts": {"A": "京剧《空城计》", "B": "豫剧《铡美案》", "C": "越剧《赵氏孤儿》", "D": "昆曲《游园惊梦》"}, "ans": "D"}, {"src": "母题", "stem": "京剧是我国的国粹，下列关于京剧的说法正确的是：", "opts": {"A": "京剧是由北方的剧种融合而成的", "B": "京剧的脸谱分为红、白、黑、蓝和绿四类", "C": "《霸王别姬》和《贵妃醉酒》是梅派的主要代表剧目", "D": "“四大名旦”是指梅兰芳、程砚秋、尚小云和杨小楼"}, "ans": "C"}, {"src": "拓展", "stem": "地位：曾称平剧，腔调以____、二黄为主，中国戏曲三鼎甲“榜首”。", "opts": {"A": "西皮", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "西皮"}, {"src": "拓展", "stem": "代表剧目：《____》《贵妃醉酒》《空城计》《四郎探母》等。", "opts": {"A": "霸王别姬", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "霸王别姬"}, {"src": "拓展", "stem": "表剧目有《____》《女驸马》《牛郎织女》等。", "opts": {"A": "天仙配", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "天仙配"}], "branches": [{"h": "2.京剧", "terms": ["西皮", "乾隆", "霸王别姬"]}, {"h": "3.其他剧种", "terms": ["才子佳人", "天仙配", "杨三姐告状", "地方剧种", "百戏之祖", "牡丹亭"]}], "notes": ["五大戏剧=京剧、越剧、黄梅戏、评剧、豫剧。京剧曾称平剧，以西皮二黄为主要声腔，居戏曲'三鼎甲'榜首；源于乾隆年间四大徽班（三庆、四喜、春台、和春）进京；手法唱念做打，行当生旦净丑，四大名旦=梅兰芳、尚小云、程砚秋、荀慧生，代表作霸王别姬、贵妃醉酒、空城计。", "脸谱颜色：红=忠贞英勇（关羽）、黑=刚直（张飞、包拯）、绿=暴躁顽强（程咬金）、白=阴险奸诈（曹操、高俅）、黄=枭勇凶猛（典韦）、蓝=刚强骁勇（窦尔敦）、金银=神仙妖怪。", "越剧（发源于浙江嵊州、发祥于上海，多才子佳人，梁山伯与祝英台、红楼梦）；黄梅戏（起源湖北黄梅、发展于安徽安庆，天仙配、女驸马）；评剧（清末河北滦县，刘三姐告状/杨三姐告状）；豫剧（河南，第一大地方剧种，花木兰、穆桂英挂帅）；昆曲（苏州昆山，'百戏之祖'，牡丹亭、桃花扇、长生殿）。"]}, {"id": 70, "part": "常识判断", "pian": "文史常识", "zhang": "文化常识", "jie": "", "kind": "zsd", "title": "传统节日", "nblank": 5, "blocks": [{"type": "table", "ncol": 5, "head": [[{"t": "节日"}], [{"t": "日期"}], [{"t": "别称"}], [{"t": "习俗"}], [{"t": "诗词常用词语"}]], "rows": [[{"toks": [{"t": "除夕"}], "span": 0}, {"toks": [{"t": "腊月三十晚"}], "span": 0}, {"toks": [{"t": "大年夜"}], "span": 0}, {"toks": [{"t": "年夜饭、守岁"}], "span": 0}, {"toks": [{"t": "/"}], "span": 0}], [{"toks": [{"t": "春节"}], "span": 0}, {"toks": [{"t": "正月初一"}], "span": 0}, {"toks": [{"t": "新春、年节"}], "span": 0}, {"toks": [{"t": "吃饺子、拜年"}], "span": 0}, {"toks": [{"a": "元日", "ul": 5}, {"t": "、桃符、屠苏"}], "span": 0}], [{"toks": [{"t": "元宵"}], "span": 0}, {"toks": [{"t": "正月十五"}], "span": 0}, {"toks": [{"a": "上元节", "ul": 5}, {"t": "、灯节"}], "span": 0}, {"toks": [{"t": "赏花灯、吃元宵"}], "span": 0}, {"toks": [{"a": "元夕", "ul": 5}, {"t": "、灯火"}], "span": 0}], [{"toks": [{"a": "寒食", "ul": 4}], "span": 0}, {"toks": [{"t": "清明前一二日"}], "span": 0}, {"toks": [{"t": "禁烟节百五节"}], "span": 0}, {"toks": [{"t": "禁烟火、吃冷食"}], "span": 0}, {"toks": [{"t": "禁火、冷食"}], "span": 0}], [{"toks": [{"t": "清明"}], "span": 0}, {"toks": [{"t": "4月5日前后"}], "span": 0}, {"toks": [{"t": "踏青节"}], "span": 0}, {"toks": [{"t": "踏青、荡秋千、\n插柳"}], "span": 0}, {"toks": [{"t": "清明"}], "span": 0}], [{"toks": [{"t": "端午"}], "span": 0}, {"toks": [{"t": "五月初五"}], "span": 0}, {"toks": [{"t": "正阳节"}], "span": 0}, {"toks": [{"t": "吃粽子、赛龙舟"}], "span": 0}, {"toks": [{"t": "汨罗、楚江、艾草"}], "span": 0}], [{"toks": [{"t": "七夕"}], "span": 0}, {"toks": [{"t": "七月初七"}], "span": 0}, {"toks": [{"t": "乞巧节"}], "span": 0}, {"toks": [{"t": "拜织女、吃巧果"}], "span": 0}, {"toks": [{"t": "牛郎织女、鹊桥"}], "span": 0}], [{"toks": [{"t": "中秋"}], "span": 0}, {"toks": [{"t": "八月十五"}], "span": 0}, {"toks": [{"t": "拜月节"}], "span": 0}, {"toks": [{"t": "吃月饼、饮桂花酒"}], "span": 0}, {"toks": [{"t": "玉盘、明月、桂花"}], "span": 0}], [{"toks": [{"t": "重阳"}], "span": 0}, {"toks": [{"t": "九月初九"}], "span": 0}, {"toks": [{"t": "登高节重九节"}], "span": 0}, {"toks": [{"t": "吃重阳糕饮菊花酒"}], "span": 0}, {"toks": [{"a": "登高", "ul": 5}, {"t": "、茱萸、黄花"}], "span": 0}]]}], "quiz": [{"src": "真题", "stem": "下列诗句内容与传统节日对应错误的是：", "opts": {"A": "“金吾不禁夜，玉漏莫相催”——寒食节", "B": "“彩缕碧筠粽，香粳白玉团”——端午节", "C": "“此生此夜不长好，明月明年何处看”——中秋节", "D": "“桂花香馅裹胡桃，江米如珠井水淘”——元宵节"}, "ans": "A"}, {"src": "母题", "stem": "下列诗歌各表现了一个传统节日，按节日的先后，排序正确的是：①暮云收尽溢清寒，银汉无声转玉盘②绿杨带雨垂垂重，五色新丝缠角粽③尘世难逢开口笑，菊花须插满头归④乐飏湖风话鹊桥，金沙泻月任酕醄", "opts": {"A": "②④①③", "B": "①②④③", "C": "①④③②", "D": "①④②③"}, "ans": "A"}, {"src": "母题", "stem": "下列民间习俗与我国传统节日对应正确的是：①挂菖蒲、熏苍术、白芷、喝雄黄酒等②扫墓、踏青、荡秋千、插柳等③赏菊、簪菊花、放纸鹤、饮菊酒等④燃灯、赏花、观潮、设宴等", "opts": {"A": "端午节——清明节——中秋节——元宵节", "B": "清明节——寒食节——中秋节——元宵节", "C": "端午节——清明节——重阳节——中秋节", "D": "清明节——寒食节——重阳节——中秋节"}, "ans": "C"}], "branches": [{"h": "要点", "terms": ["元日", "上元节", "元夕", "寒食", "登高"]}], "notes": ["按农历时间记：除夕（腊月三十晚，守岁年夜饭）、春节（正月初一，爆竹/屠苏/桃符）、元宵（正月十五上元节，赏花灯吃元宵）、寒食（清明前一二日，禁火冷食，纪念介子推）、清明（4月5日前后，踏青插柳荡秋千）、端午（五月初五，粽子赛龙舟挂艾草，纪念屈原）、七夕（七月初七乞巧节，牛郎织女鹊桥）、中秋（八月十五拜月节，月饼桂花酒）、重阳（九月初九登高节，登高茱萸菊花酒）。"]}, {"id": 71, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "力学基础定律", "nblank": 6, "blocks": [{"type": "h2", "toks": [{"t": "1.牛顿第一定律（"}, {"a": "惯性", "ul": 8}, {"t": "定律）\n一切物体总保持匀速直线运动状态或"}, {"a": "静止", "ul": 8}, {"t": "状态，除非作用在它上面的力\n迫使它改变这种状态。第一定律表明物体具有惯性。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n体现惯性的现象\n汽车行驶时突然刹车或转弯时，乘客的身体会向与汽车相反的方向倾斜。\n发动机熄火后，车会继续向前滑行一段距离，因此需要保持车距、限速行驶。"}]}, {"type": "h2", "toks": [{"t": "2.牛顿第二定律\n物体加速度的大小跟它受到的作用力成"}, {"a": "正比", "ul": 8}, {"t": "、跟它的质量成反比，加速\n度的方向跟作用力的方向"}, {"a": "相同", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.牛顿第三定律\n两个物体之间的作用力和反作用力总是大小"}, {"a": "相等", "ul": 8}, {"t": "，方向"}, {"a": "相反", "ul": 8}, {"t": "，作用\n在同一条直线上。"}]}, {"type": "h2", "toks": [{"t": "4.万有引力定律\n任意两个质点通过连心线方向上的力相互吸引。该引力的大小与它们的质量\n乘积成正比，与它们距离的平方成反比，与两物体的化学本质或物理状态以及中\n介物质无关。"}]}], "quiz": [{"src": "真题", "stem": "下列情景中，所体现的本质与其他三项不同的是：", "opts": {"A": "纸飞机离手后，继续飞行", "B": "操场上的球滚动一定距离后停下来", "C": "人走路时被障碍绊倒会向前倾倒", "D": "用拍打法除去衣服上的灰尘"}, "ans": "B"}, {"src": "母题", "stem": "如果没有外力的作用，任何物体将保持其静止状态或匀速直线运动状态。这描述的是：", "opts": {"A": "万有引力定律", "B": "惯性定律", "C": "开普勒第一定律", "D": "运动周期定律"}, "ans": "B"}, {"src": "母题", "stem": "关于惯性的说法，错误的是：", "opts": {"A": "惯性是物体固有的属性，是一种抵抗的现象", "B": "当作用在物体上的外力为零时，惯性表现为物体保持其运动状态不变", "C": "如果在同样的外力作用下，相同加速度的物体质量越大，惯性越小", "D": "物体的惯性在任何时候、任何情况不会改变，不会消失"}, "ans": "C"}, {"src": "拓展", "stem": "1.牛顿第一定律（____定律）", "opts": {"A": "惯性", "B": "静止", "C": "正比", "D": "相同"}, "ans": "A", "real": "惯性"}, {"src": "拓展", "stem": "物体加速度的大小跟它受到的作用力成____、跟它的质量成反比，加速", "opts": {"A": "正比", "B": "惯性", "C": "静止", "D": "相同"}, "ans": "A", "real": "正比"}, {"src": "拓展", "stem": "两个物体之间的作用力和反作用力总是大小____，方向相反，作用", "opts": {"A": "相等", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "相等"}], "branches": [{"h": "1.牛顿第一定律（", "terms": ["惯性", "静止"]}, {"h": "2.牛顿第二定律", "terms": ["正比", "相同"]}, {"h": "3.牛顿第三定律", "terms": ["相等", "相反"]}], "notes": ["牛顿第一定律（惯性定律）：一切物体总保持匀速直线运动或静止状态，除非外力迫使它改变；质量越大惯性越大（刹车乘客前倾、熄火车辆仍滑行→保持车距限速）。", "第二定律F=ma：加速度与合外力成正比、与质量成反比；第三定律：作用力与反作用力等大、反向、共线，力的作用是相互的。", "万有引力F=Gm₁m₂/r²：与两物体质量乘积成正比、与距离平方成反比，与化学本质、物理状态、中介物质无关。"]}, {"id": 72, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "常见的力", "nblank": 21, "blocks": [{"type": "h2", "toks": [{"t": "1.压力\n物体间由于相互挤压而垂直作用在物体表面上的力，叫作压力。物体所受的\n压力与受力面积之比叫做压强。\n要"}, {"a": "增大", "ul": 8}, {"t": "压强，可以增大压力、减小受力面积；要"}, {"a": "减小", "ul": 8}, {"t": "压强，可以减\n小压力、增大受力面积。\n流体中流速"}, {"a": "越大", "ul": 8}, {"t": "的位置，压强"}, {"a": "越小", "ul": 8}, {"t": "；流速"}, {"a": "越小", "ul": 8}, {"t": "的位置，压强\n"}, {"a": "越大", "ul": 8}, {"t": "。\n大气压是大气产生的压强，随高度的升高而"}, {"a": "降低", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.摩擦力\n阻碍物体相对运动（或相对运动趋势）的力叫做摩擦力。\n摩擦力的方向与物体相对运动（或相对运动趋势）的方向"}, {"a": "相反", "ul": 8}, {"t": "。\n滑动摩擦力的大小与物体间的"}, {"a": "压力", "ul": 8}, {"t": "和接触面的"}, {"a": "粗糙程度", "ul": 8}, {"t": "有关，为减小摩\n擦力可以将滑动摩擦改为滚动摩擦、减小接触面的粗糙程度、减小压力。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n生活中的摩擦力现象\n机械轴承定期上油可通过减小接触面的粗糙程度来减小摩擦力。\n举重运动员手上涂防滑粉可通过增大接触面的粗糙程度来增大摩擦力。"}]}, {"type": "h2", "toks": [{"t": "3.重力\n由于地球的吸引而使物体受到的力叫做重力。重力的方向竖直向下。\n当物体做"}, {"a": "向上", "ul": 8}, {"t": "加速运动或"}, {"a": "向下", "ul": 8}, {"t": "减速运动时，物体均处于超重状态，\n即不管物体如何运动，只要具有"}, {"a": "向上", "ul": 8}, {"t": "的加速度，物体就处于超重状态。\n当物体做"}, {"a": "向下", "ul": 8}, {"t": "加速运动或"}, {"a": "向上", "ul": 8}, {"t": "减速运动时，物体均处于失重状态，\n即不管物体如何运动，只要具有"}, {"a": "向下", "ul": 8}, {"t": "的加速度，物体就处于失重状态。在太\n空中，所有物体处于失重状态。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n超重和失重\n乘坐电梯上楼时，电梯先向上做加速运动，此时人处于"}, {"a": "超重", "ul": 7}, {"t": "状态；再向上\n做匀速运动，此时人受力平衡；最后向上做减速运动，此时人处于"}, {"a": "失重", "ul": 7}, {"t": "状态。"}]}, {"type": "h2", "toks": [{"t": "4.浮力\n浸在液体中的物体受到向上的浮力，浮力的大小等于它排开的液体所受的重\n力。\n当浮力"}, {"a": "大于", "ul": 8}, {"t": "重力时，物体上浮；当浮力"}, {"a": "等于", "ul": 8}, {"t": "重力时，物体悬浮在液\n体中或者漂浮在液体表面；当浮力"}, {"a": "小于", "ul": 8}, {"t": "重力时，物体下沉。"}]}], "quiz": [{"src": "真题", "stem": "龙卷风的实质是高速旋转的气流。它能把地面上的物体或人畜“吸”起卷入空中。龙卷风能“吸”起物体是因为：", "opts": {"A": "龙卷风内部的压强远小于外部的压强", "B": "龙卷风增大了空气对物体的浮力", "C": "龙卷风使物体受到的重力变小", "D": "迷信说法中的“龙”把物体“抓”到空中"}, "ans": "A"}, {"src": "母题", "stem": "下列现象蕴含的科学常识正确的是：", "opts": {"A": "湿袜子粘在脚上很难往下脱，是因为大气压把袜子压在了脚上", "B": "如坐针毡是因为压力一定时受力面积与压强成正比", "C": "书包背带做的宽是为了增大受力面积、减小压力", "D": "空间站附近的太空压力比地球正常大气压大"}, "ans": "A"}, {"src": "母题", "stem": "摩擦力在生活中扮演了重要的角色，下列过程涉及摩擦力的是：①起床叠被子、穿衣服②吃饭使用筷子夹食物③汽车在公路上行驶④拧开汽水瓶的盖子", "opts": {"A": "①④", "B": "②③④", "C": "①②③", "D": "①②③④"}, "ans": "D"}, {"src": "拓展", "stem": "要____压强，可以增大压力、减小受力面积；", "opts": {"A": "增大", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "增大"}, {"src": "拓展", "stem": "摩擦力的方向与物体相对运动（或相对运动趋势）的方向____", "opts": {"A": "相反", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "相反"}, {"src": "拓展", "stem": "当物体做____加速运动或向上减速运动时，物体均处于失重状态，", "opts": {"A": "向下", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "向下"}], "branches": [{"h": "1.压力", "terms": ["增大", "减小", "越大", "越小", "降低"]}, {"h": "2.摩擦力", "terms": ["相反", "压力", "粗糙程度"]}, {"h": "3.重力", "terms": ["向上", "向下", "超重", "失重"]}, {"h": "4.浮力", "terms": ["大于", "等于", "小于"]}], "notes": ["压强p=F/S：增大压强=增大压力或减小受力面积（磨刀、钉子、针尖、注射器）；减小压强=减小压力或增大受力面积（坦克履带、双肩包宽带、自行车座垫）。", "伯努利原理：流体流速越大压强越小（机翼升力、地铁安全线）；大气压随高度升高而降低。", "摩擦力f=μFN，方向与相对运动（趋势）相反，大小取决于压力和粗糙程度：减小摩擦=变滑动为滚动、上润滑油；增大摩擦=增大粗糙程度（举重防滑粉、轮胎花纹）。", "超重=加速度向上（向上加速或向下减速），失重=加速度向下（向下加速或向上减速），太空完全失重（电梯上行：启动超重、匀速平衡、停前失重）。", "浮力F=ρ液gV排（等于排开液体所受重力）：浮力>重力上浮、=则悬浮或漂浮、<则下沉。"]}, {"id": 73, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "杠杆原理", "nblank": 4, "blocks": [{"type": "h2", "toks": [{"t": "1.平衡条件\n杠杆平衡时，其动力F1、动力臂L1和阻力F2、阻力臂L2之间满足关系F1L1=F2L2。"}]}, {"type": "h2", "toks": [{"t": "2.分类"}]}, {"type": "h3", "toks": [{"t": "（1）省力杠杆\n特点：动力臂"}, {"a": "较长", "ul": 8}, {"t": "，动力较小。\n示例：撬棍、扳手、钳子、拔钉器、开瓶器、钢丝钳、指甲剪等。"}]}, {"type": "h3", "toks": [{"t": "（2）费力杠杆\n特点：动力臂"}, {"a": "较短", "ul": 8}, {"t": "，动力较大。\n示例：镊子、汤勺、筷子、起重机、鱼竿、船桨、理发剪、裁缝剪、晾衣杆等。"}]}, {"type": "h3", "toks": [{"t": "（3）等臂杠杆\n特点：动力臂"}, {"a": "等于", "ul": 8}, {"t": "阻力臂。\n示例：天平、跷跷板、"}, {"a": "定滑轮", "ul": 8}, {"t": "等。"}]}], "quiz": [{"src": "真题", "stem": "下列生活用品中属于省力杠杆的是：①铡刀②钓鱼竿③镊子④手推车", "opts": {"A": "①②", "B": "②③", "C": "②④", "D": "①④"}, "ans": "D"}, {"src": "母题", "stem": "下列关于杠杆原理的表述说法正确的是：", "opts": {"A": "在使用杠杆时，为了省力，就应该使用阻力臂比动力臂长的杠杆", "B": "费力杠杆的缺点是费力费距离", "C": "铡刀属于费力杠杆", "D": "定滑轮的实质是一个等臂杠杆"}, "ans": "D"}, {"src": "母题", "stem": "杠杆原理的应用在生活中十分常见，下列选项中，________使用杠杆原理的目的与其他三项不同。", "opts": {"A": "手推车", "B": "筷子", "C": "扫帚", "D": "起重机吊臂"}, "ans": "A"}, {"src": "拓展", "stem": "特点：动力臂____，动力较小。", "opts": {"A": "较长", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "较长"}, {"src": "拓展", "stem": "特点：动力臂____，动力较大。", "opts": {"A": "较短", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "较短"}, {"src": "拓展", "stem": "特点：动力臂____阻力臂。", "opts": {"A": "等于", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "等于"}], "branches": [{"h": "2.分类", "terms": ["较长", "较短", "等于", "定滑轮"]}], "notes": ["杠杆平衡条件F₁L₁=F₂L₂。省力杠杆（动力臂长、省力费距离）：撬棍、扳手、钳子、拔钉器、开瓶器、钢丝钳、指甲剪、动滑轮、铡刀；费力杠杆（动力臂短、费力省距离）：镊子、汤勺、筷子、起重机吊臂、鱼竿、船桨、理发剪、裁缝剪、晾衣杆；等臂杠杆：天平、跷跷板、定滑轮。", "【易错】钓鱼竿对人是费力杠杆、对鱼省力（支点在手，力作用在支点同一侧方向相反）。"]}, {"id": 74, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "物态变化", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.固气转化"}]}, {"type": "h3", "toks": [{"t": "（1）凝华：物体由气态转化为固态，"}, {"a": "放热", "ul": 8}, {"t": "。如，霜、雪、"}, {"a": "雾凇", "ul": 7}, {"t": "的形成。"}]}, {"type": "h3", "toks": [{"t": "（2）升华：物体由固态转化为气态，"}, {"a": "吸热", "ul": 8}, {"t": "。如，衣柜中的樟脑丸变小。"}]}, {"type": "h2", "toks": [{"t": "2.气液转化"}]}, {"type": "h3", "toks": [{"t": "（1）液化：物体由气态转化为液态，"}, {"a": "放热", "ul": 8}, {"t": "。如，雨、露、"}, {"a": "雾", "ul": 7}, {"t": "的形成。"}]}, {"type": "h3", "toks": [{"t": "（2）汽化：物体由液态转化为气态，"}, {"a": "吸热", "ul": 8}, {"t": "。如，酒精挥发。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n汽化的两种形式——蒸发和沸腾"}]}, {"type": "h2", "toks": [{"t": "1.基本概念\n蒸发：平缓的汽化现象。\n沸腾：在液体内部和表面同时发生的剧烈汽化现象。需要具备"}, {"a": "达到沸点", "ul": 8}, {"t": "、继\n续吸热两个条件。沸点与外界压力进行"}, {"a": "同向", "ul": 8}, {"t": "变化，即压力越低，沸点越低。"}]}, {"type": "h2", "toks": [{"t": "2.异同对比"}]}, {"type": "h3", "toks": [{"t": "（1）不同点\n"}, {"a": "蒸发", "ul": 8}, {"t": "：表现较为缓慢、平和；只发生在液体表面；在"}, {"a": "任何温度", "ul": 8}, {"t": "下都能发生；\n与温度、表面积、空气流速有关。\n"}, {"a": "沸腾", "ul": 8}, {"t": "：表现剧烈；液体内部和表面同时发生；必须达到沸点才能发生；\n与液体种类、气压有关。"}]}, {"type": "h3", "toks": [{"t": "（2）相同点：都是汽化现象，都需要吸热。"}]}, {"type": "h2", "toks": [{"t": "3.液固转化"}]}, {"type": "h3", "toks": [{"t": "（1）凝固：物体由液态转化为固态，"}, {"a": "放热", "ul": 8}, {"t": "。如，水结成冰。"}]}, {"type": "h3", "toks": [{"t": "（2）熔化：物体由固态转化为液态，"}, {"a": "吸热", "ul": 8}, {"t": "。如，冰化成水。"}]}], "quiz": [{"src": "真题", "stem": "下列关于物态变化的说法，错误的是：", "opts": {"A": "夏天往饮料中加冰是因其熔化吸热", "B": "东北雾凇的形成是由于发生了凝华", "C": "冬天凝结在车窗上的雾气是液态的", "D": "沸腾和蒸发涉及的物态变化不一样"}, "ans": "D"}, {"src": "母题", "stem": "下列现象中，不属于液化现象的是：", "opts": {"A": "老式白炽灯泡用久后，灯丝会变细", "B": "皮肤接触水蒸气时会被烫伤", "C": "深秋早晨室外电线上悬挂着露珠", "D": "冬天进入温暖的室内，眼镜片会起雾"}, "ans": "A"}, {"src": "母题", "stem": "下列物态变化对应正确的是：", "opts": {"A": "蜡烛燃烧——熔化——放热", "B": "水变成水蒸气——液化——吸热", "C": "冰棍周围冒“白气”——凝华——放热", "D": "衣柜中的樟脑丸时间长了变小——升华——吸热"}, "ans": "D"}, {"src": "拓展", "stem": "（1）凝华：物体由气态转化为固态，____", "opts": {"A": "放热", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "放热"}, {"src": "拓展", "stem": "（2）汽化：物体由液态转化为气态，____", "opts": {"A": "吸热", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "吸热"}, {"src": "拓展", "stem": "在____下都能发生；", "opts": {"A": "任何温度", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "任何温度"}], "branches": [{"h": "1.固气转化", "terms": ["放热", "雾凇", "吸热"]}, {"h": "2.气液转化", "terms": ["放热", "吸热"]}, {"h": "1.基本概念", "terms": ["达到沸点", "同向"]}, {"h": "2.异同对比", "terms": ["蒸发", "任何温度", "沸腾"]}, {"h": "3.液固转化", "terms": ["放热", "吸热"]}], "notes": ["三态六变及吸放热：凝华（气→固，放热，霜、雪、雾凇）、升华（固→气，吸热，樟脑丸变小、干冰）、液化（气→液，放热，露、雨、雾，冬天哈出白气=水蒸气遇冷液化成小水滴）、汽化（液→气，吸热，酒精挥发）、凝固（液→固，水结冰）、熔化（固→液，冰化水）。", "汽化分两种：蒸发（缓慢、只在表面、任何温度下都发生，受温度/表面积/空气流速影响）和沸腾（剧烈、内部表面同时、达到沸点才发生）；气压越低沸点越低（高压锅增大气压提高沸点）。"]}, {"id": 75, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "热力学应用", "nblank": 6, "blocks": [{"type": "h2", "toks": [{"t": "1.传热方式\n热传导：不同温度的物体直接接触所发生的热能从高温向低温部分转移的现\n象。主要发生在"}, {"a": "固体", "ul": 5}, {"t": "中，在气体或液体等流体中，热传导往往和热对流同时发生。\n热对流：由于流体（"}, {"a": "液体", "ul": 8}, {"t": "或气体）的宏观运动，使冷热流体相互掺混，\n从而实现热量传递的过程。\n热辐射：物体以电磁波（主要是"}, {"a": "红外线", "ul": 8}, {"t": "）的形式向外发射能量的过程。\n"}, {"a": "不需要", "ul": 8}, {"t": "任何介质，可以在真空中传播，是在真空中"}, {"a": "最为有效", "ul": 8}, {"t": "的传热方式。"}]}, {"type": "h2", "toks": [{"t": "2.分子运动论\n一切物质的分子都在不停地做无规则的运动，这种无规则运动叫做分子的热\n运动。温度越高，热运动越"}, {"a": "剧烈", "ul": 5}, {"t": "。如，食物的腌制、气味的扩散、颜色的浸染等。"}]}, {"type": "h2", "toks": [{"t": "3.热胀冷缩\n物体受热时会膨胀，遇冷时会收缩的特性。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n生活中的热胀冷缩现象\n夏天路面会受热膨胀，使得路面向上拱起，因此混凝土路面每隔一段都留有\n空隙。\n夏天架设电线时要使其略有下垂，以防冬天电线受冷时缩短断裂。\n传统的玻璃式体温计是利用汞（水银）的热胀冷缩来测量体温。\n煮熟的鸡蛋在冷水中浸泡后更易剥壳，是因为蛋壳与蛋白遇冷收缩程度不同。"}]}], "quiz": [{"src": "真题", "stem": "用分子的运动知识解释生活中的下列现象，不合理的是：", "opts": {"A": "水结冰后，由于温度较低，分子停止运动", "B": "酒精挥发到空气中后分子间的间隔增大", "C": "由于分子在不断运动，造成非吸烟者在公共场所吸食二手烟", "D": "面包房里阵阵飘香，说明分子是运动的"}, "ans": "A"}, {"src": "母题", "stem": "热传递是物理学上的一个物理现象，主要存在三种基本形式：热传导、热辐射和热对流。在实际生活中，热以多种方式复合传导。下列表述错误的是：", "opts": {"A": "用电热水壶烧水是利用热传导和对流", "B": "午后在窗边晒太阳是利用热辐射", "C": "烧菜时，铁锅利用铁的热传导，将菜烧熟", "D": "暖气片给房间取暖是利用热辐射"}, "ans": "D"}, {"src": "母题", "stem": "下列与其他三项物理学原理不同的是：", "opts": {"A": "煤气泄露及时开窗通风", "B": "乒乓球瘪了，用开水烫恢复", "C": "刚煮熟的鸡蛋放到冷水中浸一下，更容易剥壳", "D": "修水泥路时，每隔一段距离就留个缝隙"}, "ans": "A"}, {"src": "拓展", "stem": "主要发生在____中，在气体或液体等流体中，热传导往往和热对流同时发生。", "opts": {"A": "固体", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "固体"}, {"src": "拓展", "stem": "热辐射：物体以电磁波（主要是____）的形式向外发射能量的过程。", "opts": {"A": "红外线", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "红外线"}, {"src": "拓展", "stem": "不需要任何介质，可以在真空中传播，是在真空中____的传热方式。", "opts": {"A": "最为有效", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "最为有效"}], "branches": [{"h": "1.传热方式", "terms": ["固体", "液体", "红外线", "不需要", "最为有效"]}, {"h": "2.分子运动论", "terms": ["剧烈"]}], "notes": ["热传递三方式：热传导（直接接触、高温传向低温，主要发生在固体，如壶身烫手）、热对流（流体宏观流动、冷热掺混，如冷热水循环）、热辐射（以电磁波（主要红外线）传递、不需要介质、可在真空传播，真空中最有效，如烤火、晒太阳）。", "分子热运动永不停息、无规则，温度越高越剧烈（腌制入味、气味扩散、染色）。", "热胀冷缩应用：路面留伸缩缝、电线夏天下垂防止冬天收缩拉断、水银体温计；煮好的蛋用冷水泡更好剥壳（蛋壳与蛋白收缩程度不同）。"]}, {"id": 76, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "常见的光", "nblank": 7, "blocks": [{"type": "h2", "toks": [{"t": "1.电磁波谱\n各种电磁波按波长"}, {"a": "由短到长", "ul": 8}, {"t": "或频率"}, {"a": "由高到低", "ul": 8}, {"t": "排列，依次是γ射线、X射线、\n紫外线、可见光、红外线、无线电波。电磁波谱示意图如下所示："}]}, {"type": "h2", "toks": [{"t": "2.可见光\n电磁波谱中人眼可以感知的部分，按照波长递减频率"}, {"a": "递增", "ul": 8}, {"t": "的顺序可排列\n为红橙黄绿青蓝紫。"}]}, {"type": "h2", "toks": [{"t": "3.不可见光\n除可见光外其他所有人眼所不能感知的波长的电磁波，包括无线电波、微波、\n红外光、紫外光、X射线、远红外线等。"}]}, {"type": "h2", "toks": [{"t": "4.红光\n在可见光中波长"}, {"a": "最长", "ul": 8}, {"t": "，衍射能力最强，穿透空气的能力强，传播距离远，\n比较醒目，常用于警告类的标示用色，如交通信号灯、汽车尾灯、警示信号灯。"}]}, {"type": "h2", "toks": [{"t": "5.黄光\n波长较长，具有较强的穿透能力，且人眼对黄光更为敏感，常用于表达警示，\n如交通信号灯、汽车"}, {"a": "雾灯", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "6.红外线\n波长比可见光线波长长，人眼不能看到，常用于红外探测器（感应门、电梯、\n遥控器等）、热成像仪、红外测温枪等。"}]}, {"type": "h2", "toks": [{"t": "7.紫外线\n波长比可见光线波长短，人眼不能看到，常用于"}, {"a": "杀菌", "ul": 8}, {"t": "（破坏微生物遗传\n物质）、验钞，可促进人体合成"}, {"a": "维生素D", "ul": 8}, {"t": "。自然界的主要紫外线光源是太阳。"}]}], "quiz": [{"src": "真题", "stem": "晒过的被子会有一股“阳光味”。关于“阳光味”，下列说法正确的是：", "opts": {"A": "被子上的螨虫被阳光杀死后，蛋白质焦化尸体分解的味道", "B": "多种有机物在紫外线作用下发生光化学反应形成的味道", "C": "信号经神经系统传递到人大脑皮质中枢系统产生的幻觉", "D": "由细菌分解被子上残留的汗液皮质等物质产生的味道"}, "ans": "B"}, {"src": "母题", "stem": "下列说法错误的是：", "opts": {"A": "太阳的热力主要以红外线的形式传到地球上", "B": "过量紫外线照射对人体有害", "C": "红外线是人眼看不见的光", "D": "医院和食品店常用红外线消毒"}, "ans": "D"}, {"src": "母题", "stem": "路灯在生活中随处可见，路灯灯光大都是黄光。下列说法错误的是：", "opts": {"A": "人的眼睛对黄光的敏感程度最高", "B": "黄光波长较长，穿透能力强", "C": "黄光的频率较高，容易聚光", "D": "黄光对冷光源的反射线最短"}, "ans": "C"}, {"src": "拓展", "stem": "各种电磁波按波长____或频率由高到低排列，依次是γ射线、X射线、", "opts": {"A": "由短到长", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "由短到长"}, {"src": "拓展", "stem": "电磁波谱中人眼可以感知的部分，按照波长递减频率____的顺序可排列", "opts": {"A": "递增", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "递增"}, {"src": "拓展", "stem": "如交通信号灯、汽车____", "opts": {"A": "雾灯", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "雾灯"}], "branches": [{"h": "1.电磁波谱", "terms": ["由短到长", "由高到低"]}, {"h": "2.可见光", "terms": ["递增"]}, {"h": "4.红光", "terms": ["最长"]}, {"h": "5.黄光", "terms": ["雾灯"]}, {"h": "7.紫外线", "terms": ["杀菌", "维生素D"]}], "notes": ["电磁波谱按波长由短到长（频率由高到低）：γ射线、X射线、紫外线、可见光、红外线、无线电波；波长越长穿透（绕射）能力越强、越短越容易被散射。", "可见光按波长递减：红橙黄绿青蓝紫。红光波长最长、衍射能力强、传得远→警告色（交通红灯、车尾灯）；黄光穿透能力强且人眼最敏感→雾灯；红外线人眼不可见→红外感应门/遥控器、热成像测温枪（一切高于绝对零度的物体都辐射红外）；紫外线频率高能量大→杀菌（破坏遗传物质）、验钞、促进人体合成维生素D（利于钙吸收），主要来源是太阳。"]}, {"id": 77, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "光的传播", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.直线传播\n定义：光在同种均匀介质中沿直线传播。\n应用：影子的形成、"}, {"a": "小孔成像", "ul": 8}, {"t": "、"}, {"a": "日食", "ul": 8}, {"t": "、月食、激光准直。"}]}, {"type": "h2", "toks": [{"t": "2.反射\n定义：光在两种物质分界面上改变传播方向又返回原来物质中的现象。\n应用：镜子、水面的"}, {"a": "倒影", "ul": 8}, {"t": "、月光下的水坑、潜望镜。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n镜面反射和漫反射\n镜面反射：平行光射到"}, {"a": "光滑", "ul": 8}, {"t": "表面（如镜子），反射光仍然是平行的。\n漫反射：平行光射到"}, {"a": "粗糙", "ul": 8}, {"t": "表面（如电影银幕），反射光会射向四面八方。"}]}, {"type": "h2", "toks": [{"t": "3.折射\n定义：光从一种透明介质斜射入另一种透明介质时，在两种介质的交界处传\n播方向发生改变的现象。\n应用："}, {"a": "凸透镜", "ul": 8}, {"t": "、凹透镜、水中筷子的弯折、水中鱼看上去比实际大、潭清\n疑水浅、海市蜃楼、彩虹。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n凸凹透镜与凸凹面镜\n凸透镜：对光线有"}, {"a": "会聚", "ul": 8}, {"t": "作用，主要用于"}, {"a": "放大镜", "ul": 8}, {"t": "、老花镜、照相机/投影\n仪的镜头、显微镜等。\n凹透镜：对光线有发散作用，主要用于"}, {"a": "近视眼镜", "ul": 8}, {"t": "等。\n凸面镜：对光线有"}, {"a": "发散", "ul": 8}, {"t": "作用，主要用于汽车"}, {"a": "后视镜", "ul": 8}, {"t": "，转弯镜等。\n凹面镜：对光线有会聚作用，主要用于手电筒/车灯反光罩、"}, {"a": "太阳灶", "ul": 8}, {"t": "等。"}]}, {"type": "h2", "toks": [{"t": "4.散射\n定义：光通过不均匀介质时一部分光偏离原方向传播的现象。\n应用：晴天时天空是蓝色的、雾天时光线变得朦胧、"}, {"a": "丁达尔", "ul": 8}, {"t": "现象、彩霞。"}]}], "quiz": [{"src": "真题", "stem": "下列现象与物理效应之间无法对应的一组是：", "opts": {"A": "墙内开花墙外香——扩散现象", "B": "杯弓蛇影——反射现象", "C": "镜中花，水中月——折射现象", "D": "立竿见影——光沿直线传播现象"}, "ans": "C"}, {"src": "母题", "stem": "影，是日常生活中常见的光学现象。如：在墙壁上形成的手影；在湖水中亭子的倒影；用照相机摄影；电影院里的电影等等。下列知识对应正确的是：", "opts": {"A": "手影——光的反射", "B": "水中倒影——光的直线传播", "C": "摄影——光的折射", "D": "看电影——光的散射"}, "ans": "C"}, {"src": "母题", "stem": "下列属于光的折射现象的是：①猪八戒照镜子，表里如一②从鱼缸侧面看鱼，发现鱼会变大③放满水的泳池底部看起来很浅④坐井观天，所见甚小", "opts": {"A": "①②", "B": "②③", "C": "①③", "D": "③④"}, "ans": "B"}, {"src": "拓展", "stem": "应用：影子的形成、____、日食、月食、激光准直。", "opts": {"A": "小孔成像", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "小孔成像"}, {"src": "拓展", "stem": "漫反射：平行光射到____表面（如电影银幕），反射光会射向四面八方。", "opts": {"A": "粗糙", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "粗糙"}, {"src": "拓展", "stem": "凹透镜：对光线有发散作用，主要用于____等。", "opts": {"A": "近视眼镜", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "近视眼镜"}], "branches": [{"h": "1.直线传播", "terms": ["小孔成像", "日食"]}, {"h": "2.反射", "terms": ["倒影", "光滑", "粗糙"]}, {"h": "3.折射", "terms": ["凸透镜", "会聚", "放大镜", "近视眼镜", "发散", "后视镜", "太阳灶"]}, {"h": "4.散射", "terms": ["丁达尔"]}], "notes": ["光的直线传播（同种均匀介质中）：影子、小孔成像、日食月食、激光准直；反射：镜面反射（光滑面、反射光平行，如镜子、潜望镜）与漫反射（粗糙面、反射向四方，如电影银幕）；折射：斜射入另一介质时偏折，如水中筷子弯折、潭清疑水浅、海市蜃楼、彩虹；散射：不均匀介质中偏离原方向，晴天天空呈蓝色（蓝紫光易被散射、人眼对紫光不敏感）。", "透镜光可穿过、面镜穿不过：凸透镜会聚（放大镜、老花镜、照相机/投影仪镜头），凹透镜发散（近视镜）；凸面镜发散扩大视野（汽车后视镜、转弯镜），凹面镜会聚（车灯反光罩、太阳灶）。", "近视=像成在视网膜前方，用凹透镜矫正；远视=像成在视网膜后方，用凸透镜矫正。"]}, {"id": 78, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "物理知识", "kind": "zsd", "title": "声学", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.声音的性质\n声音是由物体振动产生的声波。\n通常用音色、音调和响度来衡量声音的性质。"}, {"a": "音色", "ul": 8}, {"t": "的差别取决于发声体\n的不同材料和结构，"}, {"a": "音调", "ul": 8}, {"t": "的高低取决于发声体振动的频率，"}, {"a": "响度", "ul": 8}, {"t": "的大小\n取决于发声体振动的振幅。\n声音的强度用"}, {"a": "分贝", "ul": 8}, {"t": "（dB）来衡量。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n声音性质的表现\n闻其声而知其人，原因在于每个人的音色不同。\n男高音、男中音、男低音的核心区别在于音调不同。\n震耳欲聋形容的是声音的响度很大。"}]}, {"type": "h2", "toks": [{"t": "2.声音的传播\n声音的传播需要"}, {"a": "介质", "ul": 8}, {"t": "。在真空中，声音"}, {"a": "不能", "ul": 8}, {"t": "传播。\n常温下，声音在不同的介质中传播的速度不同，通常"}, {"a": "固体", "ul": 8}, {"t": "＞"}, {"a": "液体", "ul": 8}, {"t": "＞\n"}, {"a": "气体", "ul": 8}, {"t": "，且在金属介质中传播更快。"}]}, {"type": "h2", "toks": [{"t": "3.声音的分类\n根据声音的频率，分为人耳可听声及超出听觉范围的声音。"}]}, {"type": "h3", "toks": [{"t": "（1）可听声\n频率在20Hz~20kHz之间的声波，是人耳可以感知的。"}]}, {"type": "h3", "toks": [{"t": "（2）超声波\n定义：频率高于"}, {"a": "20kHz", "ul": 8}, {"t": "的声波。\n优点：方向性好，能量集中，对固体和液体穿透力强。\n缺点：传播距离短，受介质影响大，对气体穿透力差。\n应用：测距、测速、清洗、焊接、碎石、杀菌消毒、B超机、声呐等。"}]}, {"type": "h3", "toks": [{"t": "（3）次声波\n定义：频率低于"}, {"a": "20Hz", "ul": 8}, {"t": "的声波。\n优点：传播距离远，不易衰减或被吸收，在各种介质中穿透力都很强，能绕开障碍物发生衍射。\n缺点：方向性差，难以聚焦，容易和人体器官产生共振，对人体有很强的伤害性，危险时可致人死亡。\n应用：灾害预警，核爆监测等。"}]}], "quiz": [{"src": "真题", "stem": "下列关于对声学现象的分析，正确的是：", "opts": {"A": "人们以分贝为单位来表示声音的强弱，符号为dB", "B": "歌手发生“高音刺耳”的演唱状况，是因为声音的响度发生了变化", "C": "蝙蝠利用次声波捕捉昆虫", "D": "人发声的频率范围大约是20Hz~20000Hz"}, "ans": "A"}, {"src": "母题", "stem": "声音是物体振动产生的声波通过介质传播并能被人或动物听觉感官所感知的波动现象，下列关于声音的说法错误的是：", "opts": {"A": "声音在固体中的传播速度大于在液体中的传播速度", "B": "人们把超过听力声音叫做超声波，把低于听力声音叫做次声波", "C": "声音的传播与温度和阻力有关", "D": "音调、响度、音色是乐音的三个主要特征，人们就是根据他们来区分声音"}, "ans": "A"}, {"src": "母题", "stem": "超声波的方向性好，反射能力强，易于获得较集中的声能，在医学、军事、工业、农业上有很多的应用。超声波可以用于：①碎石②清洗③杀菌消毒④测距", "opts": {"A": "①②③", "B": "①②④", "C": "①②③④", "D": "②③④"}, "ans": "C"}, {"src": "拓展", "stem": "____的差别取决于发声体", "opts": {"A": "音色", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "音色"}, {"src": "拓展", "stem": "声音的强度用____（dB）来衡量。", "opts": {"A": "分贝", "B": "惯性",
