 "C": "人民代表大会制度是我国的根本政治制度", "D": "全国人大行使最高立法权，健全和完善我国的法制体系"}, "ans": "D"}, {"src": "母题", "stem": "根据我国《宪法》，有权发布特赦令的是：", "opts": {"A": "全国人民代表大会", "B": "最高法院", "C": "国家主席", "D": "国务院"}, "ans": "C"}, {"src": "拓展", "stem": "（1）性质：最高的国家____，行使国家立法权和决定国家生活中的其他", "opts": {"A": "权力机关", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "权力机关"}, {"src": "拓展", "stem": "委员长、副委员长连续任职不得超过____", "opts": {"A": "两届", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "两届"}, {"src": "拓展", "stem": "国务院有权批准省、自治区、直辖市的____，批准", "opts": {"A": "区域划分", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "区域划分"}], "branches": [{"h": "1.全国人民代表大会", "terms": ["权力机关", "立法机关", "5年", "修改", "监督", "基本法律", "批准"]}, {"h": "2.全国人大常委会", "terms": ["常设机关", "5年", "两届", "解释", "非基本", "特赦", "战争状态"]}, {"h": "3.中华人民共和国主席", "terms": ["５年"]}, {"h": "4.国务院", "terms": ["行政机关", "５年", "两届", "行政法规", "区域划分", "建置", "紧急状态"]}, {"h": "5.其他国家机构", "terms": ["监察机关", "两届", "领导", "审判机关", "监督", "监督机关"]}], "notes": ["全国人大是最高国家权力机关、最高立法机关，由省、自治区、直辖市、特别行政区和军队选出的代表组成（各少数民族都应有适当名额代表），每届5年、代表总额不超过3000人。职权：修改宪法和监督宪法实施；制定修改刑事、民事、国家机构等基本法律；选举国家主席副主席、军委主席、国家监委主任、最高法院长、最高检检察长，根据国家主席提名决定国务院总理人选；批准省级建置、决定特别行政区设立及其制度、决定战争与和平问题。", "全国人大代表权利：30名以上代表联名可提出议案、质询案；在人大各种会议上的发言和表决不受法律追究（言论表决免责权）；非经会议主席团或全国人大常委会许可，不受逮捕或刑事审判（人身特别保护权）。", "全国人大常委会是全国人大的常设机关（与其是隶属关系），组成人员不得担任行政、监察、审判、检察机关职务，委员长副委员长连续任职不超两届。职权：解释宪法和法律、监督宪法实施；制定修改非基本法律；闭会期间决定部长、军委组成人员等任免和特赦、战争状态宣布、全国总动员或局部动员、个别省级地区进入紧急状态。", "国家主席是独立的国家机关、是国家元首，任期5年（2018年后可连选连任），与全国人大常委会共同行使：公布法律发布命令、任免国务院组成人员和驻外全权代表、外交权、荣典权。", "国务院是最高国家权力机关的执行机关、最高国家行政机关；总理副总理国务委员连续任职不超两届；制定行政法规；批准省、自治区、直辖市的区域划分和自治州、县、市的建置与区域划分；决定省范围内部分地区进入紧急状态。（省级/特别行政区建置归全国人大，其余区划归国务院，乡镇一切归省政府）", "国家监察委员会是最高监察机关，主任任期5年、连续任职不超两届，上级监委领导下级监委；人民法院是审判机关，上级法院监督下级法院；人民检察院是法律监督机关，上级检察院领导下级检察院；法院、检察院依法独立行使职权，不受行政机关、社会团体和个人干涉。"]}, {"id": 150, "part": "常识判断", "pian": "法律常识", "zhang": "宪法", "jie": "", "kind": "zsd", "title": "公民的基本权利和义务", "nblank": 8, "blocks": [{"type": "h2", "toks": [{"t": "1.公民的基本权利"}]}, {"type": "h3", "toks": [{"t": "（1）平等权：公民在法律面前一律平等。不包括立法平等，只能反映在经济\n上、政治上和社会上占统治地位的人们的意志，也即只能反映人民的意志。禁止不合理差别对待。"}]}, {"type": "h3", "toks": [{"t": "（2）宗教信仰自由。"}]}, {"type": "h3", "toks": [{"t": "（3）政治权利和自由"}]}, {"type": "h4", "toks": [{"t": "①选举权和被选举权（年满"}, {"a": "18周岁", "ul": 8}, {"t": "，中国公民，未被剥夺政治权利）"}]}, {"type": "h4", "toks": [{"t": "②中华人民共和国公民有言论、出版、集会、结社、游行、示威的自由。"}]}, {"type": "h3", "toks": [{"t": "（4）监督权：批评和建议、申诉、控告或者检举权。"}]}, {"type": "h3", "toks": [{"t": "（5）人身自由：人身自由不受侵犯；人格尊严不受侵犯；"}, {"a": "住宅", "ul": 8}, {"t": "不受侵犯；\n通信自由和"}, {"a": "通信秘密", "ul": 8}, {"t": "受法律的保护。"}]}, {"type": "h3", "toks": [{"t": "（6）社会经济的权利：公民有劳动的权利和"}, {"a": "义务", "ul": 8}, {"t": "；"}, {"a": "劳动者", "ul": 8}, {"t": "有休息的权\n利；获得物质帮助权。"}]}, {"type": "h3", "toks": [{"t": "（7）财产权：公民的"}, {"a": "合法的", "ul": 8}, {"t": "私有财产不受侵犯。国家为了公共利益的需要，\n可以依照法律规定对公民的私有财产实行征收或者征用并给予"}, {"a": "补偿", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（8）文化教育：公民受教育的权利和"}, {"a": "义务", "ul": 8}, {"t": "；从事科学研究、文艺创作的\n权利。"}]}, {"type": "h2", "toks": [{"t": "2.公民的基本义务"}]}, {"type": "h3", "toks": [{"t": "（1）维护国家的统一和各民族的团结。"}]}, {"type": "h3", "toks": [{"t": "（2）遵守宪法和法律，保守国家秘密，爱护公共财产，遵守劳动纪律，遵守\n公共秩序，尊重社会公德。"}]}, {"type": "h3", "toks": [{"t": "（3）维护祖国的安全、荣誉和利益。"}]}, {"type": "h3", "toks": [{"t": "（4）保卫祖国、抵抗侵略，依法服兵役和参加民兵组织。"}]}, {"type": "h3", "toks": [{"t": "（5）依法纳税。"}]}], "quiz": [{"src": "真题", "stem": "根据我国宪法关于公民基本权利和义务的规定，下列说法正确的是：", "opts": {"A": "公民在法律面前一律平等，我国法律保障所有公民在立法上的平等地位", "B": "张某因诈骗罪被判处有期徒刑3 年，服刑期间依然享有选举权和被选举权", "C": "公民在年老、疾病、遭受自然灾害时，有从国家和社会获得物质帮助权利", "D": "劳动和受教育既是我国公民的基本权利，也是我国公民的基本义务"}, "ans": "D"}, {"src": "母题", "stem": "以下哪一行为没有侵犯人身自由权？", "opts": {"A": "影楼未经允许将顾客的照片张贴宣传", "B": "李某私自拆阅老婆写给前夫的信件", "C": "债权人到欠债人家中搜寻财物抵债", "D": "经检察院批准，派出所逮捕某某"}, "ans": "D"}, {"src": "母题", "stem": "根据宪法的规定，下列不属于我国公民的政治权利和自由的是：", "opts": {"A": "选举权和被选举权", "B": "言论、出版、结社自由", "C": "集会、游行、示威自由", "D": "迁徙权"}, "ans": "D"}, {"src": "拓展", "stem": "①选举权和被选举权（年满____，中国公民，未被剥夺政治权利）", "opts": {"A": "18周岁", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "18周岁"}, {"src": "拓展", "stem": "（6）社会经济的权利：公民有劳动的权利和____", "opts": {"A": "义务", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "义务"}, {"src": "拓展", "stem": "（7）财产权：公民的____私有财产不受侵犯。", "opts": {"A": "合法的", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "合法的"}], "branches": [{"h": "1.公民的基本权利", "terms": ["18周岁", "住宅", "通信秘密", "义务", "劳动者", "合法的", "补偿"]}], "notes": ["平等权：公民在法律面前一律平等（指司法和守法平等，不包括立法上的平等），禁止不合理的差别对待；宗教信仰自由不受外国势力干涉。", "政治权利和自由：选举权被选举权（年满18周岁、中国公民、未被剥夺政治权利）；言论出版集会结社游行示威自由；监督权=批评建议、申诉、控告、检举权。", "人身自由（公民最起码的权利）：人身自由不受侵犯（逮捕须经检察院批准或决定、或法院决定、由公安机关执行）；人格尊严不受侵犯；住宅不受侵犯；通信自由和通信秘密受保护（因国家安全或追查刑事犯罪需要，由公安机关或检察机关依法检查）。", "社会经济权利：劳动既是权利也是义务、劳动者有休息权、公民在年老、疾病、丧失劳动能力时有获得物质帮助权；合法私有财产不受侵犯，国家为公共利益可依法征收征用并给予'补偿'（不是赔偿）；受教育既是权利也是义务，另有科学研究、文艺创作自由。", "基本义务：维护国家统一和民族团结；遵守宪法法律、保守国家秘密、爱护公共财产、遵守劳动纪律和公共秩序、尊重社会公德；维护祖国安全荣誉利益；保卫祖国、依法服兵役和参加民兵组织；依法纳税。"]}, {"id": 151, "part": "常识判断", "pian": "法律常识", "zhang": "宪法", "jie": "", "kind": "zsd", "title": "选举制度", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.选举权"}]}, {"type": "h3", "toks": [{"t": "（1）条件：年满18 周岁；中华人民共和国公民；未被剥夺政治权利。"}]}, {"type": "h3", "toks": [{"t": "（2）选举方式：直接选举与间接选举相结合。"}]}, {"type": "h4", "toks": [{"t": "①直接选举：由选民投票选举代表。不设区的市、市辖区、县、自治县、乡、\n民族乡、镇的人大代表由选民直接选举，也即"}, {"a": "县级", "ul": 8}, {"t": "以下（含县级）为直接选举。"}]}, {"type": "h4", "toks": [{"t": "②间接选举："}, {"a": "全国", "ul": 8}, {"t": "人民代表大会和省、自治区、直辖市、"}, {"a": "设区的市", "ul": 8}, {"t": "、自\n治州的人民代表大会代表由下一级人民代表大会选举。"}]}, {"type": "h3", "toks": [{"t": "（3）选举组织"}]}, {"type": "h4", "toks": [{"t": "①间接选举："}, {"a": "下级常委会", "ul": 8}, {"t": "组织。"}]}, {"type": "h4", "toks": [{"t": "②直接选举：选举委员会组织根据居住状况、生产单位、事业单位、工作单\n位进行选区划分。"}]}, {"type": "h3", "toks": [{"t": "（4）投票选举"}]}, {"type": "h4", "toks": [{"t": "①在直接选举中，"}, {"a": "过半数", "ul": 8}, {"t": "的选民参加投票有效；代表候选人获得参加投票\n的选民"}, {"a": "过半数", "ul": 8}, {"t": "即可当选。"}]}, {"type": "h4", "toks": [{"t": "②在间接选举中，代表候选人须获得全体代表的"}, {"a": "过半数", "ul": 8}, {"t": "选票才能当选。"}]}, {"type": "h2", "toks": [{"t": "2.选举权的平等性原则：2010 年修改选举法实现"}, {"a": "一票一权", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3."}, {"a": "无记名", "ul": 8}, {"t": "投票的原则"}]}], "quiz": [{"src": "真题", "stem": "根据我国选举制度的相关规定，下列说法正确的是：", "opts": {"A": "设区的市的人民代表大会代表由选民直接选举产生", "B": "某县人大代表选举中，全体选民过半数参加投票，候选人获得参加投票选民过半数选票即可当选", "C": "省人民代表大会选举全国人大代表时，代表候选人获得参加投票代表过半数选票即可当选", "D": "精神病患者不享有选举权，选举委员会不将其列入选民名单"}, "ans": "B"}, {"src": "母题", "stem": "A市B区进行区人大代表选举，拟选举120 名人大代表。根据我国选举法的相关规定，下列说法或做法不正确的是：", "opts": {"A": "按居住状况，或生产单位、事业单位、工作单位划分选区，进行选民登记", "B": "各选区选民和各政党、各人民团体提名推荐产生了200 名候选人", "C": "B区人民代表大会主席团主持该次选举活动", "D": "B区的C选区全体选民过半数参加选举，候选人王某获得参加投票选民过半数的选票，当选"}, "ans": "C"}, {"src": "拓展", "stem": "民族乡、镇的人大代表由选民直接选举，也即____以下（含县级）为直接选举。", "opts": {"A": "县级", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "县级"}, {"src": "拓展", "stem": "①间接选举：____组织。", "opts": {"A": "下级常委会", "B": "自然人", "C": "遗产继承", "D": "接受赠与"}, "ans": "A", "real": "下级常委会"}, {"src": "拓展", "stem": "②在间接选举中，代表候选人须获得全体代表的____选票才能当选。", "opts": {"A": "过半数", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "过半数"}], "branches": [{"h": "1.选举权", "terms": ["县级", "全国", "设区的市", "下级常委会", "过半数"]}, {"h": "2.选举权的平等性原则：2010 年修改选举法实现", "terms": ["一票一权"]}, {"h": "3.", "terms": ["无记名"]}], "notes": ["享有选举权三条件同时满足：年满18周岁、中国公民、未被剥夺政治权利；精神病人符合条件但不能行使的，经选举委员会确认后不列入选民名单。", "直接选举（县、乡两级：不设区的市、市辖区、县、自治县、乡、民族乡、镇）由选举委员会主持、选民直接投票；间接选举（全国、省、设区的市、自治州）由本级人大常委会主持、下一级人大选举。", "'双过半'规则：直接选举时全体选民过半数投票选举才有效，候选人获得参加投票选民过半数选票始得当选（例：选区5000人，来2500人以上选举有效；来了3000人，需1500人以上支持才当选）；间接选举中候选人须获全体代表过半数选票当选。2010年修改选举法实现城乡'一票一权'（同票同权）；选举一律采用无记名投票（秘密投票）原则。"]}, {"id": 152, "part": "常识判断", "pian": "法律常识", "zhang": "法理学", "jie": "", "kind": "zsd", "title": "法的规范作用", "nblank": 4, "blocks": [{"type": "p", "toks": [{"t": "法的规范作用："}]}, {"type": "table", "ncol": 3, "head": [[{"t": "口诀"}], [{"t": "释义"}], [{"t": "作用对象"}]], "rows": [[{"toks": [{"t": "教（教）"}], "span": 0}, {"toks": [{"t": "教育作用：通过法的实施，法律规范对人们今后的行为发生直接或间接的诱导影响"}], "span": 0}, {"toks": [{"a": "一般人", "ul": 8}, {"t": "的行为"}], "span": 0}], [{"toks": [{"t": "预（育）"}], "span": 0}, {"toks": [{"t": "预测作用：根据法律规定，人们可以预先估计到他们相互间将如何行为"}], "span": 0}, {"toks": [{"t": "人们相互间的行为"}], "span": 0}], [{"toks": [{"t": "引（尹）"}], "span": 0}, {"toks": [{"t": "指引作用：法作为行为规范，为人们提供某种行为模式，指引人们可以这样行为、必须这样行为或不得这样行为，从而对行为者本人的行为产生影响"}], "span": 0}, {"toks": [{"t": "每个人"}, {"a": "自己", "ul": 8}, {"t": "的行为"}], "span": 0}], [{"toks": [{"t": "制（志）"}], "span": 0}, {"toks": [{"t": "强制作用：法为保障自己得以充分实现，运用国家强制力制裁、惩罚违法行为。法的强制作用是法的其他作用的保证"}], "span": 0}, {"toks": [{"a": "违法犯罪者", "ul": 8}, {"t": "的违法犯罪行为"}], "span": 0}], [{"toks": [{"t": "评（平）"}], "span": 0}, {"toks": [{"t": "评价作用：法作为一种社会规范具有判断、衡量他人行为是否合法或有效的作用"}], "span": 0}, {"toks": [{"a": "他人", "ul": 8}, {"t": "的行为"}], "span": 0}]]}], "quiz": [{"src": "真题", "stem": "法律能够为人们提供既定的行为模式，从而使人们在法律范围内活动。法律最首要的作用是：", "opts": {"A": "教育作用", "B": "评价作用", "C": "预测作用", "D": "指引作用"}, "ans": "D"}, {"src": "母题", "stem": "对于违法犯罪行为的制裁和惩罚，体现了法律的：", "opts": {"A": "评价作用", "B": "教育作用", "C": "强制作用", "D": "指引作用"}, "ans": "C"}], "branches": [{"h": "要点", "terms": ["一般人", "自己", "违法犯罪者", "他人"]}], "notes": ["法的规范作用五种（口诀'指引自己、评价他人、预测彼此、强制违法、教育大多数'）：指引作用=指引本人行为（提供行为模式）；评价作用=判断衡量他人行为是否合法；预测作用=预先估计相互间将如何行为（行为还未发生）；强制作用=制裁惩罚违法犯罪者，是其他作用的保证；教育作用=通过法的实施对一般人今后行为产生诱导影响（含警示和示范）。"]}, {"id": 153, "part": "常识判断", "pian": "法律常识", "zhang": "法理学", "jie": "", "kind": "zsd", "title": "当代中国法的正式渊源", "nblank": 7, "blocks": [{"type": "p", "toks": [{"t": "当代中国法的正式渊源："}]}, {"type": "table", "ncol": 3, "head": [[], [{"t": "渊源种类"}], [{"t": "制定主体"}]], "rows": [[{"toks": [], "span": 0}, {"toks": [{"t": "宪法"}], "span": 0}, {"toks": [{"t": "制宪主体——"}, {"a": "人民", "ul": 8}, {"t": "；制宪机关——第一届全国人民代表大会第一次全体会议"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "法律"}], "span": 0}, {"toks": [{"t": "全国人大——"}, {"a": "基本法律", "ul": 8}, {"t": "；全国人大常委会——非基本法律"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "行政法规"}], "span": 0}, {"toks": [{"a": "国务院", "ul": 8}], "span": 0}], [{"toks": [{"t": "地方性法规"}], "span": 2}, {"toks": [{"t": "省级法规"}], "span": 0}, {"toks": [{"t": "省、自治区、直辖市的人大及其常委会"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "市级法规"}], "span": 0}, {"toks": [{"t": "设区的市、自治州的人大及其常委会——报省级人大常委会"}, {"a": "批准", "ul": 8}, {"t": "后生效"}], "span": 0}], [{"toks": [{"t": "规章"}], "span": 6}, {"toks": [{"t": "部门规章"}], "span": 0}, {"toks": [{"t": "国务院各部委和有权直属机构"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "地方政府规章"}], "span": 0}, {"toks": [{"a": "省一级", "ul": 8}, {"t": "和"}, {"a": "设区的市", "ul": 8}, {"t": "一级政府"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "自治法规"}], "span": 0}, {"toks": [{"t": "自治区人大——报全国人大常委会"}, {"a": "批准", "ul": 8}, {"t": "后生效自治州、自治县人大——报省级人大常委会批准后生效"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "经济特区法规"}], "span": 0}, {"toks": [{"t": "经济特区所在地的省、市的人大及其常委会"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "特别行政区法律"}], "span": 0}, {"toks": [{"t": "特区立法机关"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "国际条约和国际惯例"}], "span": 0}, {"toks": [{"t": "注意：须是我国缔结或承认的国际条约和国际惯例"}], "span": 0}]]}], "quiz": [{"src": "真题", "stem": "根据《中华人民共和国立法法》下列说法错误的是：", "opts": {"A": "国家监察委员会可以向全国人大常委会提出法律案", "B": "县级人大常委可以对基层治理方面的事项制定地方性法规", "C": "设区的市人大常委会可以根据实际需要设立基层立法联系点", "D": "法律草案的说明应当包括起草过程中对重大分歧意见的协调处理情况"}, "ans": "B"}, {"src": "母题", "stem": "为留住“红色记忆”，全方位保护红色文化遗址。近年来，我国各地出台了相应的地方性法规进行保护。对此，下列说法正确的是：", "opts": {"A": "这是各地履行经济职能和社会职能的体现", "B": "各级政府都可以制定保护红色文化遗址的地方性法规", "C": "相应的法规可有效防止对红色文化遗址的过度商业开发", "D": "省级制定的相应地方性法规必须经省人大常委会批准"}, "ans": "C"}, {"src": "拓展", "stem": "渊源种类制定主体宪法制宪主体——____", "opts": {"A": "人民", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "人民"}, {"src": "拓展", "stem": "制宪机关——第一届全国人民代表大会第一次全体会议法律全国人大——____", "opts": {"A": "基本法律", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "基本法律"}], "branches": [{"h": "要点", "terms": ["人民", "基本法律", "国务院", "批准", "省一级", "设区的市"]}], "notes": ["正式渊源与制定主体：宪法（制宪主体是人民，制宪机关是第一届全国人大第一次会议；全国人大只能修改不能制定宪法）；法律（全国人大制定基本法律、全国人大常委会制定非基本法律）；行政法规（国务院）；地方性法规（省级人大及其常委会；设区的市、自治州人大及其常委会制定后报省级人大常委会批准生效）；规章（部门规章=国务院各部委和有权直属机构；地方政府规章=省级和设区的市级政府）；自治法规（自治区人大制定、报全国人大常委会批准生效；自治州、自治县报省级人大常委会批准）；经济特区法规；特别行政区法律；我国缔结或承认的国际条约和国际惯例。", "记忆：中央层面'法律—全国人大/人常、行政法规—国务院'；省市层面'地方性法规—人大/人常、政府规章—政府'；教育部等职能部门制定的是部门规章。"]}, {"id": 154, "part": "常识判断", "pian": "法律常识", "zhang": "法理学", "jie": "", "kind": "zsd", "title": "法的效力层次", "nblank": 5, "blocks": [{"type": "h2", "toks": [{"t": "1.不同位阶法的冲突原则"}]}, {"type": "h3", "toks": [{"t": "（1）"}, {"a": "宪法", "ul": 8}, {"t": "至上、法律高于法规、行政法规高于"}, {"a": "规章", "ul": 8}, {"t": "、行政法规高于\n地方性法规。"}]}, {"type": "h3", "toks": [{"t": "（2）地方性法规与部门规章之间具有同等效力，对同一事项的规定不一致，\n不能确定如何适用时，由"}, {"a": "国务院", "ul": 8}, {"t": "提出意见，国务院认为应当适用地方性法规的，应当决定在该地方适用地方性法规的规定；认为应当适用部门规章的，应当提请全国人民代表大会"}, {"a": "常务委员会", "ul": 8}, {"t": "裁决。"}]}, {"type": "h3", "toks": [{"t": "（3）部门规章之间、部门规章与地方政府规章之间具有同等效力，在各自的\n权限范围内施行。部门规章之间、部门规章与地方政府规章之间对同一事项的规定不一致时，由"}, {"a": "国务院", "ul": 8}, {"t": "裁决。"}]}, {"type": "h2", "toks": [{"t": "2.同一位阶法的冲突原则\n特别法优先一般法、新法（后法）优先旧法。"}]}], "quiz": [{"src": "真题", "stem": "下列法的表现形式，效力从高到低排列正确的是：", "opts": {"A": "法律、地方性法规、行政法规", "B": "行政法规、规章、地方性法规", "C": "宪法、法律、行政法规", "D": "法律、国际条约、地方性法规"}, "ans": "C"}, {"src": "母题", "stem": "某地法院在审理案件过程中发现，该省人民代表大会所制定的地方性法规规定与国家某部委制定的规章规定不一致，不能确定如何适用。在此情形下，根据我国《宪法》和《立法法》，下列哪种处理办法是正确的？", "opts": {"A": "由国务院决定在该地方适用部门规章", "B": "由全国人民代表大会决定在该地方是适用地方性法规还是适用部门规章", "C": "由最高人民法院通过司法解释加以决定", "D": "由国务院决定在该地方适用地方性法规，或者由国务院提请全国人民代表大会常务委员会裁决在该地方适用部门规章"}, "ans": "D"}, {"src": "拓展", "stem": "（1）____至上、法律高于法规、行政法规高于规章、行政法规高于", "opts": {"A": "宪法", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "宪法"}, {"src": "拓展", "stem": "（1）宪法至上、法律高于法规、行政法规高于____、行政法规高于", "opts": {"A": "规章", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "规章"}, {"src": "拓展", "stem": "不能确定如何适用时，由____提出意见，国务院认为应当适用地方性法规的，应当决定在该地方适用地方性法规的规定；", "opts": {"A": "国务院", "B": "自然人", "C": "法人", "D": "资格"}, "ans": "A", "real": "国务院"}], "branches": [{"h": "1.不同位阶法的冲突原则", "terms": ["宪法", "规章", "国务院", "常务委员会"]}], "notes": ["不同位阶冲突：宪法至上、法律高于法规、行政法规高于规章和地方性法规（上位法优于下位法、中央高于地方、人大高于政府，国内法优先于我国缔结的国际条约另有约定除外）。", "地方性法规与部门规章对同一事项规定不一致、不能确定如何适用时，由国务院提出意见：国务院认为应适用地方性法规的就在当地适用；认为应适用部门规章的，要提请全国人大常委会裁决。", "部门规章之间、部门规章与地方政府规章之间冲突由国务院裁决。同一位阶冲突：特别法优于一般法、新法（后法）优于旧法；公法优于私法、根本法优于普通法。"]}, {"id": 155, "part": "常识判断", "pian": "法律常识", "zhang": "法理学", "jie": "", "kind": "zsd", "title": "法的实施", "nblank": 0, "blocks": [{"type": "h2", "toks": [{"t": "1.法的遵守\n法的遵守又称为守法，是指国家机关、社会组织和公民个人依照法的规定，\n行使权利（权力）和履行义务（职责）的活动。"}]}, {"type": "h2", "toks": [{"t": "2.法的执行\n法的执行又称为执法，狭义的执法仅指法定的国家行政机关、授权或委托的\n组织及其公职人员在行使行政管理权的过程中贯彻实施法律的活动。"}]}, {"type": "h2", "toks": [{"t": "3.法的适用\n法的适用又称为司法，是指国家司法机关（法院、检察院）依照法定职权和\n程序，具体应用法律处理案件的专门活动。"}]}], "quiz": [{"src": "真题", "stem": "天下之事，不难于立法，而难于法之必行。法律的生命在于实施，法律的权威也在于实施，守法是法律实施和实现的基本途径，对守法的理解不正确的是：", "opts": {"A": "守法的主体是一切组织和个人", "B": "守法意味着一切组织和个人严格依法办事的活动和状态", "C": "守法是行使法定的权利", "D": "守法要尊重宪法和法律"}, "ans": "C"}, {"src": "母题", "stem": "下列对公民在法律面前一律平等的理解正确的是：", "opts": {"A": "法律对全体公民不论民族、文化程度、信仰等，在法律适用上一律平等", "B": "公民依法享有同等的权利和承担同等的义务，不允许有超越法律的特权", "C": "公民的权益都受法律的保护，任何公民的违法行为都受法律的制裁", "D": "在审判活动中，所有当事人的法律权力是平等的参考答案"}, "ans": "B"}], "branches": [], "notes": ["法的实施三环节：①法的遵守（守法）——主体是一切主体、范围是一切法的渊源，形式包括不违法（消极被动守法）和依法行使权利履行义务（积极主动守法）；②法的执行（执法）——主体是行政机关（及授权或委托组织），特点是全面管理、具有主动性；③法的适用（司法）——主体是国家司法机关（法院、检察院），特点是被动性（不告不理）。", "概念辨析：'权力'对应权力机关/立法机关（公权力）；'权利'对应'人'（私权利）；'权益'指人生前死后特殊利益的保护（如死者名誉）。"]}];

<style>
:root{
  --bg:#f4f6f5; --paper:#ffffff; --ink:#23303a; --ink-soft:#5b6b76; --line:#e3e8e6;
  --accent:#0f7a6a; --accent-soft:#e3f2ef; --accent-deep:#0a5a4e;
  --gold:#b9832f; --red:#c0473b; --green:#2e8b57; --blue:#2f6db0;
  --shadow:0 2px 14px rgba(30,60,55,.07); --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c8d2cf;border-radius:6px}
/* ---------- layout ---------- */
header.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:17px;color:var(--accent-deep);white-space:nowrap;letter-spacing:.5px}
.logo small{display:block;font-size:11px;color:var(--ink-soft);font-weight:500;letter-spacing:0}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:20px;
  font-size:14px;outline:none;background:#f1f4f3}
.search input:focus{border-color:var(--accent);background:#fff}
.search::before{content:"🔍";position:absolute;left:11px;top:7px;font-size:13px;opacity:.6}
.sr{position:absolute;top:42px;left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);max-height:340px;overflow:auto;display:none;z-index:60}
.sr div{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f3f2;font-size:13.5px}
.sr div:hover{background:var(--accent-soft)}
.sr .path{color:var(--ink-soft);font-size:11.5px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 13px;border-radius:8px;
  font-size:13.5px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-deep);color:#fff}
.layout{display:flex;align-items:flex-start}
/* ---------- sidebar ---------- */
aside{width:292px;flex:0 0 292px;height:calc(100vh - 57px);position:sticky;top:57px;overflow:auto;
  padding:12px 10px 40px;border-right:1px solid var(--line);background:#fbfcfc}
.nav-node{user-select:none}
.nav-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;
  font-size:14px;color:var(--ink)}
.nav-row:hover{background:var(--accent-soft)}
.nav-row.active{background:var(--accent);color:#fff;font-weight:600}
.nav-row .twist{width:14px;display:inline-block;text-align:center;color:#93a19d;flex:0 0 14px;font-size:11px}
.nav-row.active .twist{color:#dff}
.nav-row .nm{flex:1;line-height:1.4}
.nav-row .cnt{font-size:11px;color:#9aaaA5;background:#eef2f1;border-radius:10px;padding:0 7px}
.nav-row.active .cnt{background:rgba(255,255,255,.25);color:#fff}
.nav-children{margin-left:13px;padding-left:8px;border-left:1px dashed #d7e0dd}
.lv-part>.nav-row{font-weight:800;font-size:14.5px;color:var(--accent-deep)}
.lv-pian>.nav-row{font-weight:700}
.lv-zhang>.nav-row{font-weight:600;font-size:13.7px}
.lv-jie>.nav-row{font-size:13px;color:var(--ink-soft)}
.lv-unit>.nav-row{font-size:13.3px}
.done-dot{width:7px;height:7px;border-radius:50%;background:#cfd9d6;flex:0 0 7px}
.done-dot.full{background:var(--green)} .done-dot.part{background:var(--gold)}
.nav-row.active .done-dot{background:rgba(255,255,255,.6)}
/* ---------- main ---------- */
main{flex:1;min-width:0;padding:22px 30px 80px;max-width:1080px;margin:0 auto}
.crumbs{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px}
.crumbs b{color:var(--accent-deep)}
h1.unit-title{font-size:23px;margin:0 0 4px;line-height:1.4}
.meta-line{font-size:12.8px;color:var(--ink-soft);margin-bottom:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.progress{height:8px;background:#e7edeb;border-radius:6px;overflow:hidden;width:160px;display:inline-block;vertical-align:middle}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#17a08a,#0f7a6a);width:0;transition:.3s}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin:14px 0 18px;flex-wrap:wrap}
.tab{padding:9px 18px;border:none;background:none;font-size:15px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-size:11.5px;background:#e9efed;border-radius:9px;padding:0 7px;margin-left:3px}
.tab.on .n{background:var(--accent-soft);color:var(--accent-deep)}
/* ---------- blanks ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .hint{font-size:12.5px;color:var(--ink-soft);margin-left:auto}
.block{margin-bottom:6px}
.b-h2{font-weight:800;font-size:16px;margin:18px 0 8px;padding-left:9px;border-left:4px solid var(--accent)}
.b-h3{font-weight:700;font-size:14.6px;margin:12px 0 5px;color:#33474d99;color:#3a4a52}
.b-h4{font-weight:600;margin:8px 0 4px;color:#43565e}
.b-p{margin-bottom:8px}
.b-callout{background:#fbf6ea;border:1px solid #ecddbd;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14.2px}
.b-callout::before{content:"知识延伸";display:inline-block;font-size:11.5px;font-weight:700;color:var(--gold);
  background:#f6ead1;border-radius:5px;padding:1px 8px;margin-right:8px}
/* ---------- 原书表格 ---------- */
.tbl-wrap{margin:10px 0 14px;overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border:1px solid #cfe0db;
  border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(15,122,106,.08)}
table.tbl th,table.tbl td{border:1px solid #d5e4e0;padding:8px 10px;vertical-align:top;line-height:1.7;text-align:left}
table.tbl thead th{background:#e3f0ec;color:var(--accent-deep);font-weight:800;white-space:nowrap;text-align:center}
table.tbl tbody tr:nth-child(even) td{background:#f6faf9}
table.tbl td[rowspan]{background:#eef6f3;font-weight:700;color:var(--accent-deep);vertical-align:middle;text-align:center}
table.tbl .blank{font-size:13.5px}
@media(max-width:900px){table.tbl{font-size:13px}table.tbl th,table.tbl td{padding:6px 7px}}
/* ---------- 学员批注/笔记 ---------- */
.notes-box{margin:24px 0 10px;border:1px solid #cfe3dd;background:#f2f9f7;border-radius:12px;padding:14px 18px}
.notes-head{font-weight:800;color:var(--accent-deep);font-size:14.5px;margin-bottom:6px}
.notes-list{margin:0;padding-left:20px}
.notes-list li{margin:6px 0;font-size:14px;line-height:1.85;color:#33454d}
.blank{display:inline-block;min-width:54px;text-align:center;border:none;border-bottom:2px dotted var(--accent);
  background:var(--accent-soft);color:transparent;border-radius:5px 5px 0 0;padding:0 8px;margin:0 2px;
  font-weight:700;transition:.12s;position:relative;line-height:1.6}
.blank:hover{background:#d3e8e3}
.blank.rev{color:var(--accent-deep);background:#dcefe9;border-bottom-style:solid;border-bottom-color:var(--accent)}
.blank.master{background:#e4f3e9;color:var(--green);border-bottom-color:var(--green)}
.blank .mk{position:absolute;right:-9px;top:-9px;width:17px;height:17px;border-radius:50%;font-size:10px;
  background:#bbb;color:#fff;border:none;display:none;align-items:center;justify-content:center;line-height:1}
.blank.rev .mk{display:inline-flex}
.blank.master .mk{background:var(--green)}
.blank[data-ul="0"]{min-width:34px}
/* ---------- quiz ---------- */
.qfilter{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;font-size:13px;color:var(--ink-soft)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:2px 8px}
.tag.exam{background:#fdeceb;color:var(--red)} .tag.train{background:#e9f1fa;color:var(--blue)}
.tag.gen{background:#f3edfb;color:#7a4fb5}
.qstem{font-weight:600;margin-bottom:10px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;background:#f7faf9;border:1px solid var(--line);border-radius:9px;
  padding:9px 13px;margin-bottom:7px;font-size:14.2px;transition:.12s}
.opt:hover{border-color:var(--accent);background:#fff}
.opt .L{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;
  background:#e6ecea;font-size:12.5px;margin-right:9px;font-weight:700}
.opt.right{background:#e9f6ee;border-color:var(--green);color:#1f6e43}
.opt.right .L{background:var(--green);color:#fff}
.opt.wrong{background:#fdeceb;border-color:var(--red);color:#a23a30}
.opt.wrong .L{background:var(--red);color:#fff}
.opt.dim{opacity:.62}
.qfoot{display:none;margin-top:8px;font-size:13.3px;border-top:1px dashed var(--line);padding-top:9px;color:var(--ink-soft)}
.qfoot.show{display:block}
.qfoot b{color:var(--accent-deep)}
/* ---------- mindmap ---------- */
.maptoolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tree{font-size:14px;line-height:1.9}
.tree ul{list-style:none;margin:0;padding-left:22px;position:relative}
.tree>ul{padding-left:0}
.tree li{position:relative;padding:2px 0}
.tree ul ul li::before{content:"";position:absolute;left:-14px;top:18px;width:12px;height:1px;background:#c4d2ce}
.tree ul ul{border-left:1px solid #c4d2ce}
.tnode{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:2px 9px;cursor:default}
.t-toggle{cursor:pointer;width:17px;height:17px;line-height:15px;text-align:center;background:#dde8e5;
  border-radius:4px;font-size:11px;color:var(--accent-deep);border:none;padding:0}
.t-root{background:var(--accent);color:#fff;font-weight:800;font-size:15px;border-radius:8px;padding:4px 14px}
.t-unit{background:var(--accent-soft);color:var(--accent-deep);font-weight:700;cursor:pointer}
.t-unit:hover{background:#cfe7e1}
.t-h{background:#eef4f2;font-weight:600}
.t-term{background:#fff;border:1px solid #d9e3e0;color:#3c4d55;font-size:13.3px}
.t-term:hover{border-color:var(--gold);color:var(--gold)}
/* ---------- home ---------- */
.hero{background:linear-gradient(120deg,#0f7a6a,#13998 0)}
.hero{background:linear-gradient(120deg,#0d6b5d,#159a86);color:#fff;border-radius:16px;padding:26px 30px;margin-bottom:22px}
.hero h2{margin:0 0 6px;font-size:24px}
.hero p{margin:0;opacity:.92;font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:800;color:var(--accent-deep)}
.stat .k{font-size:13px;color:var(--ink-soft)}
.part-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.pcard h3{margin:0 0 10px;color:var(--accent-deep)}
.pcard .pianlink{display:block;padding:7px 10px;border-radius:8px;font-size:14px;color:var(--ink)}
.pcard .pianlink:hover{background:var(--accent-soft)}
.chap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.chap-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.chap-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.chap-card h4{margin:0 0 6px;font-size:15px}
.chap-card .s{font-size:12.5px;color:var(--ink-soft)}
/* modal */
.modal-mask{position:fixed;inset:0;background:rgba(20,40,35,.4);display:none;align-items:center;justify-content:center;z-index:80}
.modal{background:#fff;border-radius:14px;width:min(560px,92vw);padding:24px;max-height:84vh;overflow:auto}
.modal h3{margin:0 0 12px}
.empty-note{color:var(--ink-soft);font-size:13.5px;padding:14px;background:#f2f6f5;border-radius:9px}
.legend{font-size:12.3px;color:var(--ink-soft);margin-top:6px}
.kbd{background:#eef2f1;border:1px solid #d8e0dd;border-radius:4px;padding:0 5px;font-size:12px}
@media(max-width:900px){aside{display:none}main{padding:16px}.part-cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">政治理论 & 常识判断<small>挖空背诵 · 点击显答案 · 批注补充 · 随机抽背</small></div>
  <div class="search">
    <input id="searchInput" placeholder="搜索知识点 / 关键词，如：剩余价值、节气…">
    <div class="sr" id="searchResult"></div>
  </div>
  <div class="top-actions">
    <button class="btn" id="btnRandom">随机抽背</button>
    <button class="btn primary" id="btnContinue">继续学习</button>
  </div>
</header>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<script>
const DATA = window.STUDY_DATA;
/* ================= 状态与进度 ================= */
const store = {
  get(k,d){ try{const v=localStorage.getItem('zz_'+k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem('zz_'+k,JSON.stringify(v));}catch(e){} }
};
let state = store.get('state',{master:{}, quiz:{}, notesOn:false, last:null});
if(typeof state.notesOn!=='boolean')state.notesOn=false;
function save(){store.set('state',state);}
function blankKey(u,b){return u.id+'-'+b;}
function unitMasteredSet(u){return state.master[u.id]||[];}
function unitProgress(u){
  if(!u.nblank) return 1;
  const m=unitMasteredSet(u); return Math.min(1,m.length/u.nblank);
}
/* ================= 层级树 ================= */
function chapterId(u){return u.part+'::'+u.pian+'::'+(u.zhang||'');}
const chapters = {};
DATA.forEach(u=>{
  const cid=chapterId(u); (chapters[cid]=chapters[cid]||[]).push(u);
});
function buildTree(){
  const root={};
  DATA.forEach(u=>{
    root[u.part]??={};
    const P=root[u.part];
    P[u.pian]??={_units:[]};
    const Pi=P[u.pian];
    if(u.zhang){
      Pi[u.zhang]??={};
      const Z=Pi[u.zhang];
      if(u.jie){ (Z[u.jie]=Z[u.jie]||[]).push(u); }
      else { (Z._units=Z._units||[]).push(u); }
    } else Pi._units.push(u);
  });
  return root;
}
const TREE=buildTree();
/* ================= 侧边栏 ================= */
function el(tag,cls,html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
function navRow(text,cnt,progress,leaf){
  const r=el('div','nav-row');
  r.innerHTML=`<span class="twist">${leaf?'':'▸'}</span><span class="nm">${text}</span>`+
    (progress!==undefined?`<span class="done-dot ${progress>=1?'full':progress>0?'part':''}"></span>`:'')+
    (cnt?`<span class="cnt">${cnt}</span>`:'');
  return r;
}
function renderSidebar(){
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  Object.entries(TREE).forEach(([pn,P])=>{
    const pnNode=el('div','nav-node lv-part');
    const pUnits=DATA.filter(u=>u.part===pn);
    const prow=navRow('📘 '+pn,pUnits.length); const pch=el('div','nav-children');
    let popen=false;
    prow.onclick=()=>{pch.style.display=pch.style.display==='none'?'block':'none';
      prow.querySelector('.twist').textContent=pch.style.display==='none'?'▸':'▾';};
    pnNode.append(prow,pch); sb.appendChild(pnNode);
    Object.entries(P).forEach(([pin,Pi])=>{
      const pianNode=el('div','nav-node lv-pian');
      const piUnits=DATA.filter(u=>u.part===pn&&u.pian===pin);
      const pirow=navRow(pin,piUnits.length); const pich=el('div','nav-children');
      pirow.onclick=(e)=>{e.stopPropagation();pich.style.display=pich.style.display==='none'?'block':'none';
        pirow.querySelector('.twist').textContent=pich.style.display==='none'?'▸':'▾';};
      pianNode.append(pirow,pich); pch.appendChild(pianNode);
      // 章
      const zhangKeys=Object.keys(Pi).filter(k=>k!=='_units');
      if(!zhangKeys.length){ piUnits.forEach(u=>pich.appendChild(unitNav(u))); }
      zhangKeys.forEach(zn=>{
        const Z=Pi[zn];
        const znode=el('div','nav-node lv-zhang');
        const zu=DATA.filter(u=>u.part===pn&&u.pian===pin&&u.zhang===zn);
        const zrow=navRow(zn,zu.length); const zch=el('div','nav-children');
        zrow.onclick=(e)=>{e.stopPropagation();zch.style.display=zch.style.display==='none'?'block':'none';
          zrow.querySelector('.twist').textContent=zch.style.display==='none'?'▸':'▾';};
        znode.append(zrow,zch); pich.appendChild(znode);
        (Z._units||[]).forEach(u=>zch.appendChild(unitNav(u)));
        Object.entries(Z).filter(([k])=>k!=='_units').forEach(([jn,arr])=>{
          const jnode=el('div','nav-node lv-jie');
          const jrow=navRow(jn,arr.length); const jch=el('div','nav-children');
          jrow.onclick=(e)=>{e.stopPropagation();jch.style.display=jch.style.display==='none'?'block':'none';
            jrow.querySelector('.twist').textContent=jch.style.display==='none'?'▸':'▾';};
          jnode.append(jrow,jch); zch.appendChild(jnode);
          arr.forEach(u=>jch.appendChild(unitNav(u)));
        });
      });
    });
  });
}
function unitNav(u){
  const node=el('div','nav-node lv-unit');
  const row=navRow(u.title,undefined,unitProgress(u),true);
  row.querySelector('.twist').textContent='·';
  row.onclick=()=>showUnit(u.id);
  node.appendChild(row); node.dataset.uid=u.id; return node;
}
function highlightNav(uid){
  document.querySelectorAll('.nav-row.active').forEach(r=>r.classList.remove('active'));
  if(uid==null)return;
  const node=document.querySelector(`.lv-unit[data-uid="${uid}"] .nav-row`);
  if(node){node.classList.add('active'); node.closest('aside').scrollTo({top:node.offsetTop-120,behavior:'smooth'});}
}
/* ================= 渲染：挖空 ================= */
let curUnit=null, revealAll=false, blankSeq=0;
function blockTokList(b){  // 兼容 table 嵌套结构
  if(b.type==='table'){
    const a=[];
    b.head.forEach(c=>a.push(...c));
    b.rows.forEach(r=>r.forEach(c=>a.push(...c.toks)));
    return a;
  }
  return b.toks;
}
function appendTok(parent,t,u){
  if('t' in t){
    String(t.t).split('\n').forEach((p,i)=>{ if(i>0)parent.appendChild(el('br')); parent.appendChild(document.createTextNode(p)); });
    return;
  }
  const seq=blankSeq++;
  const bk=el('button','blank');
  bk.dataset.seq=seq; bk.dataset.ul=t.ul>=12?16:(t.ul||8);
  const ans=t.a||'（讲义此处无补充）';
  bk.textContent=ans; bk.title='点击显示/隐藏答案；点亮右上角 ✓ 标记已掌握';
  const mk=el('span','mk','✓'); bk.appendChild(mk);
  if((state.master[u.id]||[]).includes(seq)){bk.classList.add('rev','master');}
  bk.onclick=(e)=>{
    if(e.target.classList.contains('mk')){
      const list=state.master[u.id]||(state.master[u.id]=[]);
      const i=list.indexOf(seq);
      if(i<0){list.push(seq);bk.classList.add('master');} else {list.splice(i,1);bk.classList.remove('master');}
      save(); refreshProgress(); refreshSidebarDots(); return;
    }
    bk.classList.toggle('rev');
  };
  parent.appendChild(bk);
}
function renderBlocks(u){
  blankSeq=0;
  const wrap=el('div');
  u.blocks.forEach(b=>{
    if(b.type==='table'){
      const tw=el('div','tbl-wrap');
      const tb=el('table','tbl');
      if(b.head.some(c=>c.length)){
        const thead=el('thead'),tr=el('tr');
        b.head.forEach(c=>{const th=el('th');c.forEach(t=>appendTok(th,t,u));tr.appendChild(th);});
        thead.appendChild(tr);tb.appendChild(thead);
      }
      const tbody=el('tbody'),spanLeft=Array(b.ncol||b.head.length).fill(0);
      b.rows.forEach(r=>{
        const tr=el('tr');
        r.forEach((c,ci)=>{
          if(spanLeft[ci]>0){spanLeft[ci]--;return;}  // 被上方 rowspan 覆盖的格子不渲染
          const td=el('td');
          if(c.span>1){td.rowSpan=c.span;spanLeft[ci]=c.span-1;}
          c.toks.forEach(t=>appendTok(td,t,u));
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      tb.appendChild(tbody);tw.appendChild(tb);wrap.appendChild(tw);
      return;
    }
    const box=el('div','block b-'+b.type);
    b.toks.forEach(t=>appendTok(box,t,u));
    wrap.appendChild(box);
  });
  return wrap;
}
function setReveal(show){
  revealAll=show;
  document.querySelectorAll('#main .blank').forEach(b=>b.classList.toggle('rev',show));
}
function refreshProgress(){
  if(!curUnit)return;
  const p=unitProgress(curUnit);
  document.getElementById('progBar').style.width=(p*100)+'%';
  document.getElementById('progText').textContent=
    `已掌握 ${unitMasteredSet(curUnit).length}/${curUnit.nblank}`;
}
function refreshSidebarDots(){
  document.querySelectorAll('.lv-unit').forEach(n=>{
    const u=DATA.find(x=>x.id==n.dataset.uid); if(!u)return;
    const dot=n.querySelector('.done-dot'); const p=unitProgress(u);
    dot.className='done-dot '+(p>=1?'full':p>0?'part':'');
  });
}
/* ================= 渲染：学员批注/笔记 ================= */
function renderNotes(u){
  const notes=u.notes||[];
  if(!notes.length) return null;
  const box=el('div','notes-box');
  box.appendChild(el('div','notes-head','✎ 学员批注 · 补充笔记（来自讲义手写批注与整理笔记）'));
  const ul=el('ul','notes-list');
  notes.forEach(n=>{const li=el('li');li.textContent=n;ul.appendChild(li);});
  box.appendChild(ul);
  return box;
}
/* ================= 单元主视图 ================= */
function showUnit(id){
  const u=DATA.find(x=>x.id===id); if(!u)return; curUnit=u; state.last={type:'unit',id};save();
  if(location.hash!=='#u'+id)history.replaceState(null,'','#u'+id);
  highlightNav(id);
  const m=document.getElementById('main'); m.innerHTML='';
  const crumb=el('div','crumbs',`${u.part} / ${u.pian}${u.zhang?' / '+u.zhang:''}${u.jie?' / '+u.jie:''}`);
  m.appendChild(crumb);
  m.appendChild(el('h1','unit-title',u.title));
  const meta=el('div','meta-line');
  meta.innerHTML=`<span>挖空 <b>${u.nblank}</b> 处</span>
   <span>掌握进度 <span class="progress"><i id="progBar"></i></span> <span id="progText"></span></span>`;
  // 上一知识点/下一知识点
  const prev=DATA[id-1],next=DATA[id+1];
  if(prev){const b=el('button','btn','← '+prev.title.slice(0,12));b.onclick=()=>showUnit(id-1);meta.appendChild(b);}
  if(next){const b=el('button','btn',next.title.slice(0,12)+' →');b.onclick=()=>showUnit(id+1);meta.appendChild(b);}
  m.appendChild(meta);
  // 工具栏
  const tb=el('div','toolbar');
  tb.innerHTML=`<span class="hint">点击空格显示答案，再点空格右上 ✓ 标记“已掌握”</span>`;
  const bShow=el('button','btn primary','全部显示'),bHide=el('button','btn','全部隐藏');
  bShow.onclick=()=>setReveal(true); bHide.onclick=()=>setReveal(false);
  // 学员批注/笔记（可能含填空答案，默认隐藏，手动展开，选择会被记住）
  const nb=renderNotes(u); let bNotes=null;
  if(nb){
    bNotes=el('button','btn',state.notesOn?'隐藏补充笔记':'显示补充笔记');
    bNotes.title='补充笔记中可能包含填空答案，默认隐藏，点击展开/收起';
    nb.style.display=state.notesOn?'':'none';
    bNotes.onclick=()=>{
      state.notesOn=!state.notesOn; save();
      nb.style.display=state.notesOn?'':'none';
      bNotes.textContent=state.notesOn?'隐藏补充笔记':'显示补充笔记';
    };
    tb.prepend(bShow,bHide,bNotes);
  } else tb.prepend(bShow,bHide);
  m.appendChild(tb);
  // 挖空正文
  m.appendChild(renderBlocks(u));
  if(nb)m.appendChild(nb);
  refreshProgress();
  window.scrollTo({top:0});
}
/* ================= 章视图 ================= */
function showChapter(cid){
  const units=chapters[cid]; if(!units)return; const u0=units[0];
  curUnit=null; highlightNav(null); state.last={type:'chap',id:cid};save();
  if(location.hash!=='#c'+encodeURIComponent(cid))history.replaceState(null,'','#c'+encodeURIComponent(cid));
  const m=document.getElementById('main');m.innerHTML='';
  m.appendChild(el('div','crumbs',`${u0.part} / ${u0.pian} / ${u0.zhang||u0.pian}`));
  m.appendChild(el('h1','unit-title',u0.zhang||u0.pian));
  const nb=units.reduce((s,u)=>s+u.nblank,0);
  m.appendChild(el('div','meta-line',`共 ${units.length} 个知识点 · ${nb} 处挖空（逐个点击进入，避免一次呈现过多）`));
  const lg=el('div','chap-grid');
  units.forEach(u=>{
    const c=el('div','chap-card');
    const p=Math.round(unitProgress(u)*100);
    const hasNotes=(u.notes&&u.notes.length)?' · 含批注':'';
    c.innerHTML=`<h4>${u.title}</h4><div class="s">${u.nblank} 空 · 掌握 ${p}%${hasNotes}</div>`;
    c.onclick=()=>showUnit(u.id);lg.appendChild(c);
  });
  m.appendChild(lg);
  window.scrollTo({top:0});
}
/* ================= 首页 ================= */
function showHome(){
  curUnit=null;highlightNav(null);
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  const m=document.getElementById('main');m.innerHTML='';
  const totalB=DATA.reduce((s,u)=>s+u.nblank,0);
  const totalNotes=DATA.reduce((s,u)=>s+(u.notes?u.notes.length:0),0);
  const mastered=Object.values(state.master).reduce((s,a)=>s+a.length,0);
  m.appendChild(el('div','hero',`<h2>政治理论 & 常识判断 · 挖空背诵自测站</h2>
    <p>以《消化清单》挖空为骨架，点击空格即显示《理论讲练》标准答案；每个知识点下方附有讲义中的手写批注与整理笔记，顶部“随机抽背”按整句出题。建议顺序：逐章进入 → 挖空主动回忆 → 对照批注巩固。</p>`));
  const sg=el('div','stat-grid');
  [['知识点',DATA.length],['挖空总数',totalB],['补充批注',totalNotes],['已掌握空',mastered]].forEach(([k,v])=>{
    sg.appendChild(el('div','stat',`<div class="v">${v}</div><div class="k">${k}</div>`));});
  m.appendChild(sg);
  // 章节卡片
  m.appendChild(el('div','b-h2','按章节进入'));
  const cg=el('div','chap-grid');
  Object.keys(chapters).forEach(cid=>{
    const us=chapters[cid],u0=us[0];
    const nb=us.reduce((s,u)=>s+u.nblank,0);
    const c=el('div','chap-card',`<h4>${u0.pian}${u0.zhang?' · '+u0.zhang:''}</h4>
      <div class="s">${us.length} 知识点 · ${nb} 空</div>`);
    c.onclick=()=>showChapter(cid);cg.appendChild(c);
  });
  m.appendChild(cg);
}
/* ================= 随机抽背（题目=目标空所在整句，答案=空内内容） ================= */
let DRILL_POOL=null;
function buildDrillPool(){
  if(DRILL_POOL)return DRILL_POOL;
  const pool=[];
  const SENT_SPLIT=/([。！？；\n])/;
  const isEnd=ch=>'。！？；\n'.includes(ch);
  DATA.forEach(u=>{
    let heading='';
    u.blocks.forEach(b=>{
      if(b.type==='h2'||b.type==='h3'||b.type==='h4'){
        heading=b.toks.map(t=>'t'in t?t.t:(t.a||'')).join('').split('\n')[0].trim();
      }
      let cur=[];
      const flush=()=>{
        if(!cur.length)return;
        cur.forEach((tk,idx)=>{
          if('a' in tk && tk.a && tk.a.trim()){
            let q=cur.map((x,j)=>j===idx?'______':('t'in x?x.t:x.a)).join('')
              .replace(/\n/g,'').replace(/^[（(]?\d+[)）.、]\s*/,'').trim();
            if(!q.includes('______'))return;
            const bare=s=>s.replace(/______/g,'').replace(/[\s《》（）()。；;、，,\.：:？]/g,'');
            // 碎片句（表格型单元被换行切碎）：小标题不含答案时用它补足语境，否则剔除（避免标题泄题）
            if(bare(q).length<5){
              if(heading&&!heading.includes(tk.a.trim())&&bare(heading).length>=4)q=heading+'：'+q;
              else return;
            }
            if(bare(q).length<4)return;
            pool.push({u,heading:heading||'',answer:tk.a.trim(),question:q});
          }
        });
        cur=[];
      };
      blockTokList(b).forEach(tk=>{
        if('t' in tk){
          tk.t.split(SENT_SPLIT).forEach(pc=>{
            if(!pc)return;
            if(isEnd(pc)){cur.push({t:pc});flush();}
            else cur.push({t:pc});
          });
        } else cur.push(tk);
      });
      flush();
    });
  });
  DRILL_POOL=pool; return pool;
}
let lastDrill=null;
function randomDrill(){
  const pool=buildDrillPool();
  let item=pool[Math.floor(Math.random()*pool.length)];
  // 尽量不连续重复同一题
  if(lastDrill&&pool.length>1){let guard=0;while(item===lastDrill&&guard++<8){item=pool[Math.floor(Math.random()*pool.length)];}}
  lastDrill=item;
  const {u,heading,answer,question}=item;
  const qText=question.replace(/\n/g,'').trim();
  const mask=document.getElementById('modalMask'),box=document.getElementById('modalBox');
  const ctx=heading?`${u.pian} / ${u.title} · ${heading}`:`${u.pian} / ${u.title}`;
  box.innerHTML=`<h3>随机抽背</h3><div class="s" style="color:#888;font-size:13px;margin-bottom:10px">${ctx}</div>
   <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:6px">请回忆空格中的内容：</div>
   <div id="randQ" style="font-size:16.5px;line-height:2.1;background:#f4f9f8;border:1px solid #dcebe7;border-radius:10px;padding:12px 16px"></div>
   <div id="randAns" style="display:none;margin:14px 0 6px;font-size:20px;font-weight:800;color:var(--accent-deep)"></div>
   <div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" id="randShow">显示答案</button>
   <button class="btn" id="randNext">换一题</button><button class="btn" id="randGo">去该知识点</button></div>`;
  document.getElementById('randQ').textContent=qText;
  const showA=()=>{const d=document.getElementById('randAns');d.style.display='';d.textContent='答案：'+answer;};
  document.getElementById('randShow').onclick=showA;
  document.getElementById('randNext').onclick=randomDrill;
  document.getElementById('randGo').onclick=()=>{mask.style.display='none';showUnit(u.id);};
  mask.style.display='flex';
  mask.onclick=(e)=>{if(e.target===mask)mask.style.display='none';};
}
/* ================= 搜索 ================= */
function initSearch(){
  const inp=document.getElementById('searchInput'),res=document.getElementById('searchResult');
  inp.oninput=()=>{
    const q=inp.value.trim(); if(!q){res.style.display='none';return;}
    const hits=[];
    DATA.forEach(u=>{
      if(u.title.includes(q))hits.push([u,99]);
      else{let score=0;u.blocks.forEach(b=>blockTokList(b).forEach(t=>{if(t.t&&t.t.includes(q))score+=2;if(t.a&&t.a.includes(q))score+=5;}));
        (u.notes||[]).forEach(x=>{if(x.includes(q))score+=3;}); if(score)hits.push([u,score]);}
    });
    hits.sort((a,b)=>b[1]-a[1]);
    res.innerHTML='';hits.slice(0,12).forEach(([u])=>{
      const d=el('div','',`<div>${u.title}</div><div class="path">${u.part} / ${u.pian}${u.zhang?' / '+u.zhang:''}</div>`);
      d.onclick=()=>{showUnit(u.id);res.style.display='none';inp.value='';};res.appendChild(d);});
    res.style.display=hits.length?'block':'none';
  };
  document.addEventListener('click',(e)=>{if(!e.target.closest('.search'))res.style.display='none';});
}
/* ================= 启动 ================= */
document.getElementById('btnRandom').onclick=randomDrill;
document.getElementById('btnContinue').onclick=()=>{const l=state.last;
  if(!l)return showHome();
  if(l.type==='unit')showUnit(l.id); else showChapter(l.id);};
document.getElementById('modalMask');
renderSidebar();initSearch();
function routeFromHash(){
  const h=location.hash;
  if(h==='#home')return showHome();
  if(h.startsWith('#u')){const id=parseInt(h.slice(2),10);if(!isNaN(id)&&DATA[id])return showUnit(id);}
  if(h.startsWith('#c')){const cid=decodeURIComponent(h.slice(2));if(chapters[cid])return showChapter(cid);}
  if(state.last&&state.last.type==='unit')showUnit(state.last.id);
  else if(state.last&&state.last.type==='chap')showChapter(state.last.id);
  else showHome();
}
window.addEventListener('hashchange',routeFromHash);
routeFromHash();
// 点击左上角标题回首页
const brand=document.querySelector('.logo'); if(brand){brand.style.cursor='pointer';brand.title='返回首页';brand.onclick=()=>{history.replaceState(null,'','#home');showHome();};}
</script>
