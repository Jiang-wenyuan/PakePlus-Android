"nblank": 10, "blocks": [{"type": "h2", "toks": [{"t": "1.哲学的基本问题\n哲学的基本问题是"}, {"a": "思维与存在", "ul": 16}, {"t": "的关系问题，即意识与物质的关系问题。"}]}, {"type": "h3", "toks": [{"t": "（1）物质和意识何者为"}, {"a": "第一性", "ul": 8}, {"t": "的问题\n对这一问题的不同回答，是"}, {"a": "唯物主义", "ul": 8}, {"t": "和"}, {"a": "唯心主义", "ul": 8}, {"t": "的根本分歧所在。\n凡认为物质决定意识的，就是唯物主义；凡认为意识决定物质的，就是唯心主义。"}]}, {"type": "h3", "toks": [{"t": "（2）物质和意识是否具有"}, {"a": "同一性", "ul": 8}, {"t": "的问题\n对这一问题的不同回答，是"}, {"a": "可知论", "ul": 8}, {"t": "和"}, {"a": "不可知论", "ul": 8}, {"t": "的根本分歧所在。"}]}, {"type": "h2", "toks": [{"t": "2.两大哲学派别"}]}, {"type": "h3", "toks": [{"t": "（1）唯物主义：认为物质决定意识\n古代朴素唯物主义：把物质归结为一种或几种"}, {"a": "实物", "ul": 8}, {"t": "。\n近代形而上学唯物主义：把物质归结为原子。\n现代唯物主义即辩证唯物主义和历史唯物主义：认为物质的唯一特性是客观实在性。"}]}, {"type": "h3", "toks": [{"t": "（2）唯心主义：认为意识决定物质\n主观唯心主义：主张"}, {"a": "人的精神", "ul": 8}, {"t": "是世界的本原。\n客观唯心主义：主张"}, {"a": "客观精神", "ul": 8}, {"t": "是世界的本原。"}]}], "quiz": [{"src": "真题", "stem": "哲学基本问题是思维和存在的关系问题，即意识与物质的关系问题。对思维和存在何者是第一性的不同回答，划分出：", "opts": {"A": "唯物主义和唯心主义", "B": "可知论和不可知论", "C": "一元论和二元论", "D": "辩证法和形而上学"}, "ans": "A"}, {"src": "母题", "stem": "关于哲学的基本问题，下列说法正确的是：", "opts": {"A": "哲学的基本问题是物质和存在的关系问题", "B": "哲学基本问题的第一方面划分了哲学的派别，是最重要的方面", "C": "哲学基本问题的第二方面是何者为第一性问题", "D": "根据何者为第一性区分了可知论和不可知论"}, "ans": "B"}, {"src": "母题", "stem": "下列哲学观点，对应错误的是：", "opts": {"A": "朴素唯物主义——气者，理之依也", "B": "现代唯物主义——物质的唯一特性是客观实在性", "C": "主观唯心主义——宇宙便是吾心，吾心即是宇宙", "D": "客观唯心主义——人是万物的尺度"}, "ans": "D"}, {"src": "拓展", "stem": "哲学的基本问题是____的关系问题，即意识与物质的关系问题。", "opts": {"A": "思维与存在", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "思维与存在"}, {"src": "拓展", "stem": "对这一问题的不同回答，是唯物主义和____的根本分歧所在。", "opts": {"A": "唯心主义", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "唯心主义"}, {"src": "拓展", "stem": "对这一问题的不同回答，是可知论和____的根本分歧所在。", "opts": {"A": "不可知论", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "不可知论"}], "branches": [{"h": "1.哲学的基本问题", "terms": ["思维与存在", "第一性", "唯物主义", "唯心主义", "同一性", "可知论", "不可知论"]}, {"h": "2.两大哲学派别", "terms": ["实物", "人的精神", "客观精神"]}], "notes": ["哲学基本问题=思维和存在（意识和物质）的关系：第一方面何者第一性（更重要）划分唯物/唯心；第二方面有无同一性划分可知论（人可以彻底认识世界）和不可知论（康德）。", "唯物主义三形态：古代朴素唯物主义（归为一种或几种实物，如金木水火土）、近代形而上学唯物主义（原子）、现代辩证唯物主义和历史唯物主义（物质唯一特性是客观实在性）。", "唯心主义：主观唯心=人的精神（人、我、心，如'吾心即宇宙'）；客观唯心=客观精神（上帝、道、理、理念、鬼神）。形而上学=片面、静止、孤立；辩证法=全面、发展、联系。"]}, {"id": 23, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "物质与意识", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.物质\n物质是标志客观实在的哲学范畴，"}, {"a": "客观实在性", "ul": 16}, {"t": "是物质的唯一特性。\n物质的"}, {"a": "根本属性", "ul": 8}, {"t": "和存在方式是运动。"}, {"a": "静止", "ul": 8}, {"t": "是运动的一种特殊的状态。\n"}, {"a": "运动", "ul": 6}, {"t": "是无条件的、永恒的、绝对的。"}, {"a": "静止", "ul": 6}, {"t": "是有条件的、暂时的、相对的。\n世界上的事物都是绝对运动和相对静止的统一。"}]}, {"type": "h2", "toks": [{"t": "2.意识\n意识的本质是人脑对客观存在的主观映象。"}, {"a": "人脑", "ul": 8}, {"t": "是意识的器官。"}]}, {"type": "h2", "toks": [{"t": "3.物质和意识的辩证关系\n物质"}, {"a": "决定", "ul": 8}, {"t": "意识，要求一切从实际出发。\n意识具有"}, {"a": "主观能动性", "ul": 16}, {"t": "，对物质起能动的反作用。正确的意识对事物的\n发展具有促进作用，错误的意识对事物的发展具有阻碍作用。\n"}, {"a": "尊重客观规律", "ul": 16}, {"t": "是正确发挥主观能动性的前提。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n人工智能"}]}, {"type": "h2", "toks": [{"t": "1.人工智能是人意识的延伸和补充，是意识具有主观能动性的体现。"}]}, {"type": "h2", "toks": [{"t": "2.人的意识是精神活动过程，人工智能是机械物理过程。"}]}, {"type": "h2", "toks": [{"t": "3.人工智能无法完全取代人的意识。"}]}, {"type": "h2", "toks": [{"t": "4.人工智能不具备意识独有的特点如具有自觉能动性、揭示规律等。"}]}], "quiz": [{"src": "真题", "stem": "“一切皆可以变，唯有我们的理想不能变；一切都可以老，唯有我们年轻的心不能老；一切都可以退，唯有我们前进的脚步不能退。”这首诗启示我们：", "opts": {"A": "运动是物质的唯一特性", "B": "物质是运动的，物质是运动的承担者", "C": "运动是静止的特殊状态", "D": "要正确把握绝对运动和相对静止的辩证关系"}, "ans": "D"}, {"src": "母题", "stem": "马克思主义哲学认为，物质是标志客观实在的哲学范畴。下列关于物质与意识的说法，错误的是：", "opts": {"A": "物质的唯一特性是客观实在性，它不依赖于人的意识而存在", "B": "运动是物质的根本属性和存在方式，静止是运动的特殊状态", "C": "意识是人脑的机能，其本质是人脑对客观存在的主观映象", "D": "意识对物质具有能动的反作用，因此意识可以直接改变客观事物的形态"}, "ans": "D"}, {"src": "母题", "stem": "“世界上的事物都是绝对运动和相对静止的统一”是辩证唯物主义的重要观点。下列诗句或名言中，蕴含的哲理与材料中关于“运动和静止”的表述一致的是：①人不能两次踏进同一条河流②日方中方睨，物方生方死③风定花犹落，鸟鸣山更幽④不是风动，不是幡动，仁者心动", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "习近平总书记在纪念五四运动100 周年大会上讲话指出，我们要建设的社会主义现代化强国，不仅要在物质上强，更要在精神上强。精神上强，才是更持久、更深沉、更有力量的。以上体现出的哲理是：", "opts": {"A": "意识第一性，物质第二性", "B": "意识对物质具有强大反作用", "C": "意识力量可以代替物质力量", "D": "物质决定意识"}, "ans": "B"}, {"src": "拓展", "stem": "物质是标志客观实在的哲学范畴，____是物质的唯一特性。", "opts": {"A": "客观实在性", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "客观实在性"}, {"src": "拓展", "stem": "____是无条件的、永恒的、绝对的。", "opts": {"A": "运动", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "运动"}, {"src": "拓展", "stem": "物质____意识，要求一切从实际出发。", "opts": {"A": "决定", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "决定"}], "branches": [{"h": "1.物质", "terms": ["客观实在性", "根本属性", "静止", "运动"]}, {"h": "2.意识", "terms": ["人脑"]}, {"h": "3.物质和意识的辩证关系", "terms": ["决定", "主观能动性", "尊重客观规律"]}], "notes": ["物质唯一特性=客观实在性（不依赖于人的主观意识）；根本属性和存在方式=运动；静止是运动的特殊状态；运动无条件、永恒、绝对，静止有条件、暂时、相对（例：卧看满天云不动，不知云与我俱东）。", "意识是人脑对客观存在的主观映象，人脑是器官；'意识是人脑的分泌物'属于庸俗唯物主义，是错误观点。", "物质决定意识要求一切从实际出发；意识具有能动反作用，正确意识促进、错误意识阻碍；正确发挥主观能动性的前提是尊重客观规律。", "【知识延伸】人工智能是意识的延伸和补充（机械物理过程），不具备自觉能动性、不能揭示规律，不能完全取代人的意识。"]}, {"id": 24, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "唯物辩证法的总特征", "nblank": 10, "blocks": [{"type": "p", "toks": [{"a": "联系", "ul": 8}, {"t": "和"}, {"a": "发展", "ul": 8}, {"t": "的观点是唯物辩证法的总观点和总特征。"}]}, {"type": "h2", "toks": [{"t": "1.事物的普遍联系"}]}, {"type": "h3", "toks": [{"t": "（1）联系的特征："}, {"a": "客观性", "ul": 8}, {"t": "、普遍性、多样性、"}, {"a": "条件性", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "①联系的客观性\n事物的联系是事物本身所固有的，不是"}, {"a": "主观臆想", "ul": 8}, {"t": "的。"}]}, {"type": "h4", "toks": [{"t": "②联系的普遍性\n任何事物内部的不同部分和要素之间都是相互联系的。任何事物都不能孤立存在，都同其他事物处于一定的联系之中。"}, {"a": "整个世界", "ul": 8}, {"t": "是相互联系的统一整体。"}]}, {"type": "h3", "toks": [{"t": "（2）整体和部分的辩证关系"}]}, {"type": "h4", "toks": [{"t": "①整体居于主导地位，整体"}, {"a": "统率", "ul": 8}, {"t": "着部分，整体具有部分所没有的新功能。"}]}, {"type": "h4", "toks": [{"t": "②部分影响整体，"}, {"a": "关键部分", "ul": 8}, {"t": "的功能及其变化甚至决定整体的功能。"}]}, {"type": "h2", "toks": [{"t": "2.事物的永恒发展\n发展的"}, {"a": "实质", "ul": 8}, {"t": "是新事物的产生和旧事物的灭亡。\n新旧事物区分的根本标志是是否同事物发展的"}, {"a": "必然趋势", "ul": 8}, {"t": "相符合。"}]}], "quiz": [{"src": "真题", "stem": "经济学家巴莱多认为，一个组织里有20%的人是最好的，70%的人是中间状态，10%的人是最差的，这是一个动态的曲线，企业管理者应主要抓好20%的骨干力量的管理，再以20%的少数带动80%的多数，这样可以提高企业效率。材料中体现的哲理是：", "opts": {"A": "部分功能常常决定着整体功能", "B": "整体的功能是部分功能之和", "C": "办事情必须立足整体，统筹全局", "D": "办事情要发挥关键部分的作用"}, "ans": "D"}, {"src": "母题", "stem": "唯物辩证法是关于普遍联系和永恒发展的科学。下列关于联系与发展的说法，正确的有几项？①联系具有普遍性，意味着任何两个事物之间都存在着必然的联系②整体居于主导地位，统率着部分，且整体具有部分所不具备的功能③发展的实质是新事物的产生和旧事物的灭亡，体现了事物的前进和上升④新旧事物区分的根本标志在于出现时间的先后顺序", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "B"}, {"src": "母题", "stem": "下列选项中，与“沉舟侧畔千帆过，病树前头万木春”这句诗蕴含的哲理相同的是：①芳林新叶催陈叶，流水前波让后波②旧时王谢堂前燕，飞入寻常百姓家③山重水复疑无路，柳暗花明又一村④无边落木萧萧下，不尽长江滚滚来", "opts": {"A": "①②", "B": "①④", "C": "②③", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "习近平总书记强调，坚持系统观念是基本思想和工作方法。下列哪个选项和系统观念体现的哲学道理不一致？", "opts": {"A": "全局在胸，统筹兼顾", "B": "覆巢之下，安有完卵", "C": "当局者迷，旁观者清", "D": "一招不慎，满盘全输"}, "ans": "D"}, {"src": "拓展", "stem": "____和发展的观点是唯物辩证法的总观点和总特征。", "opts": {"A": "联系", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "联系"}, {"src": "拓展", "stem": "（1）联系的特征：客观性、普遍性、多样性、____", "opts": {"A": "条件性", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "条件性"}, {"src": "拓展", "stem": "①整体居于主导地位，整体____着部分，整体具有部分所没有的新功能。", "opts": {"A": "统率", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "统率"}], "branches": [{"h": "要点", "terms": ["联系", "发展"]}, {"h": "1.事物的普遍联系", "terms": ["客观性", "条件性", "主观臆想", "整个世界", "统率", "关键部分"]}, {"h": "2.事物的永恒发展", "terms": ["实质", "必然趋势"]}], "notes": ["联系和发展是唯物辩证法的总观点、总特征。联系四性=客观性、普遍性、多样性、条件性：自在事物和人为事物的联系都客观（求神拜佛违背客观性）；普遍性=看似无联系实则相联系；条件性=具体联系须在一定条件下才具备。", "整体居于主导统率地位、具有部分没有的新功能；部分影响整体，关键部分功能甚至决定整体功能。", "发展的实质=新事物产生、旧事物灭亡（新出现≠新事物）；区分新旧事物的根本标志=是否符合事物发展的必然趋势。"]}, {"id": 25, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "对立统一规律", "nblank": 24, "blocks": [{"type": "p", "toks": [{"t": "对立统一规律又称矛盾规律，矛盾是反映客观事物内部或不同事物之间对立统一关系的哲学范畴。对立统一规律揭示了事物发展的"}, {"a": "源泉和动力", "ul": 16}, {"t": "，是唯物辩证法的"}, {"a": "实质和核心", "ul": 16}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.矛盾的"}, {"a": "基本属性", "ul": 8}, {"t": "：矛盾的同一性和斗争性\n矛盾的同一性是指矛盾双方"}, {"a": "相互依存", "ul": 8}, {"t": "、相互贯通的性质和趋势。\n矛盾的斗争性是指矛盾双方相互排斥、相互分离的性质和趋势。"}]}, {"type": "h2", "toks": [{"t": "2.矛盾的普遍性和特殊性"}]}, {"type": "h3", "toks": [{"t": "（1）矛盾的普遍性"}]}, {"type": "h4", "toks": [{"t": "①原理：矛盾无处不在、矛盾无时不有。"}]}, {"type": "h4", "toks": [{"t": "②方法论：坚持"}, {"a": "矛盾分析法", "ul": 16}, {"t": "，全面的看问题，"}, {"a": "一分为二", "ul": 8}, {"t": "的看问题。"}]}, {"type": "h3", "toks": [{"t": "（2）矛盾的特殊性"}]}, {"type": "h4", "toks": [{"t": "①原理：具体事物的矛盾及每一矛盾的不同方面各有其特点。矛盾的"}, {"a": "特殊性", "ul": 8}, {"t": "\n规定了一事物区别于其他事物的本质。"}]}, {"type": "h4", "toks": [{"t": "②方法论：做到"}, {"a": "具体问题具体分析", "ul": 16}, {"t": "。具体问题具体分析（矛盾的特殊性）是\n正确认识事物的"}, {"a": "基础", "ul": 8}, {"t": "和正确解决矛盾的"}, {"a": "关键", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）矛盾的普遍性和特殊性的关系\n矛盾的普遍性即矛盾的"}, {"a": "共性", "ul": 8}, {"t": "，矛盾的特殊性即矛盾的"}, {"a": "个性", "ul": 8}, {"t": "。矛盾的"}, {"a": "共性", "ul": 8}, {"t": "是无条件的、绝对的，矛盾的"}, {"a": "个性", "ul": 8}, {"t": "是有条件的、相对的。\n普遍性"}, {"a": "寓于", "ul": 8}, {"t": "特殊性之中，特殊性又都是包含着普遍性的特殊性，二者在一定条件下可以相互转化。"}]}, {"type": "h2", "toks": [{"t": "3.矛盾发展的不平衡性"}]}, {"type": "h3", "toks": [{"t": "（1）主要矛盾和次要矛盾\n主要矛盾：居于支配地位、对事物的发展过程起着决定作用的矛盾。\n次要矛盾：处于从属地位、对事物的发展过程不起决定作用的矛盾。"}]}, {"type": "h3", "toks": [{"t": "（2）矛盾主要方面和次要方面\n主要方面：居于支配地位的方面。"}, {"a": "事物的性质", "ul": 13}, {"t": "由主要矛盾的主要方面决定。\n次要方面：处于被支配地位的方面。"}]}, {"type": "h3", "toks": [{"t": "（3）坚持两点论和重点论的统一\n"}, {"a": "两点论", "ul": 8}, {"t": "就是全面论。在研究复杂事物的发展过程时，既要看到主要矛盾，又要看到次要矛盾；在研究某一矛盾时，既要看到矛盾的主要方面，又要看到矛盾的次要方面。\n"}, {"a": "重点论", "ul": 8}, {"t": "就是分清矛盾主次抓重点。要求在研究复杂事物的发展过程时，要着重地把握它的主要矛盾；在分析某一矛盾时，要着重地把握它的主要方面。"}]}, {"type": "h2", "toks": [{"t": "4.内部矛盾和外部矛盾（内因和外因）"}]}, {"type": "h3", "toks": [{"t": "（1）内因和外因的含义\n内因：事物的内部矛盾。\n外因：一事物与他事物的相互影响和相互作用，即外部矛盾。"}]}, {"type": "h3", "toks": [{"t": "（2）内因和外因的辩证关系\n内因是事物发展变化的"}, {"a": "根据", "ul": 8}, {"t": "，是"}, {"a": "第一位", "ul": 8}, {"t": "的原因。外因是事物发展变化的"}, {"a": "条件", "ul": 8}, {"t": "，是"}, {"a": "第二位", "ul": 8}, {"t": "的原因。"}, {"a": "外因", "ul": 8}, {"t": "通过"}, {"a": "内因", "ul": 8}, {"t": "而起作用。"}]}], "quiz": [{"src": "真题", "stem": "新型举国体制是当前我国推动关键核心技术攻关、实现高水平科技自立自强的重要法宝。“十五五”规划建议明确提出，完善新型举国体制，采取超常规措施，全链条推动集成电路、工业母机等重点领域关键核心技术攻关取得决定性突破。上述材料表明：", "opts": {"A": "主要矛盾对事物发展起决定作用，要集中力量解决主要矛盾", "B": "新事物在本质上优越于旧事物，要把握事物新陈代谢的规律", "C": "内因是事物发展变化的根据，应着重抓住事物发展的内部矛盾", "D": "整体功能大于部分功能之和，部分应服从和服务于整体"}, "ans": "A"}, {"src": "母题", "stem": "当前，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。这一论断体现了唯物辩证法关于矛盾不平衡性的原理。下列关于主要矛盾和次要矛盾、矛盾主要方面和次要方面的说法，正确的是：", "opts": {"A": "在复杂事物的发展过程中，主要矛盾处于支配地位，决定事物的发展", "B": "次要矛盾处于从属地位，对事物发展不起任何作用，因此可以忽略不计", "C": "事物的性质主要是由主要矛盾决定的，与矛盾的主要方面无关", "D": "坚持两点论就是全面论，要求我们在认识事物时平均用力，不分主次"}, "ans": "A"}, {"src": "母题", "stem": "“治国之道，富民为始；因地制宜，分类指导。”这一治理理念深刻体现了唯物辩证法关于矛盾问题的精髓。下列选项与“因地制宜，分类指导”蕴含哲理相同的是：①一把钥匙开一把锁②量体裁衣，对症下药③牵牛要牵牛鼻子④金无足赤，人无完人", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "A"}, {"src": "母题", "stem": "习近平总书记曾引用“物必先腐，而后虫生”来强调党风廉政建设的重要性。下列选项体现的哲理与这句古语一致的是：①打铁还需自身硬②近朱者赤，近墨者黑③族秦者，秦也，非天下也④好风凭借力，送我上青云", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "下列与“投之亡地然后存，陷之死地然后生”蕴含的哲学原理相同的是：", "opts": {"A": "一夫当关，万夫莫开", "B": "金无足赤，人无完人", "C": "射人先射马，擒贼先擒王", "D": "乱生于治，怯生于勇"}, "ans": "D"}, {"src": "拓展", "stem": "对立统一规律揭示了事物发展的____，是唯物辩证法的实质和核心", "opts": {"A": "源泉和动力", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "源泉和动力"}, {"src": "拓展", "stem": "正确认识事物的____和正确解决矛盾的关键", "opts": {"A": "基础", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "基础"}, {"src": "拓展", "stem": "____由主要矛盾的主要方面决定。", "opts": {"A": "事物的性质", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "事物的性质"}], "branches": [{"h": "要点", "terms": ["源泉和动力", "实质和核心"]}, {"h": "1.矛盾的", "terms": ["基本属性", "相互依存"]}, {"h": "2.矛盾的普遍性和特殊性", "terms": ["矛盾分析法", "一分为二", "特殊性", "具体问题具体分析", "基础", "关键", "共性"]}, {"h": "3.矛盾发展的不平衡性", "terms": ["事物的性质", "两点论", "重点论"]}, {"h": "4.内部矛盾和外部矛盾（内因和外因）", "terms": ["根据", "第一位", "条件", "第二位", "外因", "内因"]}], "notes": ["对立统一规律（矛盾规律）是唯物辩证法的实质和核心，揭示发展的源泉和动力。", "同一性=矛盾双方相互依存（一方以另一方存在为前提，如高低相比较而存在）、相互贯通（一定条件下相互转化，如塞翁失马、坏事变好事）；斗争性=相互排斥、相互分离（非此即彼、此消彼长）。", "普遍性=无时不有、无处不在→一分为二（金无足赤人无完人）；特殊性→具体问题具体分析（因材施教、因地制宜、骏马能历险犁田不如牛），是正确认识事物的基础和正确解决矛盾的关键；共性（无条件、绝对）寓于个性（有条件、相对）之中。", "主次矛盾/主次方面：两点论=全面看，重点论=抓重点；擒贼先擒王=抓主要矛盾，'功过三七开''一国两制'=抓主要方面（事物性质由主要矛盾的主要方面决定）。", "内因是根据（第一位，独立自主），外因是条件（第二位，对外开放），外因通过内因起作用（名师出高徒、师傅领进门修行在个人）。"]}, {"id": 26, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "量变质变规律", "nblank": 6, "blocks": [{"type": "p", "toks": [{"t": "量变质变规律揭示了事物发展的"}, {"a": "形式和状态", "ul": 16}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.量变和质变的区分标志\n区分量变和质变的根本标志是事物变化是否超出"}, {"a": "度", "ul": 8}, {"t": "的范围。\n度就是事物保持其质的存在的量的限度、幅度和范围。"}]}, {"type": "h2", "toks": [{"t": "2.量变和质变的辩证关系\n量变是质变的必要"}, {"a": "准备", "ul": 8}, {"t": "。\n质变是量变的必然"}, {"a": "结果", "ul": 8}, {"t": "，量变"}, {"a": "达到一定程度", "ul": 16}, {"t": "必然引起质变。\n量变和质变是相互渗透的。"}]}, {"type": "h2", "toks": [{"t": "3.方法论"}]}, {"type": "h3", "toks": [{"t": "（1）重视量的积累；（2）不失时机地促成事物的飞跃；（3）坚持"}, {"a": "适度原则", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "习近平总书记说：“干事业好比钉钉子，钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲，直到把钉子钉实钉牢，钉牢一颗再钉下一颗，不断钉下去，必然大有成效”。关于这句话说法正确的是：①量变比质变更能推动事物的发展②只有事物数量的不断增加才能引起质变③量的不断积累必然导致质的飞跃④事物的发展是从量变到质变再到新的量变的循环往复的上升过程", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "D"}, {"src": "母题", "stem": "毫不节制地食用高盐、高脂、熏炸、腌制食物会增加患胃癌的几率，遗传和环境因素共同作用于基因组，增加了基因组的不稳定性，在经过长时间后正常细胞就会逐渐变成肿瘤细胞。正常细胞癌变说明：①量变是质变的前提②质变是量变的必然结果③量变是事物数量的增减④量变不明显，可以忽略量变", "opts": {"A": "①③", "B": "③④", "C": "①②", "D": "①④"}, "ans": "C"}, {"src": "母题", "stem": "“不积跬步，无以至千里；不积小流，无以成江海。”下列选项与这句古语蕴含的哲理相同的是：①勿以恶小而为之，勿以善小而不为②锲而不舍，金石可镂③历尽天华成此景，人间万事出艰辛④泰山不让土壤，故能成其大", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "①②④"}, "ans": "D"}, {"src": "母题", "stem": "习近平总书记指出，要善于运用底线思维，凡事从坏处准备，努力争取最好的结果，做到有备无患、遇事不慌，牢牢把握主动权。这一论述体现的方法论是：", "opts": {"A": "重视量的积累，积极促成事物的飞跃", "B": "坚持适度原则，注意分寸，掌握火候", "C": "抓住主要矛盾，集中力量解决关键问题", "D": "坚持两点论和重点论的统一，统筹兼顾"}, "ans": "B"}, {"src": "拓展", "stem": "量变质变规律揭示了事物发展的____", "opts": {"A": "形式和状态", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "形式和状态"}, {"src": "拓展", "stem": "量变是质变的必要____", "opts": {"A": "准备", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "准备"}, {"src": "拓展", "stem": "质变是量变的必然____，量变达到一定程度必然引起质变。", "opts": {"A": "结果", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "结果"}], "branches": [{"h": "要点", "terms": ["形式和状态"]}, {"h": "2.量变和质变的辩证关系", "terms": ["准备", "结果", "达到一定程度"]}, {"h": "3.方法论", "terms": ["适度原则"]}], "notes": ["量变质变规律揭示事物发展的形式和状态；区分量变和质变的标志=是否超出'度'（度是保持事物质的数量界限）。", "量变是必要准备、质变是必然结果（'量变达到一定程度必然引起质变'中'一定程度'不能丢），二者相互渗透（千里之行始于足下）。", "例子：水在0–100℃内是量变，低于0℃或高于100℃是质变；方法论=重视量的积累、不失时机促成飞跃、坚持适度原则（底线思维就是守住临界点、防止坏的质变）。"]}, {"id": 27, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "否定之否定规律", "nblank": 9, "blocks": [{"type": "p", "toks": [{"t": "否定之否定规律揭示了事物发展的"}, {"a": "方向和道路", "ul": 16}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.辩证的否定观"}]}, {"type": "h3", "toks": [{"t": "（1）辩证的否定是事物的"}, {"a": "自我否定", "ul": 8}, {"t": "，是事物内部矛盾运动的结果。"}]}, {"type": "h3", "toks": [{"t": "（2）辩证的否定是事物"}, {"a": "发展", "ul": 8}, {"t": "的环节。"}]}, {"type": "h3", "toks": [{"t": "（3）辩证的否定是事物"}, {"a": "联系", "ul": 8}, {"t": "的环节。"}]}, {"type": "h3", "toks": [{"t": "（4）辩证的否定的实质是“"}, {"a": "扬弃", "ul": 8}, {"t": "”，即既克服又保留。"}]}, {"type": "h2", "toks": [{"t": "2.事物发展的辩证否定的过程——否定之否定"}]}, {"type": "h3", "toks": [{"t": "（1）事物的发展表现为"}, {"a": "螺旋式", "ul": 8}, {"t": "上升和"}, {"a": "波浪式", "ul": 8}, {"t": "前进的过程。"}]}, {"type": "h3", "toks": [{"t": "（2）事物的发展过程是"}, {"a": "前进性", "ul": 8}, {"t": "和"}, {"a": "曲折性", "ul": 8}, {"t": "的统一。"}]}], "quiz": [{"src": "真题", "stem": "习近平总书记指出，我们从来都是在风雨洗礼中成长、在历经考验中壮大，大家要充满信心。这体现了哪些哲学道理：①事物发展的道路是曲折的，方向是前进的②实践是检验真理的唯一标准③要坚持两点论和重点论统一④要重视发挥人的主观能动性", "opts": {"A": "①②", "B": "①③", "C": "①④", "D": "①②③"}, "ans": "C"}, {"src": "母题", "stem": "下列关于辩证否定观的说法，错误的是：", "opts": {"A": "辩证的否定是事物联系的环节", "B": "辩证的否定是事物发展的环节", "C": "辩证的否定是外力作用的结果，是主观任意的否定", "D": "辩证的否定的实质是“扬弃”，即既克服又保留"}, "ans": "C"}, {"src": "母题", "stem": "否定之否定规律揭示了事物发展的方向和道路，即事物的发展是前进性和曲折性的统一。下列选项能够体现这一哲理的是：①冰冻三尺，非一日之寒②宝剑锋从磨砺出，梅花香自苦寒来③青，取之于蓝，而青于蓝④无限风光在险峰", "opts": {"A": "①②", "B": "①③", "C": "②③", "D": "②④"}, "ans": "D"}, {"src": "拓展", "stem": "否定之否定规律揭示了事物发展的____", "opts": {"A": "方向和道路", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "方向和道路"}, {"src": "拓展", "stem": "（3）辩证的否定是事物____的环节。", "opts": {"A": "联系", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "联系"}, {"src": "拓展", "stem": "（1）事物的发展表现为螺旋式上升和____前进的过程。", "opts": {"A": "波浪式", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "波浪式"}], "branches": [{"h": "要点", "terms": ["方向和道路"]}, {"h": "1.辩证的否定观", "terms": ["自我否定", "发展", "联系", "扬弃"]}, {"h": "2.事物发展的辩证否定的过程——否定之否定", "terms": ["螺旋式", "波浪式", "前进性", "曲折性"]}], "notes": ["否定之否定规律揭示事物发展的方向和道路；发展是事物的自我否定（解决内部矛盾）。", "辩证否定是发展的环节、联系的环节，实质是'扬弃'=既克服又保留（守正创新就是变与不变的扬弃）。", "发展过程是螺旋式上升、波浪式前进，是前进性与曲折性的统一（麦粒→麦苗→新麦粒，道路曲折、方向前进）。"]}, {"id": 28, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "实践与认识", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.实践"}]}, {"type": "h3", "toks": [{"t": "（1）含义\n人类能动地改造世界的社会性的客观物质活动。\n实践是主观见之于客观的活动，是沟通"}, {"a": "主观和客观", "ul": 16}, {"t": "的桥梁。"}]}, {"type": "h3", "toks": [{"t": "（2）基本特征\n"}, {"a": "直接现实性", "ul": 16}, {"t": "（客观物质性）、"}, {"a": "自觉能动性", "ul": 16}, {"t": "、社会历史性。"}]}, {"type": "h3", "toks": [{"t": "（3）基本形式\n"}, {"a": "物质生产实践", "ul": 16}, {"t": " 、社会政治实践、"}, {"a": "科学文化实践", "ul": 16}, {"t": " 。其中，"}, {"a": "物质生产实践", "ul": 16}, {"t": "是最基本的、首要的实践活动。"}]}, {"type": "h2", "toks": [{"t": "2.认识"}]}, {"type": "h3", "toks": [{"t": "（1）本质\n主体在"}, {"a": "实践", "ul": 8}, {"t": "基础上对客体的能动的反映。"}]}, {"type": "h3", "toks": [{"t": "（2）特征\n认识具有"}, {"a": "主体差异性", "ul": 16}, {"t": "。主体在认识活动中自觉地将其自身因素即主体因素投入认识过程，融合或凝结于认识结果而使认识不可避免地带有主体属性。"}]}, {"type": "h2", "toks": [{"t": "3.实践和认识的辩证关系"}]}, {"type": "h3", "toks": [{"t": "（1）实践决定认识"}]}, {"type": "h4", "toks": [{"t": "①实践是认识的"}, {"a": "来源", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "②实践是认识发展的"}, {"a": "动力", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③实践是认识的"}, {"a": "目的", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "④实践是检验认识真理的"}, {"a": "唯一标准", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）认识反作用于实践\n正确的认识对实践起着积极的促进作用；错误的认识则对实践起消极的阻碍作用，甚至导致实践的失败。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n典型例句"}]}, {"type": "h2", "toks": [{"t": "1.实践是认识的来源。例句：近水知鱼性，近山识鸟音。"}]}, {"type": "h2", "toks": [{"t": "2.实践是认识发展的动力。例句：社会一旦有技术上的需要，这种需要就会\n比十所大学更能把科学推向前进。"}]}, {"type": "h2", "toks": [{"t": "3.实践是认识的目的。例句：精通的目的全在于应用。"}]}, {"type": "h2", "toks": [{"t": "4.实践是检验认识真理性的唯一标准。例句：路遥知马力，日久见人心。"}]}], "quiz": [{"src": "真题", "stem": "马克思说：“劳动过程结束时得到的结果，在这个过程开始时就已经在劳动者的表象中存在着，即已经观念地存在着。”这句话表明：", "opts": {"A": "意识先于物质而存在", "B": "实践是有意识、有目的的能动性活动", "C": "认识对社会发展具有决定作用", "D": "实践是认识的来源"}, "ans": "B"}, {"src": "母题", "stem": "马克思主义哲学认为，实践是人类能动地改造世界的社会性的客观物质活动。下列关于实践基本特征的说法，错误的是：", "opts": {"A": "实践具有直接现实性，能够把人们头脑中观念的存在变为现实的存在", "B": "实践具有自觉能动性，是有目的、有意识的活动", "C": "实践具有社会历史性，是处在一定社会关系中的人的活动", "D": "实践具有主观随意性，不受客观规律和客观条件的制约"}, "ans": "D"}, {"src": "母题", "stem": "习近平总书记强调：“实践没有止境，理论创新也没有止境。”从认识论的角度看，实践是认识发展的动力。下列选项能够体现这一哲理的是：①社会上一旦有技术上的需要，这种需要会比十所大学更能把科学推向前进②穷理以致其知，反躬以践其实③操千曲而后晓声，观千剑而后识器④人的智力是按照人如何学会改变自然界而发展的", "opts": {"A": "①②", "B": "①④", "C": "②③", "D": "③④"}, "ans": "B"}, {"src": "母题", "stem": "面对复杂的国际形势和国内改革发展稳定任务，党中央强调要深入调查研究，听真话、察实情。从哲学角度看，这是因为：①实践是认识的来源，只有通过实践才能了解事物的真实情况②认识具有主体差异性，不同主体对同一事物的认识必然不同③实践是认识的目的，调研成果最终要转化为解决问题的实招④物质生产实践是人类最基本的实践活动，决定了社会的性质", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "B"}, {"src": "拓展", "stem": "实践是主观见之于客观的活动，是沟通____的桥梁。", "opts": {"A": "主观和客观", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "主观和客观"}, {"src": "拓展", "stem": "____ 、社会政治实践、科学文化实践 。", "opts": {"A": "物质生产实践", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "物质生产实践"}, {"src": "拓展", "stem": "主体在____基础上对客体的能动的反映。", "opts": {"A": "实践", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "实践"}], "branches": [{"h": "1.实践", "terms": ["主观和客观", "直接现实性", "自觉能动性", "物质生产实践", "科学文化实践"]}, {"h": "2.认识", "terms": ["实践", "主体差异性"]}, {"h": "3.实践和认识的辩证关系", "terms": ["来源", "动力", "目的", "唯一标准"]}], "notes": ["实践是人类能动地改造世界的社会性的客观物质活动，是主观见之于客观、沟通主客观的桥梁；三特征=直接现实性、自觉能动性、社会历史性；基本形式中物质生产实践最基本，是其他实践的前提和最终目的。", "认识是实践基础上主体对客体的能动反映（属于一种意识），具有主体差异性（不同人有不同认识）。", "实践决定认识：来源（近水知鱼性）、动力（社会技术需要比十所大学更能推动科学）、目的（精通的目的全在于应用）、检验真理的唯一标准（路遥知马力）；认识反作用于实践，正确促进、错误阻碍。"]}, {"id": 29, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "认识的辩证过程", "nblank": 8, "blocks": [{"type": "p", "toks": [{"t": "认识的辩证过程就是在实践基础上由感性认识到理性认识（第一次飞跃）、又由理性认识到"}, {"a": "实践", "ul": 8}, {"t": "（第二次飞跃）的能动飞跃。"}, {"a": "第二次", "ul": 8}, {"t": "飞跃，更为重要、更有意义。"}]}, {"type": "h2", "toks": [{"t": "1.感性认识\n感性认识是认识的"}, {"a": "初级", "ul": 8}, {"t": "阶段，包括"}, {"a": "感觉、知觉、表象", "ul": 24}, {"t": "三种形式。"}]}, {"type": "h2", "toks": [{"t": "2.理性认识\n理性认识是认识的"}, {"a": "高级", "ul": 8}, {"t": "阶段，包括"}, {"a": "概念、判断、推理", "ul": 24}, {"t": "三种形式。"}]}, {"type": "h2", "toks": [{"t": "3.感性认识和理性认识的关系\n第一，理性认识"}, {"a": "依赖于", "ul": 8}, {"t": "感性认识。第二，"}, {"a": "感性认识", "ul": 8}, {"t": "有待于发展和深化为理\n性认识。第三，感性认识和理性认识相互渗透、相互包含。"}]}], "quiz": [{"src": "真题", "stem": "通常我们能感知到某物，但无法立刻理解它，但当我们理解某物时反而会更深刻地感知它，这说明：", "opts": {"A": "感性认识具有局限性", "B": "感性认识是认识的初级阶段，理性认识是认识的高级阶段", "C": "理性认识是感性认识的前提", "D": "感性认识无法帮助我们认识事物"}, "ans": "B"}, {"src": "母题", "stem": "下列关于感性认识和理性认识的表述正确的是：", "opts": {"A": "理性认识是认识的高级阶段，反映事物的本质和内部联系", "B": "感性认识是认识的初级阶段，包括概念、判断、推理三种形式", "C": "理性认识有待于发展和深化为感性认识", "D": "感性认识依赖于理性认识"}, "ans": "B"}, {"src": "拓展", "stem": "认识的辩证过程就是在____基础上由感性认识到理性认识（第一次飞跃）、又由理性认识到实践（第二次飞跃）的能动飞跃。", "opts": {"A": "实践", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "实践"}, {"src": "拓展", "stem": "感性认识是认识的____阶段，包括感觉、知觉、表象三种形式。", "opts": {"A": "初级", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "初级"}, {"src": "拓展", "stem": "第一，理性认识____感性认识。", "opts": {"A": "依赖于", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "依赖于"}], "branches": [{"h": "要点", "terms": ["实践", "第二次"]}, {"h": "1.感性认识", "terms": ["初级"]}, {"h": "2.理性认识", "terms": ["高级"]}, {"h": "3.感性认识和理性认识的关系", "terms": ["依赖于", "感性认识"]}], "notes": ["两次飞跃：感性认识→理性认识是第一次飞跃；理性认识→实践是第二次飞跃，更重要、更有意义。", "感性认识是初级阶段，形式=感觉、知觉、表象，反映现象；理性认识是高级阶段，形式=概念、判断、推理，把握本质（靠大脑分析加工）；理性认识依赖感性认识，感性认识有待发展为理性认识，二者相互渗透包含。"]}, {"id": 30, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "真理", "nblank": 4, "blocks": [{"type": "h2", "toks": [{"t": "1.真理的含义\n真理是标志主观与客观相符合的范畴，是人们对客观事物及其规律的\n"}, {"a": "正确认识", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.真理的属性"}]}, {"type": "h3", "toks": [{"t": "（1）真理具有客观性\n真理的"}, {"a": "内容", "ul": 8}, {"t": "是客观的；检验真理的"}, {"a": "标准", "ul": 8}, {"t": "实践是客观的。"}]}, {"type": "h3", "toks": [{"t": "（2）真理具有绝对性和相对性\n真理的绝对性（无条件性）：任何真理都是客观事物及其规律的正确反映。\n人的认识按其本性是能够正确认识无限发展的客观世界的。\n真理的相对性（条件性）：人们在一定条件下对客观事物及其本质和发展规律的正确认识总是有限度的、不完善的。\n真理的绝对性和相对性是"}, {"a": "同一客观真理", "ul": 16}, {"t": "的两种属性，并不是两个真理。"}]}], "quiz": [{"src": "真题", "stem": "在地球的地面环境下，乒乓球放入水里，会浮到水面上；在太空空间站微重力环境下，做同样的实验，乒乓球在水中的浮力消失，没有浮到水面。这表明：", "opts": {"A": "真理标志主观与客观相符合", "B": "真理是对客观事物及其规律的正确反映", "C": "真理包含着不依赖于人和人的意识的客观内容", "D": "真理是对客观对象一定方面、一定层次、一定程度的正确认识"}, "ans": "D"}, {"src": "母题", "stem": "关于真理，下列说法正确的有几项？①真理是人们对客观事物及其规律的正确认识②真理之所以具有客观性是因为真理的内容和检验标准都是客观的③真理具有绝对性和相对性指的是同一认识可以有两个真理④实践之所以是检验真理的唯一标准是因为实践具有自觉能动性", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "B"}, {"src": "母题", "stem": "人们常说“两点之间直线最短”，这个说法在平直的欧几里得空间中成立。但在广义相对论描述的引力场中，光线经过大质量天体附近时会发生弯曲，此时“最短路径”不再是直线而是测地线。这一现象说明：", "opts": {"A": "任何真理都有自己适用的条件和范围", "B": "实践是认识的来源和发展动力", "C": "任何真理都包含着不依赖于主体和人类的客观内容", "D": "真理与谬误相互包含、相互渗透"}, "ans": "A"}, {"src": "拓展", "stem": "真理的____是客观的；", "opts": {"A": "内容", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "内容"}, {"src": "拓展", "stem": "检验真理的____实践是客观的。", "opts": {"A": "标准", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "标准"}, {"src": "拓展", "stem": "真理的绝对性和相对性是____的两种属性，并不是两个真理。", "opts": {"A": "同一客观真理", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "同一客观真理"}], "branches": [{"h": "1.真理的含义", "terms": ["正确认识"]}, {"h": "2.真理的属性", "terms": ["内容", "标准", "同一客观真理"]}], "notes": ["真理是标志主观同客观相符合的哲学范畴，是对客观事物及其规律的正确认识（真理是一种正确认识）。", "客观性是最基本属性；绝对性（无条件）与相对性（有条件，如'平面条件下'三角形内角和180°）是同一真理的两种属性，不是两个真理；真理一元论=同一条件下对同一事物的正确认识只有一个。", "'真理掌握在少数人/多数人手中''有用即真理'都是错误说法（掺杂了人的主观性）。"]}, {"id": 31, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "社会存在与社会意识", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.社会历史观的基本问题\n"}, {"a": "社会存在和社会意识", "ul": 24}, {"t": "的关系问题是社会历史观的基本问题，对这一问\n题的不同回答，是唯物史观和唯心史观的根本分歧所在。\n唯物史观（历史唯物主义）认为社会存在决定社会意识。唯心史观（历史唯\n心主义）认为社会意识决定社会存在。"}]}, {"type": "h2", "toks": [{"t": "2.社会存在和社会意识"}]}, {"type": "h3", "toks": [{"t": "（1）社会存在\n社会存在是社会生活的物质方面，主要包括自然地理环境、"}, {"a": "人口因素", "ul": 8}, {"t": "和"}, {"a": "物质生产方式", "ul": 16}, {"t": "。自然地理环境和人口因素对社会发展起"}, {"a": "促进或延缓", "ul": 16}, {"t": "的作用。"}, {"a": "物质生产方式", "ul": 16}, {"t": "是社会存在和发展的基础及决定力量。"}]}, {"type": "h3", "toks": [{"t": "（2）社会意识\n社会意识是社会生活的精神方面。从社会意识对经济基础的关系划分可分为意识形态和非意识形态。"}]}, {"type": "h4", "toks": [{"t": "①意识形态是指反映并服务于经济基础的社会意识，具体包括政治法律思想、\n"}, {"a": "道德", "ul": 8}, {"t": "、艺术、宗教、"}, {"a": "哲学", "ul": 8}, {"t": "和大部分社会科学。"}, {"a": "具有", "ul": 8}, {"t": "阶级性。"}]}, {"type": "h4", "toks": [{"t": "②非意识形态是指反映自然现象和不属于特定经济基础的某些社会现象的社\n会意识形式，主要包括"}, {"a": "自然科学", "ul": 8}, {"t": "、一部分社会科学和"}, {"a": "思维科学", "ul": 8}, {"t": "，如语言学、逻辑学、心理学等。"}, {"a": "不具有", "ul": 8}, {"t": "阶级性。"}]}, {"type": "h3", "toks": [{"t": "（3）社会存在和社会意识的辩证关系"}]}, {"type": "h4", "toks": [{"t": "①社会存在决定社会意识。"}]}, {"type": "h4", "toks": [{"t": "②社会意识反作用于社会存在。即先进的或正确的社会意识对社会存在的发\n展起积极的推动作用，促进社会向前发展。落后的或错误的社会意识对社会存在的发展起消极的阻碍作用，延缓社会的发展进程。"}]}, {"type": "h4", "toks": [{"t": "③社会意识具有"}, {"a": "相对独立性", "ul": 16}, {"t": "。主要表现在：社会意识与社会存在变化\n发展的不完全同步性和"}, {"a": "不平衡性", "ul": 8}, {"t": "；社会意识内部各种形式之间的"}, {"a": "相互影响", "ul": 8}, {"t": "及各自具有的"}, {"a": "历史继承性", "ul": 16}, {"t": "；社会意识对社会存在的能动反作用。"}]}], "quiz": [{"src": "真题", "stem": "习近平总书记指出，共和国是红色的，不能淡化这个颜色。一个国家、一个民族不能没有灵魂。作为意识形态重要阵地的文化艺术、社会科学，更需要灵魂。灵魂凝铸于历史。这说明：", "opts": {"A": "当上层建筑适合经济基础状况时，必然推动社会进步", "B": "社会时代的变化、发展决定社会意识的变化、发展", "C": "先进的社会意识对社会发展起积极的推动作用", "D": "社会意识对社会发展起消极的阻碍作用"}, "ans": "C"}, {"src": "母题", "stem": "下列关于社会存在与社会意识的说法，正确的有几项？①社会存在和社会意识的关系问题是划分唯物史观和唯心史观的根本标准②自然地理环境是社会存在和发展的基础及决定力量③语言学、逻辑学、心理学、社会学均属于非意识形态④唯物史观认为社会存在决定社会意识", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "B"}, {"src": "母题", "stem": "宋朝是词的盛世。其实，词原本主要是为酒肆乐坊而作的歌词。随着宋朝市井生活的日益繁华，酒肆乐坊越来越多，因而对词的需求也大量增加。渐渐地，词也从市井街巷登上了大雅之堂。由此可见：①社会意识的发展与社会存在具有不完全同步性②先进社会意识对社会存在的发展起积极的推动作用③社会意识是对社会存在的能动反映④社会存在决定社会意识，社会意识随社会存在的发展而发展", "opts": {"A": "①②", "B": "①③", "C": "②④", "D": "③④"}, "ans": "D"}, {"src": "拓展", "stem": "____的关系问题是社会历史观的基本问题，对这一问", "opts": {"A": "社会存在和社会意识", "B": "马克思主义哲学", "C": "具体问题具体分析", "D": "生产力与生产关系"}, "ans": "A", "real": "社会存在和社会意识"}, {"src": "拓展", "stem": "____是社会存在和发展的基础及决定力量。", "opts": {"A": "物质生产方式", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "物质生产方式"}, {"src": "拓展", "stem": "会意识形式，主要包括自然科学、一部分社会科学和____，如语言学、逻辑学、心理学等。", "opts": {"A": "思维科学", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "思维科学"}], "branches": [{"h": "1.社会历史观的基本问题", "terms": ["社会存在和社会意识"]}, {"h": "2.社会存在和社会意识", "terms": ["人口因素", "物质生产方式", "促进或延缓", "道德", "哲学", "具有", "自然科学"]}], "notes": ["社会历史观的基本问题=社会存在和社会意识的关系问题：唯物史观认为社会存在决定社会意识。", "社会存在=自然地理环境、人口因素、物质生产方式；物质资料生产方式是基础和决定力量（人类必须先进行物质生产才能从事其他活动）。", "社会意识分意识形态（政法思想、道德、艺术、宗教、哲学等，有阶级性）和非意识形态（自然科学、语言学、逻辑学等，无阶级性）；社会意识具有相对独立性，最突出表现是能动的反作用（先进推动、落后阻碍）。"]}, {"id": 32, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "社会发展的基本规律", "nblank": 18, "blocks": [{"type": "p", "toks": [{"t": "社会历史发展的基本规律指社会的基本矛盾运动，社会基本矛盾包括"}, {"a": "生产力与生产关系", "ul": 24}, {"t": "的矛盾、经济基础与上层建筑的矛盾。社会基本矛盾是社会历史发展的根本动力。"}]}, {"type": "h2", "toks": [{"t": "1.生产力与生产关系的矛盾运动及其规律"}]}, {"type": "h3", "toks": [{"t": "（1）生产力\n生产力指人类在物质生产过程中形成的改造和影响自然以使其适合自身需要的物质力量。生产力表现的是"}, {"a": "人与自然", "ul": 8}, {"t": " 的关系。生产力是人类社会的"}, {"a": "最终决定力量", "ul": 16}, {"t": "，是衡量社会进步的最高、"}, {"a": "最根本", "ul": 8}, {"t": "的标准。\n生产力的基本要素包括"}, {"a": "劳动者", "ul": 8}, {"t": "、"}, {"a": "劳动资料", "ul": 8}, {"t": "、劳动对象。"}, {"a": "劳动者", "ul": 8}, {"t": "起主导作用。"}, {"a": "生产工具", "ul": 8}, {"t": "是劳动资料的主要内容，是生产力发展水平的客观标志。\n科学技术是生产力中的重要因素。"}]}, {"type": "h3", "toks": [{"t": "（2）生产关系\n生产关系是指人们在物质生产过程中形成的不以人的意志为转移的经济关系，即"}, {"a": "人与人", "ul": 8}, {"t": "之间的关系。生产关系由"}, {"a": "生产资料的所有制形式", "ul": 24}, {"t": "、人们在生产中的地位和相互关系、"}, {"a": "产品分配形式", "ul": 16}, {"t": "等方面构成。\n"}, {"a": "生产资料所有制形式", "ul": 24}, {"t": "是生产关系的基础，是区分社会制度的根本标志，是判断各种社会形态性质的客观依据。"}]}, {"type": "h3", "toks": [{"t": "（3）生产力和生产关系的辩证关系及其矛盾运动\n生产力决定生产关系；生产关系对生产力具有能动的反作用；生产力与生产关系的矛盾运动推动社会生产发展。"}]}, {"type": "h2", "toks": [{"t": "2.经济基础与上层建筑的矛盾运动及其规律"}]}, {"type": "h3", "toks": [{"t": "（1）经济基础\n经济基础是指由社会一定发展阶段的生产力所决定的生产关系的总和。经济基础中具有决定意义的是"}, {"a": "生产资料所有制", "ul": 16}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）上层建筑\n上层建筑是建立在一定经济基础之上的意识形态以及与之相应的制度、组织和设施。\n它由意识形态以及政治法律制度及设施和政治组织两部分组成。"}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "观念", "ul": 8}, {"t": "上层建筑（意识形态）：包括政治法律思想、道德、艺术、宗教、\n哲学等思想观点。"}]}, {"type": "h4", "toks": [{"t": "②"}, {"a": "政治上", "ul": 8}, {"t": "层建筑（政治法律制度及设施和政治组织）：包括国家政治制度、\n立法司法制度和行政制度，以及国家政权机构、政党、军队、警察、法庭、监狱等政治组织形态和设施。\n在整个上层建筑中，"}, {"a": "政治", "ul": 8}, {"t": "上层建筑居主导地位，"}, {"a": "国家政权", "ul": 8}, {"t": "是核心。"}]}, {"type": "h3", "toks": [{"t": "（3）经济基础和上层建筑的辩证关系及其矛盾运动\n经济基础决定上层建筑；上层建筑反作用于经济基础；经济基础与上层建筑的矛盾运动推动社会生产发展。"}]}, {"type": "h2", "toks": [{"t": "3.社会基本矛盾的关系\n社会基本矛盾中"}, {"a": "生产力和生产关系", "ul": 16}, {"t": "的矛盾是更根本的，它决定上层建筑和经\n济基础的矛盾；而生产力和生产关系矛盾的解决又依赖于经济基础和上层建筑矛\n盾的解决。"}]}], "quiz": [{"src": "真题", "stem": "发展新质生产力，必须进一步全面深化改革，形成与之相适应的新型生产关系。要深化经济体制、科技体制等改革，着力打通束缚新质生产力发展的堵点卡点，建立高标准市场体系，创新生产要素配置方式，让各类先进优质生产要素向发展新质生产力顺畅流动，这最直接体现了马克思主义的哪些基本观点？①生产关系必须与生产力发展要求相适应，才能促进生产力发展②经济基础的变更必然引起上层建筑的变革，并决定其变革方向③生产关系对生产力发展具有决定作用④改革是社会主义社会发展的直接动力", "opts": {"A": "①②", "B": "①④", "C": "②③", "D": "②④"}, "ans": "B"}, {"src": "母题", "stem": "社会发展的基本规律是生产力与生产关系、经济基础与上层建筑的矛盾运动及其规律。下列说法不正确的有几项？①社会基本矛盾中生产力和生产关系的矛盾是更根本的②生产工具是生产力中的主导因素，是生产力发展水平的主要标志③产品分配方式在生产关系中起基础作用④上层建筑中，思想上层建筑居主导地位", "opts": {"A": "1 项", "B": "2 项", "C": "3 项", "D": "4 项"}, "ans": "C"}, {"src": "母题", "stem": "马克思指出：“手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。”这句话深刻揭示了：", "opts": {"A": "生产关系对生产力具有能动的反作用", "B": "生产力决定生产关系，生产工具的状况决定了社会形态的性质", "C": "经济基础决定上层建筑，社会形态的更替是客观的必然过程", "D": "科学技术是第一生产力，是推动社会发展的根本动力"}, "ans": "B"}, {"src": "母题", "stem": "“法者，治之端也。”《中华人民共和国立法法》的修改，坚持科学立法、民主立法、依法立法，完善立法体制机制，提高立法质量。从唯物史观看，立法法的修改体现了：①上层建筑一定要适应经济基础状况的规律，通过完善法律制度巩固经济基础②社会存在决定社会意识，立法法的修改是对我国法治建设实践的反映③生产关系一定要适应生产力状况的规律，通过调整法律制度推动生产力发展④社会意识具有相对独立性，先进的法律制度能促进社会存在的发展", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "B"}, {"src": "拓展", "stem": "社会历史发展的基本规律指社会的基本矛盾运动，社会基本矛盾包括____的矛盾、经济基础与上层建筑的矛盾。", "opts": {"A": "生产力与生产关系", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "生产力与生产关系"}, {"src": "拓展", "stem": "生产力的基本要素包括劳动者、____、劳动对象。", "opts": {"A": "劳动资料", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "劳动资料"}, {"src": "拓展", "stem": "____是生产关系的基础，是区分社会制度的根本标志，是判断各种社会形态性质的客观依据。", "opts": {"A": "生产资料所有制形式", "B": "马克思主义哲学", "C": "具体问题具体分析", "D": "社会存在和社会意识"}, "ans": "A", "real": "生产资料所有制形式"}], "branches": [{"h": "要点", "terms": ["生产力与生产关系"]}, {"h": "1.生产力与生产关系的矛盾运动及其规律", "terms": ["人与自然", "最终决定力量", "最根本", "劳动者", "劳动资料", "生产工具", "人与人"]}, {"h": "2.经济基础与上层建筑的矛盾运动及其规律", "terms": ["生产资料所有制", "观念", "政治上", "政治", "国家政权"]}, {"h": "3.社会基本矛盾的关系", "terms": ["生产力和生产关系"]}], "notes": ["社会基本矛盾=生产力和生产关系、经济基础和上层建筑的矛盾，是社会发展的根本动力。", "生产力三要素=劳动者（主导）、劳动资料、劳动对象；生产工具是生产力发展水平的客观标志，科学技术是最重要因素。", "生产关系=生产资料所有制+生产中地位关系+产品分配；生产资料所有制是基础，是区分社会制度的根本标志（决定性）。", "上层建筑分观念上层建筑（意识形态，非强制性）和政治上层建筑（制度、军队警察法庭监狱等，强制性），政治上层建筑居主导地位，核心是国家政权。"]}, {"id": 33, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "人民群众在历史发展中的作用", "nblank": 7, "blocks": [{"type": "h2", "toks": [{"t": "1.两种历史观的对立\n"}, {"a": "英雄史观", "ul": 8}, {"t": "：把历史发展的原因归于少数统治者或社会精英的创造。\n"}, {"a": "群众史观", "ul": 8}, {"t": "：认为对历史发展起决定作用的是人民群众，但是也承认个人尤其\n是少数历史人物的作用。"}]}, {"type": "h2", "toks": [{"t": "2.人民群众在创造历史过程中的决定作用\n人民群众是社会历史的"}, {"a": "主体", "ul": 8}, {"t": "，是历史的创造者，对社会历史发展起\n"}, {"a": "决定性", "ul": 8}, {"t": "作用。\n人民群众历史创造作用的主要表现：人民群众是社会"}, {"a": "物质财富", "ul": 8}, {"t": "的创造者；人\n民群众是社会"}, {"a": "精神财富", "ul": 8}, {"t": "的创造者；人民群众是"}, {"a": "社会变革", "ul": 8}, {"t": "的决定力量。"}]}], "quiz": [{"src": "真题", "stem": "习近平总书记指出，改革是人民群众自己的事业，要全体人民共同参与，团结一致攻坚克难。改革过程中，要坚持以人为本，以实绩实效和人民群众满意度检验改革。上述讲话体现了哪些哲学道理：①人民群众是历史的创造者②人民群众是社会变革的主体③实践是检验真理的唯一标准④要重视人的主观能动性，能决定成败", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "①②③④"}, "ans": "A"}, {"src": "母题", "stem": "毛泽东强调，“人民，只有人民，才是创造世界历史的动力。”下列对这一表述的理解，正确的是：①人民群众的实践活动是一切精神财富产生和发展的源泉②人民群众是社会变革的决定力量③人民群众是社会历史的主体，是历史的创造者④人民群众创造历史的活动不受任何社会历史条件的制约", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "A"}, {"src": "母题", "stem": "下列能体现人民群众是社会精神财富创造者的是：①古代劳动人民在农业生产中总结出二十四节气，指导农事活动②陕北民歌《东方红》源于陕北农民李有源的即兴创作，后传唱全国③王羲之在民间书法的基础上创作《兰亭集序》，成为书法艺术的巅峰之作④孙中山领导辛亥革命，推翻封建帝制，推动社会制度变革", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "A"}, {"src": "拓展", "stem": "____：把历史发展的原因归于少数统治者或社会精英的创造。", "opts": {"A": "英雄史观", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "英雄史观"}, {"src": "拓展", "stem": "人民群众是社会历史的____，是历史的创造者，对社会历史发展起", "opts": {"A": "主体", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "主体"}, {"src": "拓展", "stem": "民群众是社会____的创造者；", "opts": {"A": "精神财富", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "精神财富"}], "branches": [{"h": "1.两种历史观的对立", "terms": ["英雄史观", "群众史观"]}, {"h": "2.人民群众在创造历史过程中的决定作用", "terms": ["主体", "决定性", "物质财富", "精神财富", "社会变革"]}], "notes": ["英雄史观认为少数精英创造历史；群众史观认为人民群众是历史的主体、创造者，起决定作用，同时也承认个人（尤其历史人物）的作用。", "人民群众是社会物质财富的创造者、精神财富的创造者、社会变革的决定力量。", "马政经框架：商品经济理论（商品二因素、劳动二重性、价值量、货币）+剩余价值理论；剩余价值理论是马克思主义政治经济学的核心和灵魂。"]}, {"id": 34, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "商品及其二因素", "nblank": 12, "blocks": [{"type": "p", "toks": [{"t": "商品是用来交换、能满足人的某种需要的劳动产品。\n商品的二因素是"}, {"a": "使用价值", "ul": 8}, {"t": "和"}, {"a": "价值", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.使用价值"}]}, {"type": "h3", "toks": [{"t": "（1）使用价值是指商品能够满足人们某种需要的属性，即商品的"}, {"a": "有用性", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）同一商品可以有不同的使用价值，不同的商品也可以有同一种使用价值。"}]}, {"type": "h3", "toks": [{"t": "（3）使用价值是商品的"}, {"a": "自然属性", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.价值"}]}, {"type": "h3", "toks": [{"t": "（1）价值是指凝结在商品中无差别的一般"}, {"a": "人类劳动", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）使用价值不同的商品之所以能够交换，是因为它们都具有"}, {"a": "价值", "ul": 8}, {"t": "，都\n耗费了人类一定的体力和脑力。"}]}, {"type": "h3", "toks": [{"t": "（3）价值是商品的"}, {"a": "根本属性", "ul": 8}, {"t": "，是商品的"}, {"a": "社会属性", "ul": 8}, {"t": "，是商品"}, {"a": "最本质", "ul": 8}, {"t": "的因素。"}]}, {"type": "h2", "toks": [{"t": "3.使用价值和价值的辩证关系\n商品必须同时具有使用价值和价值。"}, {"a": "使用价值", "ul": 8}, {"t": "是"}, {"a": "价值", "ul": 8}, {"t": "的物质承担者；价\n值通过使用价值表现出来，没有合格的使用价值，价值不能得到实现。\n对于同一商品所有者来说，在商品交换过程中，不论是买者还是卖者，使用\n价值和价值二者不可兼得。其对立的外在表现是"}, {"a": "商品和货币", "ul": 16}, {"t": "的对立。"}]}], "quiz": [{"src": "真题", "stem": "以下关于商品二因素说法正确的是：", "opts": {"A": "价值是商品的自然属性，使用价值是商品的社会属性", "B": "交换价值是价值的基础，也是价值的表现形式", "C": "商品的生产者无法同时拥有商品的使用价值和价值", "D": "商品二因素决定了劳动二重性"}, "ans": "C"}, {"src": "母题", "stem": "商品是用来交换、能满足人的某种需要的劳动产品。下列选项中，属于商品的是：", "opts": {"A": "农民自留地里种植、仅供自家食用的蔬菜", "B": "政府免费向市民发放的公园年票", "C": "某视频网站新上线的付费会员服务", "D": "自然流淌、未经人工开发的泉水"}, "ans": "C"}, {"src": "母题", "stem": "商品是用来交换、能满足人的某种需要的劳动产品。关于商品的二因素，下列表述正确的是：①价值反映的是人与自然之间的物质关系②使用价值和价值对立的外在表现是商品和货币的对立③使用价值不同的商品之所以能够交换，是因为它们都具有价值④使用价值是商品最本质的因素，是商品的根本属性", "opts": {"A": "①③", "B": "②④", "C": "②③", "D": "①②④"}, "ans": "C"}, {"src": "拓展", "stem": "商品的二因素是____和价值", "opts": {"A": "使用价值", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "使用价值"}, {"src": "拓展", "stem": "（1）价值是指凝结在商品中无差别的一般____", "opts": {"A": "人类劳动", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "人类劳动"}, {"src": "拓展", "stem": "（3）价值是商品的根本属性，是商品的社会属性，是商品____的因素。", "opts": {"A": "最本质", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "最本质"}], "branches": [{"h": "要点", "terms": ["使用价值", "价值"]}, {"h": "1.使用价值", "terms": ["有用性", "自然属性"]}, {"h": "2.价值", "terms": ["人类劳动", "价值", "根本属性", "社会属性", "最本质"]}, {"h": "3.使用价值和价值的辩证关系", "terms": ["使用价值", "价值", "商品和货币"]}], "notes": ["商品是用来交换、能满足需要的劳动产品；二因素=使用价值+价值。使用价值=有用性、自然属性；价值=凝结的无差别人类劳动（体力脑力耗费），是根本属性、社会属性、最本质因素。", "使用价值是价值的物质承担者；对同一商品所有者二者不可兼得；价值是交换价值的基础，交换价值是价值的表现形式。"]}, {"id": 35, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "劳动二重性", "nblank": 8, "blocks": [{"type": "p", "toks": [{"a": "劳动二重性", "ul": 16}, {"t": "学说是理解马克思政治经济学理论的枢纽。劳动二重性是指生产商品的劳动既是具体劳动，又是"}, {"a": "抽象劳动", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.具体劳动\n具体劳动是指人们在一定的具体形式下进行的劳动。"}]}, {"type": "h2", "toks": [{"t": "2.抽象劳动\n抽象劳动是指撇开一切具体形式的无差别的人类劳动，即人的体力和脑力的\n消耗。"}]}, {"type": "h2", "toks": [{"t": "3.具体劳动和抽象劳动的辩证关系\n具体劳动和抽象劳动是商品生产者"}, {"a": "同一劳动过程", "ul": 16}, {"t": "中不可分割的两个方\n面，而不是两次或者两种劳动。\n具体劳动反映人与自然的关系，是劳动的"}, {"a": "自然属性", "ul": 8}, {"t": "，生产出各种各样的\n"}, {"a": "使用价值", "ul": 8}, {"t": "。抽象劳动体现着人和人的关系，是劳动的"}, {"a": "社会属性", "ul": 8}, {"t": "，抽象劳动的凝结\n形成商品的"}, {"a": "价值", "ul": 8}, {"t": "。抽象劳动是形成商品价值的"}, {"a": "唯一源泉", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "关于马克思主义政治经济学，下列说法正确的是：", "opts": {"A": "商品的价值量是由生产该商品所需的个别劳动时间决定的", "B": "货币的价值尺度职能是通过实际的物质交换来实现的", "C": "具体劳动和抽象劳动是不同商品生产过程中的不同劳动", "D": "具体劳动创造商品的使用价值，抽象劳动形成商品的价值"}, "ans": "D"}, {"src": "母题", "stem": "关于具体劳动和抽象劳动，下列表述正确的是：", "opts": {"A": "具体劳动和抽象劳动是同一劳动过程中不可分割的两个方面", "B": "具体劳动体现着人和人的关系，是劳动的社会属性", "C": "具体劳动是指在一定具体形式下进行的劳动，它生产商品的价值", "D": "抽象劳动是人的体力和脑力的消耗，它生产商品的使用价值"}, "ans": "A"}, {"src": "拓展", "stem": "____学说是理解马克思政治经济学理论的枢纽。", "opts": {"A": "劳动二重性", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "劳动二重性"}, {"src": "拓展", "stem": "具体劳动和抽象劳动是商品生产者____中不可分割的两个方", "opts": {"A": "同一劳动过程", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "同一劳动过程"}, {"src": "拓展", "stem": "抽象劳动体现着人和人的关系，是劳动的____，抽象劳动的凝结", "opts": {"A": "社会属性", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "社会属性"}], "branches": [{"h": "要点", "terms": ["劳动二重性", "抽象劳动"]}, {"h": "3.具体劳动和抽象劳动的辩证关系", "terms": ["同一劳动过程", "自然属性", "使用价值", "社会属性", "价值", "唯一源泉"]}], "notes": ["劳动二重性是理解马政经的枢纽；生产商品的同一劳动过程既是具体劳动又是抽象劳动（不是两次/两种劳动）。", "具体劳动反映人与自然关系（自然属性），创造使用价值；抽象劳动体现人与人关系（社会属性），凝结形成价值，是形成商品价值的唯一源泉。"]}, {"id": 36, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "商品的价值量", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.商品的价值量"}]}, {"type": "h3", "toks": [{"t": "（1）商品价值量的含义及决定因素\n商品的价值量是指商品价值的大小。\n商品的价值是凝结在商品中的无差别的一般人类劳动，价值量是由劳动者生产商品所耗费的劳动量决定的，而劳动量则按照劳动时间计算。决定商品价值量的不是生产商品的个别劳动时间，而是"}, {"a": "社会必要劳动时间", "ul": 16}, {"t": "。\n社会必要劳动时间是指在现有的社会正常的生产条件下、在社会"}, {"a": "平均的", "ul": 8}, {"t": "劳动熟练程度和劳动强度下生产某种商品所需要的劳动时间。"}]}, {"type": "h3", "toks": [{"t": "（2）商品的价值量与劳动生产率\n劳动生产率指的是劳动者生产使用价值的效率。它的高低可以用单位劳动时间内生产商品的数量来测量，也可以用单位商品中所耗费的劳动时间来测量。\n单位商品的价值量与包含在商品中的社会必要劳动时间成"}, {"a": "正比", "ul": 8}, {"t": "，与生产该商品的劳动生产率成"}, {"a": "反比", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.价值规律——商品经济的"}, {"a": "基本规律", "ul": 8}]}, {"type": "h3", "toks": [{"t": "（1）价值规律的内容\n商品的价值量由生产这种商品的"}, {"a": "社会必要劳动时间", "ul": 16}, {"t": "决定，商品交换以"}, {"a": "价值量", "ul": 8}, {"t": "为基础，按照"}, {"a": "等价交换", "ul": 8}, {"t": "的原则进行。"}]}, {"type": "h3", "toks": [{"t": "（2）价值规律的表现形式\n价格总是以价值为基础，围绕"}, {"a": "价值", "ul": 8}, {"t": "上下波动是价值规律的唯一表现形式。"}]}, {"type": "h3", "toks": [{"t": "（3）价值规律的积极作用\n自发调节资源分配；自发刺激社会生产力的发展；自发调节社会收入的分配。"}]}], "quiz": [{"src": "真题", "stem": "价值规律是市场经济的基本规律，是调节资源配置的最基本方式，下列属于价值规律基本内容是：", "opts": {"A": "商品价值是由生产该商品的社会必要劳动时间决定", "B": "商品价值受供求关系影响，围绕价格上下波动", "C": "商品价值以商品量为基础，实行等价交换", "D": "商品的价格总是与价值相符合"}, "ans": "A"}, {"src": "母题", "stem": "在现实生活中，受供求关系影响，商品的价格经常与价值不一致。但经济学认为，价格围绕价值上下波动不仅没有否定价值规律，反而是价值规律发生作用的唯一表现形式。下列对这一观点的理解，错误的是：", "opts": {"A": "价格的波动总是以价值为基础，不会无限脱离价值", "B": "从较长时间看，商品价格的上涨部分和下跌部分可以相互抵消", "C": "从全社会看，商品的平均价格总额和价值总额是相等的", "D": "价格围绕价值波动说明在商品交换中，等价交换原则从未真正实现"}, "ans": "D"}, {"src": "母题", "stem": "商品的价值量与生产该商品的劳动生产率之间存在着密切的联系。若某行业生产某种商品的社会劳动生产率普遍提高，在其他条件不变的情况下，下列说法正确的是：", "opts": {"A": "单位商品的价值量增加，单位时间内创造的价值总量增加", "B": "单位商品的价值量减少，单位时间内创造的价值总量不变", "C": "单位商品的价值量不变，单位时间内创造的价值总量增加", "D": "单位商品的价值量减少，单位时间内创造的价值总量减少"}, "ans": "B"}, {"src": "拓展", "stem": "决定商品价值量的不是生产商品的个别劳动时间，而是____", "opts": {"A": "社会必要劳动时间", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "社会必要劳动时间"}, {"src": "拓展", "stem": "单位商品的价值量与包含在商品中的社会必要劳动时间成正比，与生产该商品的劳动生产率成____", "opts": {"A": "反比", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "反比"}, {"src": "拓展", "stem": "商品的____由生产这种商品的社会必要劳动时间决定，商品交换以价值量为基础，按照等价交换的原则进行。", "opts": {"A": "价值量", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "价值量"}], "branches": [{"h": "1.商品的价值量", "terms": ["社会必要劳动时间", "平均的", "正比", "反比"]}, {"h": "2.价值规律——商品经济的", "terms": ["基本规律", "社会必要劳动时间", "价值量", "等价交换", "价值"]}], "notes": ["商品价值量不由个别劳动时间决定，而由社会必要劳动时间决定（现有的社会正常生产条件、社会平均劳动熟练程度和强度下）。", "单位商品价值量与社会必要劳动时间成正比、与社会劳动生产率成反比；价值总量只与总劳动时间有关、与生产速度无关（效率↑→单位价值↓、数量↑，总量不变）。", "价值规律是商品经济基本规律，内容是等价交换；价格以价值为基础、围绕价值上下波动是唯一表现形式（受供求影响，平均价格=价值，并不违背等价交换）。"]}, {"id": 37, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "货币本质和职能", "nblank": 8, "blocks": [{"type": "h2", "toks": [{"t": "1.货币的本质\n货币是固定地充当一般等价物的商品。货币的本质是"}, {"a": "一般等价物", "ul": 16}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.货币的职能\n货币具有价值尺度、流通手段、贮藏手段、支付手段以及世界货币等职能。\n其中，"}, {"a": "价值尺度", "ul": 8}, {"t": "和"}, {"a": "流通手段", "ul": 8}, {"t": "是货币的两个最基本职能。\n价值尺度\n货币表现其他一切商品是否具有价值和衡量其价值量大小的职能。\n只需要在"}, {"a": "观念", "ul": 8}, {"t": "上是货币即可，不需要是现实中的货币。\n流通手段\n货币在商品流通中充当交换媒介借以实现商品价值的职能。\n必须是"}, {"a": "现实", "ul": 8}, {"t": "的货币，不再是观念的货币。\n贮藏手段\n货币退出流通领域作为社会财富的一般代表被保存起来的职能。\n必须是足值的金属货币或金属条块。\n支付手段\n在发生赊购赊销的情况下，货币用于清偿债务所执行的职能。\n被广泛运用于缴纳"}, {"a": "租金", "ul": 8}, {"t": "、"}, {"a": "税金", "ul": 8}, {"t": "和发放"}, {"a": "工资", "ul": 8}, {"t": "等方面。\n世界货币\n在国际商品流通中发挥一般等价物作用的职能。"}]}], "quiz": [{"src": "真题", "stem": "下列关于货币的说法正确的是：", "opts": {"A": "货币的本质是一般等价物，是一种非商品的特殊物品", "B": "货币的基本职能是充当流通手段和支付手段", "C": "货币是在商品交换的过程中产生的", "D": "货币具有使用价值但不具有价值"}, "ans": "C"}, {"src": "母题", "stem": "货币具有多种职能，不同职能对货币形式的要求也有所不同。关于货币职能的特点，下列表述错误的是：", "opts": {"A": "执行价值尺度职能时，只需要观念上的货币，不需要现实的货币", "B": "执行流通手段职能时，必须是现实的货币，不能是观念上的货币", "C": "执行贮藏手段职能时，必须是足值的金属货币或金属条块", "D": "执行支付手段职能时，货币必须是足值的金属货币，不能是价值符号"}, "ans": "D"}, {"src": "母题", "stem": "货币的支付手段职能是随着商品赊账买卖的产生而出现的，其核心特征是货币的运动与商品的运动在时间上发生了分离。下列经济活动中，最能体现这一特征的是：", "opts": {"A": "消费者在便利店用现金购买了一瓶矿泉水", "B": "购房者根据合同约定，在收房一年后向开发商支付了尾款", "C": "游客在纪念品商店看中一个标价为200 元的工艺品", "D": "投资者将100 克黄金铸成金条后存入银行的保险箱"}, "ans": "B"}, {"src": "拓展", "stem": "货币的本质是____", "opts": {"A": "一般等价物", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "一般等价物"}, {"src": "拓展", "stem": "其中，价值尺度和____是货币的两个最基本职能。", "opts": {"A": "流通手段", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "流通手段"}, {"src": "拓展", "stem": "必须是____的货币，不再是观念的货币。", "opts": {"A": "现实", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "现实"}], "branches": [{"h": "1.货币的本质", "terms": ["一般等价物"]}, {"h": "2.货币的职能", "terms": ["价值尺度", "流通手段", "观念", "现实", "租金", "税金", "工资"]}], "notes": ["货币是固定充当一般等价物的商品，本质是一般等价物（本身也是商品，有价值和使用价值，在交换中产生）。", "五职能：价值尺度（只需观念货币，如价格牌）、流通手段（必须现实货币，一手交钱一手交货）是两个最基本职能；贮藏手段（须足值金属，如金条）、支付手段（赊购赊销、租金税金工资，钱货分离）、世界货币。"]}, {"id": 38, "part": "政治理论", "pian": "马克思主义基本原理", "zhang": "", "jie": "", "kind": "zsd", "title": "剩余价值理论", "nblank": 11, "blocks": [{"type": "p", "toks": [{"t": "剩余价值学说阐明了资本主义经济制度的本质，剩余价值规律是资本主义的"}, {"a": "基本规律", "ul": 8}, {"t": "。剩余价值是"}, {"a": "雇佣工人", "ul": 8}, {"t": "所创造的并被"}, {"a": "资本家", "ul": 8}, {"t": "无偿占有的超过劳动力价值的那部分价值，它体现了资本家与雇佣工人之间剥削与被剥削的关系。"}]}, {"type": "h2", "toks": [{"t": "1.剩余价值的生产方法"}]}, {"type": "h3", "toks": [{"t": "（1）绝对剩余价值生产\n在"}, {"a": "必要劳动时间", "ul": 16}, {"t": "不变的条件下，由于延长劳动日的长度而生产的剩余价值。"}]}, {"type": "h3", "toks": [{"t": "（2）相对剩余价值生产\n在"}, {"a": "工作日", "ul": 8}, {"t": "长度不变的条件下，由于缩短必要劳动时间，相应延长剩余劳动时间而生产的剩余价值。缩短必要劳动时间是通过全社会劳动生产率的"}, {"a": "提高", "ul": 8}, {"t": "实现的。"}]}, {"type": "h2", "toks": [{"t": "2.不变资本与可变资本\n资本在资本主义生产过程中以生产资料和劳动力两种形态存在。根据这两部\n分资本在"}, {"a": "剩余价值", "ul": 8}, {"t": "生产中所起的不同作用，可将资本分为不变资本和可变资本。\n之所以划分不变资本与可变资本，主要是揭示了剩余价值的来源，以及为确定资\n本家对雇佣劳动者的剥削程度提供了科学依据。"}]}, {"type": "h3", "toks": [{"t": "（1）不变资本（C）\n以"}, {"a": "生产资料", "ul": 8}, {"t": "形态存在的那部分资本，其在生产过程中只转变自己的物质形态而不改变自己的价值量，不发生增殖。"}]}, {"type": "h3", "toks": [{"t": "（2）可变资本（V）\n以"}, {"a": "劳动力价值", "ul": 16}, {"t": "形态存在的那部分资本，其在生产过程中不是被转移到新产品中去，而是由工人的劳动再生产出来。这一部分资本的价值不是不变的，而是一个可变的量。"}]}, {"type": "h2", "toks": [{"t": "3.资本有机构成\n资本有机构成这一范畴涉及资本的技术构成、资本的价值构成和资本的有机\n构成之间的关系。\n资本的技术构成：生产的技术水平所决定的生产资料和劳动力之间的比例。\n资本的价值构成：不变资本和可变资本价值之间的比例。\n资本的有机构成：指由"}, {"a": "资本技术构成", "ul": 16}, {"t": "决定并反映技术构成变化的\n"}, {"a": "资本价值构成", "ul": 16}, {"t": "，即C:V。其中C为不变资本，V为可变资本。资本的不断积累\n和生产规模的不断扩大，会导致劳动生产率和资本有机构成的提高。"}]}], "quiz": [{"src": "真题", "stem": "关于剩余价值，下列说法错误的是：", "opts": {"A": "剩余价值规律是资本主义的基本规律", "B": "榨取绝对剩余价值和相对剩余价值均通过延长剩余劳动时间实现", "C": "榨取绝对剩余价值以提高全社会劳动生产率为前提", "D": "剩余价值体现了资本家与雇佣工人之间剥削与被剥削的关系"}, "ans": "C"}, {"src": "母题", "stem": "关于资本的分类及剩余价值理论，下列说法错误的是：", "opts": {"A": "不变资本以生产资料形态存在，在生产过程中不发生增殖", "B": "可变资本以劳动力形态存在，其价值由工人的劳动再生产出来并创造剩余价值", "C": "资本的价值构成是指不变资本和可变资本价值之间的比例", "D": "剩余价值既可以在流通过程中产生，也可以在生产过程中产生"}, "ans": "D"}, {"src": "拓展", "stem": "剩余价值学说阐明了资本主义经济制度的本质，剩余价值规律是资本主义的____", "opts": {"A": "基本规律", "B": "科学社会主义", "C": "德国", "D": "英国"}, "ans": "A", "real": "基本规律"}, {"src": "拓展", "stem": "缩短必要劳动时间是通过全社会劳动生产率的____实现的。", "opts": {"A": "提高", "B": "德国", "C": "英国", "D": "唯物史观"}, "ans": "A", "real": "提高"}, {"src": "拓展", "stem": "以____形态存在的那部分资本，其在生产过程中不是被转移到新产品中去，而是由工人的劳动再生产出来。", "opts": {"A": "劳动力价值", "B": "马克思主义哲学", "C": "科学社会主义", "D": "空想社会主义"}, "ans": "A", "real": "劳动力价值"}], "branches": [{"h": "要点", "terms": ["基本规律", "雇佣工人", "资本家"]}, {"h": "1.剩余价值的生产方法", "terms": ["必要劳动时间", "工作日", "提高"]}, {"h": "2.不变资本与可变资本", "terms": ["剩余价值", "生产资料", "劳动力价值"]}, {"h": "3.资本有机构成", "terms": ["资本技术构成", "资本价值构成"]}], "notes": ["剩余价值是雇佣工人创造、被资本家无偿占有、超过劳动力价值的部分，体现剥削关系；剩余价值规律是资本主义基本规律。", "绝对剩余价值=必要劳动时间不变、延长工作日（加班）；相对剩余价值=工作日不变、靠提高全社会劳动生产率缩短必要劳动时间；二者都是延长剩余劳动时间。", "不变资本c=生产资料，只转移价值、不增殖；可变资本v=劳动力，是可变量；剩余价值率（剥削程度）=剩余价值（利润）/可变资本。", "技术构成=生产资料:劳动力（数量比）；价值构成=C:V（货币比）；有机构成=由技术构成决定并反映其变化的价值构成（技术构成没变、仅价格变化不算有机构成）。"]}, {"id": 39, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "考古文化遗址", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.河姆渡文化：位于浙江省余姚市，发现了大量人工栽培"}, {"a": "水稻", "ul": 8}, {"t": "的遗迹，\n创造了以榫卯结构为特点的“干栏式建筑”。"}]}, {"type": "h2", "toks": [{"t": "2.仰韶文化：位于河南省仰韶村，分布于黄河上中游地区，被称为“"}, {"a": "彩陶文化", "ul": 8}, {"t": "”。\n代表性遗址包括西安"}, {"a": "半坡遗址", "ul": 8}, {"t": "，是我国最早种植"}, {"a": "粟", "ul": 8}, {"t": "的文化遗存，出土文物\n有人面鱼纹彩陶盆等。"}]}, {"type": "h2", "toks": [{"t": "3.红山文化：位于内蒙古中南部一带，出土文物有"}, {"a": "玉猪龙", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "4.良渚文化：位于浙江省杭州市，是实证"}, {"a": "中华五千年文明史", "ul": 16}, {"t": "的关键遗址，最\n大特色是出土的玉器。"}]}, {"type": "h2", "toks": [{"t": "5.大汶口文化：位于山东省泰安市。中晚期出现夫妻合葬，标志着开始或已\n经进入"}, {"a": "父系", "ul": 8}, {"t": "氏族社会。随葬品数量和质量差异显著，表明社会贫富分化明显，\n私有制已经产生并得到发展。"}]}, {"type": "h2", "toks": [{"t": "6.龙山文化：位于山东省济南市，被称为“"}, {"a": "黑陶文化", "ul": 8}, {"t": "”。"}]}, {"type": "h2", "toks": [{"t": "7.二里头文化：位于河南省洛阳市偃师二里头，学术界一般认为它是夏王朝\n中晚期都城。拥有目前已知我国最早的城市道路系统、宫室建筑群和宫城、最早\n的青铜礼器群、以青铜冶铸作坊和绿松石器制造作坊为代表的最早的官营作坊区\n等诸多重要遗存。二里头遗址是迄今为止可确认的中国最早的王朝都城遗址，开\n中国古代都邑制度之先河，一般将其称为“"}, {"a": "最早的中国", "ul": 16}, {"t": "”。"}]}, {"type": "h2", "toks": [{"t": "8.殷墟遗址：位于河南省安阳市，商代后期都城遗址。出土了大量"}, {"a": "甲骨文", "ul": 8}, {"t": "，\n这是中国最早的系统文字。出土文物中的"}, {"a": "后母戊鼎", "ul": 8}, {"t": "，是中国现存最大、最重的青\n铜器。这是中国历史上第一个"}, {"a": "有文献可考", "ul": 15}, {"t": "、并为考古发掘所证实的都城遗址。"}]}, {"type": "h2", "toks": [{"t": "9.三星堆遗址：位于四川省广汉市，是迄今在西南地区发现的范围最大、延\n续时间最长、文化内涵最丰富的古城、古国、古蜀文化遗址，被誉为\n“"}, {"a": "长江文明之源", "ul": 16}, {"t": "”。出土代表器物有青铜立人像、青铜树、青铜纵目面具等。"}]}], "quiz": [{"src": "真题", "stem": "关于我国考古发现，下列说法错误的是：", "opts": {"A": "良渚文化主要分布于太湖地区，其文化遗址最大特色是所出土的玉器", "B": "仰韶文化主要分布在黄河支流汇集的中原地区，其中较著名的是元谋人遗址", "C": "大汶口文化主要分布在泰山周围地区，氏族墓地中晚期出现了男女合葬现象", "D": "龙山文化是新石器时代晚期的文化，其陶器已开始使用轮制技术，器型规整"}, "ans": "B"}, {"src": "母题", "stem": "下列关于我国史前文化与早期王朝遗址的说法，正确的是：", "opts": {"A": "河姆渡文化位于黄河流域，是我国最早种植粟的文化遗存", "B": "龙山文化以彩陶为典型特征，因此又被称为“彩陶文化”", "C": "殷墟出土的后母戊鼎，是目前中国现存最大、最重的青铜器", "D": "红山文化主要分布于长江下游地区，代表性器物为玉猪龙"}, "ans": "C"}, {"src": "母题", "stem": "下列关于我国古代文化遗址的表述，有误的是：", "opts": {"A": "良渚文化实证中华五千年文明史，以大量精美玉器为显著特征", "B": "二里头遗址被学界普遍认为是夏代中晚期都城，有“最早的中国”之称", "C": "人面鱼纹彩陶盆是仰韶文化半坡遗址的代表性文物", "D": "大汶口文化仍处于母系氏族社会阶段，尚未出现贫富分化"}, "ans": "D"}, {"src": "拓展", "stem": "1.河姆渡文化：位于浙江省余姚市，发现了大量人工栽培____的遗迹，", "opts": {"A": "水稻", "B": "彩陶文化", "C": "半坡遗址", "D": "玉猪龙"}, "ans": "A", "real": "水稻"}, {"src": "拓展", "stem": "3.红山文化：位于内蒙古中南部一带，出土文物有____", "opts": {"A": "玉猪龙", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "玉猪龙"}, {"src": "拓展", "stem": "6.龙山文化：位于山东省济南市，被称为“____”。", "opts": {"A": "黑陶文化", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "黑陶文化"}], "branches": [{"h": "1.河姆渡文化：位于浙江省余姚市，发现了大量人工栽培", "terms": ["水稻"]}, {"h": "2.仰韶文化：位于河南省仰韶村，分布于黄河上中游地区，被称为“", "terms": ["彩陶文化", "半坡遗址"]}, {"h": "3.红山文化：位于内蒙古中南部一带，出土文物有", "terms": ["玉猪龙"]}, {"h": "4.良渚文化：位于浙江省杭州市，是实证", "terms": ["中华五千年文明史"]}, {"h": "5.大汶口文化：位于山东省泰安市。中晚期出现夫妻合葬，标志着开始或已", "terms": ["父系"]}, {"h": "6.龙山文化：位于山东省济南市，被称为“", "terms": ["黑陶文化"]}, {"h": "7.二里头文化：位于河南省洛阳市偃师二里头，学术界一般认为它是夏王朝", "terms": ["最早的中国"]}, {"h": "8.殷墟遗址：位于河南省安阳市，商代后期都城遗址。出土了大量", "terms": ["甲骨文", "后母戊鼎", "有文献可考"]}, {"h": "9.三星堆遗址：位于四川省广汉市，是迄今在西南地区发现的范围最大、延", "terms": ["长江文明之源"]}], "notes": ["九大遗址速记：河姆渡（浙江余姚、人工栽培水稻、干栏式建筑）；仰韶（河南、黄河中游、彩陶文化、西安半坡、最早种粟、人面鱼纹彩陶盆）；红山（内蒙古、玉猪龙）；良渚（浙江杭州、实证中华五千年文明史的关键遗址、特色玉器）；大汶口（山东泰安、中晚期夫妻合葬、进入父系、随葬品分化显贫富和私有）；龙山（山东、黑陶文化）。", "二里头（河南洛阳偃师）一般认为是夏朝中晚期都城，有已知最早的城市道路系统、宫室建筑群、宫城、青铜礼器群和官营作坊区，被称为'最早的中国'。", "殷墟（河南安阳）是商后期都城：大量甲骨文（最早的成熟系统文字）、后母戊鼎（现存最大最重青铜器），是第一个有文献可考并为考古所证实的都城；三星堆（四川广汉）是西南地区最大、延续最长、内涵最丰富的古蜀文化遗址，被称'长江文明之源'，代表文物青铜立人像、青铜神树、纵目面具。"]}, {"id": 40, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代战役", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.以少胜多的战役\n牧野之战：周武王伐纣，导致了商朝的灭亡。典故有"}, {"a": "临阵倒戈", "ul": 8}, {"t": "。\n"}, {"a": "巨鹿之战", "ul": 8}, {"t": "：项羽胜秦军，加速了秦朝的灭亡。典故有破釜沉舟、作壁上观。\n井陉之战：韩信胜赵国，加强了刘邦的实力。典故有"}, {"a": "背水一战", "ul": 8}, {"t": "。\n"}, {"a": "官渡之战", "ul": 8}, {"t": "：曹操胜袁绍，为曹操统一北方奠定基础。典故有夜袭乌巢。\n赤壁之战：孙刘胜曹操，为"}, {"a": "三国鼎立", "ul": 8}, {"t": "局面的形成奠定基础。典故有羽扇纶巾、\n"}, {"a": "草船借箭", "ul": 8}, {"t": "、万事俱备，只欠东风。\n"}, {"a": "淝水之战", "ul": 8}, {"t": "：东晋胜前秦，使得汉族中原文化得以延续和发展。典故有投鞭断\n流、风声鹤唳、草木皆兵。"}]}, {"type": "h2", "toks": [{"t": "2.其他重要战役\n"}, {"a": "城濮之战", "ul": 8}, {"t": "：晋国胜楚国，奠定晋文公霸主地位。典故有退避三舍。\n桂陵之战：齐国胜魏国。典故有"}, {"a": "围魏救赵", "ul": 8}, {"t": "。\n马陵之战：魏伐韩，韩请救于齐。孙膑用“"}, {"a": "减灶计", "ul": 8}, {"t": "”诱敌深入，在马陵埋\n伏，导致庞涓自杀、魏主力被歼。\n"}, {"a": "长平之战", "ul": 8}, {"t": "：秦国胜赵国，加速了秦国的统一进程。这是中国古代军事史上最\n早、规模最大、最彻底的围歼战。典故有纸上谈兵。\n邯郸之战：赵国与诸国合纵对付秦国，大败秦军。典故有"}, {"a": "毛遂自荐", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "历史课上大家正在讨论中国历史上的著名战役，下列四位同学的发言与历史有出入的是：", "opts": {"A": "小明说：“在官渡之战中，曹操以少胜多战胜了袁绍”", "B": "小丽说：“在赤壁之战中，孙刘联军以火烧战船之法战胜曹操”", "C": "小光说：“在巨鹿之战中，项羽破釜沉舟，带领将士打败了秦军", "D": "小磊说：“在垓下之战中，刘邦被项羽围困，向韩信求助才脱离了困境”"}, "ans": "D"}, {"src": "母题", "stem": "下列关于中国古代著名战役的表述，正确的是：", "opts": {"A": "巨鹿之战中，刘邦率领军队“破釜沉舟”，大败秦军主力，加速了秦朝灭亡", "B": "官渡之战是孙刘联军击败曹操的关键战役，为三国鼎立局面奠定基础", "C": "淝水之战中，东晋以少胜多击败前秦，典故“风声鹤唳、草木皆兵”源于此役", "D": "井陉之战中，孙膑运用“背水一战”的战术，击败赵国军队，巩固了自身势力"}, "ans": "C"}, {"src": "母题", "stem": "下列关于古代战役与相关典故、历史影响的对应，有误的是：", "opts": {"A": "牧野之战——临阵倒戈——商朝灭亡，西周建立", "B": "长平之战——纸上谈兵——秦国大败赵国，加速秦统一进程", "C": "城濮之战——围魏救赵——晋国击败楚国，奠定晋文公霸主地位", "D": "马陵之战——减灶计——齐国击败魏国，削弱魏国霸权"}, "ans": "C"}, {"src": "拓展", "stem": "____：项羽胜秦军，加速了秦朝的灭亡。", "opts": {"A": "巨鹿之战", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "巨鹿之战"}, {"src": "拓展", "stem": "赤壁之战：孙刘胜曹操，为____局面的形成奠定基础。", "opts": {"A": "三国鼎立", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "三国鼎立"}, {"src": "拓展", "stem": "____：东晋胜前秦，使得汉族中原文化得以延续和发展。", "opts": {"A": "淝水之战", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "淝水之战"}], "branches": [{"h": "1.以少胜多的战役", "terms": ["临阵倒戈", "巨鹿之战", "背水一战", "官渡之战", "三国鼎立", "草船借箭", "淝水之战"]}, {"h": "2.其他重要战役", "terms": ["城濮之战", "围魏救赵", "减灶计", "长平之战", "毛遂自荐"]}], "notes": ["以少胜多战役六例：牧野（武王伐纣、临阵倒戈、商亡）、巨鹿（项羽破釜沉舟、作壁上观）、井陉（韩信背水一战）、官渡（曹操胜袁绍、夜袭乌巢、奠定统一北方）、赤壁（孙刘胜曹、奠定三国鼎立、草船借箭、万事俱备只欠东风）、淝水（东晋胜前秦、保住中原文化、投鞭断流、风声鹤唳、草木皆兵）。", "其他常考：城濮（晋胜楚、退避三舍、奠定晋文公霸主）、桂陵（围魏救赵）、马陵（孙膑减灶诱敌、庞涓自刎）、长平（秦胜赵、纸上谈兵，是最早最大最彻底的围歼战，加速秦统一）、邯郸（毛遂自荐、合纵胜秦）。"]}, {"id": 41, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代政治制度", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.秦朝：在中央设置三公九卿制。“三公”是指在中央设"}, {"a": "丞相", "ul": 8}, {"t": "（“百官\n之长”，帮助皇帝处理全国的政事）、"}, {"a": "太尉", "ul": 8}, {"t": "（主管军事）、"}, {"a": "御史大夫", "ul": 8}, {"t": "（执掌\n群臣奏章，下达皇帝召令，兼理国家监察事务）三个最高官职。地方上，秦朝实\n行郡县制。"}]}, {"type": "h2", "toks": [{"t": "2.汉朝：西汉初期，地方上实行郡国并行制。汉武帝时期，正式颁布\n“"}, {"a": "推恩令", "ul": 8}, {"t": "”，削弱诸侯势力，进一步增加中央集权。"}]}, {"type": "h2", "toks": [{"t": "3.隋唐：在中央实行三省六部制。唐朝“三省”是指"}, {"a": "中书省", "ul": 8}, {"t": "（负责草拟和\n颁布皇帝诏令）、门下省（负责"}, {"a": "审核政令", "ul": 8}, {"t": "）、"}, {"a": "尚书省", "ul": 8}, {"t": "（负责执行国家的政令）。\n"}, {"a": "尚书省", "ul": 8}, {"t": "下设吏、户、礼、兵、刑、工六部。"}]}, {"type": "h2", "toks": [{"t": "4.宋朝：中央设枢密使、"}, {"a": "参知政事", "ul": 8}, {"t": "、三司使，分割宰相的军权、行政权、财\n政权。"}]}, {"type": "h2", "toks": [{"t": "5.元朝：中央设立"}, {"a": "中书省", "ul": 8}, {"t": "作为中央最高的行政机构。地方设行中书省，简\n称“行省”。元朝的行省制是"}, {"a": "中国省制", "ul": 8}, {"t": "的开端。"}]}, {"type": "h2", "toks": [{"t": "6.明朝：明太祖废除丞相制度。明成祖时，"}, {"a": "内阁", "ul": 8}, {"t": "制度正式确立。地方上，\n废行中书省，各省设立三司，即承宣布政使司、提刑按察使司、都指挥使司，分\n掌行政、司法和军政，都直属中央。"}]}, {"type": "h2", "toks": [{"t": "7.清朝：雍正帝时设立"}, {"a": "军机处", "ul": 8}, {"t": "，标志着君主专制制度发展到顶峰。"}]}], "quiz": [{"src": "真题", "stem": "下列与中国古代政府机构相关的说法，错误的是：", "opts": {"A": "军机处始设于清代雍正帝统治时期", "B": "隋唐时期中央政府采用三省六部制", "C": "宋代的枢密院是主管财政的专门机构", "D": "明太祖为加强中央集权废除丞相一职"}, "ans": "C"}, {"src": "母题", "stem": "下列事件中，标志着中国历史上君主专制制度发展到顶峰的是：", "opts": {"A": "元朝设置宣政院", "B": "雍正时设置军机处", "C": "清朝闭关锁国只留广州一处通商口岸", "D": "明太祖时废除宰相制度"}, "ans": "B"}, {"src": "母题", "stem": "下列对中国古代中央官制的演变，叙述正确的是：", "opts": {"A": "西汉的“三公”中，御史大夫负责军事，太尉掌管监察", "B": "宋朝设立参知政事、枢密使和三司使，旨在加强皇权、分割相权", "C": "元朝在地方推行行省制，但行省长官拥有独立的军政和财政权力", "D": "明朝内阁自设立之初便是法定的中央行政机构，可指挥六部行事"}, "ans": "B"}, {"src": "拓展", "stem": "“三公”是指在中央设____（“百官", "opts": {"A": "丞相", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "丞相"}, {"src": "拓展", "stem": "唐朝“三省”是指____（负责草拟和", "opts": {"A": "中书省", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "中书省"}, {"src": "拓展", "stem": "4.宋朝：中央设枢密使、____、三司使，分割宰相的军权、行政权、财", "opts": {"A": "参知政事", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "参知政事"}], "branches": [{"h": "1.秦朝：在中央设置三公九卿制。“三公”是指在中央设", "terms": ["丞相", "太尉", "御史大夫"]}, {"h": "2.汉朝：西汉初期，地方上实行郡国并行制。汉武帝时期，正式颁布", "terms": ["推恩令"]}, {"h": "3.隋唐：在中央实行三省六部制。唐朝“三省”是指", "terms": ["中书省", "审核政令", "尚书省"]}, {"h": "4.宋朝：中央设枢密使、", "terms": ["参知政事"]}, {"h": "5.元朝：中央设立", "terms": ["中书省", "中国省制"]}, {"h": "6.明朝：明太祖废除丞相制度。明成祖时，", "terms": ["内阁"]}, {"h": "7.清朝：雍正帝时设立", "terms": ["军机处"]}], "notes": ["中央官制演变：秦三公九卿（丞相=百官之长掌全国政事、太尉掌军事、御史大夫掌奏章下诏令兼监察）+地方郡县制；汉汉初郡国并行、汉武帝推恩令削藩。", "隋唐三省六部：中书省草拟、门下省审核、尚书省执行，尚书下设吏户礼兵刑工六部；宋以枢密使（军）、参知政事（行政）、三司使（财政）分割相权；元中央以中书省为最高行政、地方行中书省（省制开端）。", "明：明太祖废丞相、明成祖确立内阁制，地方废行省设三司（承宣布政使司、提刑按察使司、都指挥使司分掌行政、司法、军政，直属中央）；清雍正设军机处，君主专制达到顶峰。"]}, {"id": 42, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代选官制度", "nblank": 17, "blocks": [{"type": "p", "toks": [{"t": "一、历代重要选官制度"}]}, {"type": "h2", "toks": [{"t": "1.世卿世禄制"}]}, {"type": "h3", "toks": [{"t": "（1）时间：先秦时期。"}]}, {"type": "h3", "toks": [{"t": "（2）特点：以"}, {"a": "血缘", "ul": 8}, {"t": "关系为纽带，官位世袭。"}]}, {"type": "h3", "toks": [{"t": "（3）影响：贵族垄断，导致社会阶层固化。"}]}, {"type": "h2", "toks": [{"t": "2.军功爵制"}]}, {"type": "h3", "toks": [{"t": "（1）时间："}, {"a": "战国", "ul": 8}, {"t": "时期。"}]}, {"type": "h3", "toks": [{"t": "（2）特点：以军功为标准。"}]}, {"type": "h3", "toks": [{"t": "（3）影响：打破贵族特权，促进社会阶层流动。"}]}, {"type": "h2", "toks": [{"t": "3.察举制和征辟制"}]}, {"type": "h3", "toks": [{"t": "（1）时间："}, {"a": "两汉", "ul": 8}, {"t": "时期。"}]}, {"type": "h3", "toks": [{"t": "（2）特点：以品德（孝廉）和才能为主。"}, {"a": "察举制", "ul": 8}, {"t": "是地方官考察推荐人才给\n中央，"}, {"a": "征辟制", "ul": 8}, {"t": "是皇帝征召或高官聘任人才。"}]}, {"type": "h3", "toks": [{"t": "（3）影响：后期出现“举秀才，不知书；举孝廉，父别居”的现象。"}]}, {"type": "h2", "toks": [{"t": "4."}, {"a": "九品中正制", "ul": 16}]}, {"type": "h3", "toks": [{"t": "（1）时间：魏晋南北朝。"}]}, {"type": "h3", "toks": [{"t": "（2）特点：家世、德行、才能并重。"}]}, {"type": "h3", "toks": [{"t": "（3）影响：后期形成“上品无寒门，下品无势族”的局面，阻碍了社会流动。"}]}, {"type": "h2", "toks": [{"t": "5.科举制"}]}, {"type": "h3", "toks": [{"t": "（1）时间：隋唐至清末。"}]}, {"type": "h3", "toks": [{"t": "（2）特点：以才学（考试成绩）为标准。"}]}, {"type": "h3", "toks": [{"t": "（3）发展"}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "隋炀帝", "ul": 8}, {"t": "：始建进士科，科举制度正式形成。"}]}, {"type": "h4", "toks": [{"t": "②"}, {"a": "武则天", "ul": 8}, {"t": "：“自荐求官”，始创武举和殿试以及糊名制。"}]}, {"type": "h4", "toks": [{"t": "③宋：科举开始实行"}, {"a": "誊录", "ul": 8}, {"t": "，并发展糊名制，使其成为定制。"}]}, {"type": "h4", "toks": [{"t": "④明清：实行八股取士。"}]}, {"type": "h4", "toks": [{"t": "⑤清末"}, {"a": "光绪", "ul": 8}, {"t": "年间（1905 年）：正式废除。"}]}, {"type": "h3", "toks": [{"t": "（4）影响：中国古代存在时间最长、影响最深远的选官制度。\n二、科举考试程序（明清时期）明清两朝科举的基本制度和考试程序大体是一致的，其中以进士科考试最为重要。进士科正式考试共分童试、乡试、会试和殿试。\n童试：包括县试、童试、院试三级，通过院试者称为“生员”，俗称“"}, {"a": "秀才", "ul": 8}, {"t": "”。\n乡试：又称“秋闱”。考中者为“"}, {"a": "举人", "ul": 8}, {"t": "”，第一名称“"}, {"a": "解元", "ul": 8}, {"t": "”。\n会试：又称“礼闱”“春闱”。取中者为“"}, {"a": "贡士", "ul": 8}, {"t": "”，第一名称“"}, {"a": "会元", "ul": 8}, {"t": "”。\n殿试：一般由皇帝亲自主持，前三名分别为“"}, {"a": "状元", "ul": 8}, {"t": "、榜眼、探花”。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n连中三元\n考生在科举考试中身兼乡试第一，会试第一，殿试第一，即"}, {"a": "解元、会元、状元", "ul": 16}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "下列言论中涉及到的人才选拔制度，按出现顺序先后排列正确的是：①学通行修，经中博士②宗室非有军功论，不得为属籍③九品访人，唯问中正④风吹金榜落凡世，三十三人名字香", "opts": {"A": "②④①③", "B": "②①③④", "C": "①③②④", "D": "③②④①"}, "ans": "B"}, {"src": "母题", "stem": "科举制是我国古代选拔人才的重要制度，下列事件最有可能发生的是：", "opts": {"A": "隋炀帝时期，陈某通过发奋读书，考取了进士", "B": "唐太宗时期，裴某由于武功非凡，通过了武举考试", "C": "宋仁宗时期，孙某因精通八股文，进入了殿试", "D": "清宣统时期，黄某在科场失意后，参加了武昌起义"}, "ans": "A"}, {"src": "母题", "stem": "下列关于中国古代科举制度的表述，正确的是：", "opts": {"A": "隋炀帝始建进士科，标志科举制正式形成", "B": "武则天首创武举、殿试及“八股取士”", "C": "宋朝科举定制化推行“自荐求官”制度", "D": "科举制在清末洋务运动期间正式废除"}, "ans": "A"}, {"src": "拓展", "stem": "（2）特点：以____关系为纽带，官位世袭。", "opts": {"A": "血缘", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "血缘"}, {"src": "拓展", "stem": "①____：始建进士科，科举制度正式形成。", "opts": {"A": "隋炀帝", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "隋炀帝"}, {"src": "拓展", "stem": "考中者为“____”，第一名称“解元”。", "opts": {"A": "举人", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "举人"}], "branches": [{"h": "1.世卿世禄制", "terms": ["血缘"]}, {"h": "2.军功爵制", "terms": ["战国"]}, {"h": "3.察举制和征辟制", "terms": ["两汉", "察举制", "征辟制"]}, {"h": "4.", "terms": ["九品中正制"]}, {"h": "5.科举制", "terms": ["隋炀帝", "武则天", "誊录", "光绪", "秀才", "举人", "解元"]}], "notes": ["选官制度五阶段：世卿世禄（先秦、血缘世袭）→军功爵（战国、以军功为标准促流动）→察举征辟（两汉、重孝廉，察举=地方推荐、征辟=皇帝征召或高官聘任，后期'举秀才不知书、举孝廉父别居'）→九品中正（魏晋南北朝、后期'上品无寒门'）→科举（隋唐至1905，以才学考试为标准，存在时间最长、影响最深远）。", "科举节点：隋炀帝始建进士科（正式形成）；武则天首创武举、殿试、糊名；宋代誊录、糊名成定制；明清八股取士；1905年（光绪）废除。", "明清考试程序：童试（过了是生员/秀才）→乡试（秋闱，中为举人，第一解元）→会试（春闱/礼闱，中为贡士，第一会元）→殿试（皇帝主持，前三状元、榜眼、探花）；解元+会元+状元=连中三元。"]}, {"id": 43, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代赋税制度", "nblank": 11, "blocks": [{"type": "h2", "toks": [{"t": "1.初税亩：春秋时期，"}, {"a": "鲁国", "ul": 8}, {"t": "率先实行，按照拥有土地数量的多少征收赋\n税。这是中国征收土地税的开端。"}]}, {"type": "h2", "toks": [{"t": "2.租庸调制：始于"}, {"a": "隋", "ul": 8}, {"t": "，唐朝前期趋于完善。租是田租；调是"}, {"a": "人头税", "ul": 8}, {"t": "；\n庸是纳绢代役。"}]}, {"type": "h2", "toks": [{"t": "3.两税法："}, {"a": "唐朝", "ul": 8}, {"t": "后期，改革赋税制度，实施两税法。两税法将各种名目\n的赋税统一并到"}, {"a": "户税和地税", "ul": 16}, {"t": "中；每户按资产交纳户税，按田亩交纳地税；\n分为"}, {"a": "夏秋", "ul": 8}, {"t": "两季征收。两税法改变了以往“以人丁为主”的征税标准，转向“以\n财产、土地为核心”。"}]}, {"type": "h2", "toks": [{"t": "4.一条鞭法："}, {"a": "明朝", "ul": 8}, {"t": "时期，由张居正主持改革。把各州县的田赋、徭役以\n及其他杂征总为一条，合并征收银两，按亩折算缴纳，推动"}, {"a": "实物税", "ul": 8}, {"t": "向"}, {"a": "货币税", "ul": 8}, {"t": "\n转变，适应了商品经济的发展趋势。"}]}, {"type": "h2", "toks": [{"t": "5.摊丁入亩："}, {"a": "清朝", "ul": 8}, {"t": "时期，雍正初年开始实行摊丁入亩，即把丁银全部摊\n入地亩中征收。摊丁入亩的实行标志着延续了数千年的"}, {"a": "人头税", "ul": 8}, {"t": "的废除。"}]}], "quiz": [{"src": "真题", "stem": "对有关古代税法的表述中，不正确的是：", "opts": {"A": "唐朝采用两税法改变了以人丁为主的税收标准", "B": "宋朝王安石采用青苗法、农田水利法、方田均税法、保甲法等措施直接缓解了政府财政收入困难", "C": "明朝实行一条鞭法把力役改为雇役，政府雇人代役，全部简并为一体", "D": "清朝实行“摊丁入亩”，征收“地丁银”的措施使得人口的增加不再与赋税相关"}, "ans": "B"}, {"src": "母题", "stem": "下列赋税制度与其特点对应错误的是：", "opts": {"A": "两税法——按户税和地税分夏秋两季征收", "B": "租庸调制——“调”指征收粮食作为人头税", "C": "摊丁入亩——将丁银分摊至田亩征收", "D": "一条鞭法——役银按人丁和田亩分担"}, "ans": "B"}, {"src": "拓展", "stem": "1.初税亩：春秋时期，____率先实行，按照拥有土地数量的多少征收赋", "opts": {"A": "鲁国", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "鲁国"}, {"src": "拓展", "stem": "分为____两季征收。", "opts": {"A": "夏秋", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "夏秋"}, {"src": "拓展", "stem": "及其他杂征总为一条，合并征收银两，按亩折算缴纳，推动实物税向____", "opts": {"A": "货币税", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "货币税"}], "branches": [{"h": "1.初税亩：春秋时期，", "terms": ["鲁国"]}, {"h": "2.租庸调制：始于", "terms": ["人头税"]}, {"h": "3.两税法：", "terms": ["唐朝", "户税和地税", "夏秋"]}, {"h": "4.一条鞭法：", "terms": ["明朝", "实物税", "货币税"]}, {"h": "5.摊丁入亩：", "terms": ["清朝", "人头税"]}], "notes": ["赋税演变主线：初税亩（春秋鲁国、按土地数量征税、征地税开端）→租庸调制（隋唐前期：租=田租、庸=纳绢布代役、调=户税）→两税法（唐后期杨炎、按资产交户税、按田亩交地税、夏秋两征，征税标准从以人丁为主转向以财产土地为核心）→一条鞭法（明张居正、赋役合并、统一征银，实物税向货币税转变）→摊丁入亩（清雍正、丁银摊入地亩，延续数千年的人头税被废除）。"]}, {"id": 44, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代变法与改革", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.管仲改革：春秋时期，"}, {"a": "齐桓公", "ul": 8}, {"t": "任用管仲进行改革。主要内容有“叁其国\n而伍其鄙”“"}, {"a": "相地而衰征", "ul": 16}, {"t": "”等。改革促使齐国迅速富强，齐桓公成为春秋\n首霸。"}]}, {"type": "h2", "toks": [{"t": "2.李悝变法："}, {"a": "战国", "ul": 8}, {"t": "初期，魏文侯为了增强国力，任用李悝为相，在诸侯\n国中率先推行变法。主要内容有打破贵族世袭的“世卿世禄制”，主张选贤任能；\n推行“尽地力之教”；实施“"}, {"a": "平籴法", "ul": 8}, {"t": "”；编撰"}, {"a": "《法经》", "ul": 8}, {"t": "（中国历史上第一部系\n统的成文法典）。这是中国历史上第一次比较系统的地主阶级改革。"}]}, {"type": "h2", "toks": [{"t": "3.商鞅变法："}, {"a": "战国", "ul": 8}, {"t": "时期，秦孝公任用商鞅进行两次变法。主要内容有废\n井田，开阡陌，确立"}, {"a": "土地私有制", "ul": 16}, {"t": "；重农抑商，奖励耕织；奖励军功，按功\n授爵；推行“分户令”（“分异令”）；户籍什伍制、连坐法；推行县制。变法\n为秦统一六国奠定了基础。"}]}, {"type": "h2", "toks": [{"t": "4.北魏孝文帝改革：南北朝时期，北魏孝文帝在位时推行改革。主要内容有\n颁布均田令；迁都"}, {"a": "洛阳", "ul": 8}, {"t": "；推行"}, {"a": "汉化政策", "ul": 8}, {"t": "，说汉话、改汉姓、通汉婚等。改革\n促进了北方民族融合，是中国古代史上最成功、影响最深远的少数民族汉化改革。"}]}, {"type": "h2", "toks": [{"t": "5.王安石变法："}, {"a": "北宋", "ul": 8}, {"t": "时期，宋神宗任用王安石进行变法，旨在富国强兵。\n主要内容有“富国”方面的"}, {"a": "青苗法", "ul": 8}, {"t": "、募役法（免役法）、"}, {"a": "农田水利法", "ul": 16}, {"t": "、\n方田均税法；“强兵”部分的"}, {"a": "保甲法", "ul": 8}, {"t": "、保马法、将兵法等。"}]}, {"type": "h2", "toks": [{"t": "6.张居正改革：明神宗万历年间，张居正进行整顿改革。政治上推行“考成\n法”。经济上推行“一条鞭法”，这是其变法的核心内容。"}]}], "quiz": [{"src": "真题", "stem": "关于中国历史上著名的改革，下列说法错误的是：", "opts": {"A": "商鞅变法的“分户令”推动了自耕农经济发展", "B": "北魏孝文帝以南伐为名来达到迁都洛阳的目的", "C": "王安石采用“青苗法”打击了逃避赋税的现象", "D": "张居正改革的“一条鞭法”意在整顿赋役制度"}, "ans": "C"}, {"src": "母题", "stem": "下列关于我国古代改革与变法的说法，正确的是：", "opts": {"A": "管仲在齐国推行“相地而衰征”，从法律上确立了土地私有制", "B": "商鞅变法奖励军功、废除世卿世禄制，沉重打击了旧贵族势力", "C": "北魏孝文帝改革核心是“一条鞭法”，促进了北方民族大融合", "D": "王安石变法中的青苗法、保甲法属于“强兵”措施"}, "ans": "B"}, {"src": "母题", "stem": "下列关于我国古代改革的表述，有误的是：", "opts": {"A": "春秋时期的李悝变法，是中国历史上第一次比较系统的地主阶级改革", "B": "北魏孝文帝迁都洛阳、改汉姓、说汉话，推动少数民族汉化", "C": "王安石变法的方田均税法、农田水利法最终目的是增加财政收入", "D": "商鞅变法废井田、开阡陌，确立了土地私有制"}, "ans": "A"}, {"src": "拓展", "stem": "1.管仲改革：春秋时期，____任用管仲进行改革。", "opts": {"A": "齐桓公", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "齐桓公"}, {"src": "拓展", "stem": "3.商鞅变法：____时期，秦孝公任用商鞅进行两次变法。", "opts": {"A": "战国", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "战国"}, {"src": "拓展", "stem": "5.王安石变法：____时期，宋神宗任用王安石进行变法，旨在富国强兵。", "opts": {"A": "北宋", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "北宋"}], "branches": [{"h": "1.管仲改革：春秋时期，", "terms": ["齐桓公", "相地而衰征"]}, {"h": "2.李悝变法：", "terms": ["战国", "平籴法"]}, {"h": "3.商鞅变法：", "terms": ["战国", "土地私有制"]}, {"h": "4.北魏孝文帝改革：南北朝时期，北魏孝文帝在位时推行改革。主要内容有", "terms": ["洛阳", "汉化政策"]}, {"h": "5.王安石变法：", "terms": ["北宋", "青苗法", "农田水利法", "保甲法"]}], "notes": ["管仲（春秋、相齐桓公、'相地而衰征'，助齐桓成首霸）；李悝（战国初魏文侯、平籴法、编《法经》=第一部系统成文法典，第一次较系统的地主阶级改革）。", "商鞅变法（战国秦孝公，两次）：废井田开阡陌确立土地私有、重农抑商奖励耕织、奖励军功按功授爵（废世卿世禄）、什伍连坐、推行县制，为秦统一奠基。", "北魏孝文帝改革：均田令、迁都洛阳、全面汉化（说汉话、改汉姓、通汉婚），是最成功、影响最深远的少数民族汉化改革；王安石变法（北宋神宗）：富国（青苗法打击高利贷、募役法、农田水利、方田均税）+强兵（保甲、保马、将兵）；张居正改革（明万历）：政治考成法、经济一条鞭法（核心）。"]}, {"id": 45, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代边疆治理", "nblank": 14, "blocks": [{"type": "h2", "toks": [{"t": "1.西藏"}]}, {"type": "h3", "toks": [{"t": "（1）元朝：设置"}, {"a": "宣政院", "ul": 8}, {"t": "，专门管理全国佛教事务和"}, {"a": "西藏", "ul": 8}, {"t": "地区的行政事\n务。"}, {"a": "西藏", "ul": 8}, {"t": "自此开始成为中国领土不可分割的一部分。"}]}, {"type": "h3", "toks": [{"t": "（2）清朝\n崇德年间，设立理藩院为管理蒙古、回部及西藏等少数民族的最高中央机构。\n雍正年间，设置"}, {"a": "驻藏大臣", "ul": 8}, {"t": "，和达赖、班禅共同管理西藏。"}]}, {"type": "h2", "toks": [{"t": "2.新疆"}]}, {"type": "h3", "toks": [{"t": "（1）西汉：汉宣帝设"}, {"a": "西域都护府", "ul": 16}, {"t": "，这是今新疆地区正式归属中央统辖\n的开始。"}]}, {"type": "h3", "toks": [{"t": "（2）唐朝\n"}, {"a": "唐太宗", "ul": 8}, {"t": "设立安西都护府，主管西域（今新疆和中亚地区）事务。\n武则天设立"}, {"a": "北庭都护府", "ul": 16}, {"t": "，管辖天山以北包括阿尔泰山和巴尔喀什湖以西的广大地区。"}]}, {"type": "h3", "toks": [{"t": "（3）清朝\n乾隆年间，设置"}, {"a": "伊犁将军", "ul": 8}, {"t": "，管辖包括巴尔喀什湖在内的整个新疆地区。\n"}, {"a": "光绪", "ul": 8}, {"t": "年间，任命刘锦棠为新疆巡抚，新疆省正式成立。"}]}, {"type": "h2", "toks": [{"t": "3.台湾"}]}, {"type": "h3", "toks": [{"t": "（1）元朝：设立"}, {"a": "澎湖巡检司", "ul": 16}, {"t": "作为管理琉球（今台湾）和澎湖列岛的专\n门机构。"}]}, {"type": "h3", "toks": [{"t": "（2）明朝：1624 年"}, {"a": "荷兰", "ul": 8}, {"t": "殖民者侵占我国台湾。1661 年，郑成功从金门出\n发，打败荷兰殖民者。1662 年，荷兰殖民者投降，台湾回到祖国怀抱。"}]}, {"type": "h3", "toks": [{"t": "（3）清朝\n康熙年间，设立台湾府，隶属"}, {"a": "福建省", "ul": 8}, {"t": "，正式对台湾行使有效管辖。\n"}, {"a": "光绪", "ul": 8}, {"t": "年间，设立台湾省。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n改土归流\n明清时期中央王朝在"}, {"a": "西南", "ul": 8}, {"t": "少数民族地区（云南、贵州、广西、四川、湖\n南等）推行的一项重要政策，旨在废除当地世袭的土司制度，改设由中央直接任\n命的流官进行治理，从而加强中央集权、推动边疆与内地一体化。"}]}], "quiz": [{"src": "真题", "stem": "关于新疆地区历代的管辖机构，下列说法错误是：", "opts": {"A": "西域都护府设立于西汉", "B": "安西都护府最终被吐蕃攻陷", "C": "元朝设立宣政院管辖新疆地区", "D": "伊犁将军为清朝新疆地区最高军政长官"}, "ans": "C"}, {"src": "母题", "stem": "下列中国古代对边疆地区的治理措施，按时间先后排序正确的是：①设安西都护府②设驻藏大臣③设台湾府④设伊犁将军", "opts": {"A": "①—③—②—④", "B": "①—④—③—②", "C": "①—③—④—②", "D": "①—②—④—③"}, "ans": "C"}, {"src": "母题", "stem": "为了巩固统一的多民族国家，秦汉以来的中央政府都加强了对边疆的管理，以下朝代与其采取的措施对应正确的是：", "opts": {"A": "汉朝——大规模修筑长城，防御北方游牧民族匈奴的进攻", "B": "唐朝——设立西域都护府，管辖天山南北的西域事务", "C": "宋朝——实行“改土归流”，加强与西南少数民族地区的联系", "D": "元朝——设立宣政院，加强对西藏的管辖"}, "ans": "D"}, {"src": "拓展", "stem": "（1）元朝：设置____，专门管理全国佛教事务和西藏地区的行政事", "opts": {"A": "宣政院", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "宣政院"}, {"src": "拓展", "stem": "（1）西汉：汉宣帝设____，这是今新疆地区正式归属中央统辖", "opts": {"A": "西域都护府", "B": "彩陶文化", "C": "半坡遗址", "D": "玉猪龙"}, "ans": "A", "real": "西域都护府"}, {"src": "拓展", "stem": "____年间，任命刘锦棠为新疆巡抚，新疆省正式成立。", "opts": {"A": "光绪", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "光绪"}], "branches": [{"h": "1.西藏", "terms": ["宣政院", "西藏", "驻藏大臣"]}, {"h": "2.新疆", "terms": ["西域都护府", "唐太宗", "北庭都护府", "伊犁将军", "光绪"]}, {"h": "3.台湾", "terms": ["澎湖巡检司", "荷兰", "福建省", "光绪", "西南"]}], "notes": ["西藏：元设宣政院（西藏自此成为中国领土不可分割的一部分）、清理藩院（管蒙古回部西藏的最高中央机构）、雍正设驻藏大臣与达赖班禅共管。", "新疆：西汉宣帝设西域都护府（正式归属中央的开始）、唐设安西（太宗）、北庭（武则天）都护府、清乾隆设伊犁将军、光绪时刘锦棠任新疆巡抚、新疆正式建省。", "西南：明清'改土归流'（在云贵桂川湘废除世袭土司、改中央任命流官）。台湾：元设澎湖巡检司；1624荷兰侵占→1661郑成功进军、1662收复；清康熙设台湾府属福建省，光绪时建台湾省。"]}, {"id": 46, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代对外交流", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.两汉时期"}]}, {"type": "h3", "toks": [{"t": "（1）西汉\n汉武帝时期，"}, {"a": "张骞", "ul": 8}, {"t": "两次出使“西域”，正式打通从长安经河西走廊，通往中亚、西亚乃至欧洲的陆路通道，即陆上丝绸之路。被誉为“"}, {"a": "凿空之旅", "ul": 8}, {"t": "”。"}]}, {"type": "h3", "toks": [{"t": "（2）东汉\n汉明帝时期，"}, {"a": "班超", "ul": 8}, {"t": "出使西域，重开丝绸之路。典故有"}, {"a": "投笔从戎", "ul": 8}, {"t": "、不入虎穴，不得虎子。\n佛教由丝绸之路传入中国，建立中国第一座官办寺庙——"}, {"a": "白马寺", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.唐朝时期\n"}, {"a": "唐太宗", "ul": 8}, {"t": "时期，玄奘赴印度取经，著《大唐西域记》。\n"}, {"a": "唐玄宗", "ul": 8}, {"t": "时期，鉴真东渡日本，将中国的医药、建筑、雕塑、文学、书法、\n绘画等技术知识传入日本。日本为了学习中国文化，先后向唐朝派出十三次遣唐\n使团。"}]}, {"type": "h2", "toks": [{"t": "3.宋元时期\n宋朝，在广州、泉州等主要港口设立市舶司，负责管理外商、征收关税等。\n南宋后期，"}, {"a": "泉州港", "ul": 8}, {"t": "迅速崛起为“东方第一大港”。\n元朝，《马可·波罗游记》首次向欧洲系统介绍中国印刷术、纸币、驿站等\n制度，推动了新航路的开辟。\n宋元时期，对外交流的重心从陆路转向海路，"}, {"a": "海上丝绸之路", "ul": 16}, {"t": "进入鼎盛时\n期。中国的四大发明（造纸术、印刷术、指南针、火药）通过阿拉伯商人等渠道\n大规模西传，对世界文明进程产生了革命性影响。"}]}, {"type": "h2", "toks": [{"t": "4.明清时期\n明成祖、明宣宗时期，郑和"}, {"a": "七次", "ul": 8}, {"t": "下西洋，最远到达"}, {"a": "红海", "ul": 8}, {"t": "沿岸和\n"}, {"a": "非洲", "ul": 8}, {"t": "东海岸，核心目的是"}, {"a": "宣扬国威", "ul": 8}, {"t": "，彰显明朝富强，加强与海外各国的友好\n往来。这是中国古代规模最大、船只最多、海员最多、时间最久的海上航行。"}]}], "quiz": [{"src": "真题", "stem": "关于郑和下西洋，下列说法错误的是：", "opts": {"A": "郑和原名马和，出生于回族家庭", "B": "郑和船队最远到达非洲东海岸和红海沿岸", "C": "郑和下西洋始于明成祖永乐年间，共七次", "D": "郑和下西洋的主要目的是开拓海外贸易、掠夺殖民地"}, "ans": "D"}, {"src": "母题", "stem": "下列关于中国古代对外交流的表述，正确的：", "opts": {"A": "西汉时期，张骞出使西域时，已将造纸术传入欧洲，推动西方文化发展", "B": "东汉时期，班超重开丝绸之路，典故“投笔从戎”出自其事迹", "C": "唐朝时期，鉴真东渡日本，将中国的四大发明全部传入日本", "D": "宋元时期，海上丝绸之路进入鼎盛，广州港成为“东方第一大港”"}, "ans": "B"}, {"src": "拓展", "stem": "汉武帝时期，____两次出使“西域”，正式打通从长安经河西走廊，通往中亚、西亚乃至欧洲的陆路通道，即陆上丝绸之路。", "opts": {"A": "张骞", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "张骞"}, {"src": "拓展", "stem": "佛教由丝绸之路传入中国，建立中国第一座官办寺庙——____", "opts": {"A": "白马寺", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "白马寺"}, {"src": "拓展", "stem": "宋元时期，对外交流的重心从陆路转向海路，____进入鼎盛时", "opts": {"A": "海上丝绸之路", "B": "彩陶文化", "C": "半坡遗址", "D": "中华五千年文明史"}, "ans": "A", "real": "海上丝绸之路"}], "branches": [{"h": "1.两汉时期", "terms": ["张骞", "凿空之旅", "班超", "投笔从戎", "白马寺"]}, {"h": "2.唐朝时期", "terms": ["唐太宗", "唐玄宗"]}, {"h": "3.宋元时期", "terms": ["泉州港", "海上丝绸之路"]}, {"h": "4.明清时期", "terms": ["七次", "红海", "非洲", "宣扬国威"]}], "notes": ["西汉张骞两次出使西域、打通陆上丝绸之路，被称'凿空之旅'；东汉班超投笔从戎、'不入虎穴焉得虎子'，重开丝路；佛教经丝路传入，第一座官办佛寺=白马寺。", "唐代：玄奘（太宗时）赴天竺取经、著《大唐西域记》；鉴真（玄宗时）东渡日本传播医药建筑；日本十三次派遣唐使。", "宋代在广州、泉州设市舶司，南宋泉州是'东方第一大港'；宋元对外重心转向海路、海上丝路鼎盛，四大发明经阿拉伯传向西方；郑和七下西洋（明成祖至宣宗），最远到达红海沿岸和非洲东海岸，核心目的是宣扬国威，是古代规模最大、船只海员最多、时间最久的远洋航行。"]}, {"id": 47, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "古代农业发展", "nblank": 18, "blocks": [{"type": "h2", "toks": [{"t": "1.农作物种类"}]}, {"type": "h3", "toks": [{"t": "（1）五谷\n五谷是中国古代对主要粮食作物的统称。古代有多种不同说法，最主要的有两种：一种指稻（水稻）、"}, {"a": "黍", "ul": 8}, {"t": "（黄米）、稷、麦（小麦）、"}, {"a": "菽", "ul": 8}, {"t": "（豆类）；另一种指麻、黍、稷、麦、菽。稷是五谷之长。"}]}, {"type": "h3", "toks": [{"t": "（2）传入中国的作物\n"}, {"a": "西汉", "ul": 8}, {"t": "：西域传入葡萄、石榴、核桃、芝麻、黄瓜、香菜、大蒜、茄子等。\n"}, {"a": "唐朝", "ul": 8}, {"t": "：胡椒、熬糖法等。\n宋朝：北宋时期，越南传入的"}, {"a": "占城稻", "ul": 8}, {"t": "从福建推广到江浙和淮河流域，水稻在宋朝跃居粮食产量首位。南宋时期，太湖流域盛产稻米，"}, {"a": "棉花", "ul": 8}, {"t": "种植从闽粤扩展到江淮。\n"}, {"a": "明朝", "ul": 8}, {"t": "：玉米、甘薯、马铃薯、花生、番茄、辣椒、烟草传入我国，棉布成为人民主要衣料。"}]}, {"type": "h2", "toks": [{"t": "2.农耕技术"}]}, {"type": "h3", "toks": [{"t": "（1）春秋战国时期：人们开始使用"}, {"a": "铁农具", "ul": 8}, {"t": "和牛耕并将其逐渐推广。"}]}, {"type": "h3", "toks": [{"t": "（2）两汉时期：铁犁牛耕成为我国传统农业的主要耕作方式。汉武帝时，赵\n过推广耦犁，创造耧车，发明"}, {"a": "代田法", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）隋唐时期：创制了灌溉工具筒车；江东地区出现的"}, {"a": "曲辕犁", "ul": 8}, {"t": "，便于水田\n耕作。"}]}, {"type": "h2", "toks": [{"t": "3.水利工程"}]}, {"type": "h3", "toks": [{"t": "（1）春秋时期：楚相孙叔敖修建芍陂，又名安丰塘，是中国最早的蓄水灌溉\n工程。"}]}, {"type": "h3", "toks": [{"t": "（2）战国时期：秦国李冰主持修建的"}, {"a": "都江堰", "ul": 8}, {"t": "、韩国水工郑国修建的"}, {"a": "郑国渠", "ul": 8}, {"t": "。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n都江堰"}]}, {"type": "h2", "toks": [{"t": "1.三大主体工程\n鱼嘴分水堤：形如鱼头的堤坝将岷江一分为二，形成内江和外江。它利用地\n形和水势，实现了“四六分水”的动态平衡：枯水期，约六成江水流入"}, {"a": "内江", "ul": 8}, {"t": "，\n保证灌溉；洪水期，约六成江水排入"}, {"a": "外江", "ul": 8}, {"t": "，实现泄洪。\n飞沙堰溢洪道：作为内江的“安全阀”，当水量过大时，多余的水会漫过这\n道低矮的堰坝，排入外江。更重要的是，它利用水流在弯道产生的离心力，形成\n漩涡，能将内江80%以上的泥沙和卵石“甩”出，有效防止了渠道淤积。\n宝瓶口引水口：人工在玉垒山凿开的一个形似瓶口的狭窄通道，是内江水进\n入成都平原的咽喉。它像一道天然闸门，精确控制进入灌区的水量，确保平原地\n区用水平稳。"}]}, {"type": "h2", "toks": [{"t": "2.历史地位\n都江堰是世界现存年代最久、唯一留存、"}, {"a": "仍在使用", "ul": 8}, {"t": "的无坝引水水利工程。2000\n年列入世界文化遗产，2018 年列入世界灌溉工程遗产名录。"}]}, {"type": "h3", "toks": [{"t": "（3）秦朝时期：修建灵渠，联接"}, {"a": "长江、珠江", "ul": 8}, {"t": "两大水系，促使秦始皇统一岭南。"}]}, {"type": "h3", "toks": [{"t": "（4）隋唐时期："}, {"a": "春秋", "ul": 8}, {"t": "时期，吴王夫差开凿了连接长江与淮河的邗沟，这\n是有确切纪年的中国大运河最早的河段。隋朝时期，为加强都城洛阳与南方的联系，隋炀帝下令大规模开凿运河。元朝时期，为缩短航程，对运河进行了“"}, {"a": "裁弯取直", "ul": 8}, {"t": "”，先后开凿了济州河、会通河、通惠河等新河道，使运河不再绕道洛阳。"}]}], "quiz": [{"src": "真题", "stem": "下列外来农作物和制作方法与引进朝代对应错误的是：", "opts": {"A": "占城稻——宋朝", "B": "玉米——明朝", "C": "熬糖法——唐朝", "D": "烟草——元朝"}, "ans": "D"}, {"src": "母题", "stem": "稻、黍、稷、麦、菽都是我国有悠久种植历史的农作物，下列对应错误的是：", "opts": {"A": "黍——薯类", "B": "菽——豆类", "C": "稷——高粱", "D": "稻——水稻"}, "ans": "A"}, {"src": "母题", "stem": "关于都江堰水利工程，下列说法正确的是：", "opts": {"A": "都江堰由战国时期秦国蜀郡太守李冰主持修建，其核心工程灵渠沟通了岷江与长江水系", "B": "鱼嘴分水堤利用弯道环流原理，实现了“四六分水”，即洪水期六成水入内江，枯水期六成水入外江", "C": "飞沙堰作为内江的“安全阀”，在洪水期将多余水量和80%以上的泥沙排入外江，有效防止渠道淤积", "D": "都江堰是世界现存年代最久、唯一留存、仍在使用的有坝引水水利工程"}, "ans": "C"}, {"src": "拓展", "stem": "____：西域传入葡萄、石榴、核桃、芝麻、黄瓜、香菜、大蒜、茄子等。", "opts": {"A": "西汉", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "西汉"}, {"src": "拓展", "stem": "（1）春秋战国时期：人们开始使用____和牛耕并将其逐渐推广。", "opts": {"A": "铁农具", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "铁农具"}, {"src": "拓展", "stem": "形和水势，实现了“四六分水”的动态平衡：枯水期，约六成江水流入____，", "opts": {"A": "内江", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "内江"}], "branches": [{"h": "1.农作物种类", "terms": ["西汉", "唐朝", "占城稻", "棉花", "明朝"]}, {"h": "2.农耕技术", "terms": ["铁农具", "代田法", "曲辕犁"]}, {"h": "3.水利工程", "terms": ["都江堰", "郑国渠"]}, {"h": "1.三大主体工程", "terms": ["内江", "外江"]}, {"h": "2.历史地位", "terms": ["仍在使用", "春秋", "裁弯取直"]}], "notes": ["五谷=稻黍稷麦菽（另一说麻黍稷麦菽，稷为五谷之长）。作物传入：西汉经西域传入葡萄、石榴、核桃、芝麻、黄瓜、香菜、大蒜、茄子；唐代传入胡椒、熬糖法；北宋传入越南占城稻（此后水稻产量跃居首位）；明代传入玉米、甘薯、马铃薯、花生、番茄、辣椒、烟草。", "农耕：春秋战国出现铁农具和牛耕，两汉铁犁牛耕成为主要方式（赵过推广耦犁、耧车、代田法），隋唐有筒车和江东曲辕犁（适水田）。", "水利：春秋楚相孙叔敖修芍陂（最早的蓄水灌溉工程）；战国秦李冰修都江堰、韩国水工郑国修郑国渠；秦修灵渠（沟通长江珠江水系）；隋修大运河（春秋吴王夫差邗沟是有确切纪年的最早河段，元代裁弯取直）。", "都江堰三主体：鱼嘴分水堤（四六分水，枯水六成入内江灌溉、洪水六成入外江泄洪）、飞沙堰（利用离心力排走约八成泥沙）、宝瓶口（狭窄通道控制进水）；是世界现存最久、唯一仍在使用的无坝水利工程。"]}, {"id": 48, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "近代不平等条约", "nblank": 10, "blocks": [{"type": "table", "ncol": 4, "head": [[{"t": "时期"}], [{"t": "不平等条约"}], [{"t": "内容"}], [{"t": "影响"}]], "rows": [[{"toks": [{"t": "鸦片战争\n（1840-1842）"}], "span": 1}, {"toks": [{"t": "《南京条约》"}], "span": 0}, {"toks": [{"t": "（1）割让"}, {"a": "香港岛", "ul": 8}, {"t": "给英国。（2）赔款2100万银元。（3）开放广州、厦门、福州、宁波、"}, {"a": "上海", "ul": 8}, {"t": "为通商口岸。（4）中英“协定关税”。"}], "span": 0}, {"toks": [{"t": "中国近代第一个不平等条约。中国"}, {"a": "开始", "ul": 8}, {"t": "沦为半殖民地半封建社会。"}], "span": 0}], [{"toks": [{"t": "第二次鸦片战争\n（1858-1860）"}], "span": 2}, {"toks": [{"t": "《"}, {"a": "天津条约", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "（1）外国公使进驻北京。（2）外国传教士可到内地传教。（3）外国商船和军舰可在长江各口岸航行。"}], "span": 0}, {"toks": [{"t": "使中国丧失了大片的领土和大量的主权，中国的半殖民地"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [{"t": "《"}, {"a": "北京条约", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "（1）增开天津为通商口岸。（2）割让九龙司地方一区给英国。"}], "span": 0}, {"toks": [{"t": "半封建化程度进一步加深。列强对华经济"}], "span": 0}], [{"toks": [{"t": "甲午中日战争\n（1894-1895）"}], "span": 1}, {"toks": [{"t": "《"}, {"a": "马关条约", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "（1）清政府割让辽东半岛、"}, {"a": "台湾", "ul": 8}, {"t": "全岛及其附属岛屿、澎湖列岛。（2）赔偿日本军费白银2亿两。（3）允许日本在中国开办工厂。"}], "span": 0}, {"toks": [{"t": "侵略由商品输出转变为以"}, {"a": "资本输出", "ul": 8}, {"t": "为主，中国社会的半殖民地半封建化程度大大加深。"}], "span": 0}], [{"toks": [{"t": "八国联军侵华战争\n（1900-1901）"}], "span": 1}, {"toks": [{"t": "《"}, {"a": "辛丑条约", "ul": 8}, {"t": "》"}], "span": 0}, {"toks": [{"t": "（1）赔偿白银4.5亿两，分39年还清，本息折合9.8亿两。（2）在北京东郊民巷设使馆区，各国驻兵保护，中国人不得居住。（3）拆除从北京到大沽沿途的所有炮台，允许帝国主义派兵驻扎北京到山海关铁路沿线要地。（4）严禁中国人民参加各种形式的反帝活动。（5）改总理衙门为外务部，位于六部之上。"}], "span": 0}, {"toks": [{"t": "清政府彻底成为帝国主义统治中国的工具，中国"}, {"a": "完全陷入", "ul": 8}, {"t": "半殖民地半封建社会的深渊。"}], "span": 0}]]}], "quiz": [{"src": "真题", "stem": "下列关于《南京条约》的说法，错误的是：", "opts": {"A": "是我国近代第一个不平等条约", "B": "破坏了我国的领土完整和关税主权", "C": "使我国开始沦为半殖民地半封建社会", "D": "它的签署标志着甲午中日战争的结束"}, "ans": "D"}, {"src": "母题", "stem": "导致中国完全沦为半殖民地半封建社会的不平等条约及其对应的战争是：", "opts": {"A": "《南京条约》——鸦片战争", "B": "《北京条约》——第二次鸦片战争", "C": "《马关条约》——甲午中日战争", "D": "《辛丑条约》——八国联军侵华战争"}, "ans": "D"}, {"src": "母题", "stem": "1842 年8 月，清政府被迫签订了中国近代史上的第一个不平等条约——《南京条约》。关于《南京条约》的条款，下列说法不正确的是：", "opts": {"A": "割让香港岛", "B": "开放广州、福州、厦门、宁波、上海五处为通商口岸", "C": "允许西方传教士到中国租买土地及兴建教堂", "D": "废除公行制度，准许英商在华自由贸易"}, "ans": "C"}, {"src": "拓展", "stem": "（1840-1842）《南京条约》（1）割让____给英国。", "opts": {"A": "香港岛", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "香港岛"}, {"src": "拓展", "stem": "（1858-1860）《____》（1）外国公使进驻北京。", "opts": {"A": "天津条约", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "天津条约"}, {"src": "拓展", "stem": "（1894-1895）《马关条约》（1）清政府割让辽东半岛、____全岛及其附属岛屿、澎湖列岛。", "opts": {"A": "台湾", "B": "水稻", "C": "彩陶文化", "D": "半坡遗址"}, "ans": "A", "real": "台湾"}], "branches": [{"h": "要点", "terms": ["香港岛", "上海", "开始", "天津条约", "北京条约", "马关条约", "台湾"]}], "notes": ["《南京条约》（鸦片战争1840–42、导火线虎门销烟）：割香港岛、赔2100万银元、广厦福宁上五口通商、协定关税；是中国近代第一个不平等条约，中国开始沦为半殖民地半封建社会。", "第二次鸦片战争（1858–60）：《天津条约》（公使驻京、传教士入内地、外国船舰可在长江航行）、《北京条约》（增开天津、割九龙司地方一区），半殖民地化加深。", "《马关条约》（甲午1894–95）：割辽东半岛（后三国干涉还辽）、台湾全岛及附属岛屿、澎湖列岛，赔2亿两白银，允许日本在华设厂——列强对华由商品输出为主转向资本输出为主，大大加深半殖民地化。", "《辛丑条约》（八国联军1900–01）：赔4.5亿两、分39年本息共9.8亿两；东交民巷划为使馆区可驻兵、中国人不得居住；拆大沽炮台、允许北京至山海关沿线驻兵；改总理衙门为外务部、班列六部之上；清政府彻底成为帝国主义统治中国的工具，中国完全陷入半殖民地半封建社会深渊。"]}, {"id": 49, "part": "常识判断", "pian": "文史常识", "zhang": "历史常识", "jie": "", "kind": "zsd", "title": "旧民主主义革命时期救亡图存运动", "nblank": 17, "blocks": [{"type": "h2", "toks": [{"t": "1.鸦片战争期间\n"}, {"a": "林则徐", "ul": 8}, {"t": "：组织翻译编写《四洲志》等，被称为中国“开眼看世界的第一人”。\n魏源：编成《"}, {"a": "海国图志", "ul": 8}, {"t": "》，并提出“"}, {"a": "师夷长技以制夷", "ul": 16}, {"t": "”的思想。"}]}, {"type": "h2", "toks": [{"t": "2.洋务运动\n兴起：19 世纪60—90 年代，洋务派掀起了一场“师夷长技以自强”的洋务\n运动。\n代表人物：洋务派在中央以恭亲王奕䜣为代表，在地方以曾国藩、李鸿章、\n左宗棠、张之洞为代表。\n旗号：前期以“自强”为旗号，后期打出“求富”的旗号。\n指导思想：中学为体，西学为用。\n主要内容：创办"}, {"a": "军事工业", "ul": 8}, {"t": "、创建近代海军、创办"}, {"a": "新式学堂", "ul": 8}, {"t": "（京师同文馆等）、\n选派留学生出国深造。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n洋务运动——创办军事工业\n曾国藩：在安徽创办"}, {"a": "安庆内军械所", "ul": 16}, {"t": "（我国第一个近代军工厂）。\n李鸿章：在上海创办"}, {"a": "江南制造总局", "ul": 16}, {"t": "（当时国内最大的兵工厂）。\n左宗棠：在福州创办福州船政局。\n张之洞：在武汉创办汉阳铁厂（中国近代最早的官办钢铁企业）。"}]}, {"type": "h2", "toks": [{"t": "3.戊戌变法\n1895 年，康有为、梁启超等组织公车上书，揭开了戊戌变法的序幕。\n1898 年，"}, {"a": "光绪", "ul": 8}, {"t": "皇帝开始变法，持续103 天，史称戊戌变法，又称百日维\n新。1898 年9 月21 日，慈禧太后发动“戊戌政变”标志着“戊戌变法”失败。\n戊戌变法中，设立"}, {"a": "京师大学堂", "ul": 16}, {"t": "，这是中国近代第一所国立大学，标志\n着中国近代国立高等教育的开端。"}]}, {"type": "h2", "toks": [{"t": "4.辛亥革命\n1894 年，孙中山在檀香山成立兴中会，这是中国第一个资产阶级"}, {"a": "革命团体", "ul": 8}, {"t": "。\n1905 年，孙中山在东京成立中国"}, {"a": "同盟会", "ul": 8}, {"t": "。这是中国第一个资产阶级革命政\n党，以“驱除鞑虏，恢复中华，创立民国，平均地权”为纲领。该纲领后又被解\n释为三民主义，即民族、民权、民生，其中"}, {"a": "民权主义", "ul": 8}, {"t": "是核心。\n1911 年10 月10 日，"}, {"a": "武昌起义", "ul": 8}, {"t": "爆发，标志着辛亥革命开始。\n1912 年1 月1 日，中华民国成立，定都"}, {"a": "南京", "ul": 8}, {"t": "，以1912 年为民国元年。\n1912 年3 月，《"}, {"a": "中华民国临时约法", "ul": 16}, {"t": "》颁布，中国历史上第一部具有资产阶级\n共和国宪法性质的重要文件。\n辛亥革命推翻了清王朝的统治，结束了中国两千多年的封建"}, {"a": "君主专制", "ul": 8}, {"t": "制度，\n使民主共和的观念深入人心，但是"}, {"a": "没有改变", "ul": 8}, {"t": "中国半殖民地半封建社会的性质。"}]}], "quiz": [{"src": "真题", "stem": "中国的现代化是晚清历史发展的一个趋向，最能体现这一趋向的是：", "opts": {"A": "洋务运动——戊戌变法——辛亥革命", "B": "鸦片战争——戊戌变法——甲午战争", "C": "洋务运动——戊戌变法——清末新政", "D": "太平天国运动——中法战争——辛亥革命"}, "ans": "A"}, {"src": "母题", "stem": "下列关于辛亥革命的表述，正确的是：", "opts": {"A": "中国同盟会成立于1905 年，是第一个资产阶级革命团体", "B": "三民主义中“民族主义”是核心，对应“创立民国”", "C": "武昌起
