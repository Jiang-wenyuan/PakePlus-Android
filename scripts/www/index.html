 "C": "静止", "D": "正比"}, "ans": "A", "real": "分贝"}, {"src": "拓展", "stem": "常温下，声音在不同的介质中传播的速度不同，通常____＞液体＞", "opts": {"A": "固体", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "固体"}], "branches": [{"h": "1.声音的性质", "terms": ["音色", "音调", "响度", "分贝"]}, {"h": "2.声音的传播", "terms": ["介质", "不能", "固体", "液体", "气体"]}, {"h": "3.声音的分类", "terms": ["20kHz", "20Hz"]}], "notes": ["声音由物体振动产生；三特性：音色（由材料结构决定，'闻其声知其人'）、音调（由频率决定，区分高低）、响度（由振幅决定，'震耳欲聋'），强度单位分贝dB。", "传播需要介质、真空不能传声；一般声速固体>液体>气体（钢铁约5200、水约1500、空气约340m/s，软木约500是特例）；先看见闪电后听见雷声因为光速远大于声速。", "人耳可听声20Hz–20kHz；超声波（>20kHz）方向性好、能量集中，用于测距测速、清洗、焊接、碎石、B超、声呐；次声波（<20Hz）波长长、绕射能力强、传播远、不易衰减，可与人体器官共振造成伤害，用于灾害预警、核爆监测。"]}, {"id": 79, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "化学知识", "kind": "zsd", "title": "非金属物质", "nblank": 19, "blocks": [{"type": "h2", "toks": [{"t": "1.氢（H）\n氢是宇宙中含量"}, {"a": "最多", "ul": 8}, {"t": "的元素，也是元素周期表的第一个元素。\n氢气（H2）：最轻（密度最小）的气体，无色无味无臭，极易燃烧。"}]}, {"type": "h2", "toks": [{"t": "2.碳（C）\n碳是形成"}, {"a": "化合物种类", "ul": 16}, {"t": "最多的元素，也是构成细胞最基本的元素。\n一氧化碳（CO）：易与血红蛋白结合形成碳氧血红蛋白，使血红蛋白丧失携\n氧能力，造成组织窒息，严重时死亡。煤气中毒一般指一氧化碳中毒。\n二氧化碳（CO2）：固态二氧化碳又叫"}, {"a": "干冰", "ul": 8}, {"t": "，在低温保存物品、制造舞\n台烟雾、"}, {"a": "人工降雨", "ul": 8}, {"t": "、制作灭火器等方面有大量应用。"}]}, {"type": "h2", "toks": [{"t": "3.氮（N）\n氮是空气中"}, {"a": "最多", "ul": 8}, {"t": "的元素，是组成氨基酸的基本元素之一，也是农作物肥\n料三要素（氮、磷、钾）之一。\n氮气（N2）：空气（78%氮气、21%氧气）的主要成分，化学性质不活泼，\n常用来制作"}, {"a": "防腐剂", "ul": 8}, {"t": "以及汽车安全气囊。非真空食品袋内的气体通常是二氧化碳\n或氮气。液氮由液体变为气体时，汽化过程会吸收热量，可作用"}, {"a": "制冷剂", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "4.氧（O）\n氧是"}, {"a": "人体", "ul": 8}, {"t": "、"}, {"a": "海洋", "ul": 8}, {"t": "和地壳中含量最多的元素。除金外的所有金属都能\n和氧发生反应生成金属氧化物。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n人体、海洋、地壳中的元素含量排序\n人体中主要元素按含量依次递减为：氧、碳、氢、氮、"}, {"a": "钙", "ul": 8}, {"t": "、磷、钾、\n硫、钠、氯、镁。\n海洋中主要元素按含量依次递减为：氧、氢、氯、钠、镁、硫、钙、钾。\n地壳中主要元素按含量依次递减为：氧、硅、"}, {"a": "铝", "ul": 7}, {"t": "、铁、钙、钠、钾、镁。\n臭氧（O3）：常温常压下，是一种具有特殊鱼腥味的"}, {"a": "淡蓝色", "ul": 8}, {"t": "气体。液态时\n呈深蓝色，固态时呈紫黑色。具有极强的"}, {"a": "氧化性", "ul": 8}, {"t": "，可用于饮用水杀菌、游泳池\n消毒、空气净化、纺织品的漂白等。雷雨过后空气格外清新，就是因为雷电使部\n分氧气转化为了低浓度的臭氧。主要存在于臭氧层中，可吸收"}, {"a": "紫外线", "ul": 8}, {"t": "，因此臭\n氧层被称为“地球生命的保护伞”。"}]}, {"type": "h2", "toks": [{"t": "5.硫（S）\n二氧化硫（SO2）：造成"}, {"a": "酸雨", "ul": 8}, {"t": "和土壤酸化的主要原因。具有还原性、漂\n白性，可用作食物的漂白剂和防腐剂。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n酸雨\n酸雨是指pH值小于"}, {"a": "5.6", "ul": 8}, {"t": "的雨雪或其他形式的降水。\n酸雨的形成是自然因素与人为因素共同作用的结果，其中"}, {"a": "人为因素", "ul": 8}, {"t": "是主导。\n主要污染物为二氧化硫（SO₂ ）和氮氧化物（如NO、NO₂ ）。"}]}, {"type": "h2", "toks": [{"t": "6.硅（Si）\n硅是一种半导体材料，常用于制造半导体器件、太阳能电池板和"}, {"a": "集成电路", "ul": 8}, {"t": "。\n二氧化硅（SiO2）："}, {"a": "花岗岩", "ul": 8}, {"t": "等岩石的重要成分。主要用于制造玻璃、陶器、\n耐火材料、光导纤维等。"}]}], "quiz": [{"src": "真题", "stem": "下列有关非金属元素的说法，正确的是：", "opts": {"A": "二氧化氯具有还原性，可用于自来水的杀菌消毒", "B": "二氧化硫具有氧化性，可用于漂白纸浆", "C": "液氮汽化时要吸收大量的热，可用作制冷剂", "D": "硅是重要的半导体材料，常用于制作光导纤维"}, "ans": "C"}, {"src": "母题", "stem": "下列关于非金属物质，说法错误的是：", "opts": {"A": "氢是宇宙中含量最多的元素，也是元素周期表的第一个元素", "B": "碳是形成化合物种类最多的元素，也是构成细胞最基本的元素", "C": "氮是人体、海洋和地壳中最多的元素，是组成氨基酸的基本元素之一", "D": "除金外的所有金属都能和氧发生反应生成金属氧化物"}, "ans": "C"}, {"src": "母题", "stem": "臭氧是一种有特殊臭味的淡蓝色气体。臭氧主要分布在10~50 千米高度的平流层大气中，极大值在20~30 千米高度之间。下列关于臭氧的说法，错误的是：", "opts": {"A": "臭氧属于单质", "B": "臭氧和氧气的化学性质一样", "C": "臭氧是由氧元素组成的", "D": "臭氧层能有效地过滤太阳辐射中的紫外线，保护地球生物"}, "ans": "B"}, {"src": "拓展", "stem": "氢是宇宙中含量____的元素，也是元素周期表的第一个元素。", "opts": {"A": "最多", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "最多"}, {"src": "拓展", "stem": "常用来制作____以及汽车安全气囊。", "opts": {"A": "防腐剂", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "防腐剂"}, {"src": "拓展", "stem": "具有极强的____，可用于饮用水杀菌、游泳池", "opts": {"A": "氧化性", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "氧化性"}], "branches": [{"h": "1.氢（H）", "terms": ["最多"]}, {"h": "2.碳（C）", "terms": ["化合物种类", "干冰", "人工降雨"]}, {"h": "3.氮（N）", "terms": ["最多", "防腐剂", "制冷剂"]}, {"h": "4.氧（O）", "terms": ["人体", "海洋", "淡蓝色", "氧化性", "紫外线"]}, {"h": "5.硫（S）", "terms": ["酸雨", "5.6", "人为因素"]}, {"h": "6.硅（Si）", "terms": ["集成电路", "花岗岩"]}], "notes": ["氢H：宇宙中含量最多、H₂是密度最小的气体，极易燃；碳C：形成化合物种类最多、是构成细胞最基本元素，CO易与血红蛋白结合使人窒息（煤气中毒一般指CO），固态CO₂=干冰（升华吸热，用于低温保存、舞台烟雾、人工降雨、灭火）。", "氮N：空气中含量最多（N₂约78%、O₂约21%），化学性质不活泼可作保护气（食品袋常充氮气或CO₂），液氮汽化吸热作制冷剂；氧O：地壳/人体/海洋含量最多，臭氧O₃有强氧化性（饮水消毒、泳池净化），臭氧层吸收紫外线，是'地球生命的保护伞'。", "硫S：SO₂导致酸雨、有漂白性可作防腐剂；硅Si：半导体材料（芯片、太阳能电池板、集成电路），SiO₂是花岗岩、玻璃、陶瓷、光导纤维的主要成分（光纤本质是玻璃丝）。", "氧化还原口诀：氧化剂得电子、被还原、化合价降低；还原剂失电子、被氧化、化合价升高。", "元素含量：人体最多=氧（最多金属是钙）；地壳=氧硅铝铁钙（最多金属铝）；酸雨指pH<5.6，主要污染物是SO₂和氮氧化物；臭氧层破坏元凶是氟利昂、哈龙等含氯含溴化学品。"]}, {"id": 80, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "化学知识", "kind": "zsd", "title": "金属物质", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.钛（Ti）\n钛由于其稳定的化学性质，良好的耐高温、耐低温、抗强酸、抗强碱，以及\n高强度、低密度的特性，被誉为“"}, {"a": "太空金属", "ul": 8}, {"t": "”。\n钛合金可用于"}, {"a": "人造骨骼", "ul": 8}, {"t": "，也可用于制造飞机、火箭的结构件。"}]}, {"type": "h2", "toks": [{"t": "2.铁（Fe）\n铁是日常生活中应用"}, {"a": "最广泛", "ul": 8}, {"t": "的金属。铁能和水、氧气反应生成氧化铁，可\n用作“双吸剂”，防止食品受潮氧化。\n根据"}, {"a": "含碳量", "ul": 8}, {"t": "的不同，铁合金主要分为生铁和钢两类。生铁的含碳量为2.11%\n至4.3%，硬度大、抗压，但性脆、缺乏韧性，常用于铸造机床床身、管道等。钢\n的含碳量为0.02%至2.11%，具有良好的延展性、韧性和机械性能，广泛用于建\n筑、机械、交通、日用品等几乎所有领域，是"}, {"a": "用量最大", "ul": 8}, {"t": "、用途最广的合金。\n不锈钢多指含"}, {"a": "铬", "ul": 8}, {"t": "（Cr）量在12%-30%的合金钢。"}]}, {"type": "h2", "toks": [{"t": "3.铜（Cu）\n纯铜呈紫红色，俗称紫铜或红铜，有极好的导热、导电性，是人类"}, {"a": "最早使用", "ul": 8}, {"t": "\n的金属。常用于制造电线、电缆等。\n铜合金主要包括黄铜、白铜、青铜三类。黄铜以"}, {"a": "锌", "ul": 8}, {"t": "为主要添加元素，\n是"}, {"a": "最常见", "ul": 8}, {"t": "的铜合金。白铜以镍为主要添加元素。青铜以锡或铝等为添加元素，\n是"}, {"a": "最早出现", "ul": 8}, {"t": "的合金。"}]}, {"type": "h2", "toks": [{"t": "4.钙（Ca）\n钙是人体内含量最多的"}, {"a": "金属", "ul": 8}, {"t": "元素。"}]}, {"type": "h2", "toks": [{"t": "5.汞（Hg）\n汞，俗称水银，是常温常压下唯一呈现"}, {"a": "液态", "ul": 8}, {"t": "的金属，是熔点最低的金属。"}]}], "quiz": [{"src": "真题", "stem": "关于金属材料，下列表达错误的是：", "opts": {"A": "重金属和轻金属是根据强度不同划分的", "B": "钛合金可用于制造飞机、火箭的结构件", "C": "青铜是金属冶铸史上最早出现的合金", "D": "纯铝的导热性好，强度低，耐磨性差"}, "ans": "A"}, {"src": "母题", "stem": "下列叙述不正确的是：", "opts": {"A": "钛合金可用于制作人造骨", "B": "在常温常压下，汞是唯一以液态存在的金属", "C": "红铜和黄铜是不同结构的单质铜", "D": "火星上的橘红色物质是氧化铁"}, "ans": "C"}, {"src": "母题", "stem": "下列关于“铁”的说法，不正确的是：", "opts": {"A": "铁属于黑色金属", "B": "人体中含量最高的金属元素是铁", "C": "为增强铁质器具的抗腐蚀性，可在其表层镀一层锌", "D": "生铁和钢是含碳量不同的两种铁碳合金，生铁的含碳量更高"}, "ans": "B"}, {"src": "拓展", "stem": "高强度、低密度的特性，被誉为“____”。", "opts": {"A": "太空金属", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "太空金属"}, {"src": "拓展", "stem": "根据____的不同，铁合金主要分为生铁和钢两类。", "opts": {"A": "含碳量", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "含碳量"}, {"src": "拓展", "stem": "是____的铜合金。", "opts": {"A": "最常见", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "最常见"}], "branches": [{"h": "1.钛（Ti）", "terms": ["太空金属", "人造骨骼"]}, {"h": "2.铁（Fe）", "terms": ["最广泛", "含碳量", "用量最大"]}, {"h": "3.铜（Cu）", "terms": ["最早使用", "最常见", "最早出现"]}, {"h": "4.钙（Ca）", "terms": ["金属"]}, {"h": "5.汞（Hg）", "terms": ["液态"]}], "notes": ["钛Ti：耐高温低温、耐强酸强碱、高强度低密度，被称'太空金属'，钛合金用于人造骨骼、飞机火箭结构件。", "铁Fe是应用最广的金属：铁合金按含碳量分生铁（2.11%–4.3%，硬而脆）和钢（0.02%–2.11%，韧性好，是用量最大、用途最广的合金），熟铁含碳低于0.02%，不锈钢是含铬12%–30%的合金钢；Fe₂O₃（红色）可作双吸剂（同时吸水和氧气）；炼铁原理Fe₂O₃+3CO高温→2Fe+3CO₂，CO作还原剂。", "铜Cu：纯铜紫红色（紫铜/红铜），导热导电好，是人类最早使用的金属；铜合金=黄铜（加锌，最常见）、白铜（加镍，仿银）、青铜（加锡铝，最早出现）；钙是人体含量最多的金属元素；汞Hg（水银）是常温常压下唯一液态金属、熔点最低。"]}, {"id": 81, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "化学知识", "kind": "zsd", "title": "酸、碱、盐", "nblank": 14, "blocks": [{"type": "p", "toks": [{"t": "酸碱性可用pH值表示。pH值"}, {"a": "小于", "ul": 8}, {"t": "7 时显酸性，pH值越小则酸性越强；pH值"}, {"a": "大于", "ul": 8}, {"t": "7 时显碱性，pH值越大则碱性越强。"}]}, {"type": "h2", "toks": [{"t": "1.酸\n盐酸（HCl）："}, {"a": "胃酸", "ul": 8}, {"t": "的主要成分。常用于家居清洁、除锈、皮革加工等。\n硝酸（HNO3）：具有较强的氧化性，浓硝酸几乎能溶解所有的金属及其合金。\n浓硫酸（H2SO4）：纯硫酸一般为无色油状液体。热的浓硫酸具有很强的氧\n化性和"}, {"a": "脱水性", "ul": 8}, {"t": "。稀释时，常将浓硫酸沿器壁缓缓注入水中并不断搅拌，以使稀\n释产生的热量及时散出。"}]}, {"type": "h2", "toks": [{"t": "2.碱\n氢氧化钠（NaOH）：俗称火碱、烧碱、"}, {"a": "苛性钠", "ul": 8}, {"t": "。可用于干燥中性或碱性\n气体、炼油、造纸、炼铝、炼钨、人造丝、人造棉和肥皂制造业等。\n氢氧化钙（Ca(OH)2）：俗称"}, {"a": "熟石灰", "ul": 8}, {"t": "、消石灰。其水溶液俗称澄清石灰水（检\n验"}, {"a": "CO2", "ul": 8}, {"t": "气体的专用试剂）。可以用于中和酸性土壤、配制农药波尔多液、树\n木防冻等。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n酸碱的鉴别\n酸：能使紫色石蕊溶液"}, {"a": "变红", "ul": 8}, {"t": "，能与碱或碱性氧化物反应生成盐和水，能\n与某些金属反应生成盐和氢气，在水溶液中电离出的阳离子全部是H\n+。\n碱：能使紫色石蕊溶液"}, {"a": "变蓝", "ul": 8}, {"t": "，使无色酚酞溶液"}, {"a": "变红", "ul": 8}, {"t": "，能与酸或酸性\n氧化物反应生成盐和水，在水溶液中电离出的阴离子全部是OH\n-。"}]}, {"type": "h2", "toks": [{"t": "3.盐\n碳酸钠（Na2CO3）：俗称"}, {"a": "苏打", "ul": 8}, {"t": "、纯碱。主要用于玻璃制品和陶瓷釉的生\n产，还广泛用于生活洗涤、酸类中和、食品加工等。\n碳酸氢钠（NaHCO3）：俗称"}, {"a": "小苏打", "ul": 8}, {"t": "。可作为食品制作过程中的膨松剂，\n在作用后会残留碳酸钠，使用过多会使成品有碱味。也可用于果蔬的清洗、治疗\n胃酸过多等。\n氯化钠（NaCl）：食盐的主要成分。\n"}, {"a": "亚硝酸钠", "ul": 8}, {"t": "（NaNO2）：在腌渍和熏制食品中含量较高，过量使用时有毒。在\n烹调和消化过程中，会和氨基酸反应，产生致癌物质亚硝胺类化合物。\n"}, {"a": "碳酸镁", "ul": 8}, {"t": "（MgCO3）：可用作耐火材料、保温材料、干燥剂。举重、体操或\n攀岩运动员运动前抓一些碳酸镁，能够吸干手心的汗液，增大手掌与器械之间的\n摩擦力。"}]}], "quiz": [{"src": "真题", "stem": "下列化学物质与俗称对应错误的是：", "opts": {"A": "碳酸钠——苏打", "B": "碳酸氢钠——小苏打", "C": "氢氧化钠——火碱", "D": "氧化钠——苛性钠"}, "ans": "D"}, {"src": "母题", "stem": "下列说法不正确的是：", "opts": {"A": "氢氧化钙的水溶液是检验CO2 气体的专用试剂", "B": "在食品中加入亚硝酸钠可以代替食盐", "C": "碳酸镁可用作耐火材料、保温材料、干燥剂", "D": "发酵粉主要成分是碳酸氢钠，使得糕点疏松多孔"}, "ans": "B"}, {"src": "拓展", "stem": "pH值____7 时显酸性，pH值越小则酸性越强；", "opts": {"A": "小于", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "小于"}, {"src": "拓展", "stem": "氢氧化钙（Ca(OH)2）：俗称____、消石灰。", "opts": {"A": "熟石灰", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "熟石灰"}, {"src": "拓展", "stem": "碱：能使紫色石蕊溶液变蓝，使无色酚酞溶液____，能与酸或酸性", "opts": {"A": "变红", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "变红"}], "branches": [{"h": "要点", "terms": ["小于", "大于"]}, {"h": "1.酸", "terms": ["胃酸", "脱水性"]}, {"h": "2.碱", "terms": ["苛性钠", "熟石灰", "CO2", "变红", "变蓝"]}, {"h": "3.盐", "terms": ["苏打", "小苏打", "亚硝酸钠", "碳酸镁"]}], "notes": ["pH<7为酸性（越小越强）、>7为碱性（越大越强），pH<5.6才是酸雨。常见酸：盐酸HCl（胃酸主要成分、除锈）；硝酸HNO₃强氧化性；浓硫酸无色油状、有强氧化性和脱水性，稀释时要沿器壁把浓硫酸缓慢注入水中并搅拌散热。", "常见碱：NaOH（火碱/烧碱/苛性钠，制肥皂、造纸、炼油）；Ca(OH)₂（熟石灰/消石灰，其水溶液即澄清石灰水，用于检验CO₂、中和酸性土壤、配制波尔多液、树木涂白防冻杀虫）；碱使石蕊变蓝、酚酞变红；酸使紫色石蕊变红。", "常见盐：Na₂CO₃纯碱/苏打（注意纯碱不是碱、是盐）；NaHCO₃小苏打（膨松剂、治胃酸，受热2NaHCO₃→Na₂CO₃+H₂O+CO₂↑）；NaCl食盐；NaNO₂亚硝酸钠（腌制护色、过量有毒、可生成致癌物亚硝胺）；MgCO₃碳酸镁（举重、攀岩擦手吸汗增摩擦）。", "石灰石链条：CaCO₃高温分解→CaO（生石灰）+CO₂↑；CaO+H₂O→Ca(OH)₂（熟石灰）。"]}, {"id": 82, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "化学知识", "kind": "zsd", "title": "有机化合物", "nblank": 8, "blocks": [{"type": "h2", "toks": [{"t": "1.甲烷（CH4）\n甲烷是"}, {"a": "最简单", "ul": 8}, {"t": "的有机物，是"}, {"a": "天然气", "ul": 8}, {"t": "、沼气、坑气，瓦斯气等的主要成分。"}]}, {"type": "h2", "toks": [{"t": "2.乙烯（C2H4）\n乙烯是一种植物激素，会在果实成熟前大量合成，具有促进"}, {"a": "果实成熟", "ul": 8}, {"t": "的作用。\n人们常使用乙烯对水果进行催熟。"}]}, {"type": "h2", "toks": [{"t": "3.乙醇（C2H5OH）\n乙醇，俗称酒精，在常温常压下是一种易燃、易挥发的"}, {"a": "无色透明", "ul": 8}, {"t": "液体。\n医用酒精主要指体积浓度为"}, {"a": "75%", "ul": 8}, {"t": "左右的乙醇（一般用于杀菌），也包括\n医学上使用广泛的其他浓度乙醇（如95%乙醇，一般用于"}, {"a": "器械消毒", "ul": 8}, {"t": "）。医用酒精\n并非浓度越高，杀菌效果越好。\n工业酒精的纯度一般为95%和99%，往往含有甲醇、醛类、有机酸等杂质，\n饮用或用于消毒会引起人体中毒，甚至死亡。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n乙酸乙酯\n酒的芳香气味来自"}, {"a": "乙酸乙酯", "ul": 8}, {"t": "。新制的酒存放期间，酒里的醛不断氧化为羧酸，\n而羧酸再和酒精发生酯化反应，生成具有芳香气味的乙酸乙酯。时间越久，就有\n越多的乙酸乙酯生成，因此酒越陈越香。"}]}, {"type": "h2", "toks": [{"t": "4.甲醛（HCHO）\n甲醛是一种无色，有强烈刺激性气味的气体，挥发性强，可引发呼吸道炎症\n和皮肤炎症。主要用于人工合成黏结剂，装修后的房屋往往会散发出甲醛。\n纯甲醛为强还原剂，在空气中能缓慢被氧化成甲酸。\n"}, {"a": "福尔马林", "ul": 8}, {"t": "是35%-40%的甲醛水溶液，无色透明，有强烈刺激性气味，可用于\n防腐、消毒、漂白。"}]}], "quiz": [{"src": "真题", "stem": "乙醇是一种有机物，俗称酒精。以下关于酒精的说法不正确的是：", "opts": {"A": "酒精能与水以任意比互溶", "B": "医疗上常用体积分数为70%～75%的乙醇作消毒剂", "C": "工业酒精的成分以甲醇为主，含有少量乙醇", "D": "酒精按生产的方法来分，可分为发酵法酒精和合成法酒精"}, "ans": "C"}, {"src": "母题", "stem": "以下关于甲醛的说法正确的是：①在新装修的家里放盆水能够快速除去甲醛②甲醛被世界卫生组织列为“室内污染第一杀手”③纯甲醛有强还原作用④福尔马林是35%~40%的甲醛水溶液，具有腐蚀性", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "D"}, {"src": "拓展", "stem": "甲烷是____的有机物，是天然气、沼气、坑气，瓦斯气等的主要成分。", "opts": {"A": "最简单", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "最简单"}, {"src": "拓展", "stem": "乙烯是一种植物激素，会在____前大量合成，具有促进果实成熟的作用。", "opts": {"A": "果实成熟", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "果实成熟"}, {"src": "拓展", "stem": "医用酒精主要指体积浓度为____左右的乙醇（一般用于杀菌），也包括", "opts": {"A": "75%", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "75%"}], "branches": [{"h": "1.甲烷（CH4）", "terms": ["最简单", "天然气"]}, {"h": "2.乙烯（C2H4）", "terms": ["果实成熟"]}, {"h": "3.乙醇（C2H5OH）", "terms": ["无色透明", "75%", "器械消毒", "乙酸乙酯"]}, {"h": "4.甲醛（HCHO）", "terms": ["福尔马林"]}], "notes": ["甲烷CH₄是最简单的有机物，是天然气、沼气、坑气、瓦斯的主要成分；乙烯是植物激素、能促进果实成熟（催熟）。", "乙醇（酒精）易挥发、与水任意比互溶；医用消毒用75%乙醇（并非浓度越高越好，过高浓度会让细菌表面蛋白迅速变性成膜、反而杀不死）；工业酒精含甲醇等杂质，饮用会致中毒、失明甚至死亡。", "酒越陈越香：醛类氧化为羧酸，羧酸再与乙醇酯化生成具有芳香气味的乙酸乙酯。甲醛HCHO无色有强烈刺激性，福尔马林是35%–40%的甲醛水溶液（防腐、消毒、漂白），装修板材释放甲醛，除甲醛最有效办法是通风。"]}, {"id": 83, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "生物知识", "kind": "zsd", "title": "遗传物质", "nblank": 7, "blocks": [{"type": "h2", "toks": [{"t": "1.核酸"}]}, {"type": "h3", "toks": [{"t": "（1）含义\n基本的遗传物质，在蛋白质的复制和合成中起着储存和传递遗传信息的作用。\n在生物的生长、遗传和变异等一系列重大生命现象中起决定性的作用。"}, {"a": "DNA", "ul": 8}, {"t": "和"}, {"a": "RNA", "ul": 8}, {"t": "统称为核酸。"}]}, {"type": "h3", "toks": [{"t": "（2）基本组成单位\n核苷酸，由戊糖（DNA是脱氧核糖；RNA是核糖）、"}, {"a": "含氮碱基", "ul": 8}, {"t": "以及磷酸三种物质组成。"}]}, {"type": "h3", "toks": [{"t": "（3）分类\n脱氧核糖核酸（DNA）：呈"}, {"a": "双螺旋", "ul": 8}, {"t": "结构，携带有合成RNA和蛋白质所必需的遗传信息，引导生物发育与生命机能运作。DNA是"}, {"a": "主要的", "ul": 8}, {"t": "遗传物质，是遗传信息的载体，绝大部分生物的遗传物质为DNA。带有遗传信息的DNA片段称为"}, {"a": "基因", "ul": 8}, {"t": "，一个DNA分子上有很多个基因。\n核糖核酸（RNA）：一般为"}, {"a": "单链", "ul": 8}, {"t": "长分子，是存在于生物细胞以及部分病毒、类病毒中的遗传信息载体。"}]}, {"type": "h2", "toks": [{"t": "2.遗传信息的改变\n基因突变：指DNA分子中发生碱基对的替换、增添和缺失，而引起的基因结\n构的改变。\n基因重组：指在生物体进行有性生殖的过程中，控制不同性状的基因的重新\n组合。"}]}], "quiz": [{"src": "真题", "stem": "细菌A能产生水解氨苄青霉素的酶而具有氨苄青霉素抗性，细菌B没有，将细菌A和细菌B放在一起培养一段时间，发现部分细菌B也获得了氨苄青霉素抗性，把具有氨苄青霉素抗性的细菌B继续培养，其子代均具有氨苄青霉素抗性，由此可以推断，细菌B获得了细菌A的哪种物质而具有氨苄青霉素抗性？", "opts": {"A": "DNA", "B": "RNA", "C": "蛋白质", "D": "氨苄青霉素"}, "ans": "A"}, {"src": "母题", "stem": "我国民间有这样的说法：“种瓜得瓜，种豆得豆”，这句话反映的现象是：", "opts": {"A": "变异现象", "B": "遗传现象", "C": "进化现象", "D": "复制现象"}, "ans": "B"}, {"src": "母题", "stem": "下列关于基因突变的叙述中，不正确的是：", "opts": {"A": "基因突变是随机发生的、定向的", "B": "在自然状态下，基因突变的频率是很低的", "C": "基因突变是新基因产生的途径", "D": "对生物来说，基因突变可能破坏生物体与现有环境的协调关系"}, "ans": "A"}, {"src": "拓展", "stem": "____和RNA统称为核酸。", "opts": {"A": "DNA", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "DNA"}, {"src": "拓展", "stem": "RNA是核糖）、____以及磷酸三种物质组成。", "opts": {"A": "含氮碱基", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "含氮碱基"}, {"src": "拓展", "stem": "DNA是____遗传物质，是遗传信息的载体，绝大部分生物的遗传物质为DNA。", "opts": {"A": "主要的", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "主要的"}], "branches": [{"h": "1.核酸", "terms": ["DNA", "RNA", "含氮碱基", "双螺旋", "主要的", "基因", "单链"]}], "notes": ["核酸是基本遗传物质，分为DNA和RNA；基本单位=核苷酸（核酸的单位是核苷酸、蛋白质的单位是氨基酸），核苷酸=戊糖（DNA为脱氧核糖、RNA为核糖）+含氮碱基+磷酸。", "DNA是双螺旋结构、主要遗传物质、遗传信息的载体；带有遗传信息的DNA片段叫基因（并非每个DNA片段都是基因）；RNA一般为单链。", "基因突变=碱基对发生替换、增添、缺失导致基因结构改变（多数有害、少数有利、是进化原材料）；基因重组=有性生殖中控制不同性状的基因重新组合（正常现象）。"]}, {"id": 84, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "生物知识", "kind": "zsd", "title": "生物代谢", "nblank": 13, "blocks": [{"type": "h2", "toks": [{"t": "1.新陈代谢\n新陈代谢是生物区别于非生物"}, {"a": "最本质", "ul": 8}, {"t": "的特征，包括同化作用（合成代谢）\n和异化作用（分解代谢）。\n同化作用是指把消化后的营养重新组合，形成有机物和贮存能量的过程。如：\n"}, {"a": "光合", "ul": 8}, {"t": "作用。\n异化作用是指生物体在新陈代谢过程中，将体内的大分子转化为小分子，自\n身的组成物质发生分解，同时放出能量的过程。如："}, {"a": "呼吸", "ul": 8}, {"t": "作用。\n异化作用"}, {"a": "释放", "ul": 8}, {"t": "能量，同化作用"}, {"a": "需要", "ul": 8}, {"t": "能量，同化作用需要的能量正是\n由异化作用释放出来的。"}]}, {"type": "h2", "toks": [{"t": "2.光合作用\n含义：植物、藻类和某些细菌，在可见光的照射下，经过光反应和暗反应，\n利用光合色素，将"}, {"a": "二氧化碳", "ul": 8}, {"t": "（或硫化氢）和水转化为有机物，并释放出"}, {"a": "氧气", "ul": 8}, {"t": "\n（或氢气）的生化过程。\n影响因素："}, {"a": "光照", "ul": 8}, {"t": "（强度、时间）、"}, {"a": "二氧化碳", "ul": 8}, {"t": "浓度、温度、水分。"}]}, {"type": "h2", "toks": [{"t": "3.呼吸作用"}]}, {"type": "h3", "toks": [{"t": "（1）含义\n生物体在细胞内将有机物氧化分解并产生能量的化学过程，是所有动物和植物都具有的一项生命活动。"}]}, {"type": "h3", "toks": [{"t": "（2）分类\n有氧呼吸：有氧气参与的呼吸作用。产物为水和"}, {"a": "二氧化碳", "ul": 8}, {"t": "。\n无氧呼吸：没有氧气参与的呼吸作用。"}]}, {"type": "h4", "toks": [{"t": "①产物为"}, {"a": "乳酸", "ul": 8}, {"t": "：乳酸菌、动物、部分植物（马铃薯块茎、玉米胚、甜菜\n块根等）。"}]}, {"type": "h4", "toks": [{"t": "②产物为"}, {"a": "酒精", "ul": 8}, {"t": "和二氧化碳：酵母菌、绝大多数植物。"}]}, {"type": "h2", "toks": [{"t": "4.蒸腾作用\n含义：水分从活的植物体表面（主要是叶子）以水蒸气状态散失到大气中的\n过程，蒸腾作用不仅受外界环境条件的影响，而且还受植物本身的调节和控制。\n影响因素："}, {"a": "光照", "ul": 8}, {"t": "、温度、湿度、风。"}]}], "quiz": [{"src": "真题", "stem": "呼吸作用是生物体细胞把有机氧化物分解并产生能量的过程，没有氧气参加的呼吸称为无氧呼吸。无氧呼吸是指细胞在缺氧的条件下，通过酶的催化作用，把葡萄糖等有机物分解为尚未彻底氧化的产物。下列现象与无氧呼吸有关的有：①人剧烈运动后肌肉酸痛②用糯米和酒曲酿制米酒③农作物受涝时短时间内不会死亡④把生水果和熟苹果放在密封的缸里催熟", "opts": {"A": "①②", "B": "②③", "C": "②④", "D": "①④"}, "ans": "A"}, {"src": "母题", "stem": "关于生物的新陈代谢，下列说法正确的是：", "opts": {"A": "是生物与非生物最本质的区别", "B": "同化作用与异化作用完全对立", "C": "异化作用是贮存能量的过程", "D": "新陈代谢停止后生物仍可存活"}, "ans": "A"}, {"src": "母题", "stem": "农业科技人员向农民建议：在利用温室生产时，可向温室里施放适量的二氧化碳，这主要是因为：", "opts": {"A": "二氧化碳可使害虫窒息死亡，从而能有效防止植物的病虫害", "B": "植物的光合作用需要二氧化碳，使用二氧化碳可促进光合作用", "C": "二氧化碳可产生温室气体，使温室里的气温升高", "D": "二氧化碳能灭火，施用二氧化碳可避免火灾"}, "ans": "B"}, {"src": "拓展", "stem": "新陈代谢是生物区别于非生物____的特征，包括同化作用（合成代谢）", "opts": {"A": "最本质", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "最本质"}, {"src": "拓展", "stem": "利用光合色素，将____（或硫化氢）和水转化为有机物，并释放出氧气", "opts": {"A": "二氧化碳", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "二氧化碳"}, {"src": "拓展", "stem": "影响因素：光照（强度、时间）、____浓度、温度、水分。", "opts": {"A": "二氧化碳", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "二氧化碳"}], "branches": [{"h": "1.新陈代谢", "terms": ["最本质", "光合", "呼吸", "释放", "需要"]}, {"h": "2.光合作用", "terms": ["二氧化碳", "氧气", "光照"]}, {"h": "3.呼吸作用", "terms": ["二氧化碳", "乳酸", "酒精"]}, {"h": "4.蒸腾作用", "terms": ["光照"]}], "notes": ["新陈代谢是生物区别于非生物最本质的特征，分为同化作用（合成代谢：把消化后的营养重组为自身有机物、贮存能量，如光合作用）和异化作用（分解代谢：大分子分解为小分子、释放能量，如呼吸作用），二者同时进行。", "光合作用不只植物有（藻类和某些细菌也有）：光合色素把CO₂和水在可见光下转化为有机物并释放O₂；影响因素=光照强度和时间、CO₂浓度、温度、水分。", "呼吸作用：有氧呼吸产物是水和CO₂（给植物松土促进根的有氧呼吸）；无氧呼吸产乳酸的=乳酸菌、动物、马铃薯块茎、玉米胚、甜菜块根；产酒精和CO₂的=酵母菌、绝大多数植物。", "蒸腾作用=水分以水蒸气形式从活体（主要是叶片）散失；植被分布规律：高温高湿南方常绿阔叶林、低温低湿北方落叶阔叶林、更冷更干向北是针叶林、极干旱西北是仙人掌类。"]}, {"id": 85, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "生物知识", "kind": "zsd", "title": "人体系统", "nblank": 35, "blocks": [{"type": "h2", "toks": [{"t": "1.消化系统\n消化系统由消化道和消化腺两部分组成。\n消化道包括口腔、咽、食道、胃、"}, {"a": "小肠", "ul": 8}, {"t": "（包括十二指肠、空肠、回肠）、\n大肠（包括盲肠、阑尾、结肠、直肠）、肛门等。\n消化腺是分泌消化液的腺体，包括唾液腺、胰腺、"}, {"a": "肝脏", "ul": 8}, {"t": "、胃腺和肠腺等。\n消化液（除胆汁外）中含有消化酶。\n牙齿：人体中最坚硬的器官。"}, {"a": "牙釉质", "ul": 8}, {"t": "钙化程度最高，是人体最硬的组织。\n"}, {"a": "小肠", "ul": 8}, {"t": "：食物消化吸收的最主要场所，人体最长的器官（全长4-6 米）。\n肝脏：人体最大的"}, {"a": "消化腺", "ul": 8}, {"t": "、最大的"}, {"a": "解毒器官", "ul": 8}, {"t": "、最大的内脏器官。肝脏的主\n要功能是分泌"}, {"a": "胆汁", "ul": 8}, {"t": "、储藏糖原，调节蛋白质、脂肪和碳水化合物的新陈代谢\n等，还有解毒、造血和凝血作用。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n营养物质的分解"}]}, {"type": "h2", "toks": [{"t": "1.淀粉（糖类）\n起点：口腔，被唾液淀粉酶分解为麦芽糖。\n终点："}, {"a": "小肠", "ul": 8}, {"t": "，被胰液、肠液彻底分解为"}, {"a": "葡萄糖", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "2.蛋白质\n起点："}, {"a": "胃", "ul": 8}, {"t": "，被胃蛋白酶初步分解为多肽。\n终点：小肠，被胰液、肠液彻底分解为"}, {"a": "氨基酸", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "3.脂肪\n起点："}, {"a": "小肠", "ul": 8}, {"t": "，脂肪是唯一只在"}, {"a": "小肠", "ul": 8}, {"t": "消化的物质。\n过程：先由胆汁乳化成脂肪微粒，再由胰液、肠液分解为甘油+脂肪酸。"}]}, {"type": "h2", "toks": [{"t": "2.神经系统\n神经系统主要由脑、脊髓、脑神经、脊神经、植物性神经以及各种神经节组\n成。\n神经系统的基本活动方式是反射，可分为非条件反射和条件反射。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n非条件反射和条件反射\n非条件反射：生来就有的"}, {"a": "先天性", "ul": 8}, {"t": "反射，是一种比较"}, {"a": "低级", "ul": 8}, {"t": "的神经活动，由\n大脑皮层以下的神经中枢（如脑干、脊髓）参与即可完成。如"}, {"a": "膝跳", "ul": 8}, {"t": "反射、眨\n眼反射、缩手反射、婴儿的吮乳、排尿反射等。\n条件反射：在一定条件下，外界刺激与有机体反应之间建立起来的暂时神经\n联系，"}, {"a": "后天", "ul": 8}, {"t": "形成。在大脑皮层参与下完成，是一种"}, {"a": "高级", "ul": 8}, {"t": "的神经活动。"}]}, {"type": "h2", "toks": [{"t": "3.呼吸系统\n呼吸系统包括呼吸道（鼻腔、咽、喉、气管、支气管）和肺。"}]}, {"type": "h2", "toks": [{"t": "4.运动系统\n运动系统由骨、关节和骨骼肌三种器官组成，约占成人体重的60%。骨以不\n同形式连结在一起，构成骨骼。"}]}, {"type": "h2", "toks": [{"t": "5.内分泌系统\n内分泌腺的分泌物称为激素。常见激素的名称及其作用如下："}]}, {"type": "h3", "toks": [{"t": "（1）胰岛素：由胰腺内胰岛β细胞分泌，在调节人体血糖水平方面起着至关\n重要的作用，是人体内唯一降低"}, {"a": "血糖", "ul": 8}, {"t": "的激素。分泌不足会造成"}, {"a": "糖尿病", "ul": 8}, {"t": "，分泌过多会引起低血糖。外源性胰岛素主要用于糖尿病治疗，采用"}, {"a": "皮下注射", "ul": 8}, {"t": "（腹部、大腿、上臂、臀部）方式。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n糖尿病的种类\n1 型糖尿病：胰岛β细胞被自身免疫系统破坏，导致胰岛素绝对缺乏。必须\n终身依赖"}, {"a": "外源性", "ul": 8}, {"t": "胰岛素治疗。\n2 型糖尿病：核心是胰岛素抵抗和胰岛β细胞功能进行性减退。早期可通过\n药物改善胰岛素抵抗或促进分泌；后期常需补充胰岛素。"}]}, {"type": "h3", "toks": [{"t": "（2）甲状腺素：由甲状腺合成和分泌，能促进体内物质和能量代谢，促进身\n体和智力发育，对骨骼、神经系统和生殖系统有显著影响，其合成需要"}, {"a": "碘元素", "ul": 8}, {"t": "。\n分泌不足会造成"}, {"a": "呆小症", "ul": 8}, {"t": "，分泌过多会引起"}, {"a": "甲亢", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（3）生长激素：由"}, {"a": "腺垂体", "ul": 8}, {"t": "分泌，对人体生长发育和物质代谢等具有重要作\n用。分泌不足会造成"}, {"a": "侏儒症", "ul": 8}, {"t": "，分泌过多会引起巨人症、肢端肥大症。"}]}, {"type": "h3", "toks": [{"t": "（4）"}, {"a": "肾上腺素", "ul": 8}, {"t": "：由肾上腺分泌，在人体应对紧急情况、调节生理功能方面发\n挥着“急救兵”般的核心作用。当人经历某些刺激（如兴奋、恐惧、紧张等）时，会分泌肾上腺素，让人呼吸加快，心跳与血液流动加速，瞳孔放大，为身体活动提供更多能量，使反应更加快速。"}]}, {"type": "h2", "toks": [{"t": "6.免疫系统\n免疫系统是由免疫器官、免疫细胞、免疫分子组成，具有免疫监视、防御、\n自稳的作用。\n免疫器官包括骨髓、脾脏、淋巴结、扁桃体、黏膜相关淋巴组织、阑尾、胸\n腺等。其中，"}, {"a": "骨髓", "ul": 8}, {"t": "是所有免疫细胞的发源地，"}, {"a": "脾脏", "ul": 8}, {"t": "是最大的淋巴器官。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n免疫细胞"}]}, {"type": "h2", "toks": [{"t": "1.固有免疫细胞（反应"}, {"a": "迅速", "ul": 8}, {"t": "，但"}, {"a": "无特异性", "ul": 8}, {"t": "）\n吞噬细胞（巨噬细胞、中性粒细胞）：负责“吃掉”病原体。\nNK细胞（自然杀伤细胞）：负责直接杀伤被病毒感染的细胞或肿瘤细胞。"}]}, {"type": "h2", "toks": [{"t": "2.适应性免疫细胞（反应"}, {"a": "较慢", "ul": 8}, {"t": "，但"}, {"a": "精准", "ul": 8}, {"t": "且能记忆）\nT细胞：负责细胞免疫，直接杀伤靶细胞或指挥其他细胞。\nB细胞：负责体液免疫，分化为浆细胞后产生"}, {"a": "抗体", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "下列器官组合中，均属于免疫器官的是：①骨髓②胰腺③淋巴结④扁桃体⑤胸腺⑥支气管⑦阑尾⑧脾脏⑨唾液腺", "opts": {"A": "①③④⑦", "B": "③⑤⑥⑧", "C": "④⑥⑧⑨", "D": "②④⑦⑧"}, "ans": "A"}, {"src": "母题", "stem": "下列选项中，器官与所对应的功能系统匹配错误的一项是：", "opts": {"A": "肝脏——内分泌系统", "B": "脾脏——免疫系统", "C": "大肠——消化系统", "D": "骨骼——运动系统"}, "ans": "A"}, {"src": "母题", "stem": "下列疾病中都是由于人体内激素分泌异常导致的是：", "opts": {"A": "血友病和佝偻病", "B": "夜盲和色盲", "C": "糖尿病和侏儒症", "D": "坏血病和脚气病"}, "ans": "C"}, {"src": "拓展", "stem": "消化道包括口腔、咽、食道、胃、____（包括十二指肠、空肠、回肠）、", "opts": {"A": "小肠", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "小肠"}, {"src": "拓展", "stem": "起点：____，脂肪是唯一只在小肠消化的物质。", "opts": {"A": "小肠", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "小肠"}, {"src": "拓展", "stem": "分泌不足会造成____，分泌过多会引起甲亢", "opts": {"A": "呆小症", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "呆小症"}], "branches": [{"h": "1.消化系统", "terms": ["小肠", "肝脏", "牙釉质", "消化腺", "解毒器官", "胆汁"]}, {"h": "1.淀粉（糖类）", "terms": ["小肠", "葡萄糖"]}, {"h": "2.蛋白质", "terms": ["氨基酸"]}, {"h": "3.脂肪", "terms": ["小肠"]}, {"h": "2.神经系统", "terms": ["先天性", "低级", "膝跳", "后天", "高级"]}, {"h": "5.内分泌系统", "terms": ["血糖", "糖尿病", "皮下注射", "外源性", "碘元素", "呆小症", "甲亢"]}, {"h": "6.免疫系统", "terms": ["骨髓", "脾脏"]}, {"h": "1.固有免疫细胞（反应", "terms": ["迅速", "无特异性"]}, {"h": "2.适应性免疫细胞（反应", "terms": ["较慢", "精准", "抗体"]}], "notes": ["消化道=口腔、咽、食道、胃、小肠（十二指肠、空肠、回肠）、大肠（盲肠、阑尾、结肠、直肠）、肛门；消化腺=唾液腺、胰腺、肝脏、胃腺、肠腺（除胆汁外都含消化酶）；牙齿的牙釉质是人体最坚硬组织；小肠是消化和吸收最主要场所；肝脏是人体最大器官、最大消化腺、最大解毒器官（分泌胆汁、储糖原、参与三大代谢、造血凝血）。", "三大营养消化路径：淀粉从口腔开始（唾液淀粉酶→麦芽糖）、在小肠最终分解为葡萄糖；蛋白质从胃开始（胃蛋白酶→多肽）、在小肠最终分解为氨基酸；脂肪只在小肠消化（胆汁先乳化成微粒，再由胰液肠液分解为甘油+脂肪酸）；胃可以全部切除（主要靠小肠吸收）。", "神经活动基本方式是反射：非条件反射=先天、低级、大脑皮层以下参与（膝跳、眨眼、缩手、吮吸、排尿）；条件反射=后天、高级、必须大脑皮层参与。", "内分泌：胰岛素是唯一降血糖激素（胰岛β细胞分泌、只能皮下注射；1型=β细胞被破坏、绝对缺乏需终身外源补充，2型=胰岛素抵抗+β功能减退）；甲状腺素促代谢和发育、需碘（缺碘→呆小症[身材矮小且智力低下，区别于侏儒症智力正常]/大脖子病，过多→甲亢）；生长激素不足→侏儒症、过多→巨人症/肢端肥大；肾上腺素是应急'急救兵'。", "免疫：骨髓是所有免疫细胞发源地、脾脏是最大淋巴器官；固有免疫（快、无特异性）=吞噬细胞、NK细胞；适应性免疫（慢、精准、有记忆）=T细胞（细胞免疫、直接杀伤）、B细胞（分化为浆细胞产生抗体、体液免疫）。"]}, {"id": 86, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "生物知识", "kind": "zsd", "title": "营养物质", "nblank": 22, "blocks": [{"type": "p", "toks": [{"t": "糖类、脂肪、蛋白质、维生素、无机盐和水是人体所需的六大营养物质。其\n中，糖类、脂肪和"}, {"a": "蛋白质", "ul": 8}, {"t": "能够提供能量，"}, {"a": "维生素", "ul": 8}, {"t": "、无机盐和水不能提供能量。\n在动物饥饿或者冬眠时，能量物质消耗的顺序是："}, {"a": "糖类", "ul": 8}, {"t": "→"}, {"a": "脂肪", "ul": 8}, {"t": "→\n"}, {"a": "蛋白质", "ul": 8}, {"t": "。"}]}, {"type": "h2", "toks": [{"t": "1.糖类（碳水化合物）\n糖类是人体最重要的"}, {"a": "供能物质", "ul": 8}, {"t": "。血液的糖类主要为"}, {"a": "葡萄糖", "ul": 8}, {"t": "。蔗糖、麦芽糖、\n淀粉等需要经淀粉酶分解成葡萄糖才能被人体吸收。"}]}, {"type": "h2", "toks": [{"t": "2.脂肪\n脂肪是人体最重要的"}, {"a": "储能物质", "ul": 8}, {"t": "。一般作为备用能源物质贮存在体内。"}]}, {"type": "h2", "toks": [{"t": "3.蛋白质\n蛋白质是细胞中含量最多的有机物，是生命活动的"}, {"a": "主要承担者", "ul": 16}, {"t": "，是生\n命的物质基础。\n由碳、氢、氧、氮等构成，是人体"}, {"a": "氮", "ul": 8}, {"t": "的唯一来源。"}]}, {"type": "h2", "toks": [{"t": "4.维生素\n维生素是人和动物为维持正常的生理功能而必须从食物中获得的一类微量有\n机物质，多数无法由人体自身合成。\n维生素不参与构成人体细胞，也不提供能量，但可以调节人体"}, {"a": "新陈代谢", "ul": 8}, {"t": "。\n常见的维生素：\n维生素\n性状\n缺乏症\n维生素A\n脂溶性\n"}, {"a": "夜盲症", "ul": 8}, {"t": "、干眼症、皮肤粗糙干燥\n维生素B1\n水溶性\n"}, {"a": "脚气病", "ul": 8}, {"t": "（表现为神经炎、水肿）、食欲不振\n维生素"}, {"a": "B2", "ul": 3}, {"t": "\n水溶性\n口腔溃疡、口角炎、唇炎、舌炎\n维生素C\n水溶性\n"}, {"a": "坏血病", "ul": 8}, {"t": "（维生素C缺乏症）、免疫力下降、缺铁性贫血\n维生素D\n脂溶性\n骨质疏松（成人）、"}, {"a": "佝偻病", "ul": 8}, {"t": "（儿童）\n维生素"}, {"a": "E", "ul": 3}, {"t": "\n脂溶性\n上皮细胞变性、孕育异常\n维生素"}, {"a": "K", "ul": 3}, {"t": "\n脂溶性\n凝血时间延长、出血不止"}]}, {"type": "h2", "toks": [{"t": "5.无机盐（矿物质）\n无机盐在人体中内占比很少，在细胞中大多数以离子形式存在。对无机盐的\n摄取可以补充人体所需的各种元素。\n人体所需微量元素：碘I、铁Fe、锌Zn、硒Se、氟F、铬Cr、铜Cu、锰Mn、钼\nMo、钴Co。\n碘：参与甲状腺素的合成，被称作“"}, {"a": "智慧元素", "ul": 8}, {"t": "”。缺乏时会引发甲状腺肿（大\n脖子病），过量时会造成甲亢。\n铁：参与"}, {"a": "血红蛋白", "ul": 8}, {"t": "的形成，缺乏时会造成缺铁性贫血。\n"}, {"a": "锌", "ul": 8}, {"t": "：促进生长发育，增强组织再生能力，增强记忆力。缺乏时会造成\n生长迟滞、大脑发育不良。\n"}, {"a": "硒", "ul": 8}, {"t": "：被称作“长寿元素”“抗癌之王”“心脏守护神”。缺乏时会引\n发克山病（以心肌病变为主的地方性心肌病）和大骨节病。"}]}], "quiz": [{"src": "真题", "stem": "关于影响头发健康的营养元素，下列说法错误的是：", "opts": {"A": "蛋白质有助于支持毛囊生长和修复，肉类和豆类中有大量优质蛋白", "B": "铁是组成红细胞的重要元素，为毛囊提供营养，牛肉和波菜富含铁", "C": "锌可以帮助维持毛囊的正常功能，多吃贝类和坚果可为人体补充锌", "D": "维生素E能促进头发油脂分泌，胡萝卜和深色绿叶菜是其主要来源"}, "ans": "D"}, {"src": "母题", "stem": "下列关于维生素说法正确的是：", "opts": {"A": "严重缺乏维生素D可导致夜盲症", "B": "严重缺乏维生素C可导致坏血病", "C": "维生素A可以用于脚气病治疗", "D": "维生素B1 可以预防与治疗静脉曲张"}, "ans": "B"}, {"src": "母题", "stem": "微量元素在人体内的含量低于0.01%，但对维持生命活动，促进生长发育有极其重要的作用。关于微量元素，下列说法错误的是：", "opts": {"A": "食用加碘食盐以防止碘缺乏病", "B": "使用铁锅炒菜可以减少贫血病的发生", "C": "喝牛奶有助于睡眠", "D": "多吃各种营养品，以增大微量元素的吸收"}, "ans": "D"}, {"src": "拓展", "stem": "中，糖类、脂肪和____能够提供能量，维生素、无机盐和水不能提供能量。", "opts": {"A": "蛋白质", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "蛋白质"}, {"src": "拓展", "stem": "血液的糖类主要为____", "opts": {"A": "葡萄糖", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "葡萄糖"}, {"src": "拓展", "stem": "____（表现为神经炎、水肿）、食欲不振", "opts": {"A": "脚气病", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "脚气病"}], "branches": [{"h": "要点", "terms": ["蛋白质", "维生素", "糖类", "脂肪"]}, {"h": "1.糖类（碳水化合物）", "terms": ["供能物质", "葡萄糖"]}, {"h": "2.脂肪", "terms": ["储能物质"]}, {"h": "3.蛋白质", "terms": ["主要承担者"]}, {"h": "4.维生素", "terms": ["新陈代谢", "夜盲症", "脚气病", "B2", "坏血病", "佝偻病"]}, {"h": "5.无机盐（矿物质）", "terms": ["智慧元素", "血红蛋白"]}], "notes": ["六大营养素：糖类、脂肪、蛋白质（供能）+维生素、无机盐、水（不供能）；饥饿/冬眠时消耗顺序=糖→脂肪→蛋白质；等质量下脂肪供能最多。", "糖类是最主要供能物质；脂肪是最重要的储能（备用）物质；蛋白质是细胞中含量最多的有机物、生命活动的主要承担者、人体氮的唯一来源。", "维生素（多数人体不能合成、不构成细胞、不供能、只调节代谢）：A脂溶→夜盲症、皮肤粗糙；B1→脚气病、神经炎；B2→口角炎、唇炎、舌炎、口腔溃疡；C→坏血病、抵抗力下降、缺铁性贫血；D脂溶→儿童佝偻病、成人骨质疏松（帮助钙吸收）；E→上皮细胞变性；K脂溶→凝血障碍、出血不止。", "微量元素=碘铁锌硒氟铬铜锰钼钴：碘='智慧元素'（缺→呆小/甲状腺肿）；铁→参与血红蛋白合成（缺→缺铁性贫血）；锌→促生长、增记忆；硒='长寿元素/抗癌之王'（缺→克山病、大骨节病）。"]}, {"id": 87, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "医学知识", "kind": "zsd", "title": "医学检查", "nblank": 33, "blocks": [{"type": "p", "toks": [{"t": "1 实验室检查"}]}, {"type": "h3", "toks": [{"t": "（1）血常规\n血常规，是对血液中各种细胞成分进行数量和形态分析的基础检查。单纯的血常规检查"}, {"a": "不需要", "ul": 8}, {"t": "严格空腹。主要检测血液中的三大类细胞："}]}, {"type": "h4", "toks": [{"t": "①红细胞系统（负责运输"}, {"a": "氧气", "ul": 8}, {"t": "和部分二氧化碳）\n红细胞计数&血红蛋白：诊断贫血的核心指标。数值偏低意味着身体可能供氧不足，会感到乏力、头晕。\n红细胞平均指数：帮助判断贫血的类型。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n缺铁性贫血和巨幼细胞性贫血的辨别\n缺铁性贫血：平均红细胞体积"}, {"a": "降低", "ul": 8}, {"t": "，通常< 80 fl。\n巨幼细胞性贫血：平均红细胞体积"}, {"a": "增高", "ul": 8}, {"t": "，通常> 100 fl。"}]}, {"type": "h4", "toks": [{"t": "②白细胞系统（负责防御和"}, {"a": "免疫", "ul": 8}, {"t": "）\n白细胞计数&分类计数：总数升高通常提示身体可能存在感染、炎症或应激反应。分类计数（如中性粒细胞、淋巴细胞的比例）能帮助判断感染是细菌性还是病毒性。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n细菌感染和病毒感染的辨别\n细菌感染：“作战”主力是中性粒细胞，中性粒细胞比例显著升高。淋巴细\n胞比例通常降低。白细胞总数通常"}, {"a": "升高", "ul": 8}, {"t": "。\n病毒感染：“作战”主力是淋巴细胞，淋巴细胞比例升高。中性粒细胞比例\n通常正常或降低。白细胞总数通常正常或"}, {"a": "降低", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③血小板系统（负责凝血和"}, {"a": "止血", "ul": 8}, {"t": "）\n血小板计数：数值过低可能导致出血风险增加，过高则可能增加血栓风险。"}]}, {"type": "h3", "toks": [{"t": "（2）生化检查\n生化检查是通过分析血液中的各种化学成分，来评估身体主要器官（如肝、肾）的功能和代谢状态。通常需要在抽血前"}, {"a": "禁食", "ul": 8}, {"t": "8-12 小时，可以少量饮水。\n常见项目如下："}]}, {"type": "h4", "toks": [{"t": "①肝功能\n"}, {"a": "转氨酶", "ul": 8}, {"t": "：反映肝细胞损伤的敏感指标。\n胆红素：用于评估肝脏处理胆红素的能力，升高可能导致黄疸。\n"}, {"a": "白蛋白", "ul": 8}, {"t": "：反映慢性肝损害和营养状态。"}]}, {"type": "h4", "toks": [{"t": "②肾功能\n肌酐&尿素氮：评估肾脏滤过功能的关键指标。"}]}, {"type": "h4", "toks": [{"t": "③血糖与血脂\n血糖：筛查和监测糖尿病。\n血脂四项：包括总胆固醇、甘油三酯、"}, {"a": "高密度", "ul": 8}, {"t": "脂蛋白胆固醇（“好”胆固醇）、"}, {"a": "低密度", "ul": 8}, {"t": "脂蛋白胆固醇（“坏”胆固醇，动脉粥样硬化的主因，是降脂治疗的首要靶点），用于评估心血管疾病风险。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n血糖检测项目"}]}, {"type": "h2", "toks": [{"t": "1.空腹血糖：正常标准3.9-6.1mmol/L，诊断糖尿病的标准是≥"}, {"a": "7.0", "ul": 8}, {"t": " mmol/L。\n检查前需"}, {"a": "空腹", "ul": 8}, {"t": "。这是最基础的筛查指标，反映基础胰岛素分泌功能。"}]}, {"type": "h2", "toks": [{"t": "2.口服葡萄糖耐量试验：空腹抽一次血，喝下75g无水葡萄糖粉溶于水的糖水，2\n小时后再抽一次血。诊断糖尿病的标准是≥11.1 mmol/L。这是诊断糖尿病的“"}, {"a": "金标准", "ul": 6}, {"t": "”。"}]}, {"type": "h2", "toks": [{"t": "3.糖化血红蛋白：评估长期血糖控制情况（近8-12 周的平均水平），诊断糖尿\n病的标准是≥6.5%。"}, {"a": "无需空腹", "ul": 8}, {"t": "、不受短期波动影响。"}]}, {"type": "h3", "toks": [{"t": "（3）肿瘤标志物\n肿瘤标志物是由肿瘤细胞产生或机体对肿瘤反应而产生的一类物质。\n主要检测项目如下："}]}, {"type": "h4", "toks": [{"t": "①"}, {"a": "甲胎蛋白", "ul": 8}, {"t": "（AFP）：与原发性肝癌高度相关，也用于某些生殖细胞肿瘤的\n辅助诊断。"}]}, {"type": "h4", "toks": [{"t": "②"}, {"a": "癌胚抗原", "ul": 8}, {"t": "（CEA）：一种广谱标志物，在消化道肿瘤（如结直肠癌、胃癌）\n和肺腺癌中可能升高。"}]}, {"type": "h4", "toks": [{"t": "③糖类抗原19-9（CA19-9）：主要用于"}, {"a": "胰腺癌", "ul": 8}, {"t": "、胆管癌的辅助诊断和监测，\n在胃癌、结直肠癌中也可能升高。"}]}, {"type": "h4", "toks": [{"t": "④糖类抗原125（CA125）：常用于"}, {"a": "卵巢癌", "ul": 8}, {"t": "的辅助诊断和疗效监测。"}]}, {"type": "h3", "toks": [{"t": "（4）幽门螺杆菌\n幽门螺杆菌是"}, {"a": "唯一", "ul": 8}, {"t": "能在人胃内强酸环境中长期、稳定定植的细菌。主要传播途径为“口-口”和“粪-口”。\n常见检测方法："}]}, {"type": "h4", "toks": [{"t": "①¹³C/¹⁴C尿素呼气试验：这是"}, {"a": "现症感染", "ul": 8}, {"t": "诊断和根除后"}, {"a": "复查", "ul": 8}, {"t": "的“金标准”。\n检查前"}, {"a": "需要", "ul": 8}, {"t": "空腹。"}]}, {"type": "h4", "toks": [{"t": "②血清Hp抗体检测：仅表明曾经感染，"}, {"a": "不能", "ul": 8}, {"t": "区分是“现症感染”还是“既\n往感染”。不能用于诊断和复查。检查前"}, {"a": "不需要", "ul": 8}, {"t": "空腹。"}]}, {"type": "h2", "toks": [{"t": "2.影像学检查"}]}, {"type": "h3", "toks": [{"t": "（1）X光\n适用：肺部疾病（如肺炎、肺结核）和"}, {"a": "骨折", "ul": 8}, {"t": "的初步筛查。\n特点：影像重叠，微小病灶易漏诊；软组织分辨力差；有少量"}, {"a": "电离辐射", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）CT（电子计算机断层扫描）\n适用：急诊中脑出血、外伤、胸痛的首选，肺结节、早期肺癌、实质性脏器（肝、胆、胰、肾）的肿瘤或结石筛查。\n特点：对软组织（如脊髓、韧带）的分辨力不如核磁共振。有"}, {"a": "电离辐射", "ul": 8}, {"t": "，辐射剂量高于X光。"}]}, {"type": "h3", "toks": [{"t": "（3）MRI（核磁共振）\n适用：脑梗死（特别是早期）、脑肿瘤等神经系统疾病以及肿瘤分期筛查。\n特点：检查时间长，噪音大，体内有"}, {"a": "金属", "ul": 8}, {"t": "植入物通常不能做。"}, {"a": "无", "ul": 8}, {"t": "电离辐射。"}]}, {"type": "h3", "toks": [{"t": "（4）超声（B超）\n适用：肝囊肿、胆囊结石、脂肪肝等，胎儿检查、心脏结构、甲状腺、乳腺结节等筛查。\n特点：无法看清肺部、肠道、骨骼等问题，受操作者经验影响比较大。"}, {"a": "无", "ul": 8}, {"t": "电离辐射。"}]}], "quiz": [{"src": "真题", "stem": "关于医学检查方法，下列说法错误的是：", "opts": {"A": "做心脏超声检查，无须患者做憋尿、空腹等特殊准备", "B": "造影利用了造影剂与人体组织密度的区别", "C": "磁共振检查没有放射性，适用于孕妇、婴幼儿等人群", "D": "血清检查是判断幽门螺杆菌感染的最佳方法"}, "ans": "D"}, {"src": "母题", "stem": "患者，男，25 岁，因发热、咽痛就诊。医生开具血常规检查以辅助诊断。关于该患者的检查结果分析，下列说法错误的是：", "opts": {"A": "若检查结果显示中性粒细胞比例显著升高，通常提示细菌性感染的可能性较大", "B": "若白细胞总数明显降低，且淋巴细胞比例升高，可能提示病毒性感染", "C": "若患者确诊为缺铁性贫血，其红细胞平均体积数值通常低于80fl", "D": "血常规检查必须严格空腹进行，否则会导致白细胞计数假性升高，影响感染判断"}, "ans": "D"}, {"src": "母题", "stem": "关于生化检查中血糖相关指标的临床意义及检测要求，下列描述正确的是：", "opts": {"A": "空腹血糖是诊断糖尿病的“金标准”，其正常参考范围上限为7.0mmol/L", "B": "糖化血红蛋白能反映近8-12 周的平均血糖水平，检测时必须严格禁食12小时以上", "C": "口服葡萄糖耐量试验中，若服糖后2 小时血糖值≥11.1mmol/L，可作为糖尿病的诊断依据", "D": "肝功能检查中的转氨酶指标主要反映肾脏滤过功能，其数值升高提示肾功能受损"}, "ans": "C"}, {"src": "拓展", "stem": "单纯的血常规检查____严格空腹。", "opts": {"A": "不需要", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "不需要"}, {"src": "拓展", "stem": "____：反映肝细胞损伤的敏感指标。", "opts": {"A": "转氨酶", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "转氨酶"}, {"src": "拓展", "stem": "幽门螺杆菌是____能在人胃内强酸环境中长期、稳定定植的细菌。", "opts": {"A": "唯一", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "唯一"}], "branches": [{"h": "要点", "terms": ["不需要", "氧气", "降低", "增高", "免疫", "升高", "止血"]}, {"h": "1.空腹血糖：正常标准3.9-6.1mmol/L，诊断糖尿病的标准是≥", "terms": ["7.0", "空腹"]}, {"h": "2.口服葡萄糖耐量试验：空腹抽一次血，喝下75g无水葡萄糖粉溶于水的糖水，2", "terms": ["金标准"]}, {"h": "3.糖化血红蛋白：评估长期血糖控制情况（近8-12 周的平均水平），诊断糖尿", "terms": ["无需空腹", "甲胎蛋白", "癌胚抗原", "胰腺癌", "卵巢癌", "唯一", "现症感染"]}, {"h": "2.影像学检查", "terms": ["骨折", "电离辐射", "金属"]}], "notes": ["血常规不需要空腹：红细胞计数和血红蛋白是诊断贫血的核心指标（平均红细胞体积<80fl提示缺铁性贫血、>100fl提示巨幼细胞性贫血）；白细胞判断感染类型：细菌感染=中性粒升高、白细胞总数升高，病毒感染=淋巴细胞升高、白细胞总数正常或偏低；血小板负责凝血止血（低则易出血、高则易血栓）。", "生化检查需禁食8–12小时（可少量饮水）：肝功能看转氨酶（肝细胞损伤最敏感）、胆红素、白蛋白；肾功能看肌酐和尿素氮；血脂四项中低密度脂蛋白是'坏胆固醇'、是动脉粥样硬化主因和降脂靶点。", "血糖诊断：空腹正常3.9–6.1mmol/L、糖尿病空腹≥7.0；口服葡萄糖耐量试验（喝75g无水葡萄糖后2h血糖≥11.1）是金标准；糖化血红蛋白反映近8–12周平均血糖、≥6.5%可诊断、无需空腹、不受短期波动影响。", "肿瘤标志物：AFP甲胎蛋白（原发肝癌）、CEA癌胚抗原（广谱、消化道肿瘤）、CA19-9（胰腺/胆管癌）、CA125（卵巢癌）。", "幽门螺杆菌是唯一能在胃强酸环境长期定植的细菌，经口-口/粪-口传播；13C/14C尿素呼气试验是现症诊断和根除后复查金标准（需空腹）；血清抗体阳性只代表曾经感染、不能区分现症与既往。", "影像选择：X光用于肺部、骨折初筛（有重叠、软组织分辨差）；CT是急诊脑出血、外伤、胸痛首选（有电离辐射、孕妇不做）；MRI核磁对脑梗死早期、脑肿瘤更优（无电离辐射、耗时长、金属植入物通常禁忌）；B超无辐射但看不清含气的肺、肠和骨。"]}, {"id": 88, "part": "常识判断", "pian": "科技常识", "zhang": "基础科学", "jie": "医学知识", "kind": "zsd", "title": "急救知识", "nblank": 20, "blocks": [{"type": "h2", "toks": [{"t": "1.烫伤\n烫伤后应立即用20℃左右的"}, {"a": "凉水冲洗", "ul": 8}, {"t": "以止痛、减少渗出和肿胀，避免或减少\n水泡形成。等冷却后才可小心地将贴身衣服脱去。\n"}, {"a": "不可", "ul": 8}, {"t": "用冰块凉敷，以免产生冻伤。不可擅自在伤口处涂药或涂其他物质，\n以免影响创面情况的观察与处理。若烫伤处有水泡，不可"}, {"a": "挑破", "ul": 8}, {"t": "，应用干净纱\n布覆盖，去医院处理。"}]}, {"type": "h2", "toks": [{"t": "2.触电\n有人触电时，首先应迅速"}, {"a": "切断电源", "ul": 8}, {"t": "。\n如果一时不能切断电源，救助者应做好防护措施，用不导电的物体，挑开触\n电者身上的电线，尽快将触电者与电源隔离。"}]}, {"type": "h2", "toks": [{"t": "3.中暑\n应停止活动并在凉爽、通风的环境中休息，脱去多余的或者紧身的衣服。\n如果患者有反应并且没有恶心呕吐，可给患者喝水或者运动饮料，也可服用\n人丹、十滴水、藿香正气水等中药。\n用湿的凉毛巾放置于患者的"}, {"a": "头部", "ul": 8}, {"t": "和躯干部以降温，或将冰袋置于患者的\n"}, {"a": "腋下", "ul": 8}, {"t": "、颈侧和"}, {"a": "腹股沟", "ul": 8}, {"t": "处。"}]}, {"type": "h2", "toks": [{"t": "4.骨折\n要对伤肢进行"}, {"a": "固定", "ul": 8}, {"t": "再送医院，否则骨折断端异常活动，会加重损伤。"}]}, {"type": "h2", "toks": [{"t": "5.溺水\n溺水者被救上岸后急救方法步骤如下："}]}, {"type": "h3", "toks": [{"t": "（1）清除口、鼻中杂物；"}]}, {"type": "h3", "toks": [{"t": "（2）人工呼吸；"}]}, {"type": "h3", "toks": [{"t": "（3）胸外心脏按摩。\n将溺水者救上岸后，如发现溺水者心跳已停或极其微弱，则应立即施行胸外心脏按摩，通过间接按压心脏使其收缩与舒张，恢复供血功能。"}]}, {"type": "h2", "toks": [{"t": "6.煤气中毒\n当有人在室内煤气中毒，首先应"}, {"a": "打开门窗通风", "ul": 16}, {"t": "，将患者迅速转移到通风\n口处，使其呼吸到新鲜的空气，缓解组织缺氧，并对昏迷者进行人工呼吸。\n煤气泄漏应禁止一切能够引起火花的行为（如开灯、打开排风扇、点燃打火\n机等）。"}]}, {"type": "h2", "toks": [{"t": "7.关节扭伤\n关节扭伤后48 小时内，应"}, {"a": "冷敷", "ul": 8}, {"t": "伤处，抬高压迫，予以紧急处理。\n刚扭伤时，不可热敷、按揉、擦涂红花油等活血化瘀的药剂。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n冷敷和热敷\n血遇热而活，遇寒则凝，所以在受伤早期宜"}, {"a": "冷敷", "ul": 8}, {"t": "，以减少局部血肿；在\n出血停止以后再"}, {"a": "热敷", "ul": 8}, {"t": "，可加速消散伤处周围的瘀血。一般而言，受伤24 到48\n小时后视情况使用热敷。"}]}, {"type": "h2", "toks": [{"t": "8.重金属中毒\n重金属指的是密度大于4.5g/cm3 的金属，主要包括铜、镍、钴、"}, {"a": "铅", "ul": 8}, {"t": "、\n锌、锡、锑、铋、镉、"}, {"a": "汞", "ul": 8}, {"t": "等。\n误食重金属后，需要通过补充"}, {"a": "蛋白质", "ul": 8}, {"t": "（如牛奶、豆浆等）来缓解中毒症状。"}]}, {"type": "h2", "toks": [{"t": "9.急性呼吸道异物堵塞\n“海姆里克腹部冲击法”，被称为“"}, {"a": "生命的拥抱", "ul": 16}, {"t": "”。\n对于1 岁以上儿童及"}, {"a": "成人", "ul": 8}, {"t": "，发生重度气道梗阻且"}, {"a": "意识清醒", "ul": 8}, {"t": "时，先进行5\n次背部拍击，即用掌根在患者两侧肩胛骨连线的中点处，快速、有力地连续拍击\n5 次。如果拍背后异物未排出，立即转为腹部冲击。交替进行“5 次背部拍击”和\n“5 次腹部冲击”，直到异物排出或患者失去意识。\n对于1 岁以下婴儿，严禁使用腹部冲击法，应采用“拍背+"}, {"a": "按胸", "ul": 8}, {"t": "”法，\n以免损伤其未发育成熟的肝、脾等内脏。\n对于孕妇和肥胖者，先进行5 次背部拍击，若异物未排出，则采取"}, {"a": "胸部冲击", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "生活中，触电是常见的一种意外状况。当发现周边有人触电时，下列做法顺序最恰当的是：①将伤者抬到通风处②挑开电线③迅速切断电源④进行抢救并拨打120", "opts": {"A": "②③④①", "B": "③②①④", "C": "②④①③", "D": "④②③①"}, "ans": "B"}, {"src": "母题", "stem": "在日常生活中，人们会有发生急性疾病或受到意外伤害的可能，比如外伤大出血、骨折，尤其是心脏骤停的病人，如不及时进行心肺复苏，会很快死亡。下列急救措施中错误的是：", "opts": {"A": "确认发生骨折后，可用木棍、木板等作固定夹板对伤肢进行固定再送医", "B": "发生烫伤时，应立即用冷水冲洗烫伤部位，然后及时送医", "C": "在发生煤气泄漏时，应立即关闭煤气，开窗通风", "D": "误食重金属后，应大量饮水以缓解中毒症状"}, "ans": "D"}, {"src": "母题", "stem": "炎热的夏天，如果人长时间在烈日下暴晒容易出现中暑的症状。关于中暑的急救措施，下列说法错误的是：", "opts": {"A": "停止活动并在凉爽、通风的环境中休息", "B": "将湿凉毛巾放置于患者头部以降温", "C": "患者仍有意识时，立即补充大量水分", "D": "对于重症中暑病人，立即送医院诊治"}, "ans": "C"}, {"src": "拓展", "stem": "烫伤后应立即用20℃左右的____以止痛、减少渗出和肿胀，避免或减少", "opts": {"A": "凉水冲洗", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "凉水冲洗"}, {"src": "拓展", "stem": "腋下、颈侧和____处。", "opts": {"A": "腹股沟", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "腹股沟"}, {"src": "拓展", "stem": "误食重金属后，需要通过补充____（如牛奶、豆浆等）来缓解中毒症状。", "opts": {"A": "蛋白质", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "蛋白质"}], "branches": [{"h": "1.烫伤", "terms": ["凉水冲洗", "不可", "挑破"]}, {"h": "2.触电", "terms": ["切断电源"]}, {"h": "3.中暑", "terms": ["头部", "腋下", "腹股沟"]}, {"h": "4.骨折", "terms": ["固定"]}, {"h": "6.煤气中毒", "terms": ["打开门窗通风"]}, {"h": "7.关节扭伤", "terms": ["冷敷", "热敷"]}, {"h": "8.重金属中毒", "terms": ["蛋白质"]}, {"h": "9.急性呼吸道异物堵塞", "terms": ["生命的拥抱", "成人", "意识清醒", "按胸", "胸部冲击"]}], "notes": ["烫伤：立即用约20℃流动凉水冲洗、冷却后再小心脱衣，不可冰块直接冰敷（防冻伤）、不擅自涂牙膏酱油、水疱不要挑破，纱布覆盖后就医。", "触电：先切断电源，再用干燥木棒等不导电物体挑开电线；中暑：转移到阴凉通风处、解开衣物，无恶心可少量多次喝水或运动饮料，湿毛巾/冰袋置于腋下、颈侧、腹股沟（大血管处）。", "骨折先固定再送医；溺水先清口鼻异物→人工呼吸→胸外按压；煤气中毒（CO）立即开门窗通风、把人转移到通风处，严禁一切火花行为（开灯、开排风扇、打火机都不行）。", "关节扭伤48小时内冷敷、抬高、压迫，刚受伤不能热敷、按揉、擦红花油（血遇热则活、遇寒则凝，一般24–48小时出血停止后再热敷散瘀）。", "气道异物用海姆立克急救法（'生命的拥抱'）：1岁以上/成人先5次背部拍击（掌根拍两肩胛骨之间），未排出再做5次腹部冲击，交替进行直到排出；1岁以下婴儿严禁腹部冲击，改用拍背+按胸；孕妇和极度肥胖者改用胸部冲击。"]}, {"id": 89, "part": "常识判断", "pian": "科技常识", "zhang": "生活常识", "jie": "", "kind": "zsd", "title": "家用电器", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.冰箱"}]}, {"type": "h3", "toks": [{"t": "（1）工作原理\n冰箱通过制冷剂在系统内循环，利用压缩机做功，使制冷剂在"}, {"a": "气态", "ul": 8}, {"t": "和液态之间转换。制冷剂在冰箱内部的蒸发器中蒸发，吸收箱体内的热量，使内部降温。制冷剂被压缩后流向冰箱背部或底部的冷凝器，冷凝"}, {"a": "液化", "ul": 8}, {"t": "，将热量释放到空气中。这就是冰箱侧面或背面摸起来发热的原因。"}]}, {"type": "h3", "toks": [{"t": "（2）使用要求"}]}, {"type": "h4", "toks": [{"t": "①新冰箱到家后要尽快撕掉保护膜。"}]}, {"type": "h4", "toks": [{"t": "②冰箱属于大功率电器，应使用单独的"}, {"a": "专用插座", "ul": 8}, {"t": "。"}]}, {"type": "h4", "toks": [{"t": "③冰箱冷藏室的推荐最佳温度为4 摄氏度或略低于此温度。"}]}, {"type": "h4", "toks": [{"t": "④只要食物"}, {"a": "不烫手", "ul": 8}, {"t": "，就应该密封放入冰箱，而非等到凉透。"}]}, {"type": "h4", "toks": [{"t": "⑤冰箱应保持"}, {"a": "80%以下", "ul": 8}, {"t": "的使用容量，以此保证足够空间使冷空气循环制冷。"}]}, {"type": "h2", "toks": [{"t": "2.空调"}]}, {"type": "h3", "toks": [{"t": "（1）工作原理\n空调与冰箱原理类似，也是利用蒸气压缩式制冷循环。"}]}, {"type": "h3", "toks": [{"t": "（2）使用要求"}]}, {"type": "h4", "toks": [{"t": "①空调属于大功率电器，应使用单独的专用插座。"}]}, {"type": "h4", "toks": [{"t": "②短时间外出，保持空调"}, {"a": "运行", "ul": 8}, {"t": "比关闭后再重启更省电。"}]}, {"type": "h4", "toks": [{"t": "③空调关机后应等待三分钟后再启动，以保护压缩机。"}]}, {"type": "h4", "toks": [{"t": "④空调制冷时，将出风口"}, {"a": "向上", "ul": 8}, {"t": "吹，冷气会自然下沉，房间凉得更快且更\n均匀。空调制热时，将出风口"}, {"a": "向下", "ul": 8}, {"t": "吹，先将地板和人体脚部区域加热，然后热空气自然上升，使整个房间温暖得更快、更舒适。"}]}, {"type": "h2", "toks": [{"t": "3.微波炉"}]}, {"type": "h3", "toks": [{"t": "（1）工作原理\n微波穿透食物，使食物中的水分子剧烈摩擦。摩擦产生热量，从而实现从食物内部到外部的同时加热。其能量转化过程为"}, {"a": "电能", "ul": 8}, {"t": "转化为电磁能，再将电磁能转化为"}, {"a": "内能", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（2）使用要求"}]}, {"type": "h4", "toks": [{"t": "①不能使用"}, {"a": "金属", "ul": 8}, {"t": "容器盛放食品，会产生电火花，甚至引发火灾。"}]}, {"type": "h4", "toks": [{"t": "②不能加热"}, {"a": "密封", "ul": 8}, {"t": "以及带壳的食物，会引起爆炸。"}]}], "quiz": [{"src": "真题", "stem": "微波具有反射性，微波炉采用经特殊处理的碳板制成内壁，根据微波炉内壁所引起的反射作用，使微波来回穿透食物，加强热效率。下列容器中，能使用微波炉加热的是：①陶瓷碗②耐热塑料器皿③金属类容器④耐热玻璃器皿", "opts": {"A": "①③④", "B": "②③④", "C": "①②④", "D": "①②③"}, "ans": "C"}, {"src": "母题", "stem": "关于电器的使用，下列说法正确的是：", "opts": {"A": "用微波炉加热利乐枕包装的牛奶", "B": "家用空调应使用单独的专用插座", "C": "食物要等到凉透后放入冰箱", "D": "新冰箱侧面的保护膜应尽量保留"}, "ans": "C"}, {"src": "拓展", "stem": "冰箱通过制冷剂在系统内循环，利用压缩机做功，使制冷剂在____和液态之间转换。", "opts": {"A": "气态", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "气态"}, {"src": "拓展", "stem": "⑤冰箱应保持____的使用容量，以此保证足够空间使冷空气循环制冷。", "opts": {"A": "80%以下", "B": "粗糙程度", "C": "定滑轮", "D": "达到沸点"}, "ans": "A", "real": "80%以下"}, {"src": "拓展", "stem": "其能量转化过程为____转化为电磁能，再将电磁能转化为内能", "opts": {"A": "电能", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "电能"}], "branches": [{"h": "1.冰箱", "terms": ["气态", "液化", "专用插座", "不烫手", "80%以下"]}, {"h": "2.空调", "terms": ["运行", "向上", "向下"]}, {"h": "3.微波炉", "terms": ["电能", "内能", "金属", "密封"]}], "notes": ["冰箱靠制冷剂汽化吸热（内部蒸发器）和液化放热（背部/底部冷凝器）工作，所以侧面背面发热正常；冷藏最佳温度约4℃（5℃以上细菌易繁殖）；食物不烫手就可密封放入、不必等凉；装载量不超容积80%以保冷空气循环；到家尽快撕掉保护膜。", "空调是蒸气压缩制冷：应单独使用插座；短时间外出保持运行比关掉重开更省电；关机后等3分钟再启动以保护压缩机；制冷时风口向上吹（冷气下沉）、制热时向下吹（热空气上升）。", "微波炉利用微波使水分子剧烈摩擦生热；禁用金属容器（会打火，应用陶瓷、玻璃、耐热塑料）；禁加热密封或带壳食物（整蛋、盒装牛奶等会因压力爆炸）。"]}, {"id": 90, "part": "常识判断", "pian": "科技常识", "zhang": "生活常识", "jie": "", "kind": "zsd", "title": "交通常识", "nblank": 15, "blocks": [{"type": "h2", "toks": [{"t": "1.汽车"}]}, {"type": "h3", "toks": [{"t": "（1）多数汽车的前窗都是倾斜的，主要是为了避免因"}, {"a": "反光", "ul": 5}, {"t": "而影响驾驶员视线。"}]}, {"type": "h3", "toks": [{"t": "（2）双闪灯的作用是在紧急情况或"}, {"a": "临时停车", "ul": 8}, {"t": "时，用来提醒其他人的。"}]}, {"type": "h3", "toks": [{"t": "（3）"}, {"a": "远光灯", "ul": 8}, {"t": "，适用于照明条件特别差，又不会影响其他交通参与者的情况。\n晚上开车在有路灯的街道上行驶，尽量少用汽车远光灯，以免影响他人。"}]}, {"type": "h3", "toks": [{"t": "（4）汽车轮胎上的花纹是为了"}, {"a": "增大", "ul": 8}, {"t": "汽车与地面的摩擦力。"}]}, {"type": "h3", "toks": [{"t": "（5）在加油站，所有机动车辆均须熄火加油，不能拨打手机，也不要下车拍\n打化纤类衣物。"}]}, {"type": "h3", "toks": [{"t": "（6）雷电天气，如正在驾驶汽车，应"}, {"a": "留在车内", "ul": 8}, {"t": "。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n高速路上车辆故障的处理方式\n严格遵循“车靠边、人撤离、即报警”的九字安全警句。"}]}, {"type": "h2", "toks": [{"t": "1.车靠边：立即开启双闪灯，警示后方来车。在确保安全的前提下，迅速将车驶\n入右侧应急车道。"}]}, {"type": "h2", "toks": [{"t": "2.人撤离：在确保自身安全的情况下，从右侧车门下车。在车辆后方"}, {"a": "150", "ul": 8}, {"t": "米\n以外放置三角警示牌。如果遇到夜间、雨、雪、雾等恶劣天气，警示距离应延长至200\n米以上。放置好警示牌后，车上人员应当迅速转移到右侧路肩上或者应急车道内。"}]}, {"type": "h2", "toks": [{"t": "3.即报警：全国统一的高速公路报警救援电话是12122。"}]}, {"type": "h2", "toks": [{"t": "2.飞机"}]}, {"type": "h3", "toks": [{"t": "（1）飞机窗户必须做成圆形。圆角可以避免四角受到的力不均匀，导致机体\n受损。"}]}, {"type": "h3", "toks": [{"t": "（2）飞机的机翼横截面一般前端圆钝、后端尖锐，上表面"}, {"a": "拱起", "ul": 8}, {"t": "、下表面\n"}, {"a": "较平", "ul": 8}, {"t": "。空气通过机翼上表面时流速大，压强小；通过下表面时流速小，压强大，因而此时飞机会有一个向上的升力。"}]}, {"type": "h2", "toks": [{"t": "3.火车"}]}, {"type": "h3", "toks": [{"t": "（1）火车轨道由两条钢轨组成，一般来说，转弯处的火车轨道，"}, {"a": "外侧", "ul": 8}, {"t": "钢\n轨比"}, {"a": "内侧", "ul": 8}, {"t": "高。"}]}, {"type": "h3", "toks": [{"t": "（2）“C”代表城际，“D”代表动车，“G”代表高铁，“Z”代表直达，\n“T”代表特快，“K”代表快速，“L”代表临客，“Y”代表旅游列车。"}]}, {"type": "h2", "toks": [{"t": "4.交通信号灯\n红绿灯是国际统一的交通信号灯。红灯禁止通行，绿灯允许通行，黄灯为警\n示。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n红绿灯的种类\n按控制对象不同，分为机动车信号灯、非机动车信号灯、人行横道信号灯、方向\n指示信号灯等。\n机动车信号灯：由红、黄、绿三个"}, {"a": "圆形", "ul": 8}, {"t": "灯组成。\n非机动车信号灯：由红、黄、绿三个圆形内有"}, {"a": "自行车", "ul": 8}, {"t": "图案的灯组成。\n人行横道信号灯：由红、绿两色行人站立和行走的图案组成。\n方向指示信号灯：绿色、黄色或红色的"}, {"a": "箭头", "ul": 8}, {"t": "，指示左转、直行、右转中的一\n个或多个方向。\n红灯亮，车辆禁止直行或左转弯，在不碍行人和车辆情况下，允许车辆右转\n弯；禁止行人进入人行横道，但是"}, {"a": "已经进入", "ul": 8}, {"t": "人行横道的，可以继续通过或者在道\n路中心线处停留等候。\n黄灯亮，停在路口停止线或人行横道线以内，"}, {"a": "已越过", "ul": 8}, {"t": "停止线的车辆可以继\n续通；持续闪烁时为闪光警告信号灯，警告车辆行人注意安全，瞭望确认安全后\n通过。"}]}], "quiz": [{"src": "真题", "stem": "关于火车和铁路，下列说法错误的是：", "opts": {"A": "红色、黄色和绿色是我国铁路信号的基本颜色", "B": "高铁动力来源于电力牵引，而不是内燃机牵引", "C": "轨道道床既方便了轨道排水，又能起到支撑轨枕的作用", "D": "高速行进时车头会受到向下的力，因此要实行限速运行"}, "ans": "D"}, {"src": "母题", "stem": "下列关于交通常识，说法错误的是：", "opts": {"A": "晚上开车时，为行驶方便，尽量使用远光灯", "B": "汽车加油时不可下车拍打化纤类衣物", "C": "下雪天汽车轮胎上加防滑链可增大摩擦力", "D": "汽车行驶时，车内一般不开灯避免挡风玻璃上成像"}, "ans": "A"}, {"src": "母题", "stem": "关于交通信号灯，下列说法错误的是：", "opts": {"A": "红绿灯是国际统一的交通信号灯", "B": "闪光警告信号灯为持续闪烁的黄灯，提示车辆、行人通过时注意嘹望，确认安全后通过", "C": "人行横道灯红灯亮时，禁止行人通过人行横道，但是已进入人行横道的，可以继续通过或者在道路中心线处停留等候", "D": "方向指示信号灯是由红色、黄色、绿色三个内有自行车图案的圆形单位组成的一组灯"}, "ans": "D"}, {"src": "拓展", "stem": "（1）多数汽车的前窗都是倾斜的，主要是为了避免因____而影响驾驶员视线。", "opts": {"A": "反光", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "反光"}, {"src": "拓展", "stem": "（6）雷电天气，如正在驾驶汽车，应____", "opts": {"A": "留在车内", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "留在车内"}, {"src": "拓展", "stem": "机动车信号灯：由红、黄、绿三个____灯组成。", "opts": {"A": "圆形", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "圆形"}], "branches": [{"h": "1.汽车", "terms": ["反光", "临时停车", "远光灯", "增大", "留在车内"]}, {"h": "2.人撤离：在确保自身安全的情况下，从右侧车门下车。在车辆后方", "terms": ["150"]}, {"h": "2.飞机", "terms": ["拱起", "较平"]}, {"h": "3.火车", "terms": ["外侧", "内侧"]}, {"h": "4.交通信号灯", "terms": ["圆形", "自行车", "箭头", "已经进入", "已越过"]}], "notes": ["汽车前窗倾斜是为了避免车内成像反光干扰视线（夜间车内不开灯同理）；双闪=紧急/临时停车提醒；轮胎花纹为增大摩擦；加油站要熄火加油、不打手机、不拍打化纤衣物（防静电火花）；雷雨天留在车内最安全（金属外壳形成屏蔽、把电流导入大地）。", "高速故障九字诀'车靠边、人撤离、即报警'：开双闪、从右侧车门下车、来车方向150米（恶劣天气200米）放三角警示牌、人员撤到右侧路肩/应急车道、拨打12122。", "飞机舷窗做成圆形（避免四角应力集中开裂）；机翼上拱下平利用伯努利原理产生升力；火车转弯处外侧钢轨高于内侧。", "列车代号：C城际、D动车、G高铁、Z直达、T特快、K快速、L临客、Y旅游。", "信号灯：红灯停、绿灯行、黄灯警示；红灯时在不妨碍情况下可右转；黄灯时已越停车线可继续通过；黄灯闪烁表示瞭望后谨慎通过。"]}, {"id": 91, "part": "常识判断", "pian": "科技常识", "zhang": "生活常识", "jie": "", "kind": "zsd", "title": "灾害应对", "nblank": 23, "blocks": [{"type": "h2", "toks": [{"t": "1.火灾"}]}, {"type": "h3", "toks": [{"t": "（1）逃生注意事项\n安全疏散的正确顺序：着火层—着火层的"}, {"a": "上层", "ul": 8}, {"t": "—着火层的"}, {"a": "下层", "ul": 8}, {"t": "。\n高层建筑火灾逃生要有序疏散，"}, {"a": "勿乘电梯", "ul": 8}, {"t": "；不能跳楼，可利用疏散楼梯、阳\n台、落水管等，用绳索顺绳滑下逃生自救。\n穿过充满烟气的楼道逃生时，要尽量"}, {"a": "降低", "ul": 8}, {"t": "头部的高度，用湿毛巾或口罩\n捂住口鼻，匍匐着撤离。沿墙壁方向逃生可以明确逃生方向。\n身上着火后应就地打滚或利用厚重的衣物、被子等物体覆压火苗。"}]}, {"type": "table", "ncol": 4, "head": [[], [{"t": "二氧化碳灭火器"}], [{"a": "泡沫", "ul": 8}, {"t": "灭火器"}], [{"a": "干粉", "ul": 8}, {"t": "灭火器"}]], "rows": [[{"toks": [{"t": "灭火剂"}], "span": 0}, {"toks": [{"t": "液态二氧化碳"}], "span": 0}, {"toks": [{"t": "硫酸铝、碳酸氢钠"}], "span": 0}, {"toks": [{"t": "有灭火效能的无机盐"}], "span": 0}], [{"toks": [{"t": "适用火灾"}], "span": 0}, {"toks": [{"a": "图书档案", "ul": 8}, {"t": "、贵重设备、精密仪器、电气设备及油类的初起火灾"}], "span": 0}, {"toks": [{"t": "木材等固体物质或汽油、柴油等液体火灾"}], "span": 0}, {"toks": [{"t": "可燃固体、液体、气体及带电设备的初起火灾"}], "span": 0}], [{"toks": [{"t": "不适用火灾"}], "span": 0}, {"toks": [{"a": "过氧化物", "ul": 8}, {"t": "火灾"}], "span": 0}, {"toks": [{"t": "水溶性可燃液体、"}, {"a": "电气设备", "ul": 8}, {"t": "、忌水物质和精密仪器火灾"}], "span": 0}, {"toks": [{"a": "金属", "ul": 8}, {"t": "燃烧火灾"}], "span": 0}]]}, {"type": "h2", "toks": [{"t": "2.雷电\n若处室外，应寻找低洼处（如土坑）藏身，低头曲身下蹲，同时双手抱膝，\n两脚"}, {"a": "并拢", "ul": 8}, {"t": "。远离导电物品（如金属广告牌或湿润树干）和电力设施（如灯杆、\n电线杆），不要拿着金属物品（如带有金属杆的雨伞）在雷雨中停留。\n若处室内，"}, {"a": "不", "ul": 8}, {"t": "拨打接听电话，拔掉电器用具插头；不开门开窗以防雷\n电直击室内。"}]}, {"type": "h2", "toks": [{"t": "3.洪水\n若时间充裕，应按照预定路线，有组织地向"}, {"a": "山坡", "ul": 8}, {"t": "、高地等处转移；来不\n及转移时，应立即爬上屋顶、大树、高墙等高的地方，做暂时避险，等待援救。"}]}, {"type": "h2", "toks": [{"t": "4.泥石流\n发生泥石流时，要立即向坚固的高地或与泥石流成"}, {"a": "垂直", "ul": 8}, {"t": "方向的两侧山坡\n跑，离开沟道、河谷地带。"}]}, {"type": "h2", "toks": [{"t": "5.地震\n若身处低矮楼层，应尽快疏散到屋外开阔空地，远离人多的地方、高层建筑\n和桥梁。若身处高层，应躲在低矮牢固的家具（如床、桌）下或"}, {"a": "跨度小", "ul": 8}, {"t": "、刚度\n强的小开间的室内（如厨房、卫生间、承重墙墙角等）暂避，并用手护住头部。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n地震"}]}, {"type": "h2", "toks": [{"t": "1.地震的类型及分布\n地震按其成因一般分为"}, {"a": "构造地震", "ul": 8}, {"t": "、火山地震、塌陷地震。\n世界有三大地震带，即"}, {"a": "环太平洋", "ul": 8}, {"t": "地震带（世界上最大的地震带）、欧亚地震带、\n海岭地震带。其中环太平洋地震带主要影响我国东部地区，欧亚地震带主要影响我国\n西南地区，海岭地震带不影响我国。"}]}, {"type": "h2", "toks": [{"t": "2.地震的相关名词"}]}, {"type": "h3", "toks": [{"t": "（1）震源：地球内部岩层破裂引起震动的地方。"}]}, {"type": "h3", "toks": [{"t": "（2）震中：地面正对着震源的那一点。"}]}, {"type": "h3", "toks": [{"t": "（3）震级：衡量地震本身大小，代表地震释放能量的多少。一次地震，"}, {"a": "只有一个", "ul": 8}, {"t": "\n震级。我国目前使用的震级标准是里氏分级表，共分9 个等级，震级相差一级，\n地震所释放的能量相差"}, {"a": "30", "ul": 8}, {"t": "倍。"}]}, {"type": "h3", "toks": [{"t": "（4）烈度：衡量地震对地表及建筑物的影响和破坏程度。一次地震，可以有\n"}, {"a": "多个", "ul": 8}, {"t": "烈度。一般来说，震级越大，烈度"}, {"a": "越大", "ul": 8}, {"t": "。"}]}, {"type": "h3", "toks": [{"t": "（5）地震波\n纵波（P波）：振动方向与传播方向一致。会引起地面上下颠簸，破坏力相对\n较弱。传播速度"}, {"a": "最快", "ul": 8}, {"t": "，穿透力最强，可以在固体、液体和气体中传播。\n横波（S波）：振动方向与传播方向垂直。会引起地面水平摇晃，对建筑物的\n剪切破坏力强。传播速度较慢，只能在"}, {"a": "固体", "ul": 7}, {"t": "中传播，不能在液体和气体中传播。"}]}], "quiz": [{"src": "真题", "stem": "雷击是常见的暴雨天气灾害，常发生在户外活动多的场所，其破坏性是巨大的。下列避免户外雷击的方法，不正确的是：", "opts": {"A": "遇到突然的雷雨，可以蹲下，降低自己的高度", "B": "不要触摸或者靠近防雷接地线", "C": "不要拿着金属物品及接打手机", "D": "尽快躲到大树下避雨"}, "ans": "D"}, {"src": "母题", "stem": "下列关于地震的说法，正确的是：", "opts": {"A": "欧亚地震带是世界上最大的地震带", "B": "地震时，纵波比横波破坏力更强", "C": "震级每增加1 级，能量增加30 倍", "D": "一次地震，只有一个烈度"}, "ans": "C"}, {"src": "母题", "stem": "在发生泥石流时，下列做法正确的是：", "opts": {"A": "发现泥石流后，要马上向与泥石流成垂直方向一边的山坡爬", "B": "发生山体滑坡时，要马上沿着滑坡方向尽力奔跑", "C": "发生泥石流时，在沟底尽力爬到大树上进行躲避，等待救援", "D": "沿山谷徒步行走时，一旦遭遇大雨，发现山谷有异常的声音或听到警报时，应立即找寻较大的洞穴或巨石躲避，等大雨过后再走"}, "ans": "A"}, {"src": "拓展", "stem": "安全疏散的正确顺序：着火层—着火层的____—着火层的下层", "opts": {"A": "上层", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "上层"}, {"src": "拓展", "stem": "若时间充裕，应按照预定路线，有组织地向____、高地等处转移；", "opts": {"A": "山坡", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "山坡"}, {"src": "拓展", "stem": "世界有三大地震带，即____地震带（世界上最大的地震带）、欧亚地震带、", "opts": {"A": "环太平洋", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "环太平洋"}], "branches": [{"h": "1.火灾", "terms": ["上层", "下层", "勿乘电梯", "降低", "泡沫", "干粉", "图书档案"]}, {"h": "2.雷电", "terms": ["并拢"]}, {"h": "3.洪水", "terms": ["山坡"]}, {"h": "4.泥石流", "terms": ["垂直"]}, {"h": "5.地震", "terms": ["跨度小"]}, {"h": "1.地震的类型及分布", "terms": ["构造地震", "环太平洋"]}, {"h": "2.地震的相关名词", "terms": ["只有一个", "30", "多个", "越大", "最快", "固体"]}], "notes": ["火灾疏散顺序=着火层→着火层上层→着火层下层（烟气热气向上，先疏散上层）；高层起火勿乘电梯、勿跳楼，走疏散楼梯；穿过浓烟要压低身体、湿毛巾捂口鼻匍匐前进、沿墙找方向；身上着火就地打滚或用厚物压灭（隔绝氧气）；灭火器喷射要对准火苗根部。", "灭火器选型：CO₂灭火器（图书档案、贵重设备、精密仪器、带电设备初起火灾，不适用活泼金属）；泡沫灭火器（木材固体、汽油柴油液体火灾，不适用电气、水溶性可燃液体、精密仪器）；干粉灭火器（可燃固体、液体、气体、带电设备初起火灾，不适用金属燃烧）。", "雷电天气室外找低洼处下蹲、双脚并拢、双手抱膝，远离金属物和电力设施、不撑带金属杆的伞；室内不打电话、拔插头、不开门窗。", "洪水向山坡高地转移；泥石流要向坚固高地或垂直于泥石流流向的两侧山坡跑（绝不能顺沟往下跑）；地震时低楼层尽快疏散到开阔地，高层躲到坚固家具下或小开间（厨房、卫生间承重墙墙角）护头。", "地震概念：一次地震只有一个震级（衡量释放能量、里氏分级，每差一级能量差约30倍），但有多个烈度（衡量地表破坏程度，距震中越近烈度越大）；纵波P最快、上下颠簸、破坏弱，横波S较慢、水平摇晃、破坏强且只在固体传播，面波破坏最强。"]}, {"id": 92, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "计算机技术", "nblank": 16, "blocks": [{"type": "h2", "toks": [{"t": "1.基础知识"}]}, {"type": "h3", "toks": [{"t": "（1）系统构成"}]}, {"type": "h4", "toks": [{"t": "①硬件系统\n运算器：进行运算的部件，计算机中的数值运算采用"}, {"a": "二进制", "ul": 8}, {"t": "。\n控制器：与运算器合称"}, {"a": "中央处理器", "ul": 16}, {"t": "（CPU）。\n存储器：分为内存储器与外存储器，简称内存与外存。内存储器比外存储器容量小，价格昂贵，但存取速度快。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n存储器\n只读存储器（ROM）：只能读出，一般不能写入，断电数据"}, {"a": "不会", "ul": 8}, {"t": "丢失。\n随机存储器（RAM）：可以读出，也可以写入，断电数据"}, {"a": "会", "ul": 8}, {"t": "丢失。\n输入设备：把人的意图传达给机器的一种联系人和机器的部分。键盘、鼠标、\n摄像头、扫描仪、光笔、手写输入板、游戏杆、语音输入装置等都属于输入设备。\n输出设备：把机器的工作情况和计算结果报告给有关人员的一种联系机器和\n人的部分。显示器、打印机、绘图仪、影像输出系统、语音输出系统等都属于输\n出设备。"}]}, {"type": "h4", "toks": [{"t": "②软件系统\n系统软件：控制、协调计算机及外部设备，支持应用软件开发和运行的软件，包括操作系统、语言处理系统、数据库管理系统、系统辅助处理程序。\n应用软件：为解决各类实际问题而设计的程序软件，如办公软件、互联网软件、多媒体软件等。"}]}, {"type": "h3", "toks": [{"t": "（2）常见概念"}]}, {"type": "h4", "toks": [{"t": "①字节\n字节（Byte）是计算机用于计量存储容量的"}, {"a": "基本单位", "ul": 8}, {"t": "。\n二进制位（bit）是计算机用于计量存储容量的最小单位。\n1B（byte，字节）=8bit（比特）；1KB=1024B；1MB（兆）=1024KB；1GB=1024MB；\n１TB＝1024GB；1PB=1024TB；1 个汉字＝2B。"}]}, {"type": "h4", "toks": [{"t": "②快捷键\n复制——Ctrl+C粘贴——Ctrl+V剪切——"}, {"a": "Ctrl+X", "ul": 8}, {"t": "全选——Ctrl+A撤销——"}, {"a": "Ctrl+Z", "ul": 8}, {"t": "保存——Ctrl+S打印——"}, {"a": "Ctrl+P", "ul": 8}, {"t": "查找——"}, {"a": "Ctrl+F", "ul": 8}, {"t": "替换——Ctrl+Ｈ"}]}, {"type": "h2", "toks": [{"t": "2.中国的计算机成就"}]}, {"type": "h3", "toks": [{"t": "（1）超级计算\n银河-I（1983 年）：中国首台亿次巨型机，使中国成为继美、日之后第三个能独立设计制造巨型机的国家。\n天河一号（2010 年）：中国首台"}, {"a": "千万亿次", "ul": 8}, {"t": "超算，首次摘得TOP500 世界第一。\n天河二号（2013 年）：连续6 次位居世界第一。\n"}, {"a": "神威·太湖之光", "ul": 14}, {"t": "（2016 年）：实现核心部件完全国产化，多次问鼎世界第一。"}]}, {"type": "h3", "toks": [{"t": "（2）量子计算\n九章一号（2020 年）：首次实现"}, {"a": "光量子", "ul": 8}, {"t": "计算优越性，中国成为全球"}, {"a": "第二个", "ul": 8}, {"t": "实现量子优越性的国家。\n祖冲之二号（2021 年）：使中国成为唯一在"}, {"a": "超导", "ul": 8}, {"t": "和"}, {"a": "光量子", "ul": 8}, {"t": "两条路线上都实现“量子优越性”的国家。\n"}, {"a": "本源悟空", "ul": 8}, {"t": "（2024 年）：中国量子算力首次大规模、长时间向全球开放，昭示我国正式进入量子算力“可用”时代。"}]}], "quiz": [{"src": "真题", "stem": "快捷键就是使用键盘上某一个或某几个键的组合完成一条功能命令，从而达到提高操作速度的目的。“查找”的快捷键为：", "opts": {"A": "Ctrl+Q", "B": "Ctrl+W", "C": "Ctrl+S", "D": "Ctrl+F"}, "ans": "D"}, {"src": "母题", "stem": "下列各类计算机存储器中，断电后其中信息会丢失的是：", "opts": {"A": "ROM", "B": "RAM", "C": "硬盘", "D": "软盘"}, "ans": "B"}, {"src": "母题", "stem": "计算机技术是衡量一个国家综合国力和科技水平的重要标志。近年来，我国在超级计算和量子计算领域取得了一系列举世瞩目的成就。下列关于我国计算机成就的表述，正确的是：", "opts": {"A": "“银河-I”的研制成功，标志着我国成为世界上第四个能独立设计制造巨型机的国家", "B": "“天河一号”作为我国首台千万亿次超级计算机，曾连续6 次位居TOP500榜单世界第一", "C": "“神威·太湖之光”多次问鼎世界第一，其核心突破在于实现了核心部件的完全国产化", "D": "“祖冲之二号”的问世，使我国成为全球第二个实现“量子计算优越性”的国家"}, "ans": "C"}, {"src": "拓展", "stem": "运算器：进行运算的部件，计算机中的数值运算采用____", "opts": {"A": "二进制", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "二进制"}, {"src": "拓展", "stem": "字节（Byte）是计算机用于计量存储容量的____", "opts": {"A": "基本单位", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "基本单位"}, {"src": "拓展", "stem": "九章一号（2020 年）：首次实现____计算优越性，中国成为全球第二个实现量子优越性的国家。", "opts": {"A": "光量子", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "光量子"}], "branches": [{"h": "1.基础知识", "terms": ["二进制", "中央处理器", "不会", "基本单位", "Ctrl+X", "Ctrl+Z", "Ctrl+P"]}, {"h": "2.中国的计算机成就", "terms": ["千万亿次", "神威·太湖之光", "光量子", "第二个", "超导", "本源悟空"]}], "notes": ["硬件：CPU=运算器+控制器；存储器分内存（RAM随机读写、断电丢失；ROM只读、断电不丢，存固件）和外存（硬盘、U盘等，容量大但慢）；输入设备=键盘、鼠标、摄像头、扫描仪、麦克风；输出设备=显示器、打印机、绘图仪、音箱。软件分系统软件（操作系统、语言处理、数据库管理）和应用软件。", "存储换算：1Byte=8bit，1KB=1024B、1MB=1024KB、1GB=1024MB、1TB=1024GB、1PB=1024TB；一个汉字占2字节。常用快捷键：Ctrl+C/V/X复制粘贴剪切、Ctrl+A全选、Ctrl+Z撤销、Ctrl+S保存、Ctrl+P打印、Ctrl+F查找、Ctrl+H替换。", "中国计算机成就：银河-I（1983首台亿次巨型机，继美日后第三个国家）；天河一号2010年首登TOP500第一；天河二号2013年起连续6次第一；神威·太湖之光2016年核心部件全国产；九章一号2020年首次实现光量子计算优越性（全球第二个）；祖冲之二号2021年（我国成为唯一在超导和光量子两条路线都实现量子优越性的国家）；本源悟空2024年首次大规模、长时间全球开放，进入量子算力'可用'时代。"]}, {"id": 93, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "新能源技术", "nblank": 21, "blocks": [{"type": "h2", "toks": [{"t": "1.能源分类"}]}, {"type": "h3", "toks": [{"t": "（1）按照技术成熟程度分类\n传统能源（常规能源）：技术上比较成熟，已被人类广泛利用，如煤、石油、天然气、"}, {"a": "水能", "ul": 8}, {"t": "等。\n新能源（非常规能源）：传统能源之外的各种能源形式，具有污染小、储量大的特点，如太阳能、地热能、风能、海洋能、"}, {"a": "生物质能", "ul": 8}, {"t": "（如沼气等）、可燃冰、"}, {"a": "核能", "ul": 8}, {"t": "等。"}]}, {"type": "h3", "toks": [{"t": "（2）按照产生方式分类\n一次能源：自然界中本来就有的各种形式的能源，如"}, {"a": "化石能源", "ul": 8}, {"t": "（煤、石油、天然气、可燃冰等）、太阳能、风能、地热能、"}, {"a": "核能", "ul": 8}, {"t": "、潮汐能等。\n二次能源：由一次能源经过转化或加工制造而产生的能源，如煤气、沼气、"}, {"a": "电力", "ul": 8}, {"t": "、汽油、柴油、煤油、酒精、焦炭、蒸汽等。"}]}, {"type": "h3", "toks": [{"t": "（3）按照再生能力分类\n按照再生能力，可以将"}, {"a": "一次能源", "ul": 8}, {"t": "分为可再生能源和不可再生能源。\n可再生能源：在自然界中可以循环再生的能源，如太阳能、水能、风能、"}, {"a": "生物质能", "ul": 8}, {"t": "、地热能、海洋能等。\n不可再生能源：在自然界中经过亿万年形成，短期内无法恢复，且随着大规模开发利用，储量越来越少，总有枯竭一天的能源，如化石能源、"}, {"a": "核能", "ul": 8}, {"t": "、油页岩等。"}]}, {"type": "h2", "toks": [{"t": "2.当前主要的能源"}]}, {"type": "h3", "toks": [{"t": "（1）核能\n核能是原子核结构发生变化时所释放出的能量，是目前唯一现实的、可大规模代替"}, {"a": "化石燃料", "ul": 8}, {"t": "的能源，包括裂变能和聚变能。\n核裂变：主要用于核电站发电，主要燃料是"}, {"a": "铀", "ul": 8}, {"t": "。\n核聚变：目前人类已实现不受控制的核聚变，如"}, {"a": "氢弹", "ul": 8}, {"t": "的爆炸，但尚不能将能量控制和有效利用。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n核能发展\n1942 年，"}, {"a": "美国", "ul": 8}, {"t": "在芝加哥大学运行世界上第一座可控原子核裂变链式反应\n堆。原子能、半导体、计算机、激光器并称20 世纪的四大发明。\n1954 年，"}, {"a": "苏联", "ul": 8}, {"t": "建成世界上第一座核电站奥布灵斯克核电站。\n1991 年，中国大陆第一座核电站"}, {"a": "秦山", "ul": 8}, {"t": "核电站建成。\n1994 年，中国大陆第一座大型商用核电站"}, {"a": "大亚湾", "ul": 8}, {"t": "核电站建成。\n2021 年，全球第一台“华龙一号”核电机组福建福清核电5 号机组投入商业\n运行。\n2025 年1 月20 日，我国有“人造太阳”之称的全超导托卡马克"}, {"a": "核聚变", "ul": 8}, {"t": "实验\n装置（EAST）首次完成1 亿摄氏度1000 秒“高质量燃烧”，标志我国聚变能源\n研究实现从基础科学向工程实践的重大跨越。"}]}, {"type": "h3", "toks": [{"t": "（2）太阳能\n间接利用：利用燃料、风力、水力、海洋热能等各种被固定的太阳辐射能中的能量。\n直接利用：直接利用太阳辐射的能量。"}]}, {"type": "h3", "toks": [{"t": "（3）风能\n开发风能，主要是利用风力发电。"}]}, {"type": "h3", "toks": [{"t": "（4）生物质能\n生物质能是太阳能以化学能形式贮存在生物质中的能量形式，即以生物质为载体的能量，如沼气（主要成分为甲烷）。生物质能是唯一一种可再生的"}, {"a": "碳源", "ul": 8}, {"t": "，也是人类历史上"}, {"a": "最早使用", "ul": 8}, {"t": "的能源。"}]}, {"type": "h3", "toks": [{"t": "（5）可燃冰\n可燃冰（"}, {"a": "天然气", "ul": 8}, {"t": "水合物）是分布于深海沉积物或陆域的永久冻土中，由天然气与水在高压低温条件下形成的类冰状的结晶物质，主要成分是"}, {"a": "甲烷", "ul": 8}, {"t": "，储量丰富。"}]}], "quiz": [{"src": "真题", "stem": "关于核裂变与核衰变，下列说法错误的是：", "opts": {"A": "核衰变的过程中电荷数是守恒的", "B": "放射性元素衰变是自然界自发进行的", "C": "核裂变是一种异常剧烈的化学变化", "D": "核裂变释放出的中子可以引起链式反应"}, "ans": "C"}, {"src": "母题", "stem": "能源按其基本形态可分为一次能源和二次能源，下列属于二次能源的有：①电力②汽油③沼气④煤气", "opts": {"A": "①", "B": "②③", "C": "①③④", "D": "①②③④"}, "ans": "D"}, {"src": "母题", "stem": "生物质能是太阳能以化学能形式贮存在生物质中的能量形式，即以生物质为载体的能量，以下属于生物质能的有：①畜禽粪便②天然气③厨余垃圾④农作物秸秆", "opts": {"A": "①②③", "B": "①②④", "C": "①③④", "D": "②③④"}, "ans": "C"}, {"src": "拓展", "stem": "传统能源（常规能源）：技术上比较成熟，已被人类广泛利用，如煤、石油、天然气、____等。", "opts": {"A": "水能", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "水能"}, {"src": "拓展", "stem": "核能是原子核结构发生变化时所释放出的能量，是目前唯一现实的、可大规模代替____的能源，包括裂变能和聚变能。", "opts": {"A": "化石燃料", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "化石燃料"}, {"src": "拓展", "stem": "1991 年，中国大陆第一座核电站____核电站建成。", "opts": {"A": "秦山", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "秦山"}], "branches": [{"h": "1.能源分类", "terms": ["水能", "生物质能", "核能", "化石能源", "电力", "一次能源"]}, {"h": "2.当前主要的能源", "terms": ["化石燃料", "氢弹", "美国", "苏联", "秦山", "大亚湾", "核聚变"]}], "notes": ["分类：按成熟度分常规能源（煤、石油、天然气、水能）和新能源（污染小、储量大：太阳能、风能、地热能、海洋能、生物质能、可燃冰、核能）；按产生分一次能源（自然界本来就有，含化石能源、太阳能、风能、核能、潮汐能）和二次能源（加工转化而来：煤气、沼气、电力、汽油、酒精、蒸汽；注意水能是一次、水电是二次）；按再生性分可再生（太阳能、水、风、生物质、地热、海洋能）和不可再生（化石能源、核能）。", "我国能源国情=富煤、贫油、少气，水能蕴藏量世界第一；非清洁能源=煤和原油，清洁能源=天然气、水能和新能源。", "核能是唯一现实可大规模替代化石燃料的能源：核裂变已可控（核电站，燃料铀-235），核聚变尚不可控（氢弹），二者都是改变原子核的物理变化；1942年美国芝加哥建成第一座可控核裂变链式反应堆；1954苏联奥布灵斯克是第一座核电站；中国大陆第一座=1991秦山30万千瓦，1994大亚湾为大型商用核电站；2021年全球首台'华龙一号'福清5号商运；全球首座四代石岛湾高温气冷堆（氦气冷却、石墨慢化）商运；2025.1.20 EAST'人造太阳'首次实现1亿℃1000秒高质量燃烧。核电站能量转化=核能→内能→机械能→电能。", "生物质能是太阳能以化学能形式储存在生物质中、以生物质为载体，是唯一可再生碳源（沼气主要成分是甲烷）；可燃冰（天然气水合物）分布于深海沉积层和永久冻土，主成分甲烷。"]}, {"id": 94, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "生物工程技术", "nblank": 10, "blocks": [{"type": "h2", "toks": [{"t": "1.基因工程\n含义：又称DNA重组技术，是通过对生物体的遗传物质进行体外“剪切、拼\n接和重组”，从而定向改造生物性状或创造新物种的技术。它是生物工程技术的\n"}, {"a": "核心", "ul": 8}, {"t": "。\n应用：转基因作物，如"}, {"a": "抗虫棉", "ul": 8}, {"t": "、抗倒伏水稻、转基因食品；基因治疗，如\n人工合成胰岛素、"}, {"a": "乙肝疫苗", "ul": 8}, {"t": "等。"}]}, {"type": "h2", "toks": [{"t": "2.细胞工程\n含义：通过细胞培养、融合、核移植、基因导入等技术，改良生物特性或获\n得特定产物的技术。\n应用：包括"}, {"a": "克隆", "ul": 8}, {"t": "技术、干细胞技术、体细胞杂交技术（如用番茄和马铃\n薯培育成“番茄—马铃薯”）等。"}]}, {"type": "h2", "toks": [{"t": "3.发酵工程\n含义：也称微生物工程，是"}, {"a": "历史最悠久", "ul": 16}, {"t": "、应用最广泛的生物技术。\n应用：酒（"}, {"a": "酵母菌", "ul": 8}, {"t": "发酵）、醋（醋酸菌发酵）、酸奶（"}, {"a": "乳酸菌", "ul": 8}, {"t": "发酵）、\n泡菜（"}, {"a": "乳酸菌", "ul": 8}, {"t": "发酵）、酱油（米曲霉菌发酵）、面包（"}, {"a": "酵母菌", "ul": 8}, {"t": "发酵）、腐乳\n（毛霉菌发酵）、味精等都是发酵的产物。"}]}, {"type": "h2", "toks": [{"t": "4.酶工程\n含义：利用酶的"}, {"a": "催化", "ul": 8}, {"t": "作用，对酶进行改造、生产、固定化，并将其应用\n于工业生产、食品加工、医药、环保等领域的技术。\n应用：在食品加工、轻化工业、医药上应用广泛，如葡萄糖浆的生产，加酶\n洗衣粉，诊断试剂（如血糖试纸中的葡萄糖氧化酶）等。"}]}], "quiz": [{"src": "真题", "stem": "关于现代生物技术，下列说法错误的是：", "opts": {"A": "细胞融合是指用自然或人工的方法，使2 个或几个不同的细胞融合成一个细胞的过程", "B": "在酶工程中，蛋白酶的作用是催化蛋白质的水解", "C": "利用酵母菌发酵制作工业酒精的过程属于厌氧发酵", "D": "在基因工程中，常利用DNA解旋酶将DNA切割成片段"}, "ans": "D"}, {"src": "母题", "stem": "微生物发酵是指在适宜的条件下将原料经过特定的代谢途径转化为人类所需产物的过程。下列不涉及微生物发酵的是：", "opts": {"A": "豆腐", "B": "食醋", "C": "乳酪", "D": "白酒"}, "ans": "A"}, {"src": "母题", "stem": "转基因食品的安全性被广泛质疑，国际社会对其尚存在极大争议。下列关于转基因食品说法正确的有：①转基因的作物存在破坏生态系统平衡的可能②市场上第一个转基因食品出现在美国，是一种保鲜番茄③杂交水稻属于转基因食品④中国是转基因食品最多的国家", "opts": {"A": "①②", "B": "①④", "C": "②③", "D": "③④"}, "ans": "A"}, {"src": "拓展", "stem": "应用：转基因作物，如____、抗倒伏水稻、转基因食品；", "opts": {"A": "抗虫棉", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "抗虫棉"}, {"src": "拓展", "stem": "含义：也称微生物工程，是____、应用最广泛的生物技术。", "opts": {"A": "历史最悠久", "B": "粗糙程度", "C": "定滑轮", "D": "达到沸点"}, "ans": "A", "real": "历史最悠久"}, {"src": "拓展", "stem": "泡菜（____发酵）、酱油（米曲霉菌发酵）、面包（酵母菌发酵）、腐乳", "opts": {"A": "乳酸菌", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "乳酸菌"}], "branches": [{"h": "1.基因工程", "terms": ["核心", "抗虫棉", "乙肝疫苗"]}, {"h": "2.细胞工程", "terms": ["克隆"]}, {"h": "3.发酵工程", "terms": ["历史最悠久", "酵母菌", "乳酸菌"]}, {"h": "4.酶工程", "terms": ["催化"]}], "notes": ["基因工程（DNA重组技术）：在体外剪切、拼接、重组DNA，定向改造或创造新物种，是生物工程的核心（转基因抗虫棉、基因治疗、人工合成胰岛素、乙肝疫苗；注意杂交水稻不是基因工程；全世界转基因作物种植最多的是美国）。", "细胞工程：细胞培养、融合、核移植、基因导入（克隆、干细胞、体细胞杂交番茄-马铃薯）；克隆属于细胞工程，第一只克隆羊多利的性状像提供细胞核的羊（核+质重组细胞）。", "发酵工程（微生物工程）历史最久、应用最广：酿酒=酵母菌、酿醋=醋酸菌、酸奶/泡菜=乳酸菌、酱油=米曲霉、面包=酵母菌、腐乳=毛霉；酶工程=利用酶催化生产固定化产品（加酶洗衣粉、血糖试纸上的葡萄糖氧化酶、淀粉酶）。"]}, {"id": 95, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "探月工程", "nblank": 19, "blocks": [{"type": "h2", "toks": [{"t": "1.概述\n2004 年，中国探月工程立项实施，确定了“绕、落、回”三步走战略规划。\n2023 年，中国载人月球探测工程登月阶段任务启动实施，计划在"}, {"a": "2030", "ul": 8}, {"t": "年\n前实现中国人首次登陆月球，开展月球科学考察及相关技术试验，突破掌握载人\n地月往返、月面短期驻留、人机联合探测等关键技术，完成“登、巡、采、研、\n回”等多重任务，形成独立自主的载人月球探测能力。"}]}, {"type": "h2", "toks": [{"t": "2.已发射探测器\n嫦娥一号（2007 年，"}, {"a": "西昌", "ul": 8}, {"t": "）：中国首颗月球探测器，获取了我国首张120\n米分辨率"}, {"a": "全月影像图", "ul": 16}, {"t": "。\n"}, {"a": "嫦娥二号", "ul": 8}, {"t": "（2010 年，西昌）：拍摄当时国际最高分辨率（7 米）的全月图，\n完成日地L2 点探测和图塔蒂斯小行星飞越，验证了深空探测能力，成为中国首个\n人造太阳系小行星。\n嫦娥三号（2013 年，西昌）：实现了中国首次在月球"}, {"a": "正面", "ul": 8}, {"t": "软着陆。携带\n"}, {"a": "玉兔号", "ul": 8}, {"t": "月球车，使中国成为世界上"}, {"a": "第三个", "ul": 8}, {"t": "实现地外天体软着陆和巡视勘察的\n国家。\n嫦娥四号（2018 年，西昌）：实现了世界首次在月球"}, {"a": "背面", "ul": 8}, {"t": "软着陆。携带\n"}, {"a": "玉兔二号", "ul": 8}, {"t": "月球车，通过"}, {"a": "鹊桥一号", "ul": 8}, {"t": "中继星实现地月背面通信。\n嫦娥五号（2020 年，"}, {"a": "文昌", "ul": 8}, {"t": "）：实现了中国首次月球"}, {"a": "正面", "ul": 8}, {"t": "取样返回，\n标志中国探月工程“绕、落、回”三步走圆满收官。在月壤中发现了全新的矿物，\n并被命名为“嫦娥石”。实现五星红旗首次在月球的动态展示，使用的是国产\n"}, {"a": "新型复合材料", "ul": 16}, {"t": "，被称为“织物版”国旗。\n嫦娥六号（2024 年，"}, {"a": "文昌", "ul": 8}, {"t": "）：实现了世界首次月球"}, {"a": "背面", "ul": 8}, {"t": "取样返回。\n通过"}, {"a": "鹊桥二号", "ul": 8}, {"t": "中继星实现地月背面通信。实现五星红旗首次在月球背面的动态展\n示，使用"}, {"a": "玄武岩", "ul": 8}, {"t": "纤维，被誉为“石头版”国旗。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n鹊桥二号中继星\n鹊桥二号中继星（2024 年，"}, {"a": "文昌", "ul": 8}, {"t": "）：核心任务是为嫦娥六号、嫦娥七号、\n嫦娥八号等任务提供稳定可靠的中继通信服务，后期也将接替超期服役的初代“鹊\n桥”，继续支持嫦娥四号月背巡视。采用国际上首次使用的环月"}, {"a": "大椭圆", "ul": 8}, {"t": "冻结轨\n道，具有节省燃料、通信更快、覆盖更广的优势。"}]}], "quiz": [{"src": "真题", "stem": "关于我国航空探月技术，下列说法错误的是：", "opts": {"A": "空间站的温控系统采用流体回路以使温度保持适宜", "B": "嫦娥五号在月表展示的国旗采用有机刚性纤维制成", "C": "嫦娥四号的“腿”所用“嫦娥钢”兼具至刚至柔特性", "D": "鹊桥二号中继星采用前所未有的环月大椭圆冻结轨道"}, "ans": "B"}, {"src": "母题", "stem": "下列关于我国探月工程，说法正确的是：", "opts": {"A": "嫦娥一号是我国第一颗人造太阳系小行星", "B": "嫦娥三号是我国首颗实现月球背面软着陆的登月探测器", "C": "嫦娥五号实现我国首次正面采样往返任务", "D": "嫦娥七号即将实施首次月背采样往返任务"}, "ans": "C"}, {"src": "拓展", "stem": "2023 年，中国载人月球探测工程登月阶段任务启动实施，计划在____年", "opts": {"A": "2030", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "2030"}, {"src": "拓展", "stem": "嫦娥四号（2018 年，西昌）：实现了世界首次在月球____软着陆。", "opts": {"A": "背面", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "背面"}, {"src": "拓展", "stem": "嫦娥六号（2024 年，____）：实现了世界首次月球背面取样返回。", "opts": {"A": "文昌", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "文昌"}], "branches": [{"h": "1.概述", "terms": ["2030"]}, {"h": "2.已发射探测器", "terms": ["西昌", "全月影像图", "嫦娥二号", "正面", "玉兔号", "第三个", "背面"]}], "notes": ["探月工程2004年立项，分'绕、落、回'三步走；2023年启动载人登月阶段，计划2030年前实现中国人首次登月。", "嫦娥一号2007（首颗月球探测器、首张120米分辨率全月图）；二号2010（7米分辨率全月图、飞掠日地L2和图塔蒂斯小行星）；三号2013（首次月球正面软着陆、玉兔号，世界第三个实现地外天体软着陆巡视）；四号2018（世界首次月背软着陆、玉兔二号、鹊桥一号中继星）；五号2020（首次月球正面采样返回、'绕落回'圆满、月壤中发现新矿物'嫦娥石'、首次动态展示国旗）；六号2024（世界首次月背采样返回、鹊桥二号中继、玄武岩纤维'石头版'国旗）。", "【旁批规划】嫦娥七号2026年文昌发射，开展月球南极环境与资源勘察；嫦娥八号2028年构建月球科研站基本型；从嫦娥五号起发射场由西昌改为文昌。"]}, {"id": 96, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "行星探测", "nblank": 11, "blocks": [{"type": "p", "toks": [{"t": "2020 年4 月24 日，中国国家航天局宣布，中国行星探测任务被命名为“"}, {"a": "天问", "ul": 8}, {"t": "系列”，首次"}, {"a": "火星", "ul": 8}, {"t": "探测任务被命名为“天问一号”。\n2020 年7 月23 日，“天问一号”在"}, {"a": "文昌", "ul": 8}, {"t": "卫星发射中心由“长征五号遥四”运载火箭发射成功。此次任务是“长征五号”系列运载火箭首次应用性发射，也是中国运载火箭首次执行地球—火星转移轨道发射任务。“天问一号”任务的顺利完成标志着我国成为世界上"}, {"a": "首个", "ul": 8}, {"t": "一次性完成火星“绕、着、巡”的国家。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n“天问一号”的六个“首次”\n一是首次实现地火转移轨道探测器发射；二是首次实现"}, {"a": "行星际", "ul": 8}, {"t": "飞行；三是\n首次实现地外行星"}, {"a": "软着陆", "ul": 8}, {"t": "；四是首次实现地外行星表面巡视探测；五是首次实\n现"}, {"a": "4亿", "ul": 8}, {"t": "公里距离的测控通信；六是首次获取第一手的火星科学数据。\n2021 年6 月11 日，在京举行天问一号探测器着陆火星首批科学影像图的揭\n幕仪式上，公布了由“"}, {"a": "祝融号", "ul": 8}, {"t": "”火星车拍摄的影像图。\n2025 年5 月29 日，“天问二号”在"}, {"a": "西昌", "ul": 8}, {"t": "卫星发射中心成功发射升空。\n“天问二号”的主要任务目标是对"}, {"a": "小行星", "ul": 8}, {"t": "2016HO3 进行探测、取样并返回地球，\n此后再对主带"}, {"a": "彗星", "ul": 8}, {"t": "311P开展科学探测。“天问二号”的发射成功标志着中国\n首次小行星探测与采样返回之旅顺利迈出第一步。"}]}], "quiz": [{"src": "真题", "stem": "我国首颗行星探测器“天问一号”探测的行星是：", "opts": {"A": "土星", "B": "金星", "C": "火星", "D": "木星"}, "ans": "C"}, {"src": "母题", "stem": "下列关于中国“天问系列”行星探测任务的表述，正确的是：", "opts": {"A": "“天问一号”任务实现了中国首次地外行星硬着陆与巡视探测", "B": "“天问二号”任务将依次对小行星2016HO3 和主带彗星311P进行探测", "C": "“天问一号”的六个“首次”中包括首次实现8 亿公里距离的测控通信", "D": "“天问一号”由长征七号运载火箭发射，这是中国运载火箭首次执行行星际转移轨道发射"}, "ans": "B"}, {"src": "拓展", "stem": "2020 年7 月23 日，“天问一号”在____卫星发射中心由“长征五号遥四”运载火箭发射成功。", "opts": {"A": "文昌", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "文昌"}, {"src": "拓展", "stem": "首次实现地外行星____", "opts": {"A": "软着陆", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "软着陆"}, {"src": "拓展", "stem": "2025 年5 月29 日，“天问二号”在____卫星发射中心成功发射升空。", "opts": {"A": "西昌", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "西昌"}], "branches": [{"h": "要点", "terms": ["天问", "火星", "文昌", "首个", "行星际", "软着陆", "4亿"]}], "notes": ["2020.4.24行星探测任务正式命名'天问系列'，首次火星探测命名'天问一号'；2020.7.23在文昌由长征五号遥四发射（长征五号首次应用性飞行、中国首次地球-火星转移轨道探测），一次性完成火星'绕、着、巡'三大任务（我国是首个一次任务完成三步的国家；火星探测没有'回'是因为距离太远）；2021.6.11公布首批祝融号火星车影像。", "天问二号2025.5.29西昌发射：主任务是对小行星2016HO3取样返回，之后对主带彗星311P开展探测，是中国首次小行星探测采样返回。"]}, {"id": 97, "part": "常识判断", "pian": "科技常识", "zhang": "高新技术", "jie": "", "kind": "zsd", "title": "载人航天", "nblank": 32, "blocks": [{"type": "h2", "toks": [{"t": "1.空间站\n我国的载人空间站名为“天宫”。于2022 年底全面建成，标志着中国成为世\n界上"}, {"a": "第三个", "ul": 8}, {"t": "能够独立建造和长期运营空间站的国家。\n空间站由天和核心舱、问天实验舱、梦天实验舱三个舱段构成。\n"}, {"a": "天和核心舱", "ul": 16}, {"t": "是空间站的管理和控制中心，是发射入轨的第一个空间站舱段。"}]}, {"type": "h2", "toks": [{"t": "2.货运飞船\n我国的货运飞船名为“天舟”，均在"}, {"a": "海南文昌", "ul": 8}, {"t": "发射，使用"}, {"a": "长征七号", "ul": 8}, {"t": "运载火箭。"}]}, {"type": "h2", "toks": [{"t": "3.载人飞船\n我国的载人飞船名为“神舟”，均在"}, {"a": "甘肃酒泉", "ul": 8}, {"t": "发射，使用长征二号F运载火箭。\n神舟五号（2003 年）：实现首次载人飞行，使中国成为世界"}, {"a": "第三个", "ul": 8}, {"t": "独立掌\n握载人航天技术的国家。\n"}, {"a": "神舟六号", "ul": 8}, {"t": "（2005 年）：实现首次进行多人多天的航天飞行。\n"}, {"a": "神舟七号", "ul": 8}, {"t": "（2008 年）：实现首次出舱活动，使中国成为第三个掌握出舱活动\n技术的国家。\n神舟八号（2011 年）：实现与“"}, {"a": "天宫一号", "ul": 8}, {"t": "”首次空间交会对接。"}]}, {"type": " "ul": 8}, {"t": "和深空探测卫星等航天器的发射任务。\n中国东方航天港（山东）：中国唯一的海上发射母港，具备全射向能力。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n海南商业航天发射场\n2025 年3 月12 日，海南商业航天发射场一号发射工位首次发射取得圆满成\n功，长征八号遥六运载火箭以“一箭十八星”方式将千帆星座第五批组网卫星送\n入预定轨道，标志着我国首个商业航天发射场具备了全系统发射能力。"}]}], "quiz": [{"src": "真题", "stem": "下列关于我国航天的说法，错误的是：", "opts": {"A": "嫦娥五号探测器在文昌航天发射场成功发射", "B": "酒泉卫星发射中心是“东风精神”的发源地", "C": "东方航天港是唯一的运载火箭海上发射母港", "D": "西昌卫星发射中心的优势是纬度与海拔较低"}, "ans": "D"}, {"src": "母题", "stem": "近几年我国航天科技事业发展迅速，对于我国五大卫星发射中心的表述错误的一项是：", "opts": {"A": "酒泉卫星发射中心是中国创建最早、规模最大的综合型导弹、卫星发射中心，也是中国目前唯一的载人航天发射场", "B": "太原卫星发射中心适合发射多种卫星，特别是大质量极轨卫星", "C": "西昌卫星发射中心担负通信、广播、气象卫星等试验发射和应用发射任务", "D": "文昌卫星发射中心是中国首个滨海发射基地"}, "ans": "B"}, {"src": "拓展", "stem": "____卫星发射中心（四川）：主要承担地球同步轨道卫星的发射任务，担负通信、广播、气象卫星等试验发射和应用发射任务。", "opts": {"A": "西昌", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "西昌"}, {"src": "拓展", "stem": "文昌卫星发射中心（海南）：中国____滨海发射基地，也是世界上为数不多的低纬度发射场之一。", "opts": {"A": "首个", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "首个"}, {"src": "拓展", "stem": "主要承担地球同步轨道卫星、____极轨卫星、大吨位空间站和深空探测卫星等航天器的发射任务。", "opts": {"A": "大质量", "B": "惯性", "C": "静止", "D": "正比"}, "ans": "A", "real": "大质量"}], "branches": [{"h": "要点", "terms": ["酒泉", "太原", "西昌", "首个", "大质量", "空间站"]}], "notes": ["空间站'天宫'2022年底全面建成（世界第三个独立建造并长期运营的空间站），三舱T字构型=天和核心舱（管理控制中心、第一个舱段）+问天、梦天实验舱；货运飞船'天舟'（均在文昌由长征七号发射，天舟一号与天宫二号对接被称'太空加油'）；载人飞船'神舟'均在酒泉由长征二号F发射。", "神舟节点：神五2003杨利伟首次载人（世界第三个独立掌握载人航天的国家）；神六2005多人多天；神七2008翟志刚首次出舱；神八2011无人、与天宫一号首次交会对接；神九2012首次载人交会对接；神十2013首次太空授课；神十一2016两人驻留30天；神十二2021首次进入自己的空间站；神十三2021首次在轨6个月+第二次太空授课（王亚平）；神十六2023首次含驾驶员、工程师、载荷专家三类型乘组（桂海潮是首位载荷专家）；神二十二2025是首次应急发射的载人飞船（'太空救援车'，无人发射、载人返回）。", "天宫一号2011（首个目标飞行器/空间实验室）、天宫二号2016（第一个真正意义上的空间实验室）。", "航天第一：首入太空=杨利伟、首位女航天员=刘洋、首次太空行走=翟志刚、首次太空行走女航天员=王亚平、首位女飞行工程师=王浩泽、首位在轨驻留超100天=聂海胜、进入太空次数最多=景海鹏、目前在轨驻留时间最久=陈冬（超400天）。"]}, {"id": 99, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "需求", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.需求的含义\n需求是指在其他条件不变的情况下，消费者在一定时期内在各种可能的价格\n水平愿意而且能够购买的该商品的数量。"}]}, {"type": "h2", "toks": [{"t": "2.需求的影响因素\n商品自身价格（影响"}, {"a": "最大", "ul": 8}, {"t": "）：商品价格上涨，对该商品的需求量下降（一\n般成"}, {"a": "反比", "ul": 8}, {"t": "）。\n消费者收入水平：收入水平提高，对该商品的需求量增加（一般成"}, {"a": "正比", "ul": 8}, {"t": "）。\n相关商品价格：替代品价格上涨，对该商品的需求量增加（"}, {"a": "正比", "ul": 8}, {"t": "）；互\n补品价格上涨，对该商品的需求量下降（"}, {"a": "反比", "ul": 8}, {"t": "）。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n替代品和互补品\n"}, {"a": "替代品", "ul": 8}, {"t": "是指两种商品之间能够相互替代以满足消费者的某一种需要。如洗\n衣粉和洗衣液。\n"}, {"a": "互补品", "ul": 8}, {"t": "是指两种商品必须互相配合，才能共同满足消费者的同一种需要。\n如羽毛球和羽毛球拍。\n消费者偏好：偏好程度增加，对该商品的需求量增加（"}, {"a": "正比", "ul": 8}, {"t": "）。\n消费者对商品的价格预期：预期商品价格会上涨，对该商品的需求量增加\n（"}, {"a": "正比", "ul": 8}, {"t": "）。"}]}], "quiz": [{"src": "真题", "stem": "羽毛球利用鸭、鹅翅膀上的刀翎作为原材料，而鸭肉、鹅肉和猪肉是常见的肉类产品，猪肉价格变动可能影响羽毛球价格。从经济学角度看，下列与之相关的说法错误的是：", "opts": {"A": "猪肉和鸭肉互为替代品", "B": "刀翎和鹅肉属于互补品", "C": "羽毛球爱好者减少会导致刀翎价格下降", "D": "猪肉价格下跌可能引起羽毛球价格上涨"}, "ans": "B"}, {"src": "母题", "stem": "以下关于商品需求量说法错误的是：", "opts": {"A": "一般情况下，商品价格升高，则该商品需求量降低", "B": "消费者收入水平越高，对正常商品的需求量越高", "C": "商品的价格升高，则它的替代品需求量降低", "D": "商品的价格升高，它的互补品需求量也随之减少"}, "ans": "C"}, {"src": "拓展", "stem": "商品自身价格（影响____）：商品价格上涨，对该商品的需求量下降（一", "opts": {"A": "最大", "B": "反比", "C": "正比", "D": "替代品"}, "ans": "A", "real": "最大"}, {"src": "拓展", "stem": "相关商品价格：替代品价格上涨，对该商品的需求量增加（____）；", "opts": {"A": "正比", "B": "最大", "C": "反比", "D": "替代品"}, "ans": "A", "real": "正比"}, {"src": "拓展", "stem": "____是指两种商品之间能够相互替代以满足消费者的某一种需要。", "opts": {"A": "替代品", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "替代品"}], "branches": [{"h": "2.需求的影响因素", "terms": ["最大", "反比", "正比", "替代品", "互补品"]}], "notes": ["需求=其他条件不变时，消费者在一定时期、各价格水平下愿意且能够购买的数量（'愿意'+'能够'缺一不可）。影响因素：自身价格（影响最大、反向）、收入（正向）、相关商品价格、消费者偏好、价格预期。", "相关商品辨析：替代品（洗衣粉/洗衣液、牛猪鸡肉）价格上涨→该商品需求增加（同向）；互补品（羽毛球拍和球、牙膏和牙刷）价格上涨→该商品需求减少（反向）；预期涨价会提前抢购（11·11前反向囤货同理）。"]}, {"id": 100, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "成本", "nblank": 5, "blocks": [{"type": "h2", "toks": [{"t": "1.机会成本与沉没成本\n机会成本：为从事某项经营活动而"}, {"a": "放弃", "ul": 8}, {"t": "其他经营活动中获得的"}, {"a": "最大收益", "ul": 8}, {"t": "。\n沉没成本：已经付出且"}, {"a": "不可收回", "ul": 8}, {"t": "的成本。"}]}, {"type": "h2", "toks": [{"t": "2.显性成本与隐性成本\n显性成本：厂商在生产过程中购买或租用他人所拥有的生产要素的"}, {"a": "实际支出", "ul": 8}, {"t": "。\n隐性成本：厂商自己所拥有的且被用于该企业生产过程的生产要素的总价格。"}]}, {"type": "h2", "toks": [{"t": "3.平均成本与边际成本\n平均成本：企业平均每生产一单位产品所耗费的成本。\n边际成本：企业每增加一单位产量所引起的总成本的"}, {"a": "增量", "ul": 8}, {"t": "。"}]}], "quiz": [{"src": "真题", "stem": "某企业因原材料价格上涨需要调整生产规模，因而向其它设备商租赁了新设备，经济学中此类成本是：", "opts": {"A": "生产设备的折旧费，属于隐性成本", "B": "已发生的无法收回的成本，属于沉没成本", "C": "增加一单位产量而发生的成本，属于边际成本", "D": "实际货币支出，属于显性成本"}, "ans": "D"}, {"src": "母题", "stem": "下列表示机会成本的是：", "opts": {"A": "厂商雇佣李某，每月支付李某工资3000 元", "B": "厂商从市场上购买原材料，支付价款10 万元", "C": "厂商运用自己所拥有的原料可生产一辆货车或一辆小型客车，厂商选择生产货车，放弃生产价值10 万元的小型客车", "D": "厂商从银行贷款10 万元，需每月支付利息1000 元"}, "ans": "C"}, {"src": "拓展", "stem": "机会成本：为从事某项经营活动而____其他经营活动中获得的最大收益", "opts": {"A": "放弃", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "放弃"}, {"src": "拓展", "stem": "机会成本：为从事某项经营活动而放弃其他经营活动中获得的____", "opts": {"A": "最大收益", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "最大收益"}, {"src": "拓展", "stem": "沉没成本：已经付出且____的成本。", "opts": {"A": "不可收回", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "不可收回"}], "branches": [{"h": "1.机会成本与沉没成本", "terms": ["放弃", "最大收益", "不可收回"]}, {"h": "2.显性成本与隐性成本", "terms": ["实际支出"]}, {"h": "3.平均成本与边际成本", "terms": ["增量"]}], "notes": ["机会成本=为了从事某项活动而放弃的其他活动中能获得的最大收益（选A放弃的最好选项B的价值就是机会成本；只要有选择就有机会成本）；沉没成本=已经付出且不可收回的成本，不应再参与后续决策。", "显性成本=购买/租用他人生产要素的实际支出；隐性成本=使用自有生产要素的总价格（计入隐性成本利润核算才真实）；平均成本=总成本/总产量（判断定价是否亏损），边际成本=每增加一单位产量引起的总成本增量（判断是否继续增产）。"]}, {"id": 101, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "经济增长", "nblank": 9, "blocks": [{"type": "h2", "toks": [{"t": "1.经济增长的含义\n经济增长是指一国一定时期内生产的产品和提供的劳务总量的扩大，表现为\n经济总量（GDP）或人均量的增加。"}]}, {"type": "h2", "toks": [{"t": "2.拉动经济增长的“三驾马车”\n投资、消费和出口是拉动经济增长的“三驾马车”，是拉动经济增长的最主\n要力量。其中"}, {"a": "投资", "ul": 8}, {"t": "和"}, {"a": "消费", "ul": 8}, {"t": "合称为内需，"}, {"a": "出口", "ul": 8}, {"t": "称为外需。"}]}, {"type": "h2", "toks": [{"t": "3.经济增长的核算指标"}]}, {"type": "h3", "toks": [{"t": "（1）国内生产总值（GDP）\n国内生产总值是一个地域概念，是指经济社会（即一国或一地区）在一定时期内运用生产要素所生产的全部最终产品（物品和劳务）的市场价值。\nGDP是经济增长核算的核心指标，其概念可从以下几方面理解："}]}, {"type": "h4", "toks": [{"t": "①GDP是一国范围内生产的最终产品的市场价值，从而是一个"}, {"a": "地域", "ul": 8}, {"t": "概念。"}]}, {"type": "h4", "toks": [{"t": "②GDP是一定时期内（往往为一年）所"}, {"a": "生产", "ul": 8}, {"t": "而不是所售卖掉的最终产品\n价值。"}]}, {"type": "h4", "toks": [{"t": "③GDP是计算期内生产的最终产品价值，因而是"}, {"a": "流量", "ul": 8}, {"t": "而不是存量。流量\n是一定时期内发生的变量，存量是一定时点上存在的变量。"}]}, {"type": "h4", "toks": [{"t": "④GDP测度的是当期最终产品的价值，"}, {"a": "中间产品", "ul": 8}, {"t": "不计入。"}]}, {"type": "h4", "toks": [{"t": "⑤GDP是一个市场价值的概念，一般仅指"}, {"a": "市场活动", "ul": 8}, {"t": "导致的价值。"}]}, {"type": "h3", "toks": [{"t": "（2）国民生产总值（GNP）\n国民生产总值是一个"}, {"a": "国民", "ul": 8}, {"t": "概念，是指一个国家或一个地区的常住居民在一定时期所拥有的生产要素所生产的全部最终产品（物品和劳务）的市场价值。"}]}], "quiz": [{"src": "真题", "stem": "下列行为不能拉动内需促进经济增长的是：", "opts": {"A": "某互联网大亨将国内资产变卖后去注资国外足球队", "B": "某富二代因爱好游戏遂大手笔投资一电子竞技公司", "C": "某公司艺人为了表演效果花高价购买演出服装", "D": "某富商因为业务普及全国分别在多个城市买下多个楼盘"}, "ans": "A"}, {"src": "母题", "stem": "GDP意为国内生产总值。它是指一个国家或一个地区在一定时期内所生产和提供的以市场价格计算的最终产品与劳务的市场价值总和，是统计国家经济状况的最终指标，下列可以计入GDP的有：", "opts": {"A": "二手车买卖", "B": "政府转移支付", "C": "赌博所产生的收益", "D": "劳动者工资性收入"}, "ans": "D"}, {"src": "拓展", "stem": "其中____和消费合称为内需，出口称为外需。", "opts": {"A": "投资", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "投资"}, {"src": "拓展", "stem": "其中投资和消费合称为内需，____称为外需。", "opts": {"A": "出口", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "出口"}, {"src": "拓展", "stem": "②GDP是一定时期内（往往为一年）所____而不是所售卖掉的最终产品", "opts": {"A": "生产", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "生产"}], "branches": [{"h": "2.拉动经济增长的“三驾马车”", "terms": ["投资", "消费", "出口"]}, {"h": "3.经济增长的核算指标", "terms": ["地域", "生产", "流量", "中间产品", "市场活动", "国民"]}], "notes": ["'三驾马车'=投资+消费（合称内需）+出口（外需）；消费对经济发展起基础性作用、投资对优化供给结构起关键作用。", "GDP是地域概念（在中国境内就算，不管哪国企业），GNP是国民概念（中国人拥有的要素，不管在哪）。GDP核算五要点：①只算最终产品、中间品不计（面粉厂的面粉不计、面包店的面包计）；②算当期'生产'而非'售卖'（建房100栋算、卖掉二手房不算）；③是流量不是存量；④只核算市场活动（赈灾物资等非市场交易不计，但二手房中介费计入）。"]}, {"id": 102, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "通货膨胀", "nblank": 12, "blocks": [{"type": "h2", "toks": [{"t": "1.通货膨胀的含义\n通货膨胀是指在货币流通条件下，因货币供给"}, {"a": "大于", "ul": 8}, {"t": "货币实际需求，导致\n货币贬值，而引起的一段时间内商品和劳务的价格持续而普遍地"}, {"a": "上涨", "ul": 8}, {"t": "现象。\n其实质是社会总需求大于社会总供给。"}]}, {"type": "h2", "toks": [{"t": "2.通货膨胀的衡量\n物价指数是衡量通货膨胀程度的基本指标，常见的有消费价格指数、生产者\n价格指数等。"}]}, {"type": "h3", "toks": [{"t": "（1）消费价格指数（"}, {"a": "CPI", "ul": 8}, {"t": "）\n消费价格指数也称居民消费价格指数，是反映与居民生活有关的产品及劳务价格统计出来的物价变动指标。\n按国际惯例，当CPI增幅连续超过"}, {"a": "3%", "ul": 8}, {"t": "时，就意味着发生了通货膨胀；当CPI增幅低于1%且持续一段时间，预示着通货紧缩的风险。"}]}, {"type": "h3", "toks": [{"t": "（2）生产者价格指数（"}, {"a": "PPI", "ul": 8}, {"t": "）\n生产者价格指数也称工业生产者出厂价格指数，是衡量工业企业产品出厂价格变动趋势和变动程度的指数，是反映某一时期生产领域价格变动情况的重要经济指标。"}]}, {"type": "h2", "toks": [{"t": "3.通货膨胀的影响\n通货膨胀不利于"}, {"a": "固定", "ul": 8}, {"t": "收入者，有利于"}, {"a": "变动", "ul": 8}, {"t": "收入者；\n通货膨胀不利于"}, {"a": "债权", "ul": 8}, {"t": "人，有利于"}, {"a": "债务", "ul": 8}, {"t": "人；\n通货膨胀不利于工人，有利于雇主。"}]}, {"type": "h2", "toks": [{"t": "4.通货膨胀与失业的关系\n菲利普斯曲线反映了失业率和通货膨胀率之间"}, {"a": "反向", "ul": 8}, {"t": "变动的关系。即通货\n膨胀率高，失业率低；通货膨胀率低，则失业率高。\n菲利普斯曲线只在"}, {"a": "短期", "ul": 8}, {"t": "有效，"}, {"a": "长期", "ul": 8}, {"t": "无效。"}]}], "quiz": [{"src": "真题", "stem": "下列关于通货膨胀的说法，错误的是：", "opts": {"A": "实质：社会总供给小于社会总需求", "B": "原因：市场上流通的纸币量多于商品流通中所需要的货币量", "C": "危害：直接引起物价下跌，影响企业投资的积极性，失业率上升", "D": "对策：实行紧缩的货币政策，控制银行信贷规模"}, "ans": "C"}, {"src": "母题", "stem": "下列关于“消费者物价指数（CPI）”的说法，不正确的一项是：", "opts": {"A": "该指标上升意味着居民生活成本下降", "B": "通常作为观察通货膨胀水平的重要指标", "C": "该指标较大时可能出现经济运行不稳定", "D": "反映与居民生活有关的商品价格及劳务价格的统计物价变动指标"}, "ans": "A"}, {"src": "拓展", "stem": "通货膨胀是指在货币流通条件下，因货币供给____货币实际需求，导致", "opts": {"A": "大于", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "大于"}, {"src": "拓展", "stem": "（2）生产者价格指数（____）", "opts": {"A": "PPI", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "PPI"}, {"src": "拓展", "stem": "通货膨胀不利于债权人，有利于____人；", "opts": {"A": "债务", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "债务"}], "branches": [{"h": "1.通货膨胀的含义", "terms": ["大于", "上涨"]}, {"h": "2.通货膨胀的衡量", "terms": ["CPI", "3%", "PPI"]}, {"h": "3.通货膨胀的影响", "terms": ["固定", "变动", "债权", "债务"]}, {"h": "4.通货膨胀与失业的关系", "terms": ["反向", "短期", "长期"]}], "notes": ["通货膨胀实质是社会总需求大于总供给、货币贬值、物价持续普遍上涨（不是某一种商品涨价）。CPI=居民消费价格指数（国际惯例：涨幅连续超过3%即通胀、持续低于1%预示通缩）；PPI=工业生产者出厂价格指数。", "通胀的再分配效应：不利于固定收入者、有利于变动收入者（销售提成）；不利于债权人、有利于债务人（早年借钱、多年后还钱更'不值钱'）；不利于工人、有利于雇主。", "菲利普斯曲线：短期看失业率与通胀率反向变动（经济热→失业低→工资涨→成本升→物价涨），长期无效。"]}, {"id": 103, "part": "常识判断", "pian": "经济常识", "zhang": "", "jie": "", "kind": "zsd", "title": "宏观经济政策", "nblank": 29, "blocks": [{"type": "h3", "toks": [{"t": "（2）财政政策和货币政策的运用"}]}, {"type": "table", "ncol": 5, "head": [[{"t": "经济形势"}], [{"t": "政策性质"}], [{"t": "政策类型"}], [{"t": "目标"}], [{"t": "具体措施"}]], "rows": [[{"toks": [{"t": "通货膨胀"}], "span": 2}, {"toks": [{"a": "紧缩", "ul": 6}, {"t": "性"}], "span": 2}, {"toks": [{"t": "财政政策"}], "span": 0}, {"toks": [{"t": "增加财政收入、减少财政支出，抑制总需求"}], "span": 0}, {"toks": [{"a": "增加", "ul": 6}, {"t": "税收、"}, {"a": "减发", "ul": 6}, {"t": "国债、"}, {"a": "减少", "ul": 6}, {"t": "支出（政府购买和转移支付）"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [], "span": 0}, {"toks": [{"t": "货币政策"}], "span": 0}, {"toks": [{"t": "降低货币供应量，\n提高利率，抑制总需求"}], "span": 0}, {"toks": [{"a": "提高", "ul": 6}, {"t": "法定存款准备金率、"}, {"a": "提高", "ul": 6}, {"t": "再贴现率、"}, {"a": "提高", "ul": 6}, {"t": "利率、"}, {"a": "卖出", "ul": 6}, {"t": "有价证券"}], "span": 0}], [{"toks": [{"t": "通货紧缩"}], "span": 2}, {"toks": [{"a": "扩张", "ul": 6}, {"t": "性"}], "span": 2}, {"toks": [{"t": "财政政策"}], "span": 0}, {"toks": [{"t": "减少财政收入、增加财政支出，刺激总需求"}], "span": 0}, {"toks": [{"a": "减少", "ul": 6}, {"t": "税收、"}, {"a": "增发", "ul": 6}, {"t": "国债、"}, {"a": "增加", "ul": 6}, {"t": "支出（政府购买和转移支付）"}], "span": 0}], [{"toks": [], "span": 0}, {"toks": [], "span": 0}, {"toks": [{"t": "货币政策"}], "span": 0}, {"toks": [{"t": "增加货币供应量，\n降低利率，刺激总需求"}], "span": 0}, {"toks": [{"a": "降低", "ul": 6}, {"t": "法定存款准备金率、"}, {"a": "降低", "ul": 6}, {"t": "再贴现率、"}, {"a": "降低", "ul": 6}, {"t": "利率、"}, {"a": "买入", "ul": 6}, {"t": "有价证券"}], "span": 0}]]}, {"type": "h3", "toks": [{"t": "（1）财政政策和货币政策的内涵\n财政政策是指"}, {"a": "政府", "ul": 8}, {"t": "通过变动财政收入和财政支出以保持社会总供给和社\n会总需求平衡的一种经济政策。主要工具包括收入部分的税收和国债以及支出部\n分的政府购买和转移支付。\n货币政策是指"}, {"a": "中央银行", "ul": 8}, {"t": "通过控制和调节货币供应量以保持社会总供给和社会\n总需求平衡的一种经济政策。主要工具包括法定存款准备金率、"}, {"a": "再贴现率", "ul": 8}, {"t": "、公开\n市场业务、"}, {"a": "基准利率", "ul": 8}, {"t": "。"}]}, {"type": "callout", "toks": [{"t": "【知识延伸】\n法定存款准备金率、再贴现率、公开市场业务、基准利率\n法定存款准备金率：中央银行规定的商业银行对于存款所必须保持的\n"}, {"a": "准备金", "ul": 8}, {"t": "的比例。\n再贴现率：商业银行将其贴现的"}, {"a": "未到期", "ul": 8}, {"t": "票据向中央银行申请再贴现时的预\n扣利率。\n公开市场业务：中央银行通过"}, {"a": "买进或卖出", "ul": 16}, {"t": "有价证券，吞吐基础货币，\n调节货币供应量的活动。\n基准利率：中央银行规定的"}, {"a": "存贷款", "ul": 8}, {"t": "利率。"}]}, {"type": "h2", "toks": [{"t": "2.收入分配政策\n初次分配属于微观分配行为，主要由"}, {"a": "生产部门", "ul": 8}, {"t": "自主进行。如职工薪酬、\n"}, {"a": "最低工资保障", "ul": 16}, {"t": "、企业缴纳税金等。\n再分配属于宏观分配行为，主要由"}, {"a": "政府", "ul": 8}, {"t": "以收入税等形式进行。如个人所\n得税、"}, {"a": "社会保障", "ul": 8}, {"t": "、转移支付、公务员工资等。\n第三次分配建立在志愿性的基础上，以"}, {"a": "慈善公益", "ul": 8}, {"t": "方式进行。"}]}], "quiz": [{"src": "真题", "stem": "下列经济目标与政策工具匹配错误的是：", "opts": {"A": "扩大基础设施投资规模——提高专项债发行额度", "B": "降低市场主体经营成本——延续小微企业增值税减免", "C": "拓宽房企的融资渠道——增加保障性住房再贷款额度", "D": "缓解基层“三保”支出压力——加大中央对地方转移支付"}, "ans": "C"}, {"src": "母题", "stem": "某国面临通货紧缩的经济形势，该国政府为了及时遏制通货紧缩带来的负面影响，推出了一系列政策。以下不可能属于该系列政策的是：", "opts": {"A": "降低存款准备金率", "B": "增加货币供给", "C": "增加政府支出", "D": "提高存款准备金率"}, "ans": "D"}, {"src": "母题", "stem": "以下属于第三次分配的是：", "opts": {"A": "政府向困难家庭发放低保", "B": "国家给公务员发放工资", "C": "某慈善组织救助困难学生", "D": "银行给中小企业办理贷款"}, "ans": "C"}, {"src": "拓展", "stem": "____利率，刺激总需求降低法定存款准备金率、降低再贴现率、降低利率、买入有价证券", "opts": {"A": "降低", "B": "最大", "C": "反比", "D": "正比"}, "ans": "A", "real": "降低"}, {"src": "拓展", "stem": "货币政策是指____通过控制和调节货币供应量以保持社会总供给和社会", "opts": {"A": "中央银行", "B":
